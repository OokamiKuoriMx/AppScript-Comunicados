        /**

        async function init(container) {
            console.log('Iniciando ComunicadoDetalle v3.2...');

            // RESET STALE INSTANCES (Fix for navigation re-mounts)
            _modalFacturaInstance = null;
            _movModal = null;
            if (dom) dom = {}; // Reset DOM cache wrapper

            _setGlobalLoader(true, 'Preparando entorno...');

            const storedId = sessionStorage.getItem('currentComunicadoId');
            if (!storedId) {
                console.warn('ID no encontrado. Volviendo al listado.');
                location.hash = '#/comunicados';
                return;
            }
            state.id = storedId;

            try {
                await _mount(container);
                _cacheDom();
                _bindEvents();

                _setGlobalLoader(true, 'Sincronizando datos...');
                await _loadData();

            } catch (error) {
                console.error('Error crítico:', error);
                container.innerHTML = `<div class="alert alert-danger p-4">
                        <h4>Error de Carga</h4><p>${error.message}</p>
                        <button class="btn btn-outline-danger" onclick="location.reload()">Recargar</button>
                    </div>`;
            } finally {
                _setGlobalLoader(false);
            }
        }

        const mount = async (container) => init(container);

        async function _mount(container) {
            container.innerHTML = '';
            let content = globalThis.TEMPLATES?.['comunicado_detalle'];
            if (!content) {
                const response = await serverCall('getTemplates', ['comunicado_detalle']);
                content = response?.comunicado_detalle;
            }
            if (!content) throw new Error('Plantilla no encontrada.');
            container.innerHTML = content;
        }

        // --- HANDLERS (New) ---
        function _handleDeleteClick() {
            dom.modalDelete?.show();
        }

        async function _confirmDelete() {
            const id = state.id;
            if (!id) return;

            const btn = dom.btnConfirmDelete;
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = 'Eliminando...';

            try {
                // Call backend deleteComunicado (CASCADE)
                await serverCall('deleteComunicado', id);

                dom.modalDelete.hide();
                globalThis.showToast?.('Comunicado eliminado correctamente.', 'success');

                // Redirect back to list
                setTimeout(() => {
                    location.hash = '#/comunicados';
                }, 500);

            } catch (error) {
                console.error("Delete Error:", error);
                alert('Error al eliminar: ' + error.message);
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        // --- HELPERS DE FECHA (DD/MM/AAAA) ---
        function _toUserDate(isoDate) {
            if (!isoDate) return '';
            const [y, m, d] = isoDate.split('-');
            return `${d}/${m}/${y}`;
        }

        function _fromUserDate(userDate) {
            if (!userDate) return '';
            // Regex match DD/MM/YYYY
            const match = userDate.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
            if (!match) return ''; // Invalid or partial
            const d = match[1];
            const m = match[2];
            const y = match[3];
            return `${y}-${m}-${d}`;
        }

        function _forceUppercase(input) {
            const start = input.selectionStart;
            const end = input.selectionEnd;
            input.value = input.value.toUpperCase();
            input.setSelectionRange(start, end);
        }

        function _bindEvents() {
            dom.btnVolver?.addEventListener('click', () => location.hash = '#/comunicados');
            dom.btnGuardar?.addEventListener('click', _guardarTodo);

            // Delete Handlers (Fix)
            dom.btnEliminar?.addEventListener('click', _handleDeleteClick);
            dom.btnConfirmDelete?.addEventListener('click', _confirmDelete);

            dom.presupuesto.btnAdd?.addEventListener('click', _addActualizacionPresupuesto);
            dom.financiero.btnAddConstructora?.addEventListener('click', () => _addEstimacion('CONSTRUCTORA'));
            dom.financiero.btnAddSupervision?.addEventListener('click', () => _addEstimacion('SUPERVISION'));
            dom.equipo.btnAddContratista?.addEventListener('click', () => _addEquipo('contratista'));
            dom.equipo.btnAddSupervisor?.addEventListener('click', () => _addEquipo('supervisor'));
            dom.tickets.btnAdd?.addEventListener('click', _addTicket);

            // Force Uppercase for standard inputs
            [dom.genComunicado, dom.genDescripcion, dom.genFenomeno, dom.genFi, dom.genFondo].forEach(el => {
                if (el) el.addEventListener('input', () => _forceUppercase(el));
            });

            _initSidebarNavigation();
        }

        // --- MANEJO DE NAVEGACIÓN (FIX) ---
        function _initSidebarNavigation() {
            const allLinks = document.querySelectorAll('#detalle-nav-tabs a[data-bs-toggle="list"]');

            // Helper styling function
            const setActiveStyle = (el) => {
                el.classList.add('active', 'bg-white', 'border-start', 'border-4', 'border-primary', 'shadow-sm', 'fw-bold', 'text-primary');
                el.classList.remove('text-muted');
            };
            const setInactiveStyle = (el) => {
                el.classList.remove('active', 'bg-white', 'border-start', 'border-4', 'border-primary', 'shadow-sm', 'fw-bold', 'text-primary');
                el.classList.add('text-muted');
            };

            allLinks.forEach(link => {
                link.addEventListener('click', function (e) {
                    allLinks.forEach(l => setInactiveStyle(l)); // Clear all
                    setActiveStyle(this); // Set active

                    const targetId = this.getAttribute('href').substring(1);
                    document.querySelectorAll('.tab-pane').forEach(pane => {
                        if (pane.id === targetId) {
                            pane.classList.add('show', 'active');
                        } else {
                            pane.classList.remove('show', 'active');
                        }
                    });
                });
                // Initialize state
                if (link.classList.contains('active')) setActiveStyle(link);
                else setInactiveStyle(link);
            });
        }

        async function _loadData() {
            try {
                const catalogsResponse = await serverCall('fetchComunicadoCatalogs');

                if (catalogsResponse) {
                    state.catalogs = catalogsResponse;
                    _poblarCatalogosUI();
                } else {
                    console.warn('fetchComunicadoCatalogs retornó nulo o indefinido');
                }

                const dataResponse = await serverCall('getComunicadoCompleto', state.id);
                if (dataResponse) {
                    state.data = _sanitizeData(dataResponse);

                    // AUTO-FIX: Consolidar duplicados al cargar
                    if (state.data.presupuesto) {
                        for (let i = 0; i < state.data.presupuesto.length; i++) {
                            // Asegurar estructura
                            if (!state.data.presupuesto[i].lineas) state.data.presupuesto[i].lineas = [];
                            _consolidarDuplicados(i);
                        }
                    }

                    _renderData();
                }
            } catch (e) {
                console.error(e);
                _showAlert('Error de Carga', e.message, 'error');
            }
        }

        function _sanitizeData(d) {
            // Aplanar facturas: Extraerlas de las estimaciones para tener un array maestro
            const facturasAplanadas = (d.estimaciones || []).flatMap(e => e.facturas || []);

            return {
                ...d,
                presupuesto: d.presupuesto || [],
                equipo: d.equipo || [],
                tickets: d.tickets || [],
                // Asegurar que estimaciones sea un array
                estimaciones: d.estimaciones || [],
                // POBLAR facturasEstimaciones para que el renderizador las encuentre
                facturasEstimaciones: facturasAplanadas,
                financiero: Array.isArray(d.financiero) ? d.financiero : (d.financiero?.estimaciones || [])
            };
        }

        function _poblarCatalogosUI() {
            try {
                console.log('Inicio _poblarCatalogosUI. Catalogs:', state.catalogs ? Object.keys(state.catalogs) : 'null');

                if (dom.genEstado && state.catalogs.estados) {
                    try {
                        dom.genEstado.innerHTML = '<option value="">Seleccione...</option>';
                        state.catalogs.estados.forEach(est => {
                            const opt = document.createElement('option');
                            opt.value = est.id;
                            opt.textContent = est.estado || est.nombre;
                            dom.genEstado.appendChild(opt);
                        });

                        console.error('Error poblando estados:', e);
                    }
                }

                try {
                    _setupCombobox(dom.genSiniestro, dom.dropdownSiniestro, state.catalogs.siniestros || [], 'siniestro',
                        (item) => { dom.genSiniestro.value = item.siniestro; _onSiniestroChange(item); },
                        dom.avisos.siniestro,
                        (val, match) => {
                            if (match) _onSiniestroChange(match);
                            else _onSiniestroChange(null);
                        }
                    );
                } catch (e) { console.error('Error setupCombobox Siniestro:', e); }

                try {
                    _setupCombobox(dom.genDistrito, dom.dropdownDistrito, state.catalogs.distritosRiego || [], 'distritoRiego',
                        (item) => dom.genDistrito.value = item.distritoRiego,
                        dom.avisos.distrito
                    );
                } catch (e) { console.error('Error setupCombobox Distrito:', e); }

                try {
                    _setupCombobox(dom.genAjustador, dom.dropdownAjustador, state.catalogs.ajustadores || [], 'nombreAjustador',
                        (item) => {
                            dom.genAjustador.value = item.nombreAjustador || item.nombre;

                        dom.avisos.ajustador
                    );
                    console.log('Catalogos UI poblados. Ajustadores:', state.catalogs.ajustadores?.length);
                } catch (e) { console.error('Error setupCombobox Ajustador:', e); }

                try {
                    _setupCombobox(dom.genAseguradora, dom.dropdownAseguradora, state.catalogs.aseguradoras || [], 'aseguradora',

            } catch (err) {
                console.error('Error FATAL en _poblarCatalogosUI:', err);

        function _renderData() {
            const d = state.data;

            // Header: DESCRIPCIÓN TITLE (Blue & Uppercase)
            // Ya no se muestra ID ni Ref en subtitulo
            if (dom.headerTitle) {
                dom.headerTitle.textContent = (d.descripcion || 'SIN DESCRIPCIÓN').toUpperCase();
                dom.headerTitle.title = d.descripcion || '';
            }
            if (dom.headerSubtitle) dom.headerSubtitle.textContent = '';

            // Datos Generales
            dom.genId.value = d.id || '';

            // Referencia (buscar por ID original o alternativo)
            const referencia = d.referencia || d.cuenta?.referencia || d.cuenta?.cuenta || 'Sin Referencia';
            const inputReferencia = dom.genCuenta || document.getElementById('gen-referencia');
            if (inputReferencia) {
                inputReferencia.value = referencia;
            }

            // AJUSTADOR (Solo Lectura - Heredado de Cuenta)
            // Backend ahora envía d.ajustador = { id, nombre }


            if (dom.genAjustador) {
                // Prioridad: 1. Ajustador del objeto datosGenerales (enriquecido y populado en 'ajustador')
                //            2. Ajustador heredado de la cuenta/referencia (si existiera)
                //            3. Ajustador por nombre directo
                let nombreAjustadorReal = '';

                if (d.ajustador && d.ajustador.nombreAjustador) {
                    nombreAjustadorReal = d.ajustador.nombreAjustador;
                } else if (d.ajustadorNombre) {
                    nombreAjustadorReal = d.ajustadorNombre;
                }

                dom.genAjustador.value = nombreAjustadorReal;
            }

            // Mapeo corregido por feedback: Fecha de Registro -> fechaAsignacion, Fecha Documento -> fecha (original)
            dom.genFecha.value = _formatDateISO(d.fechaAsignacion || d.fechaCreacion); // "Fecha de Registro"
            if (dom.genFechaDocumento) dom.genFechaDocumento.value = _formatDateISO(d.fecha); // "Fecha del Documento"
            dom.genComunicado.value = d.comunicado || '';
            dom.genDescripcion.value = d.descripcion || '';
            if (d.idEstado) dom.genEstado.value = d.idEstado;
            _setComboboxValue(dom.genDistrito, d.distrito, 'distritoRiego');
            _setComboboxValue(dom.genSiniestro, d.siniestro, 'siniestro');

            // Aseguradora
            if (dom.genAseguradora) {
                const asegNombre = d.siniestroDetalle?.aseguradora || 'Sin Aseguradora';
                dom.genAseguradora.value = asegNombre;
            }

            // Datos del Siniestro Detallados

        /**

         */
        function _renderDashboard() {
            if (!state.data) return;
            const fmt = (n) => new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(n);

            // Use Shared Logic (Hoisted)
            const financeData = (typeof _calculateFinanceData === 'function') ? _calculateFinanceData() : null;
            if (!financeData) return;

            ['c', 's'].forEach(prefix => {
                const s = financeData[prefix];
                // s has: estimado, estimadoTotal, ejercido, ejercidoTotal, pagado, pagadoTotal, anticipo, amortizado

                // DOM Helpers
                const setText = (id, val) => {
                    const el = document.getElementById(id);
                    if (el) el.textContent = val;
                };
                const setHtml = (id, val) => {
                    const el = document.getElementById(id);
                    if (el) el.innerHTML = val;
                };
                const setWidth = (id, width) => {
                    const el = document.getElementById(id);
                    if (el) el.style.width = width + '%';
                };

                // Helper for Dual Amount Display
                // Large Font: Net (Sin IVA)
                // Small Font: Gross (Con IVA)
                const renderDual = (id, net, gross, colorClass = '') => {
                    // colorClass default depends on context, but let's assume parent provides color or use utility classes
                    // If no color provided, inherit.
                    const html = `
                        <div class="d-flex flex-column">
                            <span class="display-6 fw-bold ${colorClass}">${fmt(net)}</span>
                            <small class="opacity-75 fs-6" style="margin-top: -5px;">${fmt(gross)} (IVA inc.)</small>
                        </div>
                    `;
                    setHtml(id, html);
                };

                // Main Metrics
                // Estimado: Net (Large) / Total (Small)
                // Note: The template has classes like text-white or text-dark. We need to be careful with colors.

                // 1. ESTIMADO CARD (Gradient BG, text-white)
                // Note: Added Anticipo to Estimate Sum because typically "Estimate" summary includes it, 
                // but if strictly "Estimate" type, then s.estimado. 
                // Review: 'Summary' card combines them? No, Summary has Authorizado vs Estimado.
                // Dashboard card says "Monto Estimado (Neto)". 
                // Let's stick to s.estimado (Estimaciones + Finiquitos) as per previous logic, OR include Anticipo if the user considers "Estimated" as "Performed Work + Advance".
                // Previous logic in _renderDashboard only summed 'ESTIMACION'/'FINIQUITO' for 'estimado'. Anticipo was separate.
                // Let's keep s.estimado (Net) and s.estimadoTotal (Gross).
                renderDual(`dash-${prefix}-estimado`, s.estimado, s.estimadoTotal, 'text-white');


                // 2. FACTURADO CARD (Light BG, text-dark/info)
                // Gross is usually the main one for billing, but User requested Net Large.
                // Assuming we can calculate Net Facturado? 
                // `_calculateFinanceData` returns `ejercido` (Net) and `ejercidoTotal` (Gross).
                renderDual(`dash-${prefix}-facturado`, s.ejercido, s.ejercidoTotal, 'text-dark');

                // 3. PAGADO CARD (Light BG, text-success)
                // `_calculateFinanceData` returns `pagado` (Net) and `pagadoTotal` (Gross).
                renderDual(`dash-${prefix}-pagado`, s.pagado, s.pagadoTotal, 'text-success');

                // Progress Bars
                // Facturado vs Estimado (Using Totals/Gross for proper comparison? Or Net?)
                // User asked for "Sin IVa" prominence. Ratios should technically be same if tax constant. 
                // Let's use Nets for ratio to match the "Large" numbers visual.
                const pFacturado = s.estimado > 0 ? (s.ejercido / s.estimado) * 100 : 0;
                setWidth(`prog-${prefix}-facturado`, Math.min(pFacturado, 100));
                setText(`pct-${prefix}-facturado`, pFacturado.toFixed(1) + '%');

                // Pagado vs Facturado
                const pPagado = s.ejercido > 0 ? (s.pagado / s.ejercido) * 100 : 0;
                setWidth(`prog-${prefix}-pagado`, Math.min(pPagado, 100));
                setText(`pct-${prefix}-pagado`, pPagado.toFixed(1) + '%');

                // Anticipos vs Amortizado
                // Anticipo Card mostly static, but strictly speaking it has Net/Gross too.
                // `_calculateFinanceData` provides `anticipo` (Net). `anticipoTotal`?
                // I didn't return `anticipoTotal` in `_calculateFinanceData` previously. 
                // I should probably just show Net for now as Anticipo usually tracking Base.
                // Or update `_calculateFinanceData` to return `anticipoTotal`.
                // Let's stick to Net for Anticipo as per previous behavior unless I modify the calc function.
                setText(`dash-${prefix}-anticipo`, fmt(s.anticipo));

                setText(`dash-${prefix}-amortizado`, fmt(s.amortizado));

                const pAmortizado = s.anticipo > 0 ? (s.amortizado / s.anticipo) * 100 : 0;
                setText(`pct-${prefix}-amortizado`, pAmortizado.toFixed(1) + '% Recup.');

                const pendiente = Math.max(0, s.anticipo - s.amortizado);
                setText(`text-${prefix}-pendiente-amortizar`, `Pendiente: ${fmt(pendiente)}`);

                setWidth(`bar-${prefix}-amortizado`, Math.min(pAmortizado, 100));
                setWidth(`bar-${prefix}-pendiente`, Math.min(100 - pAmortizado, 100));
            });

            // Update Global Date Badge
            const badge = document.getElementById('dash-last-update');
            if (badge) {
                const now = new Date();
                badge.textContent = 'Actualizado: ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }
        }




        async function saveEstimacion(id) {
            // Use String() comparison to handle type mismatch
            const item = (state.data.estimaciones || []).find(e => String(e.id) === String(id));
            if (!item) {
                console.warn('saveEstimacion: Item not found for id:', id);
                return;
            }

            // Spinner Logic - use id-based selector
            let btn = document.getElementById(`btn-save-${id}`);
            const btnOriginalContent = btn ? btn.innerHTML : '';

            try {
                if (btn) {
                    btn.disabled = true;
                    btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>';
                }

                _setGlobalLoader(true, 'Guardando estimación...');

                if (item._isNew) {
                    // Create
                    const response = await serverCall('crearEstimacion', item);
                    // Update local ID with the persistent one from server
                    if (response && response.data && response.data.id) {
                        const oldId = item.id;
                        item.id = response.data.id;

                        // Sync selection if active
                        // Sync selection if active
                        if (state.ui.selectedEstimacionId === oldId) {
                            state.ui.selectedEstimacionId = item.id;
                        }

                        // FIXED: Update idEstimacion in any local orphan facturas (created while estimation was temp)
                        if (state.data.facturasEstimaciones) {
                            state.data.facturasEstimaciones.forEach(f => {
                                if (f.idEstimacion === oldId) {
                                    f.idEstimacion = item.id;
                                    console.log('Fixed orphan factura idEstimacion:', f.id, 'to', item.id);
                                }
                            });
                        }
                    }
                    delete item._isNew;
                } else {
                    // Update - clean internal properties before sending
                    const cleanData = { ...item };
                    delete cleanData._modified;
                    delete cleanData._isNew;
                    delete cleanData._isNewlyAdded;
                    delete cleanData.facturas; // Remove nested data
                    delete cleanData.constructoraVinculada; // Remove nested data

                    console.log('Saving estimacion:', { id: item.id, data: cleanData });
                    await serverCall('actualizarEstimacion', item.id, cleanData);
                }

                item._modified = false;
                _renderFinanciero();
                Swal.fire({
                    icon: 'success',
                    title: 'Estimación Guardada',
                    text: 'Los cambios se han actualizado correctamente.',
                    timer: 1500,
                    showConfirmButton: false
                });

            } catch (e) {
                console.error(e);
                Swal.fire('Error', 'No se pudo guardar la estimación: ' + e.message, 'error');
            } finally {
                _setGlobalLoader(false);
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = btnOriginalContent;
                    // Force checkmark visual if success
                    if (!item._modified) {
                        btn.innerHTML = '<i class="bi bi-check-lg"></i>';
                        btn.className = 'btn-icon text-success me-1';
                    }
                }
            }
        }

        async function registrarComplemento(idFactura) {
            const folioInput = document.getElementById(`input-comp-folio-${idFactura}`);
            const fechaInput = document.getElementById(`input-comp-fecha-${idFactura}`);
            const uuidInput = document.getElementById(`input-comp-uuid-${idFactura}`);
            const montoInput = document.getElementById(`input-comp-monto-${idFactura}`);
            const ivaInput = document.getElementById(`input-comp-iva-${idFactura}`);
            const totalInput = document.getElementById(`input-comp-total-${idFactura}`);

            const folio = folioInput ? folioInput.value : '';
            const fecha = fechaInput ? fechaInput.value : '';
            const uuid = uuidInput ? uuidInput.value : '';
            const monto = montoInput ? parseFloat(montoInput.value.replace(/,/g, '')) || 0 : 0;
            const iva = ivaInput ? parseFloat(ivaInput.value.replace(/,/g, '')) || 0 : 0;
            const total = totalInput ? parseFloat(totalInput.value.replace(/,/g, '')) || 0 : 0;

            if (!folio || !total) {
                Swal.fire('Datos Incompletos', 'Se requiere al menos Folio y Monto total', 'warning');
                return;
            }

            const f = state.data.facturasEstimaciones.find(x => x.id === idFactura);
            if (!f) return;

            // VALIDACION CRITICA: Suma de complementos <= Total Factura
            const complementosExistentes = (state.data.facturasEstimaciones || [])
                .filter(c => String(c.idFacturaRelacionada) === String(idFactura) && c.estatusSAT !== 'CANCELADO');

            const totalComplementos = complementosExistentes.reduce((sum, c) => sum + (parseFloat(c.total) || 0), 0);

            // Using 0.10 tolerance prevents floating point blocks on exact matches
            if ((totalComplementos + total) > (parseFloat(f.total) + 0.10)) {
                const saldoReal = Math.max(0, parseFloat(f.total) - totalComplementos);
                Swal.fire({
                    title: 'Monto Excedido',
                    text: `El monto del complemento ($${_formatCurrency(total)}) supera el saldo pendiente de la factura ($${_formatCurrency(saldoReal)}).`,
                    icon: 'warning'
                });
                return;
            }

            const payload = {
                idEstimacion: f.idEstimacion, // Misma estimación
                idFacturaRelacionada: idFactura,
                tipo: 'COMPLEMENTO',
                folioFactura: folio,
                fecha: fecha,
                uuid: uuid,
                monto: monto,
                iva: iva,
                total: total,
                estatusSAT: 'VIGENTE'
            };

            try {
                _setGlobalLoader(true, 'Registrando complemento...');
                await serverCall('agregarFactura', f.idEstimacion, payload);

                // --- ACTUALIZAR ESTATUS A PAGADO ---
                // User requirement: "Al generar complemento, estatus de estimación y factura deben ser PAGADO"
                // 1. Factura Original (Padre) -> PAGADO
                try {
                    f.estatusSAT = 'PAGADO'; // Optimistic local update
                    await serverCall('actualizarFactura', idFactura, { estatusSAT: 'PAGADO' });
                } catch (e) {
                    console.warn('Error auto-updating factura status:', e);
                }

                // 2. Estimación (Padre) -> PAGADO
                // Check if estimacion should be paid? User said "DEBEN CAMBIAR". Assuming direct rule.
                try {
                    const itemEst = (state.data.estimaciones || []).find(e => e.id === f.idEstimacion);
                    if (itemEst) {
                        itemEst.estatusInterno = 'PAGADO'; // Optimistic local update
                        await serverCall('actualizarEstimacion', f.idEstimacion, { estatusInterno: 'PAGADO' });
                    }
                } catch (e) {
                    console.warn('Error auto-updating estimacion status:', e);
                }

                await _reloadEstimaciones();
                globalThis.showToast?.('Complemento registrado y saldo liquidado', 'success');
            } catch (e) {
                Swal.fire('Error', e.message, 'error');
            } finally {
                _setGlobalLoader(false);
            }
        }

            // _updateResumenFinanciero usa presupuestoTotal como global.
            // Verificamos suma total vs presupuestoTotal.
            const totalEstimadoActual = (state.data.estimaciones || [])
                .filter(e => e.estatusInterno !== 'CANCELADO')
                .reduce((sum, e) => sum + (parseFloat(e.montoTotal) || 0), 0);

            const presupuestoTotal = parseFloat(state.data.presupuestoTotal) || 0;

            // Tolerance of 1.00 for rounding
            if (presupuestoTotal > 0 && totalEstimadoActual >= (presupuestoTotal - 1)) {

                    title: 'Presupuesto Cubierto',
                    text: `El monto total de las estimaciones (${_formatCurrency(totalEstimadoActual)}) ha alcanzado el monto autorizado.`,

            // but the user said "hasta que sean igual". 
            // Let's strictly block if >=, but maybe allow override?

            if (presupuestoTotal > 0 && totalEstimadoActual >= (presupuestoTotal - 0.01)) {

                    .reduce((acc, c) => ({ ...acc, [c.id]: `${c.tipo} ${c.numero} - ${_formatCurrency(c.montoAutorizado)}` }), {});

            // Calcular monto sugerido para SUPERVISION (5% de constructora)

        function formatInputCurrency(el, withSymbol = true) {
            if (!el || !el.value) return;
            const val = parseFloat(el.value.replace(/[$,]/g, '')) || 0;
            el.value = _formatCurrency(val, withSymbol);
        }

        function unformatInputCurrency(el) {
            if (!el || !el.value) return;
            const val = parseFloat(el.value.replace(/[$,]/g, '')) || 0;
            // Show plain number or empty if 0
            el.value = val === 0 ? '' : val;
            if (el.value !== '') el.select();
        }

        function calcMovOrganico() {
            const getVal = (id) => {
                const el = document.getElementById(id);
                // Robust parsing handling $ and ,
                return el ? parseFloat(el.value.replace(/[$,]/g, '')) || 0 : 0;
            };

            const monto = getVal('mov-org-monto');
            const amort = getVal('mov-org-amortizacion');
            const desc = getVal('mov-org-descuentos');

            // Logic: Neto = Monto - Amort - Descuentos
            const subtotalNeto = Math.max(0, monto - amort - desc);
            const iva = subtotalNeto * 0.16;
            const total = subtotalNeto + iva;

            // Helper to set value
            const set = (id, val, isCurrency = true) => {
                const el = document.getElementById(id);
                if (el) el.value = isCurrency ? _formatCurrency(val) : val;
            };

            set('mov-org-subtotal', subtotalNeto);
            set('mov-org-iva', iva);
            set('mov-org-total', total);
        }

        async function saveMovimientoOrganico(status = 'PENDIENTE') {
            if (state.saving) return;

            const getVal = (id) => document.getElementById(id).value;
            // Robust parsing handling $ and ,
            const getNum = (id) => parseFloat(document.getElementById(id).value.replace(/[$,]/g, '')) || 0;

            const type = document.querySelector('input[name="movType"]:checked').value;
            const fecha = getVal('mov-org-fecha');
            const monto = getNum('mov-org-monto');

            if (!fecha) return _showAlert('Falta Fecha', 'Seleccione fecha de corte', 'warning');
            if (monto === 0 && type !== 'FINIQUITO') return _showAlert('Monto Requerido', 'El monto no puede ser cero', 'warning');

            // Set Loading UI
            state.saving = true;
            const btnSave = document.getElementById('btn-save-mov-organico');
            const originalBtnText = btnSave ? btnSave.innerHTML : '';
            if (btnSave) {
                btnSave.disabled = true;
                btnSave.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Guardando...';
            }

            const mapType = { 'ANTICIPO': 1, 'ESTIMACION': 2, 'FINIQUITO': 3 };
            const idToEdit = getVal('mov-org-id');
            const amort = getNum('mov-org-amortizacion');
            const desc = getNum('mov-org-descuentos');
            const avFisico = getNum('mov-org-avfisico');

            const subtotalNeto = Math.max(0, monto - amort - desc);
            const iva = subtotalNeto * 0.16;
            const total = subtotalNeto + iva;

            const payload = {
                idComunicado: state.id, // Fixed: use state.id derived from init()
                entidad: 'CONSTRUCTORA',
                tipo: mapType[type],
                fechaCorte: fecha,
                monto: monto, // Base Amount
                amortizacion: amort,
                descuentos: desc,
                neto: subtotalNeto, // Persisted Calculated Base
                iva: iva,
                montoTotal: total, // Grand Total
                montoAvanceFisico: avFisico, // Informative
                numero: getVal('mov-org-numero'),
                estatusInterno: status,
            };

            if (idToEdit) {
                payload.id = idToEdit;
            }

            try {
                const action = idToEdit ? 'actualizarEstimacion' : 'crearEstimacion';
                const response = await serverCall(action, payload);
                console.log('DEBUG: saveMovimientoOrganico response:', response);

                // serverCall solo resuelve si es exitoso (success: true), devolviendo la data.
                // Si fallara, iría al catch.
                if (response) {
                    globalThis.showToast?.(`Movimiento guardado exitosamente`, 'success');

                    // Force reload from server to ensure IDs and State are 100% synced and valid.
                    // This prevents "object Object" ID issues from manual optimistic updates.
                    await _loadData();

                    _movModal.hide();
                    _renderFinanciero();
                } else {
                    // Caso teorico donde resuelve pero con null/undefined
                    console.error('DEBUG: API Error (Empty Response):', response);
                    _showAlert('Error al Guardar', 'Respuesta vacía del servidor', 'error');
                }

            } catch (e) {
                console.error('DEBUG: Exception in saveMovimientoOrganico:', e);
                _showAlert('Error', 'Excepción: ' + (e.message || e), 'error');
            } finally {
                state.saving = false;
                if (btnSave) {
                    btnSave.disabled = false;
                    btnSave.innerHTML = originalBtnText;
                }
            }
        }

        function _renderDualAmount(element, net, total, colorClass = '', authorized = 0, label = '') {
            if (!element) return;
            // Main Amount (Neto)
            const netFormatted = _formatCurrency(net);
            // Secondary Amount (Total)
            const totalFormatted = _formatCurrency(total);

            // Percentage Calculation
            let percent = 0;
            if (authorized > 0) {
                percent = (net / authorized) * 100;
            }
            // Clamp percentage for bar between 0 and 100, but display real value if higher
            const percentDisplay = percent.toFixed(1);
            const percentBar = Math.min(Math.max(percent, 0), 100);

            // Progress Bar Color & Style logic
            let barColor = 'bg-primary';
            let barStyle = '';
            let finalColorClass = colorClass;
            let textStyle = '';

            if (label === 'POR EJERCER') {
                barColor = '';
                barStyle = 'background-color: #6f42c1;'; // Purple
                if (net < 0) {
                    barColor = 'bg-danger';
                    barStyle = '';
                    finalColorClass = 'text-danger';
                } else {
                    finalColorClass = '';
                    textStyle = 'color: #6f42c1;';
                }
            } else if (label === 'AV. FISICO') {
                barColor = 'bg-secondary'; // Grey for "Av. Fisico"
            } else if (label === 'EJERCIDO') {
                // User Rule: Ejercido bar should be Green (unless over budget)
                barColor = percent > 100 ? 'bg-danger' : 'bg-success';
            } else if (label === 'ESTIMADO') {
                barColor = 'bg-warning';
            } else {
                // Default Logic related to consumption
                if (percent > 100) barColor = 'bg-danger';
                else if (percent > 90) barColor = 'bg-warning';
                else if (percent > 0) barColor = 'bg-success';
            }

            // Custom Layout with Progress Bar
            element.innerHTML = `
                    <div class="d-flex justify-content-between align-items-baseline w-100">
                        <div class="${finalColorClass} fw-bold" style="font-size: 1.1rem; ${textStyle}">${netFormatted}</div>
                        <div class="ms-2 badge bg-light text-dark border" style="font-size: 0.7rem;">${percentDisplay}%</div>
                    </div>
                    <div class="small opacity-75 fw-normal text-muted mb-1" style="font-size: 0.65rem; margin-top: -2px;">
                        Total: ${totalFormatted}
                    </div>
                    <div class="progress" style="height: 4px;">
                        <div class="progress-bar ${barColor}" role="progressbar" style="width: ${percentBar}%; ${barStyle}" aria-valuenow="${percentBar}" aria-valuemin="0" aria-valuemax="100"></div>
                    </div>
                `;
        }

        function _calculateFinanceData() {
            if (!state.data) return null;

            // Helper de seguridad
            const safeFloat = (val) => parseFloat(String(val).replace(/[^0-9.-]+/g, '')) || 0;
            const IVA_R = typeof IVA_RATE !== 'undefined' ? IVA_RATE : 0.16;

            const estAll = state.data.estimaciones || [];
            const presAll = state.data.presupuesto || [];
            const ultPres = presAll.length > 0 ? presAll[presAll.length - 1] : null;
            const allDocs = state.data.facturasEstimaciones || [];

            const calculateFor = (entidad) => {
                const est = estAll.filter(e => (e.entidad || 'CONSTRUCTORA') === entidad && e.estatusInterno !== 'CANCELADO');
                const ids = est.map(e => String(e.id));

                // 1. Autorizado
                let autorizado = 0;
                if (ultPres) {
                    if (entidad === 'CONSTRUCTORA') {
                        autorizado = (ultPres.montoCapturado !== null && !isNaN(parseFloat(ultPres.montoCapturado)))
                            ? parseFloat(ultPres.montoCapturado)
                            : safeFloat(ultPres.monto);
                    } else {
                        autorizado = safeFloat(ultPres.montoSupervision);
                    }
                }

                // 2. Estimado / Anticipo / Amortizado
                let estimado = 0; // Suma de MONTOS (Sin amort/desc) de EST/FIN
                let estimadoTotal = 0; // Suma de MONTOS Gross (Calculado)
                let anticipo = 0; // Suma Importes Netos Anticipos
                let amortizado = 0; // Suma Importes Amortizados EST/FIN
                let avFisico = 0; // Suma Avance Fisico

                est.forEach(e => {
                    const m = parseFloat(e.monto) || 0; // Monto Base
                    const a = parseFloat(e.amortizacion) || 0;
                    const af = safeFloat(e.montoAvanceFisico);
                    const tipo = String(e.tipo).toUpperCase();

                    // Check types based on ID or String
                    // TIPO 2 or ANTICIPO -> Anticipo Sum
                    // ERROR FIX: User clarified "estimaciones solo son movimientos tipo 2 y 3". 
                    // Thus, Type 1 must be 'ANTICIPO'. 
                    // Previous code was using '2' for Anticipo, causing the overlap.

                    // Logic: 
                    // Anticipo = Tipo 'ANTICIPO' or 1.
                    // Estimacion = Rest (2, 3).

                    if (tipo === 'ANTICIPO' || tipo === '1') {
                        anticipo += m;
                    } else {
                        // ESTIMACION (2), FINIQUITO (3)
                        // REGLA: "ESTIMADO = SUMA DE LOS MONTOS SIN CONSIDERAR LA AMORTIZACION"
                        estimado += m;
                        // Gross calc: Monto * (1 + IVA)
                        estimadoTotal += (m * (1 + IVA_R));

                        // REGLA: "AMORTIZADO = SUMA DE LOS IMPORTES AMORTIZADOS"
                        amortizado += a;

                        // REGLA: "AV. FISICO"
                        avFisico += af;
                    }
                });

                // 3. Ejercido / Pagado (Facturas)
                let ejercido = 0; // Net
                let ejercidoTotal = 0; // Gross
                let pagado = 0; // Net
                let pagadoTotal = 0; // Gross

                // REGLA: "EJERCIDO = SUMA DE LOS NETOS FACTURADOS VIGENTES"
                // Includes invoices linked to Antipicos, Estimaciones, Finiquitos (all in 'ids')
                // Note: User said "considerando anticipos, estimaciones y finiquitos", so we include all types.
                const facturasVigentes = allDocs.filter(f =>
                    ids.includes(String(f.idEstimacion)) &&
                    f.estatusSAT !== 'CANCELADO' &&
                    (String(f.tipo).toUpperCase() !== 'COMPLEMENTO' && f.tipo != 2) // Exclude complements
                );

                facturasVigentes.forEach(f => {
                    ejercido += (parseFloat(f.monto) || 0); // Net
                    ejercidoTotal += (parseFloat(f.total) || 0); // Gross
                });

                // REGLA: "PAGADO = SUMA DE LOS IMPORTES NETOS DE LOS COMPLEMENTOS DE PAGO VIGENTES"
                // Logic: Sum of Complements.
                const complementosVigentes = allDocs.filter(f =>
                    ids.includes(String(f.idEstimacion)) &&
                    f.estatusSAT !== 'CANCELADO' &&
                    (String(f.tipo).toUpperCase() === 'COMPLEMENTO' || f.tipo == 2)
                );

                complementosVigentes.forEach(c => {
                    pagado += (parseFloat(c.monto) || 0); // Net
                    pagadoTotal += (parseFloat(c.total) || 0); // Gross
                });

                // REGLA: Por Ejercer logic remains: Autorizado - Ejercido
                const porEjercer = autorizado - ejercido;
                const porEjercerTotal = porEjercer + (porEjercer * IVA_R);

                return { autorizado, estimado, estimadoTotal, ejercido, ejercidoTotal, pagado, pagadoTotal, anticipo, amortizado, avFisico, porEjercer, porEjercerTotal };
            };

            return {
                c: calculateFor('CONSTRUCTORA'),
                s: calculateFor('SUPERVISION')
            };
        }

        window._calculateFinanceData = _calculateFinanceData;

        function _updateResumenFinanciero() {
            try {
                const financeData = _calculateFinanceData();
                if (!financeData) return;

                const dataConst = financeData.c;
                const dataSup = financeData.s;

                // --- ACTUALIZACION DOM CONSTRUCTORA ---
                const uiC = dom.financiero.resumen;

                // Helper Percentage
                const getPct = (val, total) => total > 0 ? (val / total) * 100 : 0;

                // CONSTRUCTORA
                if (uiC.autorizado) uiC.autorizado.textContent = typeof _formatCurrency === 'function' ? _formatCurrency(dataConst.autorizado) : dataConst.autorizado;

                // NOTA: User Rule "Estimado no debe sumar anticipos"
                // _calculateFinanceData separa 'estimado' y 'anticipo'.

                _renderDualAmount(uiC.estimado, dataConst.estimado, dataConst.estimadoTotal, 'text-warning', dataConst.autorizado, 'ESTIMADO');
                _renderDualAmount(uiC.ejercido, dataConst.ejercido, dataConst.ejercidoTotal, 'text-success', dataConst.autorizado, 'EJERCIDO');
                _renderDualAmount(uiC.avanceFisico, dataConst.avFisico, 0, 'text-secondary', dataConst.autorizado, 'AV. FISICO');
                if (uiC.porEjercer) _renderDualAmount(uiC.porEjercer, dataConst.porEjercer, dataConst.porEjercerTotal, '', dataConst.autorizado, 'POR EJERCER');

                if (dom.financiero.contratista) {
                    if (dom.financiero.contratista.anticipo) dom.financiero.contratista.anticipo.textContent = typeof _formatCurrency === 'function' ? _formatCurrency(dataConst.anticipo) : dataConst.anticipo;
                    if (dom.financiero.contratista.amortizado) dom.financiero.contratista.amortizado.textContent = typeof _formatCurrency === 'function' ? _formatCurrency(dataConst.amortizado) : dataConst.amortizado;
                }

                // SUPERVISION
                const uiS = dom.financiero.resumenSupervision;
                if (uiS && uiS.autorizado) uiS.autorizado.textContent = typeof _formatCurrency === 'function' ? _formatCurrency(dataSup.autorizado) : dataSup.autorizado;

                // Map 'PAGADO' UI to Calculated Pagado (Net/Gross)
                if (uiS && uiS.estimado) _renderDualAmount(uiS.estimado, dataSup.pagado, dataSup.pagadoTotal, 'text-warning', dataSup.autorizado, 'ESTIMADO');

                // Map 'EJERCIDO' UI to Calculated Ejercido
                if (uiS && uiS.ejercido) _renderDualAmount(uiS.ejercido, dataSup.ejercido, dataSup.ejercidoTotal, 'text-success', dataSup.autorizado, 'EJERCIDO');

                if (uiS && uiS.porEjercer) {
                    _renderDualAmount(uiS.porEjercer, dataSup.porEjercer, dataSup.porEjercerTotal, '', dataSup.autorizado, 'POR EJERCER');
                }
            } catch (err) {
                console.error('CRITICAL ERROR in _updateResumenFinanciero:', err);
            }
        }

        // Nuevo Flujo para Asignar Contratista
        async function _addContratista() {
            // 1. Obtener lista de empresas del catálogo
            const empresasCatalog = state.catalogs.empresas || [];
            // If empty, warn but allow adding? Better to warn but maybe empty catalog is init state.
            if (empresasCatalog.length === 0) {
                // If distinct empty logic needed, keep it. But users might want to add first one.
                // For now keep existing check or relax it?
                // Let's relax it to allow adding even if 0.
            }

            // Crear HTML para el "Cuadro Combinado" (Searchable Select)
            const optionsHtml = empresasCatalog.map(e =>
                `<option value="${e.razonSocial}" data-id="${e.id}"></option>`
            ).join('');

            const htmlContent = `
                    <div class="mb-3 text-start">
                        <label for="swal-input-empresa" class="form-label">Buscar y Seleccionar Empresa</label>
                        <input class="form-control" list="datalistOptions" id="swal-input-empresa" placeholder="Escriba para buscar...">
                        <datalist id="datalistOptions">
                            ${optionsHtml}
                        </datalist>
                         <div class="form-text small text-muted">Si la empresa no existe, se le pedirá confirmación para agregarla.</div>
                    </div>
                `;

            const { value: result } = await Swal.fire({
                title: 'Asignar Contratista',
                html: htmlContent,
                focusConfirm: false,
                showCancelButton: true,
                confirmButtonText: 'Asignar',
                showLoaderOnConfirm: true,
                preConfirm: () => {
                    const input = document.getElementById('swal-input-empresa');
                    const val = (input.value || '').trim().toUpperCase();
                    if (!val) {
                        Swal.showValidationMessage('Debe seleccionar o escribir una empresa');
                        return false;
                    }

                    // Buscar la empresa por razonSocial (que es lo que el input tiene)
                    const selectedEmpresa = empresasCatalog.find(e => e.razonSocial === val);

                    if (!selectedEmpresa) {
                        // Logic Change: Allow returning object to trigger creation flow
                        return { isNew: true, name: val };
                    }
                    return selectedEmpresa.id;
                }
            });

            if (!result) return;

            let idEmpresa = null;

            // Handle New Company Creation
            if (typeof result === 'object' && result.isNew) {
                const { isConfirmed } = await Swal.fire({
                    title: 'Empresa Nueva',
                    text: `La empresa "${result.name}" no existe en el catálogo.\n¿Desea registrarla y asignarla inmediatamente?`,
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonText: 'Sí, Registrar y Asignar',
                    cancelButtonText: 'Cancelar'
                });

                if (!isConfirmed) return;

                try {
                    _setGlobalLoader(true, 'Registrando nueva empresa...');
                    // Call Backend to Create Company
                    // Note: 'registrarEmpresa' must exist in backend
                    const resp = await serverCall('registrarEmpresa', { razonSocial: result.name });

                    if (resp && resp.id) {
                        idEmpresa = resp.id;
                        // Optimistic Update
                        if (!state.catalogs.empresas) state.catalogs.empresas = [];
                        state.catalogs.empresas.push({ id: resp.id, razonSocial: result.name });
                    } else {
                        throw new Error(resp?.message || 'No se recibió ID de la nueva empresa.');
                    }
                } catch (e) {
                    _setGlobalLoader(false);
                    console.error('Error creating company:', e);
                    Swal.fire('Error', 'No se pudo registrar la empresa: ' + e.message, 'error');
                    return;
                }
            } else {
                idEmpresa = result;
            }

            if (idEmpresa) {
                _setGlobalLoader(true, 'Asignando contratista...');
                try {
                    const result = await serverCall('asignarContratista', state.id, idEmpresa);

                    // Validación robusta: Aceptar true directo o objeto con success
                    if (result === true || (result && result.success)) {
                        await _loadData();
                        globalThis.showToast?.('Contratista asignado correctamente', 'success');
                    } else {
                        throw new Error(result?.message || 'Error desconocido');
                    }
                } catch (e) {
                    console.error(e);
                    Swal.fire('Error', 'No se pudo asignar el contratista: ' + e.message, 'error');
                } finally {
                    _setGlobalLoader(false);
                }
            }
        }

        // --- MATRIX ACTUALIZACIONES ---
        function _renderMatrixActualizaciones() {
            const headerEl = document.getElementById('matrix-header');
            const bodyEl = document.getElementById('matrix-body');
            const footerEl = document.getElementById('matrix-footer');
            const emptyEl = document.getElementById('matrix-empty');
            const wrapperEl = document.getElementById('matrix-wrapper');
            const countConceptos = document.getElementById('matrix-count-conceptos');
            const countUpdates = document.getElementById('matrix-count-updates');

            if (!headerEl || !bodyEl) return;

            // 1. Sort Updates by Consecutivo to ensure column order
            const actualizaciones = (state.data.presupuesto || [])
                .slice()
                .sort((a, b) => (Number(a.consecutivo) || 0) - (Number(b.consecutivo) || 0));

            // Handle empty state
            if (actualizaciones.length === 0 || actualizaciones.every(a => !a.lineas || a.lineas.length === 0)) {
                if (wrapperEl) wrapperEl.classList.add('d-none');
                if (emptyEl) emptyEl.classList.remove('d-none');
                if (countConceptos) countConceptos.textContent = '0 conceptos';
                if (countUpdates) countUpdates.textContent = '0 actualizaciones';
                return;
            }

            if (wrapperEl) wrapperEl.classList.remove('d-none');
            if (emptyEl) emptyEl.classList.add('d-none');

            // Helper for normalization (Matches _renderModalLines logic)
            const _normKey = (str) => (str || '').normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().replace(/\s+/g, ' ').trim();

            // 2. Collect all unique concepts across all updates
            const conceptosMap = new Map();
            actualizaciones.forEach((act, actIdx) => {
                (act.lineas || []).forEach(linea => {
                    // Use Normalized Key for grouping (Description + Category)
                    // Added '|' separator and Category to discriminator
                    const key = _normKey(linea.descripcion) + '|' + _normKey(linea.categoria);
                    if (key && !conceptosMap.has(key)) {
                        conceptosMap.set(key, {
                            descripcion: linea.descripcion || '', // Keep original description
                            categoria: linea.categoria || '',
                            firstSeen: actIdx
                        });
                    }
                });
            });

            // 3. Build matrix: [conceptKey] -> { meta, importes: [importe per update] }
            const matrix = {};
            conceptosMap.forEach((meta, key) => {
                matrix[key] = { meta, importes: [] };
                actualizaciones.forEach((act, idx) => {
                    // Find line matching BOTH description and category
                    const linea = (act.lineas || []).find(l =>
                        (_normKey(l.descripcion) + '|' + _normKey(l.categoria)) === key
                    );
                    matrix[key].importes[idx] = linea ? (parseFloat(linea.importe) || 0) : null;
                });
            });

            const conceptKeys = Object.keys(matrix);
            const numActualizaciones = actualizaciones.length;

            // Update counters
            if (countConceptos) countConceptos.textContent = `${conceptKeys.length} concepto${conceptKeys.length !== 1 ? 's' : ''}`;
            if (countUpdates) countUpdates.textContent = `${numActualizaciones} actualizaci${numActualizaciones !== 1 ? 'ones' : 'ón'}`;

            // 4. Build header row
            let headerHtml = '<tr>';
            headerHtml += '<th class="sticky-col">Ubicación / Concepto</th>';
            headerHtml += '<th>Cat.</th>';
            actualizaciones.forEach((act, idx) => {
                const nombre = (act.esOrigen == 1 || idx === 0) ? 'Origen' : (act.revision || `Rev ${String.fromCharCode(65 + idx - 1)}`);
                const fecha = _formatDateISO(act.fecha);
                const isLast = idx === numActualizaciones - 1;
                headerHtml += `<th class="text-center ${isLast ? 'col-vigente' : ''}">${nombre}${fecha ? `<br><span style="font-weight:400;text-transform:none;font-size:0.68rem;color:#64748b;">${fecha}</span>` : ''}</th>`;
            });
            headerHtml += '</tr>';
            headerEl.innerHTML = headerHtml;

            // 5. Build body rows
            let bodyHtml = '';
            conceptKeys.forEach(key => {
                const data = matrix[key];
                // RESOLVER CATEGORIA (ID o TEXTO)
                let rawCat = data.meta.categoria || '';
                let displayCat = rawCat;
                let catClass = '';

                // Normalizar para check (1=DAÑO FISICO, 2=DESAZOLVE)
                const sCat = String(rawCat).toUpperCase();

                if (sCat === '1' || sCat.includes('DAÑO') || sCat.includes('FISICO')) {
                    displayCat = 'DAÑO FÍSICO';
                    catClass = 'cat-df';
                } else if (sCat === '2' || sCat.includes('DESAZ')) {
                    displayCat = 'DESAZOLVE';
                    catClass = 'cat-dz';
                }

                bodyHtml += '<tr>';
                bodyHtml += `<td class="sticky-col">${_escapeHtml(data.meta.descripcion)}</td>`;
                bodyHtml += `<td><span class="cat-badge ${catClass}">${displayCat || '—'}</span></td>`;

                data.importes.forEach((importe, idx) => {
                    const isLast = idx === numActualizaciones - 1;

                    // Logic to find 'prev' non-null value? 
                    // Strict Matrix means comparing with previous column index. 
                    // If previous column was null (concept didn't exist), then delta is raw amount.
                    // If previous column had value, delta is diff.
                    const prev = idx > 0 ? data.importes[idx - 1] : null;
                    const hasPrev = prev !== null;
                    let delta = null;
                    let deltaHtml = '';

                    if (importe !== null) {
                        if (hasPrev) {
                            delta = importe - prev;
                            if (delta > 0.01) { // Tolerance
                                deltaHtml = `<div class="delta-up">+${_formatCurrency(delta)}</div>`;
                            } else if (delta < -0.01) {
                                deltaHtml = `<div class="delta-down">${_formatCurrency(delta)}</div>`;
                            }
                        } else if (idx === 0) {
                            // Origin - show as positive delta for clarity that it's "new" to the system
                            deltaHtml = `<div class="delta-up">+${_formatCurrency(importe)}</div>`;
                        } else if (idx > 0) {
                            // New concept in later revision (was null before)
                            deltaHtml = `<div class="delta-up">NUEVO</div>`;
                        }
                    }

                    const cellValue = importe !== null ? _formatCurrency(importe) : '<span class="text-muted">—</span>';
                    // Highlight logic: if diff is 0 and not origin, maybe dim it? No, keep standard.
                    bodyHtml += `<td class="${isLast ? 'col-vigente' : ''}">${cellValue}${deltaHtml}</td>`;
                });
                bodyHtml += '</tr>';
            });
            bodyEl.innerHTML = bodyHtml;

            // 5. Build footer with totals
            let footerHtml = '<tr>';
            footerHtml += '<td class="sticky-col text-end" colspan="2"><strong>Totales</strong></td>';
            actualizaciones.forEach((act, idx) => {
                const isLast = idx === numActualizaciones - 1;
                const total = conceptKeys.reduce((sum, key) => sum + (matrix[key].importes[idx] || 0), 0);
                const prevTotal = idx > 0 ? conceptKeys.reduce((sum, key) => sum + (matrix[key].importes[idx - 1] || 0), 0) : 0;
                const deltaTotal = total - prevTotal;
                let deltaHtml = '';
                if (idx > 0 && deltaTotal !== 0) {
                    deltaHtml = deltaTotal > 0
                        ? `<div class="delta-up">+${_formatCurrency(deltaTotal)}</div>`
                        : `<div class="delta-down">${_formatCurrency(deltaTotal)}</div>`;
                }
                footerHtml += `<td class="${isLast ? 'col-vigente' : ''}">${_formatCurrency(total)}${deltaHtml}</td>`;
            });
            footerHtml += '</tr>';
            footerEl.innerHTML = footerHtml;
        }

        function _escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function _attachCurrencyFormatters() {
            document.querySelectorAll('.currency-input').forEach(input => {
                input.addEventListener('blur', (e) => {
                    const val = parseFloat(e.target.value.replace(/[^0-9.-]/g, '')) || 0;
                    e.target.value = _formatCurrency(val, true);
                });
                input.addEventListener('focus', (e) => {
                    e.target.value = e.target.value.replace(/,/g, '').replace('$', '');
                    e.target.select();
                });
            });
        }
        function _formatCurrency(val, withSymbol = true) {
            const num = parseFloat(val) || 0;
            return (withSymbol ? '$' : '') + num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
        function _formatDateISO(dateStr) {
            if (!dateStr) return '';

            // 1. Direct YYYY-MM-DD (ISO Date part) - Return as is (No Timezone Shift)
            if (typeof dateStr === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
                const year = parseInt(dateStr.split('-')[0]);
                if (year < 2000) return ''; // Filter epoch
                return dateStr;
            }

            // 2. Direct dd/mm/yyyy (Manual Format) - Convert to ISO
            if (typeof dateStr === 'string' && /^\d{1,2}\/\d{1,2}\/\d{4}$/.test(dateStr)) {
                const parts = dateStr.split('/');
                const year = parseInt(parts[2]);
                if (year < 2000) return '';
                // Ensure padding
                const month = parts[1].padStart(2, '0');
                const day = parts[0].padStart(2, '0');
                return `${year}-${month}-${day}`;
            }

            try {
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return '';

                if (d.getFullYear() < 2000) return '';

                // Fallback: Use Local Time parts
                const year = d.getFullYear();
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            } catch (e) { return ''; }
        }

        // Helper para obtener fecha actual en formato local segura YYYY-MM-DD
        function _getTodayLocalISO() {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // Helper para ENVIAR al backend en formato ISO (yyyy-mm-dd) mas seguro
        function _toSaveDate(isoDateStr) {
            if (!isoDateStr) return '';
            // _formatDateISO ya devuelve yyyy-mm-dd limpio
            return _formatDateISO(isoDateStr);
        }

        function _updateTableTotals(entidad) {
            const isSupervision = entidad === 'SUPERVISION';
            const ui = isSupervision ? dom.financiero.resumenSupervision : dom.financiero.resumen;

            if (!ui || !ui.neto) return;

            // Filter items
            const items = (state.data.estimaciones || [])
                .filter(e => (e.entidad || 'CONSTRUCTORA').toUpperCase() === entidad && e.estatusInterno !== 'CANCELADO');

            // Calculate Totals using logic consistent with row renderers
            let totalNeto = 0;
            let totalIva = 0;
            let totalTotal = 0;

            items.forEach(e => {
                // Neto = Monto - Amortizacion
                const neto = (parseFloat(e.monto) || 0) - (parseFloat(e.amortizacion) || 0);
                totalNeto += neto;
                totalIva += parseFloat(e.iva) || 0;
                totalTotal += parseFloat(e.montoTotal) || 0;
            });

            // Update DOM
            if (ui.neto) ui.neto.textContent = _formatCurrency(totalNeto);
            if (ui.iva) ui.iva.textContent = _formatCurrency(totalIva);
            if (ui.total) ui.total.textContent = _formatCurrency(totalTotal);
        }

        function _renderTableSupervision(container) {
            // 1. Obtener estimaciones SUPERVISION
            const estSupervision = (state.data.estimaciones || [])
                .filter(e => (e.entidad || 'CONSTRUCTORA').toUpperCase() === 'SUPERVISION');

            // 2. Obtener estimaciones CONSTRUCTORA (Parents)
            const estContratista = (state.data.estimaciones || [])
                .filter(e => (e.entidad || 'CONSTRUCTORA').toUpperCase() === 'CONSTRUCTORA')
                .sort((a, b) => {
                    const mapType = { 'ANTICIPO': 1, 'ESTIMACION': 2, 'FINIQUITO': 3 };
                    return (mapType[a.tipo] || 99) - (mapType[b.tipo] || 99) || (parseInt(a.numero) - parseInt(b.numero));
                });

            // 3. Crear Estructura de Tabla
            const table = _createTableSkeleton(false); // isSupervision = false (Constructora View)
            const tbody = table.querySelector('tbody');

            // 4. Renderizar por cada Contratista (Parent)
            // Si la contratista NO tiene supervision, aun asi la mostramos para permitir agregarle una.
            // Asi que iteramos sobre TODAS las contratistas disponibles.

            // OJO: El usuario dice "mostrar datos de la estimacion de la contratista... Debajo un boton".
            // Y si ya existe supervision? Mostrar la existente.

            if (estContratista.length === 0 && estSupervision.length === 0) {
                container.innerHTML = `<div class="text-center text-muted py-5 border rounded bg-light mb-3">Sin estimaciones registradas</div>`;
                return;
            }

            estContratista.forEach(parentEst => {
                // Render Estimacion Row (Editable for Constructora)
                // Check deps for delete protection
                const facturasAsociadas = (state.data.facturasEstimaciones || [])
                    .filter(f => String(f.idEstimacion) === String(parentEst.id) && f.estatusSAT !== 'CANCELADO');
                const tieneFacturas = facturasAsociadas.length > 0;

                const trParent = _createEstimacionRow(parentEst, tieneFacturas, false, false); // isIndented=false, isSupervision=false
                tbody.appendChild(trParent);

                // Check for existing Supervision Children
                // Check for idRelacionada (Sheet Header) or idEstimacionVinculada (Legacy/Import Object)
                const children = estSupervision.filter(s => String(s.idRelacionada || s.idEstimacionVinculada || '').trim() === String(parentEst.id).trim());

                // Si existe, mostrar
                if (children.length > 0) {

                    // Asumiremos 1:1 por logica comun, pero el boton permite crear nueva.
                    // Si ya hay una, quizas no queremos boton?
                    // "Al dar click... se inserta el registro".
                    // Mostraremos el boton SIEMPRE si queremos permitir N, o solo si children=0 si es 1:1.
                    // Por ahora mostremos el boton SOLO si no hay hijos, para forzar 1:1 logico visual, 
                    // a menos que sean estimaciones parciales.
                    // Dejaremos el boton disponible siempre debajo para consistencia.

                    const trBtnObj = document.createElement('tr');

                                       <i class="bi bi-plus-lg me-2"></i>Agregar Estimación de Supervisión
                                   </button>
                                </div>
                           </div>
                       </td>
                    `;
                    tbody.appendChild(trBtnObj);
                }
            });

            // 5. Renderizar Huerfanas (Supervision sin idVinculada o con id invalido)
            const orphans = estSupervision.filter(s => {
                const refId = String(s.idRelacionada || s.idEstimacionVinculada || '').trim();
                return !refId || !estContratista.find(c => String(c.id).trim() === refId);

            if (orphans.length > 0) {
                // Header o separador para huerfanas
                const trSep = document.createElement('tr');
                trSep.className = 'table-warning';
                trSep.innerHTML = `<td colspan="12" class="text-center small fw-bold text-dark">ESTIMACIONES DE SUPERVISIÓN SIN VINCULAR</td>`;
                tbody.appendChild(trSep);

                orphans.forEach(child => {
                    _appendEstimacionRowPair(tbody, child, false);
                });
            }

            container.appendChild(table);
        }

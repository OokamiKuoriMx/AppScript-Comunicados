<script>
    /**
     * Componente ComunicadoDetalle
     * Vista detallada y completa para la gestión de un comunicado individual.
     * VERSIÓN: 3.1 - Full Refactor & Fix
     */
    console.log('📦 ComunicadoDetalle.js cargado - Versión 3.1');
    globalThis.ComunicadoDetalle = (() => {
        'use strict';

        // --- ESTADO LOCAL ---
        let state = {
            id: null,
            data: null,
            catalogs: {},
            loading: false,
            saving: false,
            editingPresupuestoIdx: null,
            ui: {
                selectedEstimacionId: null,
                selectedEntidad: null
            }
        };

        // --- REFERENCIAS DOM ---
        let dom = {};

        // --- CONSTANTES ---
        const IVA_RATE = 0.16;

        /**
         * Inicializa el componente
         */
        async function init(container) {
            console.log('Iniciando ComunicadoDetalle v3.2...');

            _setGlobalLoader(true, 'Preparando entorno...');

            const storedId = sessionStorage.getItem('currentComunicadoId');
            if (!storedId) {
                console.warn('ID no encontrado. Volviendo al listado.');
                location.hash = '#/comunicados';
                return;
            }
            state.id = storedId;

            try {
                await _mount(container);
                _cacheDom();
                _bindEvents();

                _setGlobalLoader(true, 'Sincronizando datos...');
                await _loadData();

            } catch (error) {
                console.error('Error crítico:', error);
                container.innerHTML = `<div class="alert alert-danger p-4">
                    <h4>Error de Carga</h4><p>${error.message}</p>
                    <button class="btn btn-outline-danger" onclick="location.reload()">Recargar</button>
                </div>`;
            } finally {
                _setGlobalLoader(false);
            }
        }

        const mount = async (container) => init(container);

        async function _mount(container) {
            container.innerHTML = '';
            let content = globalThis.TEMPLATES?.['comunicado_detalle'];
            if (!content) {
                const response = await serverCall('getTemplates', ['comunicado_detalle']);
                content = response?.comunicado_detalle;
            }
            if (!content) throw new Error('Plantilla no encontrada.');
            container.innerHTML = content;
        }

        function _cacheDom() {
            dom.headerTitle = document.getElementById('header-titulo');
            dom.headerSubtitle = document.getElementById('header-subtitulo');
            dom.btnVolver = document.getElementById('btn-volver-listado');
            dom.btnGuardar = document.getElementById('btn-guardar-todo');
            dom.btnEliminar = document.getElementById('btn-eliminar-comunicado');
            dom.btnConfirmDelete = document.getElementById('btn-confirm-delete-detalle');

            const modalEl = document.getElementById('modalConfirmDeleteDetalle');
            if (modalEl) {
                dom.modalDelete = new bootstrap.Modal(modalEl);
            } else {
                console.warn('Modal ConfirmDeleteDetalle no encontrado. Posible desactualización de plantilla.');
            }

            // General
            dom.genId = document.getElementById('gen-id');
            // Referencia - Antes era gen-cuenta o gen-referencia
            dom.genCuenta = document.getElementById('gen-cuenta') || document.getElementById('gen-referencia');
            dom.genAjustador = document.getElementById('gen-ajustador');
            dom.genAseguradora = document.getElementById('gen-aseguradora'); // Nuevo
            dom.genFecha = document.getElementById('gen-fecha');
            dom.genFechaDocumento = document.getElementById('gen-fecha-documento'); // Nuevo
            dom.genComunicado = document.getElementById('gen-comunicado');
            dom.genDescripcion = document.getElementById('gen-descripcion');

            // Ubicación
            dom.genEstado = document.getElementById('gen-estado');
            dom.genDistrito = document.getElementById('gen-distrito');
            dom.genSiniestro = document.getElementById('gen-siniestro');
            dom.genFenomeno = document.getElementById('gen-fenomeno');
            dom.genFi = document.getElementById('gen-fi');
            dom.genFondo = document.getElementById('gen-fondo');
            dom.dropdownSiniestro = document.getElementById('dropdown-gen-siniestro-list');
            dom.dropdownDistrito = document.getElementById('dropdown-gen-distrito-list');
            dom.dropdownAjustador = document.getElementById('dropdown-gen-ajustador-list');
            dom.dropdownAseguradora = document.getElementById('dropdown-gen-aseguradora-list');

            dom.avisos = {
                siniestro: document.getElementById('aviso-gen-siniestro'),
                distrito: document.getElementById('aviso-gen-distrito'),
                ajustador: document.getElementById('aviso-gen-ajustador'),
                aseguradora: document.getElementById('aviso-gen-aseguradora')
            };


            // Financiero - separado por entidad
            dom.financiero = {
                bodyConstructora: document.getElementById('lista-estimaciones-constructora'),
                bodySupervision: document.getElementById('lista-estimaciones-supervision'),
                btnAddConstructora: document.getElementById('btn-add-estimacion-constructora'),
                btnAddSupervision: document.getElementById('btn-add-estimacion-supervision'),
                totalConstructora: document.getElementById('total-constructora'),
                totalSupervision: document.getElementById('total-supervision'),
                resumen: {
                    autorizado: document.getElementById('fin-autorizado'),
                    ejercido: document.getElementById('fin-ejercido'),
                    porEjercer: document.getElementById('fin-por-ejercer')
                },
                selectContratista: document.getElementById('select-contratista-main')
            };

            // Presupuesto
            dom.presupuesto = {
                body: document.getElementById('tabla-presupuesto-body'),
                btnAdd: document.getElementById('btn-add-actualizacion'),
                totalLabel: document.getElementById('presupuesto-total-autorizado')
            };

            // Equipo
            dom.equipo = {
                listContratistas: document.getElementById('lista-contratistas'),
                listSupervisores: document.getElementById('lista-supervisores'),
                btnAddContratista: document.getElementById('btn-add-contratista'),
                btnAddSupervisor: document.getElementById('btn-add-supervisor')
            };

            // Tickets
            dom.tickets = {
                list: document.getElementById('lista-tickets'),
                btnAdd: document.getElementById('btn-add-ticket')
            };
        }

        // --- HANDLERS (New) ---
        function _handleDeleteClick() {
            dom.modalDelete?.show();
        }

        async function _confirmDelete() {
            const id = state.id;
            if (!id) return;

            const btn = dom.btnConfirmDelete;
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = 'Eliminando...';

            try {
                // Call backend deleteComunicado (CASCADE)
                await serverCall('deleteComunicado', id);

                dom.modalDelete.hide();
                globalThis.showToast?.('Comunicado eliminado correctamente.', 'success');

                // Redirect back to list
                setTimeout(() => {
                    location.hash = '#/comunicados';
                }, 500);

            } catch (error) {
                console.error("Delete Error:", error);
                alert('Error al eliminar: ' + error.message);
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        function _forceUppercase(input) {
            const start = input.selectionStart;
            const end = input.selectionEnd;
            input.value = input.value.toUpperCase();
            input.setSelectionRange(start, end);
        }

        function _bindEvents() {
            dom.btnVolver?.addEventListener('click', () => location.hash = '#/comunicados');
            dom.btnGuardar?.addEventListener('click', _guardarTodo);

            // Delete Handlers (Fix)
            dom.btnEliminar?.addEventListener('click', _handleDeleteClick);
            dom.btnConfirmDelete?.addEventListener('click', _confirmDelete);

            dom.presupuesto.btnAdd?.addEventListener('click', _addActualizacionPresupuesto);
            dom.financiero.btnAddConstructora?.addEventListener('click', () => _addEstimacion('CONSTRUCTORA'));
            dom.financiero.btnAddSupervision?.addEventListener('click', () => _addEstimacion('SUPERVISION'));
            dom.equipo.btnAddContratista?.addEventListener('click', () => _addEquipo('contratista'));
            dom.equipo.btnAddSupervisor?.addEventListener('click', () => _addEquipo('supervisor'));
            dom.tickets.btnAdd?.addEventListener('click', _addTicket);

            // Force Uppercase for standard inputs
            [dom.genComunicado, dom.genDescripcion, dom.genFenomeno, dom.genFi, dom.genFondo].forEach(el => {
                if (el) el.addEventListener('input', () => _forceUppercase(el));
            });

            _initSidebarNavigation();
        }

        // --- MANEJO DE NAVEGACIÓN (FIX) ---
        function _initSidebarNavigation() {
            // Seleccionar todos los links que actúan como tabs (incluyendo anidados)
            const allLinks = document.querySelectorAll('#detalle-nav-tabs a[data-bs-toggle="list"]');

            allLinks.forEach(link => {
                link.addEventListener('click', function (e) {
                    // 1. Quitar 'active' de TODOS los links del sidebar (limpieza visual)
                    allLinks.forEach(l => l.classList.remove('active'));

                    // 2. Bootstrap agregará 'active' al clickeado automáticamente, pero aseguramos
                    // que el resto se limpie correctamente.

                    // 3. Manejar Paneles: Ocultar TODOS los paneles, mostrar SOLO el target
                    // Esto arregla el bug de solapamiento visual
                    const targetId = this.getAttribute('href').substring(1); // remove #

                    document.querySelectorAll('.tab-pane').forEach(pane => {
                        if (pane.id === targetId) {
                            pane.classList.add('show', 'active');
                        } else {
                            pane.classList.remove('show', 'active');
                        }
                    });
                });
            });
        }

        async function _loadData() {
            try {
                const catalogsResponse = await serverCall('fetchComunicadoCatalogs');

                if (catalogsResponse) {
                    state.catalogs = catalogsResponse;
                    _poblarCatalogosUI();
                } else {
                    console.warn('fetchComunicadoCatalogs retornó nulo o indefinido');
                }

                const dataResponse = await serverCall('getComunicadoCompleto', state.id);
                if (dataResponse) {
                    state.data = _sanitizeData(dataResponse);
                    _renderData();
                }
            } catch (e) {
                console.error(e);
                _showAlert('Error de Carga', e.message, 'error');
            }
        }

        function _sanitizeData(d) {
            return {
                ...d,
                presupuesto: d.presupuesto || [],
                equipo: d.equipo || [],
                tickets: d.tickets || [],
                financiero: Array.isArray(d.financiero) ? d.financiero : (d.financiero?.estimaciones || [])
            };
        }

        function _poblarCatalogosUI() {
            try {
                console.log('Inicio _poblarCatalogosUI. Catalogs:', state.catalogs ? Object.keys(state.catalogs) : 'null');

                if (dom.genEstado && state.catalogs.estados) {
                    try {
                        dom.genEstado.innerHTML = '<option value="">Seleccione...</option>';
                        state.catalogs.estados.forEach(est => {
                            const opt = document.createElement('option');
                            opt.value = est.id;
                            opt.textContent = est.estado || est.nombre;
                            dom.genEstado.appendChild(opt);
                        });
                    } catch (e) {
                        console.error('Error poblando estados:', e);
                    }
                }

                try {
                    _setupCombobox(dom.genSiniestro, dom.dropdownSiniestro, state.catalogs.siniestros || [], 'siniestro',
                        (item) => { dom.genSiniestro.value = item.siniestro; _onSiniestroChange(item); },
                        dom.avisos.siniestro,
                        (val, match) => {
                            if (match) _onSiniestroChange(match);
                            else _onSiniestroChange(null);
                        }
                    );
                } catch (e) { console.error('Error setupCombobox Siniestro:', e); }

                try {
                    _setupCombobox(dom.genDistrito, dom.dropdownDistrito, state.catalogs.distritosRiego || [], 'distritoRiego',
                        (item) => dom.genDistrito.value = item.distritoRiego,
                        dom.avisos.distrito
                    );
                } catch (e) { console.error('Error setupCombobox Distrito:', e); }

                try {
                    _setupCombobox(dom.genAjustador, dom.dropdownAjustador, state.catalogs.ajustadores || [], 'nombreAjustador',
                        (item) => {
                            dom.genAjustador.value = item.nombreAjustador || item.nombre;
                        },
                        dom.avisos.ajustador
                    );
                    console.log('Catalogos UI poblados. Ajustadores:', state.catalogs.ajustadores?.length);
                } catch (e) { console.error('Error setupCombobox Ajustador:', e); }

                try {
                    _setupCombobox(dom.genAseguradora, dom.dropdownAseguradora, state.catalogs.aseguradoras || [], 'aseguradora',
                        (item) => {
                            dom.genAseguradora.value = item.aseguradora || item.nombre;
                        },
                        dom.avisos.aseguradora
                    );
                } catch (e) { console.error('Error setupCombobox Aseguradora:', e); }

            } catch (err) {
                console.error('Error FATAL en _poblarCatalogosUI:', err);
            }
        }

        function _renderData() {
            const d = state.data;

            // Header: DESCRIPCIÓN TITLE (Blue & Uppercase)
            // Ya no se muestra ID ni Ref en subtitulo
            dom.headerTitle.textContent = (d.descripcion || 'SIN DESCRIPCIÓN').toUpperCase();
            if (dom.headerSubtitle) dom.headerSubtitle.textContent = '';

            // Si el texto es muy largo, se trunca con CSS, pero podemos poner tooltip
            dom.headerTitle.title = d.descripcion || '';

            // Datos Generales
            dom.genId.value = d.id || '';

            // Referencia (buscar por ID original o alternativo)
            const referencia = d.referencia || d.cuenta?.referencia || d.cuenta?.cuenta || 'Sin Referencia';
            const inputReferencia = dom.genCuenta || document.getElementById('gen-referencia');
            if (inputReferencia) {
                inputReferencia.value = referencia;
            }

            // AJUSTADOR (Solo Lectura - Heredado de Cuenta)
            // Backend ahora envía d.ajustador = { id, nombre }


            if (dom.genAjustador) {
                // Prioridad: 1. Ajustador del objeto datosGenerales (enriquecido y populado en 'ajustador')
                //            2. Ajustador heredado de la cuenta/referencia (si existiera)
                //            3. Ajustador por nombre directo
                let nombreAjustadorReal = '';

                if (d.ajustador && d.ajustador.nombreAjustador) {
                    nombreAjustadorReal = d.ajustador.nombreAjustador;
                } else if (d.ajustadorNombre) {
                    nombreAjustadorReal = d.ajustadorNombre;
                }

                dom.genAjustador.value = nombreAjustadorReal;
            }

            // Mapeo corregido por feedback: Fecha de Registro -> fechaAsignacion, Fecha Documento -> fecha (original)
            dom.genFecha.value = _formatDateISO(d.fechaAsignacion || d.fechaCreacion); // "Fecha de Registro"
            if (dom.genFechaDocumento) dom.genFechaDocumento.value = _formatDateISO(d.fecha); // "Fecha del Documento"
            dom.genComunicado.value = d.comunicado || '';
            dom.genDescripcion.value = d.descripcion || '';
            if (d.idEstado) dom.genEstado.value = d.idEstado;
            _setComboboxValue(dom.genDistrito, d.distrito, 'distritoRiego');
            _setComboboxValue(dom.genSiniestro, d.siniestro, 'siniestro');

            // Aseguradora
            if (dom.genAseguradora) {
                const asegNombre = d.siniestroDetalle?.aseguradora || 'Sin Aseguradora';
                dom.genAseguradora.value = asegNombre;
            }

            // Datos del Siniestro Detallados
            if (dom.genFenomeno) dom.genFenomeno.value = d.siniestroDetalle?.fenomeno || '';
            if (dom.genFondo) dom.genFondo.value = d.siniestroDetalle?.fondo || '';
            if (dom.genFi) dom.genFi.value = d.siniestroDetalle?.fi || ''; // Ahora "Fecha Incidencia"
            if (d.siniestro) _onSiniestroChange(d.siniestro);

            _renderPresupuesto();
            _renderEquipo();
            _renderFinanciero();
            _renderTickets();
            _renderMatrixActualizaciones();

            // Render Contratista Selector (Nuevo)
            _renderContratistaSelector();

            // Mostrar contenido principal
            const content = document.getElementById('detalle-content');
            if (content) content.classList.remove('d-none');
        }

        // --- FINANCIERO (Separado por ENTIDAD) - INTERFAZ INTERACTIVA ---
        const ESTATUS_OPTIONS = ['PENDIENTE', 'EN_REVISION', 'APROBADO', 'PAGADO', 'CANCELADO'];

        async function _renderFinanciero() {
            const tbodyC = dom.financiero.bodyConstructora;
            const tbodyS = dom.financiero.bodySupervision;
            if (!tbodyC || !tbodyS) return;

            // Cargar desde el servidor si no se ha cargado aún
            // NOTA: Ahora las facturas vienen anidadas desde getComunicadoCompleto,
            // pero mantenemos esta lógica para aplanar la estructura si es necesario.
            if (!state.ui._estimacionesLoaded) {
                try {
                    // Populate facturasEstimaciones from nested facturas arrays if available
                    if (state.data && state.data.estimaciones) {
                        state.data.facturasEstimaciones = state.data.estimaciones.flatMap(e => e.facturas || []);
                    } else {
                        state.data.facturasEstimaciones = [];
                    }
                    state.ui._estimacionesLoaded = true;
                } catch (e) {
                    console.error('Error procesando estimaciones iniciales:', e);
                    state.ui._estimacionesLoaded = true;
                }
            }

            const items = state.data.estimaciones || [];
            const constructora = items.filter(e => (e.entidad || 'CONSTRUCTORA').toUpperCase() === 'CONSTRUCTORA');
            const supervision = items.filter(e => (e.entidad || '').toUpperCase() === 'SUPERVISION');

            // Helper para crear select de estatus
            const estatusSelect = (id, current) => {
                const opts = ESTATUS_OPTIONS.map(s =>
                    `<option value="${s}" ${s === current ? 'selected' : ''}>${s.replace('_', ' ')}</option>`
                ).join('');
                return `<select class="form-select form-select-sm" onchange="ComunicadoDetalle.updateEstimacion('${id}', 'estatusInterno', this.value)">${opts}</select>`;
            };

            // Helper para crear select de vinculación (solo para SUPERVISION)
            const vinculadoSelect = (item, constructoraList) => {
                const opts = constructoraList
                    .filter(c => c.tipo === item.tipo) // Solo del mismo tipo
                    .map(c => `<option value="${c.id}" ${c.id === item.idEstimacionVinculada ? 'selected' : ''}>${c.tipo} ${c.numero} - ${_formatCurrency(c.montoAutorizado)}</option>`)
                    .join('');
                return `<select class="form-select form-select-sm" onchange="ComunicadoDetalle.updateEstimacion('${item.id}', 'idEstimacionVinculada', this.value)">
                    <option value="">Sin vincular</option>${opts}</select>`;
            };

            // Renderizar CONSTRUCTORA (editable)
            tbodyC.innerHTML = '';
            if (constructora.length === 0) {
                tbodyC.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-muted">
                    <i class="bi bi-inbox fs-4 d-block mb-2"></i>Sin estimaciones de constructora</td></tr>`;
            } else {
                constructora.forEach(item => {
                    const tr = document.createElement('tr');
                    const tipoBadge = item.tipo === 'ANTICIPO' ? 'bg-success' :
                        item.tipo === 'FINIQUITO' ? 'bg-danger' : 'bg-primary';
                    const numFacturas = item.facturas?.length || 0;

                    tr.className = (state.ui.selectedEstimacionId === item.id) ? 'table-active' : '';
                    tr.style.cursor = 'pointer';
                    tr.onclick = (e) => {
                        // Ignore input clicks
                        if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.closest('button')) return;
                        ComunicadoDetalle.selectEstimacion(item.id, 'CONSTRUCTORA');
                    };

                    tr.innerHTML = `
                        <td>
                            <span class="badge ${tipoBadge}">${item.tipo || 'ESTIMACION'}</span>
                            ${item._isNew ? '<span class="badge bg-info text-dark ms-1" style="font-size:0.65rem;">NUEVA</span>' : ''}
                        </td>
                        <td>
                            <input type="text" class="form-control form-control-sm text-center fw-bold" 
                                value="${item.numero || ''}" style="width: 50px;"
                                onchange="ComunicadoDetalle.updateEstimacion('${item.id}', 'numero', this.value)">
                        </td>
                        <td>
                            <div class="d-flex flex-column gap-1">
                                <input type="date" class="form-control form-control-xs" title="Fecha Corte / Solicitud"
                                    value="${_formatDateISO(item.fechaCorte)}"
                                    onchange="ComunicadoDetalle.updateEstimacion('${item.id}', 'fechaCorte', this.value)">
                                
                                ${(item.entidad !== 'SUPERVISION' && item.tipo !== 'ANTICIPO') ? `
                                <div class="input-group input-group-xs">
                                    <span class="input-group-text p-0 px-1 text-muted" style="font-size: 0.65rem;">Del</span>
                                    <input type="date" class="form-control form-control-xs p-1" style="font-size: 0.7rem;"
                                        value="${_formatDateISO(item.periodoInicio)}"
                                        onchange="ComunicadoDetalle.updateEstimacion('${item.id}', 'periodoInicio', this.value)">
                                </div>
                                <div class="input-group input-group-xs">
                                    <span class="input-group-text p-0 px-1 text-muted" style="font-size: 0.65rem;">Al</span>
                                    <input type="date" class="form-control form-control-xs p-1" style="font-size: 0.7rem;"
                                        value="${_formatDateISO(item.periodoFin)}"
                                        onchange="ComunicadoDetalle.updateEstimacion('${item.id}', 'periodoFin', this.value)">
                                </div>
                                ` : ''}
                            </div>
                        </td>
                        
                        <!-- FINANCIAL FIELDS -->
                        <td>
                            <input type="text" class="form-control form-control-sm text-end" placeholder="0%"
                                value="${(item.porcentajeAvanceFisico || 0) + '%'}"
                                onchange="ComunicadoDetalle.updateEstimacion('${item.id}', 'porcentajeAvanceFisico', this.value.replace('%',''))"
                                ${item.tipo === 'ANTICIPO' ? 'disabled style="background-color:#f8f9fa;"' : ''}>
                        </td>
                        <td>
                            <input type="text" class="form-control form-control-sm text-end currency-input" placeholder="$0.00"
                                value="${_formatCurrency(item.montoAvanceFisico, false)}"
                                onchange="ComunicadoDetalle.updateEstimacion('${item.id}', 'montoAvanceFisico', this.value)"
                                ${item.tipo === 'ANTICIPO' ? 'disabled style="background-color:#f8f9fa;"' : ''}>
                        </td>
                        <td>
                            <input type="text" class="form-control form-control-sm text-end currency-input text-danger" placeholder="$0.00"
                                value="${_formatCurrency(item.amortizacion, false)}"
                                onchange="ComunicadoDetalle.updateEstimacion('${item.id}', 'amortizacion', this.value)"
                                ${item.tipo === 'ANTICIPO' ? 'disabled style="background-color:#f8f9fa;"' : ''}>
                        </td>
                        <td>
                            <input type="text" class="form-control form-control-sm text-end currency-input ${item.tipo === 'ANTICIPO' ? '' : 'bg-light'}" 
                                ${item.tipo === 'ANTICIPO' ? '' : 'readonly'}
                                value="${_formatCurrency(item.montoNeto, false)}"
                                title="${item.tipo === 'ANTICIPO' ? 'Monto del Anticipo' : 'Calculado: Avance Físico - Amortización'}"
                                onchange="ComunicadoDetalle.updateEstimacion('${item.id}', 'montoNeto', this.value)">
                        </td>
                        <td>
                            <input type="text" class="form-control form-control-sm text-end currency-input bg-light" placeholder="$0.00" readonly
                                value="${_formatCurrency(item.iva, false)}"
                                title="IVÁ (16%) Auto-calculado">
                        </td>
                        <td>
                            <input type="text" class="form-control form-control-sm text-end currency-input fw-bold" readonly
                                value="${_formatCurrency(item.montoTotal, false)}"
                                title="Calculado: Neto + IVA">
                        </td>


                        <td>${estatusSelect(item.id, item.estatusInterno || 'PENDIENTE')}</td>
                        
                        <td class="text-center">
                            <div class="btn-group btn-group-sm">
                                <button class="btn ${item._modified ? 'btn-primary' : 'btn-outline-success'} border-0" 
                                    onclick="ComunicadoDetalle.saveEstimacion('${item.id}')" 
                                    title="${item._modified ? 'Guardar Cambios' : 'Sin cambios pendientes'}" 
                                    ${item._modified ? '' : 'disabled'}>
                                    <i class="bi ${item._modified ? 'bi-save' : 'bi-check-circle'}"></i>
                                </button>
                                <button class="btn btn-outline-danger border-0" onclick="ComunicadoDetalle.removeEstimacion('${item.id}')" title="Eliminar">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                        </td>
                    `;
                    tbodyC.appendChild(tr);
                });
            }

        // --- CONTRATISTA SELECTOR LOGIC ---
        function _renderContratistaSelector() {
            const select = dom.financiero.selectContratista;
            if (!select) return;

            const contratistas = state.data.relacionContratistas || [];

            // Limpiar
            select.innerHTML = '';

            if (contratistas.length === 0) {
                const opt = document.createElement('option');
                opt.value = "";
                opt.textContent = "Sin contratistas asignados";
                select.appendChild(opt);
                return;
            }

            // Ordenar: Vigentes primero
            // Asumimos que esVigente es booleano o 1/0
            const sorted = [...contratistas].sort((a, b) => {
                const vigA = a.esVigente ? 1 : 0;
                const vigB = b.esVigente ? 1 : 0;
                return vigB - vigA; // Descendente (1 antes que 0)
            });

            let defaultSelected = null;

            sorted.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.idEmpresa; // Usamos ID Empresa para vincular
                // Mostrar nombre y si es vigente
                opt.textContent = c.nombreEmpresa + (c.esVigente ? ' (VIGENTE)' : '');

                // Estilo visual si es vigente (no funciona en todos los navegadores igual, pero ayuda)
                if (c.esVigente) {
                    opt.style.fontWeight = 'bold';
                    if (!defaultSelected) defaultSelected = c.idEmpresa;
                }

                select.appendChild(opt);
            });

            // Seleccionar por defecto el vigente encontrado
            if (defaultSelected) {
                select.value = defaultSelected;
            }
        }
        function updateEstimacion(id, field, value) {
            const item = (state.data.estimaciones || []).find(e => e.id === id);
            if (!item) return;

            if (field === 'montoAutorizado' || field === 'montoNeto') {
                item[field] = parseFloat(String(value).replace(/[$,]/g, '')) || 0;
            } else {
                item[field] = value;
            }

            // Marcar como modificado para el guardado
            item._modified = true;

            // LOGIC: 100% Avance Fisico -> FINIQUITO
            if (field === 'porcentajeAvanceFisico' && item.entidad === 'CONSTRUCTORA') {
                const pct = parseFloat(value || 0);
                if (pct >= 100) {
                    item.tipo = 'FINIQUITO';
                    item.porcentajeAvanceFisico = 100; // Cap at 100 visual
                } else if (item.tipo === 'FINIQUITO') {
                    item.tipo = 'ESTIMACION';
                }
            }

            // Recalcular montos autocalculados
            // Recalcular montos autocalculados
            // Si es ANTICIPO, el Neto es manual
            if (item.tipo === 'ANTICIPO') {
                if (field === 'montoNeto') {
                    const neto = parseFloat(String(item.montoNeto || 0));
                    // Auto-calcular IVA
                    item.iva = neto * IVA_RATE;
                    // Calcular Total
                    item.montoTotal = neto + item.iva;
                    _renderFinanciero();
                }
                return;
            }

            // Para ESTIMACION/FINIQUITO (Flujo normal)
            if (['montoAvanceFisico', 'amortizacion'].includes(field)) {

                const fisico = parseFloat(String(item.montoAvanceFisico || 0)); // Ensure it's treated as number
                const amort = parseFloat(String(item.amortizacion || 0));

                // 1. Calcular Neto
                item.montoNeto = fisico - amort;

                // 2. Auto-calcular IVA
                item.iva = item.montoNeto * IVA_RATE;

                // 3. Calcular Total
                item.montoTotal = item.montoNeto + item.iva;

                // Re-render para mostrar calculados
                _renderFinanciero();
            }
        }

        function addFactura(entidad) {
            if (!state.ui.selectedEstimacionId) {
                Swal.fire('Seleccione una estimación', 'Debe seleccionar una estimación primero', 'warning');
                return;
            }

            // Find parent estimacion to copy amounts
            const estimacion = (state.data.estimaciones || []).find(e => e.id === state.ui.selectedEstimacionId);
            const montoNeto = estimacion ? (parseFloat(estimacion.montoNeto) || 0) : 0;
            const iva = estimacion ? (parseFloat(estimacion.iva) || 0) : 0;
            const total = estimacion ? (parseFloat(estimacion.montoTotal) || 0) : 0;

            const nuevaFactura = {
                id: 'temp-fact-' + Date.now(),
                idEstimacion: state.ui.selectedEstimacionId,
                folioFactura: '', // Empty for user input
                monto: montoNeto,
                iva: iva,
                total: total,
                fecha: new Date().toISOString().split('T')[0],
                uuid: '',
                estatusSAT: 'VIGENTE',
                _isNew: true,
                _isNewlyAdded: true,
                _modified: true // Mark clear modified to show save button
            };

            // Add to local state
            if (!state.data.facturasEstimaciones) state.data.facturasEstimaciones = [];
            state.data.facturasEstimaciones.push(nuevaFactura);

            // Render immediately (no modal, no server call yet)
            if (state.ui.selectedEstimacionId) {
                selectEstimacion(state.ui.selectedEstimacionId, state.ui.selectedEntidad);
            }
        }

        async function saveEstimacion(id) {
            const item = (state.data.estimaciones || []).find(e => e.id === id);
            if (!item) return;

            try {
                _setGlobalLoader(true, 'Guardando estimación...');

                if (item._isNew) {
                    // Create
                    const response = await serverCall('crearEstimacion', item);
                    // Update local ID with the persistent one from server
                    if (response && response.data && response.data.id) {
                        const oldId = item.id;
                        item.id = response.data.id;

                        // Sync selection if active
                        if (state.ui.selectedEstimacionId === oldId) {
                            state.ui.selectedEstimacionId = item.id;
                        }
                    }
                    delete item._isNew;
                } else {
                    // Update
                    await serverCall('actualizarEstimacion', id, item);

                item._modified = false;
                _renderFinanciero();
                Swal.fire({
                    icon: 'success',
                    title: 'Estimación Guardada',
                    text: 'Los cambios se han actualizado correctamente.',
                    timer: 1500,
                    showConfirmButton: false
                });

            } catch (e) {
                console.error(e);
                Swal.fire('Error', 'No se pudo guardar la estimación: ' + e.message, 'error');

                _setGlobalLoader(false);
            }
        }

            f._modified = true;

            if (btn) {

        async function saveFactura(id) {
            console.log('saveFactura init for:', id);
            const f = state.data.facturasEstimaciones.find(x => x.id === id);
            if (!f) return;

            if (!f.folioFactura || !f.monto) {
                Swal.fire('Datos Incompletos', 'El Folio y Monto son obligatorios.', 'warning');
                return;
            }

            // Define outside try to be accessible in catch
            const btn = document.querySelector(`button[onclick="ComunicadoDetalle.saveFactura('${id}')"]`);
            const btnOriginalContent = btn ? btn.innerHTML : '';

            try {
                if (btn) btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';

                // Check if NEW (created effectively via addFactura but strictly temp) or UPDATE
                if (String(f.id).startsWith('temp-')) {
                    const payload = { ...f };
                    delete payload.id; // Backend assigns
                    delete payload._isNew;
                    delete payload._isNewlyAdded;
                    delete payload._modified;

                    console.log('Sending payload (NEW):', payload);
                    const response = await serverCall('agregarFactura', f.idEstimacion, payload);
                    console.log('Server response:', response);

                    if (response && response.success) {
                        console.log('Reloading estimaciones...');
                        await _reloadEstimaciones();
                        console.log('Reload complete.');
                        Swal.fire({ icon: 'success', title: 'Factura Guardada', toast: true, position: 'top-end', showConfirmButton: false, timer: 2000 });
                    } else {
                        throw new Error(response ? response.message : 'Error desconocido del servidor');
                    }
                } else {
                    // Update existing
                    const payload = { ...f };
                    delete payload._isNew;
                    delete payload._isNewlyAdded;
                    delete payload._modified;

                    console.log('Sending payload (UPDATE):', payload);
                    await serverCall('actualizarFactura', f.id, payload);

                    f._modified = false;
                    _renderFinanciero();
                    Swal.fire({
                        icon: 'success',
                        title: 'Factura Actualizada',
                        toast: true,
                        position: 'top-end',
                        showConfirmButton: false,
                        timer: 2000
                    });
                }

            } catch (e) {
                console.error('Error caught in saveFactura:', e);
                Swal.fire('Error', e.message || String(e), 'error');
                // Restore button
                if (btn) btn.innerHTML = btnOriginalContent || '<i class="bi bi-save"></i>';
            }
        }

            const input = document.getElementById(`input-bitacora-${idFactura}`);

            const emisorSelect = document.getElementById(`input-emisor-${idFactura}`);

        async function _addEstimacion(entidad) {
            // Determinar tipos disponibles según entidad
            // FINIQUITO se elimina de la selección manual para Constructora
            const tiposDisponibles = entidad === 'SUPERVISION'
                ? ['ANTICIPO', 'ESTIMACION', 'FINIQUITO'] // Supervision puede ser distinta
                : ['ANTICIPO', 'ESTIMACION'];

            const constructoraExistentes = (state.data.estimaciones || [])
                .filter(e => (e.entidad || 'CONSTRUCTORA').toUpperCase() === 'CONSTRUCTORA');

            // Para SUPERVISION, verificar que exista al menos una CONSTRUCTORA del mismo tipo o relevante
            if (entidad === 'SUPERVISION' && constructoraExistentes.length === 0) {
                Swal.fire({
                    title: 'No hay estimaciones de Constructora',
                    text: 'Primero debes crear al menos una estimación de CONSTRUCTORA para poder vincular la supervisión.',
                    icon: 'warning'
                });
                return;
            }

            const { value: tipo } = await Swal.fire({
                title: `Nueva Estimación - ${entidad}`,
                input: 'select',
                inputOptions: Object.fromEntries(tiposDisponibles.map(t => [t, t])),
                inputPlaceholder: 'Selecciona el tipo',
                showCancelButton: true,
                confirmButtonText: 'Crear',
                cancelButtonText: 'Cancelar'
            });

            if (!tipo) return;

            // Para SUPERVISION, seleccionar a cuál CONSTRUCTORA vincular
            let idVinculada = '';
            if (entidad === 'SUPERVISION') {
                const opcionesVinculo = constructoraExistentes
                    .filter(c => c.tipo === tipo)
                    .reduce((acc, c) => ({ ...acc, [c.id]: `${c.tipo} ${c.numero} - ${_formatCurrency(c.montoAutorizado)}` }), {});

                if (Object.keys(opcionesVinculo).length === 0) {
                    Swal.fire({
                        title: 'Sin coincidencia',
                        text: `No hay estimación de CONSTRUCTORA tipo "${tipo}" para vincular. Créala primero.`,
                        icon: 'warning'
                    });
                    return;
                }

                const { value: vinculoSeleccionado } = await Swal.fire({
                    title: 'Vincular a Constructora',
                    text: 'Selecciona la estimación de constructora a la que se vincula:',
                    input: 'select',
                    inputOptions: opcionesVinculo,
                    showCancelButton: true,
                    confirmButtonText: 'Vincular',
                    cancelButtonText: 'Cancelar'
                });

                if (!vinculoSeleccionado) return;
                idVinculada = vinculoSeleccionado;
            }

            // Determinar número automático
            const existentes = (state.data.estimaciones || []).filter(e =>
                e.entidad === entidad && e.tipo === tipo
            );
            let numero = tipo === 'ANTICIPO' ? 'A' : tipo === 'FINIQUITO' ? 'F' : String(existentes.length + 1);

            // Calcular monto sugerido para SUPERVISION (5% de constructora)
            let montoSugerido = 0;
            if (idVinculada) {
                const vinculada = constructoraExistentes.find(c => c.id === idVinculada);
                if (vinculada) {
                    montoSugerido = (parseFloat(vinculada.montoAutorizado) || 0) * 0.05;
                }
            }

            if (!state.data.estimaciones) state.data.estimaciones = [];

            // Obtener Empresa Seleccionada
            const selectCont = dom.financiero.selectContratista;
            const idEmpresaSel = selectCont ? selectCont.value : '';

            const nueva = {
                id: 'temp-' + Date.now(),
                idComunicado: state.id,
                entidad: entidad,
                idEmpresa: idEmpresaSel, // Save the selected company
                tipo: tipo,
                numero: numero,
                idEstimacionVinculada: idVinculada,

                // Init financial fields
                porcentajeAvanceFisico: 0,
                montoAvanceFisico: 0,
                amortizacion: 0,
                montoNeto: 0,
                iva: 0,
                montoTotal: 0,

                fechaCorte: new Date().toISOString().split('T')[0],
                periodoInicio: '',
                periodoFin: '',
                estatusInterno: 'PENDIENTE',
                facturas: [],
                _isNew: true
            };

            state.data.estimaciones.push(nueva);
            _renderFinanciero();
            globalThis.showToast?.(`${entidad} - ${tipo} agregada${montoSugerido > 0 ? ' (5% sugerido)' : ''}`, 'success');
        }


        function _updateResumenFinanciero() {
            const items = state.data.financiero || [];
            const presItems = state.data.presupuesto || [];

            // Calcular Autorizado usando la lógica maestra "Presupuesto Vigente"
            let autorizado = 0;

            if (presItems.length > 0) {
                // Ordenar por si acaso (aunque suelen venir ordenados)
                // Usamos el último elemento como el Vigente
                const last = presItems[presItems.length - 1];

                // Determinar Importe Obra (Precedencia: Capturado > Calculado)
                const mCapturado = parseFloat(last.montoCapturado);
                const hasCapturado = !isNaN(mCapturado) && last.montoCapturado !== '' && last.montoCapturado !== null;
                const importeObra = hasCapturado ? mCapturado : (parseFloat(last.monto) || 0);

                // Determinar Supervisión
                const supervision = parseFloat(last.montoSupervision) || 0;

                // Gran Total Vigente
                autorizado = importeObra + supervision;

                // Actualizar Label en Header de Tabla Presupuesto si existe
                if (dom.presupuesto.totalLabel) {
                    dom.presupuesto.totalLabel.textContent = _formatCurrency(autorizado);
                }
            } else {
                if (dom.presupuesto.totalLabel) {
                    dom.presupuesto.totalLabel.textContent = _formatCurrency(0);
                }
            }

            const ejercido = items.reduce((sum, item) => sum + (parseFloat(item.montoEjecutado) || 0), 0);
            const saldo = autorizado - ejercido; // Saldo real de obra

            if (dom.financiero.resumen.autorizado) dom.financiero.resumen.autorizado.textContent = _formatCurrency(autorizado);
            if (dom.financiero.resumen.ejercido) dom.financiero.resumen.ejercido.textContent = _formatCurrency(ejercido);
            if (dom.financiero.resumen.porEjercer) {
                dom.financiero.resumen.porEjercer.textContent = _formatCurrency(saldo);
                dom.financiero.resumen.porEjercer.className = `fs-5 fw-bold ${saldo < 0 ? 'text-danger' : 'text-success'}`;
            }
        }

        async function _addContratista() {

            if (empresasCatalog.length === 0) {

            const optionsHtml = empresasCatalog.map(e =>

            ).join('');

            // Usamos un datalist nativo para soportar "Escribir y Elegir"
            // Nota: datalist muestra el value. Si el value es el ID, el user ve el ID.
            // Si el value es el Nombre, enviamos el nombre. Necesitamos recuperar el ID despues.
            const htmlContent = `
                <div class="mb-3 text-start">

                    const selectedEmpresa = empresasCatalog.find(e => e.razonSocial === val);

        // --- MATRIX ACTUALIZACIONES ---
        function _renderMatrixActualizaciones() {
            const headerEl = document.getElementById('matrix-header');
            const bodyEl = document.getElementById('matrix-body');
            const footerEl = document.getElementById('matrix-footer');
            const emptyEl = document.getElementById('matrix-empty');
            const wrapperEl = document.getElementById('matrix-wrapper');
            const countConceptos = document.getElementById('matrix-count-conceptos');
            const countUpdates = document.getElementById('matrix-count-updates');

            if (!headerEl || !bodyEl) return;

            const actualizaciones = state.data.presupuesto || [];

            // Handle empty state
            if (actualizaciones.length === 0 || actualizaciones.every(a => !a.lineas || a.lineas.length === 0)) {
                if (wrapperEl) wrapperEl.classList.add('d-none');
                if (emptyEl) emptyEl.classList.remove('d-none');
                if (countConceptos) countConceptos.textContent = '0 conceptos';
                if (countUpdates) countUpdates.textContent = '0 actualizaciones';
                return;
            }

            if (wrapperEl) wrapperEl.classList.remove('d-none');
            if (emptyEl) emptyEl.classList.add('d-none');

            // 1. Collect all unique concepts across all updates
            const conceptosMap = new Map();
            actualizaciones.forEach((act, actIdx) => {
                (act.lineas || []).forEach(linea => {
                    const key = (linea.descripcion || '').toUpperCase().trim();
                    if (key && !conceptosMap.has(key)) {
                        conceptosMap.set(key, {
                            descripcion: linea.descripcion || '',
                            categoria: linea.categoria || '',
                            firstSeen: actIdx
                        });
                    }
                });
            });

            // 2. Build matrix: [conceptKey] -> { meta, importes: [importe per update] }
            const matrix = {};
            conceptosMap.forEach((meta, key) => {
                matrix[key] = { meta, importes: [] };
                actualizaciones.forEach((act, idx) => {
                    const linea = (act.lineas || []).find(l =>
                        (l.descripcion || '').toUpperCase().trim() === key
                    );
                    matrix[key].importes[idx] = linea ? (parseFloat(linea.importe) || 0) : null;
                });
            });

            const conceptKeys = Object.keys(matrix);
            const numActualizaciones = actualizaciones.length;

            // Update counters
            if (countConceptos) countConceptos.textContent = `${conceptKeys.length} concepto${conceptKeys.length !== 1 ? 's' : ''}`;
            if (countUpdates) countUpdates.textContent = `${numActualizaciones} actualizaci${numActualizaciones !== 1 ? 'ones' : 'ón'}`;

            // 3. Build header row
            let headerHtml = '<tr>';
            headerHtml += '<th class="sticky-col">Ubicación / Concepto</th>';
            headerHtml += '<th>Cat.</th>';
            actualizaciones.forEach((act, idx) => {
                const nombre = idx === 0 ? 'Origen' : (act.revision || `Rev ${String.fromCharCode(65 + idx - 1)}`);
                const fecha = _formatDateISO(act.fecha);
                const isLast = idx === numActualizaciones - 1;
                headerHtml += `<th class="text-center ${isLast ? 'col-vigente' : ''}">${nombre}${fecha ? `<br><span style="font-weight:400;text-transform:none;font-size:0.68rem;color:#64748b;">${fecha}</span>` : ''}</th>`;
            });
            headerHtml += '</tr>';
            headerEl.innerHTML = headerHtml;

            // 4. Build body rows
            let bodyHtml = '';
            conceptKeys.forEach(key => {
                const data = matrix[key];
                const cat = data.meta.categoria || '';
                const catClass = cat.includes('DAÑO') || cat.includes('FISICO') ? 'cat-df' : cat.includes('DESAZ') ? 'cat-dz' : '';

                bodyHtml += '<tr>';
                bodyHtml += `<td class="sticky-col">${_escapeHtml(data.meta.descripcion)}</td>`;
                bodyHtml += `<td><span class="cat-badge ${catClass}">${cat || '—'}</span></td>`;

                data.importes.forEach((importe, idx) => {
                    const isLast = idx === numActualizaciones - 1;
                    const prev = idx > 0 ? data.importes[idx - 1] : null;
                    const hasPrev = prev !== null;
                    let delta = null;
                    let deltaHtml = '';

                    if (importe !== null && hasPrev) {
                        delta = importe - prev;
                        if (delta > 0) {
                            deltaHtml = `<div class="delta-up">+${_formatCurrency(delta)}</div>`;
                        } else if (delta < 0) {
                            deltaHtml = `<div class="delta-down">${_formatCurrency(delta)}</div>`;
                        }
                    } else if (importe !== null && idx === 0) {
                        // Origin - show as new
                        deltaHtml = `<div class="delta-up">+${_formatCurrency(importe)}</div>`;
                    } else if (importe !== null && !hasPrev) {
                        // New concept in this revision
                        deltaHtml = `<div class="delta-up">NUEVO</div>`;
                    }

                    const cellValue = importe !== null ? _formatCurrency(importe) : '<span class="text-muted">—</span>';
                    bodyHtml += `<td class="${isLast ? 'col-vigente' : ''}">${cellValue}${deltaHtml}</td>`;
                });
                bodyHtml += '</tr>';
            });
            bodyEl.innerHTML = bodyHtml;

            // 5. Build footer with totals
            let footerHtml = '<tr>';
            footerHtml += '<td class="sticky-col text-end" colspan="2"><strong>Totales</strong></td>';
            actualizaciones.forEach((act, idx) => {
                const isLast = idx === numActualizaciones - 1;
                const total = conceptKeys.reduce((sum, key) => sum + (matrix[key].importes[idx] || 0), 0);
                const prevTotal = idx > 0 ? conceptKeys.reduce((sum, key) => sum + (matrix[key].importes[idx - 1] || 0), 0) : 0;
                const deltaTotal = total - prevTotal;
                let deltaHtml = '';
                if (idx > 0 && deltaTotal !== 0) {
                    deltaHtml = deltaTotal > 0
                        ? `<div class="delta-up">+${_formatCurrency(deltaTotal)}</div>`
                        : `<div class="delta-down">${_formatCurrency(deltaTotal)}</div>`;
                }
                footerHtml += `<td class="${isLast ? 'col-vigente' : ''}">${_formatCurrency(total)}${deltaHtml}</td>`;
            });
            footerHtml += '</tr>';
            footerEl.innerHTML = footerHtml;
        }

        function _escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // --- PUBLIC HELPERS (Exports) ---
        function updateFinanciero(index, field, value) {
            const item = state.data.financiero[index];
            if (!item) return;
            if (['montoEjecutado', 'amortizacion'].includes(field)) {
                item[field] = parseFloat(String(value).replace(/,/g, '')) || 0;
            } else {
                item[field] = value;
            }
            // Recálculo del Total Facturado
            const sub = (parseFloat(item.montoEjecutado) || 0) - (parseFloat(item.amortizacion) || 0);
            item.totalFacturado = sub * (1 + IVA_RATE);
            _renderFinanciero();
        }

        function removeFinanciero(index) {
            if (confirm('¿Eliminar registro financiero?')) {
                state.data.financiero.splice(index, 1);
                _renderFinanciero();
            }
        }

        function updatePresupuesto(idx, field, val) {
            const item = state.data.presupuesto[idx];
            if (field === 'montoCapturado' || field === 'montoSupervision') {
                // Permitir vacío para capturado
                if (val === '') {
                    item[field] = field === 'montoCapturado' ? null : 0;
                } else {
                    item[field] = parseFloat(val.replace(/,/g, '')) || 0;
                }
            } else if (field === 'monto') {
                // Legacy or if manually editing calc (shouldn't happen due to readonly)
                item[field] = parseFloat(val.replace(/,/g, '')) || 0;
            } else {
                item[field] = val;
            }
            _renderPresupuesto();
        }
        function removePresupuesto(idx) {
            const items = state.data.presupuesto;

            // Reglas de Seguridad
            if (idx === 0) {
                _showAlert('Acción No Permitida', 'No se puede eliminar el presupuesto de Origen.', 'warning');
                return;
            }
            if (idx !== items.length - 1) {
                _showAlert('Acción No Permitida', 'Solo se puede eliminar la última revisión para mantener la integridad de la secuencia.', 'warning');
                return;
            }

            if (!confirm('¿Estás seguro de eliminar esta revisión?\n\nADVERTENCIA: Esta acción eliminará permanentemente la revisión y todo su desglose de conceptos asociado.')) {
                return;
            }

            state.data.presupuesto.splice(idx, 1);
            _renderPresupuesto();

        function removeEquipo(idx) { state.data.equipo.splice(idx, 1); _renderEquipo(); }

        function updateTicket(idx, field, val) { state.data.tickets[idx][field] = val; }
        function removeTicket(idx) { state.data.tickets.splice(idx, 1); _renderTickets(); }

        // --- AUXILIARES ---
        function _attachCurrencyFormatters() {
            document.querySelectorAll('.currency-input').forEach(input => {
                input.addEventListener('blur', (e) => {
                    const val = parseFloat(e.target.value.replace(/,/g, '')) || 0;
                    e.target.value = _formatCurrency(val, false);
                });
                input.addEventListener('focus', (e) => {
                    e.target.value = e.target.value.replace(/,/g, '').replace('$', '');
                    e.target.select();
                });
            });
        }
        function _formatCurrency(val, withSymbol = true) {
            const num = parseFloat(val) || 0;
            return (withSymbol ? '$' : '') + num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
        function _formatDateISO(dateStr) {
            if (!dateStr) return '';
            try { return new Date(dateStr).toISOString().split('T')[0]; } catch (e) { return ''; }
        }
        function _setComboboxValue(input, obj, prop) {
            const val = (obj && typeof obj === 'object') ? obj[prop] : (obj || '');
            input.value = val || '';
        }

        function _showAlert(title, text, icon = 'info') {
            if (typeof Swal !== 'undefined') {
                Swal.fire({
                    title: title,
                    text: text,
                    icon: icon,
                    confirmButtonColor: '#0d6efd'
                });
            } else {
                alert(`${title}\n${text}`);
            }
        }

        function _setupCombobox(input, dropdown, items, keyProp, onSelect, alertElement = null, onInputHandler = null) {
            if (!input || !dropdown) return;
            const safeItems = Array.isArray(items) ? items : [];

            // Referencia a instancia bootstrap

            let dropdownInstance = null;

            const getDropdownInstance = () => {
                if (dropdownInstance) return dropdownInstance;
                if (window.bootstrap && window.bootstrap.Dropdown) {
                    try {
                        dropdownInstance = bootstrap.Dropdown.getInstance(input) || new bootstrap.Dropdown(input, { autoClose: 'outside' });
                    } catch (e) { console.warn('Bootstrap error:', e); }
                }
                return dropdownInstance;
            };

            const renderList = (filter = '') => {
                dropdown.innerHTML = '';
                const term = (filter || '').toLowerCase();
                const filtered = term
                    ? safeItems.filter(i => {
                        const val = i[keyProp] || i.nombre || '';
                        return String(val).toLowerCase().includes(term);
                    })
                    : safeItems;

                const displayItems = filtered.slice(0, 50);

                if (displayItems.length === 0) {
                    dropdown.innerHTML = '<li class="dropdown-item text-muted disabled">Sin resultados</li>';
                } else {
                    displayItems.forEach(item => {
                        const li = document.createElement('li');
                        const a = document.createElement('a');
                        a.className = 'dropdown-item';
                        a.href = '#';
                        a.textContent = item[keyProp] || item.nombre || 'Sin Nombre';
                        a.onclick = (e) => {
                            e.preventDefault();
                            onSelect(item);
                            const instance = getDropdownInstance();
                            if (instance) instance.hide();
                            else dropdown.classList.remove('show');

                            // Ocultar alerta al seleccionar existente
                            if (alertElement) alertElement.classList.add('d-none');
                        };
                        li.appendChild(a);
                        dropdown.appendChild(li);
                    });
                }
            };

            const showDropdown = () => {
                renderList(input.value);
                const instance = getDropdownInstance();
                if (instance) {
                    instance.show();
                } else {
                    // Fallback sin bootstrap
                    dropdown.classList.add('show');
                    dropdown.style.display = 'block';
                }
            };

            input.addEventListener('input', () => {
                // Force Uppercase
                _forceUppercase(input);

                const instance = getDropdownInstance();
                if (instance) instance.show();
                else { dropdown.classList.add('show'); dropdown.style.display = 'block'; }

                renderList(input.value);

                const val = input.value.trim().toLowerCase();
                let exactMatchItem = null;
                if (val) {
                    exactMatchItem = safeItems.find(i => String(i[keyProp] || i.nombre || '').toLowerCase() === val);
                }

                if (alertElement) {
                    if (!val) {
                        alertElement.classList.add('d-none');
                    } else {
                        alertElement.classList.toggle('d-none', !!exactMatchItem);
                    }
                }

                if (onInputHandler) {
                    onInputHandler(input.value, exactMatchItem);
                }
            });

            input.addEventListener('focus', showDropdown);
            input.addEventListener('click', showDropdown);

            input.addEventListener('blur', () => {
                setTimeout(() => {
                    const instance = getDropdownInstance();
                    if (instance) instance.hide();
                    else { dropdown.classList.remove('show'); dropdown.style.display = 'none'; }
                }, 200);
            });
        }

        function _onSiniestroChange(itemOrString) {
            const fields = [dom.genFenomeno, dom.genFi, dom.genFondo];
            const isObj = typeof itemOrString === 'object' && itemOrString !== null;
            if (isObj) {
                dom.genFenomeno.value = itemOrString.fenomeno || '';
                dom.genFi.value = itemOrString.fi || '';
                dom.genFondo.value = itemOrString.fondo || '';

                // Logic to set Aseguradora from Siniestro
                if (dom.genAseguradora) {
                    let asegName = itemOrString.aseguradora || '';
                    if (!asegName && itemOrString.idAseguradora && state.catalogs.aseguradoras) {
                        const match = state.catalogs.aseguradoras.find(a => String(a.id) === String(itemOrString.idAseguradora));
                        if (match) asegName = match.aseguradora || match.nombre || '';
                    }
                    dom.genAseguradora.value = asegName;
                    // Keep custom aseguradora editable even if derived? User said "fields linked", 
                    // usually implying read-only, but for Aseguradora they said "leave blank to choose".
                    // If populated, maybe we leave it enabled? I'll leave it enabled as per previous logic (it wasn't in 'fields' array).
                }

                // Habilitar campos siempre, para permitir correcciones
                fields.forEach(f => { if (f) f.disabled = false; });

                fields.forEach(f => { if (f) { f.disabled = false; f.value = ''; } });
                if (dom.genAseguradora) {
                    dom.genAseguradora.value = '';
                    dom.genAseguradora.disabled = false;
                }
            }
        }

        function _renderPresupuesto() {
            const tbody = dom.presupuesto.body;
            if (!tbody) return;
            tbody.innerHTML = '';

            if (items.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">Sin presupuesto.</td></tr>';

                    // Lógica
                    const mCalculado = parseFloat(item.monto) || 0;
                    const mCapturado = parseFloat(item.montoCapturado);
                    const hasCapturado = item.montoCapturado !== null && item.montoCapturado !== '' && item.montoCapturado !== undefined;
                    const mSupervision = parseFloat(item.montoSupervision) || 0;
                    const montoTotal = _formatCurrency((hasCapturado ? mCapturado : mCalculado) + mSupervision);

                    // Estilos
                    // Si hay manual: Input blanco con borde primario
                    // Si no: Input gris (readonly)

                    const btnTitle = hasCapturado ? 'Revertir a calculado' : 'Corregir manualmente';
                    const btnAction = hasCapturado ? `ComunicadoDetalle.toggleManualInput(${idx}, false)` : `ComunicadoDetalle.toggleManualInput(${idx}, true)`;

                    tr.innerHTML = `
                           <td class="ps-4 align-middle">${idx === 0 ? '<span class="badge bg-secondary">Origen</span>' : `<input class="form-control form-control-sm text-center fw-bold" style="width: 80px;" value="${item.revision || ''}" onchange="ComunicadoDetalle.updatePresupuesto(${idx},'revision',this.value)">`}</td>
                           <td class="align-middle"><input type="date" class="form-control form-control-sm" value="${_formatDateISO(item.fecha)}" onchange="ComunicadoDetalle.updatePresupuesto(${idx},'fecha',this.value)"></td>
                           
                           <!-- Columna Importe Obra: Diseño Integrado -->
                           <td class="align-middle">
                                <div class="input-group input-group-sm">
                                    <span class="input-group-text ${hasCapturado ? 'bg-warning text-dark border-warning' : 'bg-light text-muted'}">
                                        ${hasCapturado ? 'Man' : 'Calc'}
                                    </span>
                                    <input type="text" class="form-control text-end font-monospace ${inputClass}" 
                                           id="input-obra-${idx}"
                                           value="${inputVal}" 
                                           ${inputReadonly}
                                           onchange="ComunicadoDetalle.updatePresupuesto(${idx}, 'montoCapturado', this.value)"
                                           placeholder="$0.00">
                                    <button class="btn ${btnClass}" type="button" onclick="${btnAction}" title="${btnTitle}">
                                        ${iconBtn}
                                    </button>
                                </div>
                                ${hasCapturado ? `<div class="form-text text-end mt-0" style="font-size: 0.7rem;"><span class="text-decoration-line-through text-muted me-1">${_formatCurrency(mCalculado)}</span> <span class="text-primary">Manual</span></div>` : ''}
                           </td>

                           <!-- Columna Supervisión -->
                           <td class="align-middle">
                               <div class="input-group input-group-sm">
                                   <input type="text" class="form-control text-end font-monospace" value="${_formatCurrency(mSupervision, false)}" placeholder="0.00" onchange="ComunicadoDetalle.updatePresupuesto(${idx},'montoSupervision',this.value)">
                                   <button class="btn btn-outline-secondary" type="button" onclick="ComunicadoDetalle.calcularSupervision(${idx})" title="Calc 5%">5%</button>
                               </div>
                           </td>

                           <td class="text-center align-middle">
                               <div class="d-flex justify-content-center gap-2">
                                   <button class="btn btn-sm btn-outline-primary d-flex align-items-center gap-1" onclick="ComunicadoDetalle.abrirEditorPresupuesto(${idx})" title="Ver Desglose">
                                       <i class="bi bi-list-columns-reverse"></i>
                                   </button>
                                   ${(!isOrigin && isLast)
                            ? `<button class="btn btn-sm btn-outline-danger border-0" onclick="ComunicadoDetalle.removePresupuesto(${idx})" title="Eliminar"><i class="bi bi-trash"></i></button>`
                            : `<span class="text-muted d-flex align-items-center" title="${isOrigin ? 'El origen es permanente' : 'Solo se puede eliminar la última revisión'}"><i class="bi bi-lock-fill"></i></span>`
                        }
                               </div>

                       `;
                    tbody.appendChild(tr);
                });
            }

            // Actualizar Footer con Desglose Separado
            let obra = 0;
            let supervision = 0;

            if (items.length > 0) {
                const last = items[items.length - 1];
                const mCapturado = parseFloat(last.montoCapturado);
                const hasCapturado = !isNaN(mCapturado) && last.montoCapturado !== '' && last.montoCapturado !== null;

                obra = hasCapturado ? mCapturado : (parseFloat(last.monto) || 0);
                supervision = parseFloat(last.montoSupervision) || 0;

            const footerObra = document.getElementById('footer-total-obra');
            const footerSup = document.getElementById('footer-total-sup');

            if (footerSup) footerSup.textContent = _formatCurrency(supervision);

        function _addActualizacionPresupuesto() {

            _mostrarModalTipoActualizacion();

        function toggleManualInput(idx, activate) {
            const item = state.data.presupuesto[idx];

            if (activate) {
                // Activar manual: Si está vacío, copiamos el calculado como sugerencia, o lo dejamos vacío.
                // UX decision: Copiar el calculado facilita la "corrección" menor.
                // Pero el user pidió "Corregir monto PDF". A veces es totalmente diferente.
                // Dejemoslo vacío o en 0 para que escriba.
                // Si ya había algo (casos raros), se respeta.
                if (item.montoCapturado === undefined || item.montoCapturado === null || item.montoCapturado === '') {
                    // Inicializar con 0 explícitamente para que hasCapturado sea true
                    // hasCapturado chequea: !isNaN && !== '' && !== null
                    item.montoCapturado = 0;
                }

                // Hack para foco: renderizamos y luego buscamos el input
                _renderPresupuesto();
                setTimeout(() => {
                    const input = document.getElementById(`input-obra-${idx}`);
                    if (input) input.focus();

            } else {
                // Desactivar manual -> Revertir a calculado
                item.montoCapturado = null;

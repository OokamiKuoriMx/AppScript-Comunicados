        function toggleManualInput(idx, activate) {
            const item = state.data.presupuesto[idx];

            if (activate) {
                // Activar manual: Si está vacío, copiamos el calculado como sugerencia, o lo dejamos vacío.
                // UX decision: Copiar el calculado facilita la "corrección" menor.
                // Pero el user pidió "Corregir monto PDF". A veces es totalmente diferente.
                // Dejemoslo vacío o en 0 para que escriba.
                // Si ya había algo (casos raros), se respeta.
                if (item.montoCapturado === undefined || item.montoCapturado === null || item.montoCapturado === '') {
                    // Inicializar con 0 explícitamente para que hasCapturado sea true
                    // hasCapturado chequea: !isNaN && !== '' && !== null
                    item.montoCapturado = 0;
                }

                // Hack para foco: renderizamos y luego buscamos el input
                _renderPresupuesto();
                setTimeout(() => {
                    const input = document.getElementById(`input-obra-${idx}`);
                    if (input) input.focus();
                }, 50);

            } else {
                // Desactivar manual -> Revertir a calculado
                item.montoCapturado = null;
                _renderPresupuesto();
            }
        }

        function calcularSupervision(idx) {
            const item = state.data.presupuesto[idx];
            // Regla de verdad: Capturado > Calculado
            const mCapturado = parseFloat(item.montoCapturado);
            const hasCapturado = !isNaN(mCapturado) && item.montoCapturado !== '' && item.montoCapturado !== null;

            const base = hasCapturado ? mCapturado : (parseFloat(item.monto) || 0);

            item.montoSupervision = base * 0.05;
            _renderPresupuesto();
        }

        // --- MODAL DESGLOSE PRESUPUESTO ---
        // --- MODAL DESGLOSE PRESUPUESTO ---
        function abrirEditorPresupuesto(idx) {
            state.editingPresupuestoIdx = idx;

            // Asegurar integridad de estructura
            if (!state.data.presupuesto[idx]) return;
            if (!state.data.presupuesto[idx].lineas) state.data.presupuesto[idx].lineas = [];

            // Sincronizar CASCADA de revisiones anteriores (Carry Over)
            // IMPORTANTE: Si abrimos L27B (idx=2), necesitamos asegurar que L27A (idx=1) 
            // ya haya sincronizado sus líneas con L27 (idx=0). 
            // Por eso iteramos desde el principio hasta el índice actual.
            for (let i = 1; i <= idx; i++) {
                // Asegurar que la revisión intermedia tenga array de líneas
                if (state.data.presupuesto[i] && !state.data.presupuesto[i].lineas) {
                    state.data.presupuesto[i].lineas = [];
                }
                _sincronizarLineasFaltantes(i);

                // NUEVO: Consolidar duplicados inmediatamente después de sincronizar
                // Esto limpia el "Desastre" si el usuario re-ingresó datos manualmente
                _consolidarDuplicados(i);
            }

            _renderModalLines();
            _recalcularTotalModal(); // Inicializar total

            const modalEl = document.getElementById('modalPresupuestoDetalle');
            const modal = new bootstrap.Modal(modalEl);
            modal.show();
        }

        function _sincronizarLineasFaltantes(currentIdx) {
            const currentItem = state.data.presupuesto[currentIdx];
            const prevItem = state.data.presupuesto[currentIdx - 1];

            if (!prevItem || !prevItem.lineas || prevItem.lineas.length === 0) return;

            const currentLines = currentItem.lineas || [];
            let addedCount = 0;

            const _norm = (s) => String(s || '').toUpperCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, ' ');

            prevItem.lineas.forEach(pLine => {
                // Buscar si existe en la actual
                let match = null;

                // 1. Por ID directo (SAFEGUARD: Verificar Categoria para evitar cruces de ID)
                if (pLine.idLinea) {
                    const idCandidates = currentLines.filter(c => String(c.idLinea) === String(pLine.idLinea));
                    // Priorizamos coincidencia de Categoría (Normalizada)
                    match = idCandidates.find(c => _norm(c.categoria) === _norm(pLine.categoria));

                    // Si hay ID pero la categoría es distinta, ¿Asumimos ID incorrecto o Renombramiento?
                    // Dado el bug reportado, asumimos ID incorrecto y buscamos por Texto.
                }

                // 2. Por coincidencia de texto (Normalizada)
                // MEJORA CRÍTICA: Si encontramos match por texto, DEBEMOS ASIGNAR EL ID de la línea anterior
                // para "vincular" la nueva entrada manual con la histórica.
                if (!match) {
                    const pDesc = _norm(pLine.descripcion);
                    const pCat = _norm(pLine.categoria);

                    match = currentLines.find(c => {
                        return _norm(c.descripcion) === pDesc && _norm(c.categoria) === pCat;
                    });

                    // Si encontramos match por texto y no tiene ID (o es diferente), vincularlo.
                    if (match) {
                        if (!match.idLinea) {
                            match.idLinea = pLine.idLinea; // VINCULACIÓN: Ahora son la misma línea histórica
                        }
                    }
                }

                // Si no existe, la traemos (Arrastrar para mantener historia)
                if (!match) {
                    // Clonar objeto para romper referencia
                    const newLine = {
                        ...pLine,
                        id: undefined, // Es un nuevo registro en DB (relación nueva)
                        // idLinea se mantiene igual para preservar identidad del concepto
                        // importe se mantiene igual (carry over) a menos que el usuario lo cambie después
                    };
                    currentLines.push(newLine);
                    addedCount++;
                }
            });

            // Si agregamos líneas, reordenamos para mantener consistencia visual (ej. por consecutivo)
            if (addedCount > 0) {
                currentLines.sort((a, b) => (Number(a.consecutivo) || 9999) - (Number(b.consecutivo) || 9999));
            }
        }

        // NUEVO: Función para limpiar duplicados en una revisión
        function _consolidarDuplicados(idx) {
            const lines = state.data.presupuesto[idx].lineas;
            if (!lines || lines.length < 2) return;

            const _norm = (s) => String(s || '').toUpperCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, ' ');

            // Agrupar por llave única (Desc + Cat)
            const map = new Map();
            const toRemoveIndices = [];

            lines.forEach((line, i) => {
                const key = _norm(line.descripcion) + '|' + _norm(line.categoria);
                if (!map.has(key)) {
                    map.set(key, { index: i, line: line });
                } else {
                    // DUPLICADO DETECTADO
                    const existing = map.get(key);

                    // Decidir cuál conservar y cómo fusionar
                    // Prioridad: 
                    // 1. Conservar el que tenga idLinea (vinculación histórica)
                    // 2. Usar el importe del que tenga el valor "Más nuevo" (o diferente de 0, o modificado)

                    // Supuesto: El usuario ingresó una línea manual (sin ID) con el nuevo monto.
                    // El sistema trajo la línea vieja (con ID) con el monto viejo.
                    // Queremos: Línea con ID, pero con Monto Nuevo.

                    let master = existing.line;
                    let victim = line;
                    let masterIdx = existing.index;
                    let victimIdx = i;

                    /* ESCENARIOS:
                       A) Master tiene ID, Victim no -> Master es la base, toma importe de Victim.
                       B) Master no tiene ID, Victim si -> Victim es la base, toma importe de Master (raro).
                       C) Ambos tiene ID -> Error de duplicación real, conservar primero.
                    */

                    // Si Victim tiene ID y Master no, intercambiar roles para que Master sea siempre el que tiene ID (si existe)
                    if (!master.idLinea && victim.idLinea) {
                        master = line;
                        victim = existing.line;
                        masterIdx = i;
                        victimIdx = existing.index;
                        // Actualizar mapa para apuntar al nuevo master
                        map.set(key, { index: i, line: line });
                    }

                    // FUSIONAR DATOS
                    // Si el "Victim" (el duplicado que vamos a borrar) tiene un importe distinto al master,
                    // y parece ser una entrada válida (no 0, o diferente), asumimos que es el valor correcto (User Input)
                    const vImporte = parseFloat(victim.importe) || 0;
                    const mImporte = parseFloat(master.importe) || 0;

                    // Lógica heurística: Si victim tiene un monto diferente, úsalo.
                    // (Asume que el duplicado es la entrada manual del usuario con el dato fresco)
                    if (vImporte !== mImporte) {
                        master.importe = vImporte;
                    }

                    // Marcar el índice de la víctima para eliminar
                    toRemoveIndices.push(victimIdx);
                }
            });

            // Eliminar duplicados (en orden inverso para no afectar índices)
            toRemoveIndices.sort((a, b) => b - a).forEach(i => {
                lines.splice(i, 1);
            });
        }

        function _renderModalLines() {
            const tbody = document.getElementById('modal-presupuesto-lines-body');
            tbody.innerHTML = '';
            const idx = state.editingPresupuestoIdx;
            const lines = state.data.presupuesto[idx].lineas;
            const totalRevisiones = state.data.presupuesto.length;

            // REGLA DE INTEGRIDAD: Si hay revisiones posteriores, no se puede modificar estructura
            const esUltimaRevision = idx === totalRevisiones - 1;
            const tieneRevisionesPosteriores = !esUltimaRevision;

            // Mostrar/ocultar botón Agregar Línea según si es última revisión
            const btnAgregarLinea = document.querySelector('[onclick="ComunicadoDetalle.addLineaPresupuesto()"]');
            if (btnAgregarLinea) {
                if (tieneRevisionesPosteriores) {
                    btnAgregarLinea.classList.add('d-none');
                } else {
                    btnAgregarLinea.classList.remove('d-none');
                }
            }

            // Get previous revision lines for comparison
            const prevIdx = idx - 1;
            const prevLines = prevIdx >= 0 && state.data.presupuesto[prevIdx]
                ? (state.data.presupuesto[prevIdx].lineas || [])
                : [];

            // Helper to find matching line from previous revision
            const findPrevLine = (currentLine, currentIdx) => {
                const _norm = (s) => String(s || '').toUpperCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, ' ');

                // 1. Try matching by unique 'idLinea' WITH SAFEGUARD (Most Robust)
                if (currentLine.idLinea) {
                    const idCandidates = prevLines.filter(pl => String(pl.idLinea) === String(currentLine.idLinea));

                    // Prioritize Category Match (Avoid bad cross-links)
                    const catMatch = idCandidates.find(pl => _norm(pl.categoria) === _norm(currentLine.categoria));
                    if (catMatch) return catMatch;

                    // Fallback to Description Match if Category differs (maybe renamed?)
                    const descMatch = idCandidates.find(pl => _norm(pl.descripcion) === _norm(currentLine.descripcion));
                    if (descMatch) return descMatch;

                    // IF ID matches but everything else is different, IGNORE IT.
                    // This fixes the "Reading Database Wrong" issue where IDs are crossed.
                }

                // 2. Try matching by Description + Category (Content Matching Normalized)
                const descNorm = _norm(currentLine.descripcion);
                const catNorm = _norm(currentLine.categoria);

                if (descNorm) {
                    const exactMatch = prevLines.find(pl => {
                        return _norm(pl.descripcion) === descNorm && _norm(pl.categoria) === catNorm;
                    });
                    if (exactMatch) return exactMatch;
                }

                // 3. Fallback: Positional Matching NO DESCRIPTIONS
                // Only if both have empty/short descriptions
                if (!descNorm || descNorm.length < 3) {
                    const candidateByIndex = prevLines[currentIdx];
                    // Verify candidate also has empty descriptions to be safe
                    if (candidateByIndex) {
                        const prevDesc = _norm(candidateByIndex.descripcion);
                        if (!prevDesc || prevDesc.length < 3) {
                            return candidateByIndex;
                        }
                    }
                }

                return null;
            };

            // Prepare Categories Catalog
            const categoriasCatalog = state.catalogs.categorias || [];

            lines.forEach((l, i) => {
                const tr = document.createElement('tr');
                const importeActual = parseFloat(l.importe) || 0;

                // Find matching line in previous revision
                const prevLine = findPrevLine(l, i);

                // MEJORA: Para ORIGEN (idx=0), mostrar $0.00 como anterior para que se vea el incremento en verde
                // Para actualizaciones, si la línea es nueva (no existía antes), también mostrar $0.00
                const esOrigen = idx === 0;
                const esLineaNueva = !prevLine && !esOrigen; // Nueva en esta revisión (no origen)

                // Importe anterior: 0 para origen, 0 para líneas nuevas, valor real para existentes
                const importeAnterior = esOrigen ? 0 : (prevLine ? (parseFloat(prevLine.importe) || 0) : 0);
                const diferencia = importeActual - importeAnterior;

                // Color coding for diferencia - using matrix delta classes
                let difClass = 'delta-neutral';
                let difPrefix = '';
                let difHtml = '';
                if (diferencia > 0) {
                    difClass = 'delta-up';
                    difPrefix = '+';
                    difHtml = `< div class="delta-up" > ${difPrefix}${_formatCurrency(diferencia)}</div > `;
                } else if (diferencia < 0) {
                    difClass = 'delta-down';
                    difHtml = `< div class="delta-down" > ${_formatCurrency(diferencia)}</div > `;
                } else {
                    difHtml = `< span class="text-muted" >—</span > `;
                }

                // Row class - subtle styling without Bootstrap colored backgrounds
                tr.className = '';

                // Build Category Options con badge
                const currentCat = (l.categoria || '').trim();
                const catExists = (val) => categoriasCatalog.some(c => String(c.id).toUpperCase() === String(val).toUpperCase());

                let catOptions = `< option value = "" > Seleccione...</option > `;
                if (currentCat && !catExists(currentCat)) {
                    catOptions += `< option value = "${currentCat}" selected > ${currentCat}</option > `;
                }
                categoriasCatalog.forEach(c => {
                    const isSelected = String(c.id).toUpperCase() === String(currentCat).toUpperCase();
                    catOptions += `< option value = "${c.id}" ${isSelected ? 'selected' : ''}> ${c.nombre}</option > `;
                });

                // Determinar si esta línea puede eliminarse
                // REGLA: Si hay revisiones posteriores, NINGUNA línea puede eliminarse
                // REGLA: Si es la última revisión, solo líneas nuevas (sin match previo) pueden eliminarse
                const esLineaNuevaEnEstaRevision = !prevLine;
                const puedeEliminar = esUltimaRevision && esLineaNuevaEnEstaRevision;

                // Badge de estado para indicar visualmente tipo de línea
                let statusBadge = '';
                if (esOrigen) {
                    statusBadge = '<span class="cat-badge" style="background:#dcfce7;color:#166534;">NUEVA</span>';
                } else if (esLineaNueva) {
                    statusBadge = '<span class="cat-badge" style="background:#dcfce7;color:#166534;">NUEVA</span>';
                } else if (diferencia !== 0) {
                    statusBadge = '<span class="cat-badge" style="background:#dbeafe;color:#1e40af;">MODIF</span>';
                }

                // ======= LOCKING LOGIC =======
                // Reglas:
                // - Descripción: Solo editable en ORIGEN o líneas nuevas de la última revisión
                // - Categoría: NUNCA editable en actualizaciones (solo ORIGEN)
                // - Importe: Editable en ORIGEN, o en la ÚLTIMA revisión (cualquier línea)

                const puedeEditarDescripcion = esOrigen || (esUltimaRevision && esLineaNuevaEnEstaRevision);
                const puedeEditarCategoria = esOrigen; // Solo en ORIGEN
                const puedeEditarImporte = esOrigen || esUltimaRevision;

                // Generar atributos disabled/readonly
                const descReadonly = puedeEditarDescripcion ? '' : 'readonly';
                const catDisabled = puedeEditarCategoria ? '' : 'disabled';
                const impReadonly = puedeEditarImporte ? '' : 'readonly';

                tr.innerHTML = `
        <td class="sticky-col">
            <div class="d-flex align-items-center gap-2">
                <input type="text" class="form-control form-control-sm border-0" value="${l.descripcion || ''}" placeholder="Ubicación / Concepto" ${descReadonly} onchange="ComunicadoDetalle.updateLineaPresupuesto(${i}, 'descripcion', this.value)">
                    ${statusBadge}
            </div>
                        </td>
                        <td>
                            <select class="form-select form-select-sm border-0" style="min-width:100px;" ${catDisabled} onchange="ComunicadoDetalle.updateLineaPresupuesto(${i}, 'categoria', this.value)">
                                ${catOptions}
                            </select>
                        </td>
                        <td class="text-end ${esOrigen ? 'text-muted' : ''}">
                            ${_formatCurrency(importeAnterior)}
                        </td>
                        <td class="col-vigente">
                            <input type="text" class="form-control form-control-sm text-end currency-input border-0 fw-bold" value="${_formatCurrency(importeActual)}" ${impReadonly} onchange="ComunicadoDetalle.updateLineaPresupuesto(${i}, 'importe', this.value)">
                        </td>
                        <td class="text-end fw-bold">
                            ${difHtml}
                        </td>
                        <td class="text-center">
                            ${puedeEliminar
                        ? `<button class="btn btn-sm text-danger border-0 p-0" onclick="ComunicadoDetalle.removeLineaPresupuesto(${i})" title="Eliminar línea"><i class="bi bi-trash"></i></button>`
                        : `<span class="text-muted" title="${tieneRevisionesPosteriores ? 'Revisión bloqueada' : 'Línea vinculada'}"><i class="bi bi-lock-fill"></i></span>`
                    }
                        </td>
    `;
                tbody.appendChild(tr);
            });
            _attachCurrencyFormatters();
        }

        function addLineaPresupuesto() {
            const idx = state.editingPresupuestoIdx;
            const totalRevisiones = state.data.presupuesto.length;
            const esUltimaRevision = idx === totalRevisiones - 1;

            // REGLA DE INTEGRIDAD: Solo se pueden agregar líneas en la última revisión
            if (!esUltimaRevision) {
                _showAlert('Acción No Permitida', 'No se pueden agregar líneas a revisiones que ya tienen actualizaciones posteriores.', 'warning');
                return;
            }

            state.data.presupuesto[idx].lineas.push({ descripcion: '', categoria: '', importe: 0 });
            // INTENTAR CONSOLIDAR DUPLICADOS AQUÍ TAMBIÉN POR SI LAS DUDAS
            _consolidarDuplicados(idx);

            _renderModalLines();
            _renderMatrixActualizaciones(); // Trigger real-time update
        }

        function removeLineaPresupuesto(lineIdx) {
            const idx = state.editingPresupuestoIdx;
            const totalRevisiones = state.data.presupuesto.length;
            const esUltimaRevision = idx === totalRevisiones - 1;

            // REGLA DE INTEGRIDAD: Solo se pueden eliminar líneas en la última revisión
            if (!esUltimaRevision) {
                _showAlert('Acción No Permitida', 'No se pueden eliminar líneas de revisiones que ya tienen actualizaciones posteriores.', 'warning');
                return;
            }

            const linea = state.data.presupuesto[idx].lineas[lineIdx];

            // Verificar si existe en CUALQUIER revisión anterior (incluyendo origen)
            // Recopilar todas las líneas de revisiones anteriores
            let todasLineasAnteriores = [];
            for (let i = 0; i < idx; i++) {
                const rev = state.data.presupuesto[i];
                if (rev && rev.lineas) {
                    todasLineasAnteriores = todasLineasAnteriores.concat(rev.lineas);
                }
            }

            // Buscar si la línea existe en alguna revisión anterior
            let existeEnRevisionAnterior = false;
            if (linea.idLinea) {
                existeEnRevisionAnterior = todasLineasAnteriores.some(pl => String(pl.idLinea) === String(linea.idLinea));
            } else if (linea.descripcion) {
                const descNorm = (linea.descripcion || '').toUpperCase().trim();
                const catNorm = (linea.categoria || '').toUpperCase().trim();
                existeEnRevisionAnterior = todasLineasAnteriores.some(pl => {
                    const prevDesc = (pl.descripcion || '').toUpperCase().trim();
                    const prevCat = (pl.categoria || '').toUpperCase().trim();
                    return prevDesc === descNorm && prevCat === catNorm;
                });
            }

            // Validación: Solo líneas nuevas (que no existen en revisiones anteriores ni origen) pueden eliminarse
            if (existeEnRevisionAnterior) {
                _showAlert('Acción No Permitida', 'Esta línea existe en el origen o revisiones anteriores y no puede eliminarse.', 'warning');
                return;
            }

            state.data.presupuesto[idx].lineas.splice(lineIdx, 1);
            _renderModalLines();
            _recalcularTotalModal();
        }

        function updateLineaPresupuesto(lineIdx, field, val) {
            const line = state.data.presupuesto[state.editingPresupuestoIdx].lineas[lineIdx];
            if (field === 'importe') {
                line[field] = parseFloat(val.replace(/,/g, '')) || 0;
                _recalcularTotalModal();
            } else {
                line[field] = val;
                // If description/category changed, we must re-render matrix to update grouping
                if (field === 'descripcion' || field === 'categoria') {
                    _renderMatrixActualizaciones();
                }
            }
        }

        function _recalcularTotalModal() {
            const idx = state.editingPresupuestoIdx;
            const lines = state.data.presupuesto[idx].lineas;
            const totalActual = lines.reduce((sum, l) => sum + (parseFloat(l.importe) || 0), 0);

            // Get previous revision lines for comparison
            const prevIdx = idx - 1;
            const prevLines = prevIdx >= 0 && state.data.presupuesto[prevIdx]
                ? (state.data.presupuesto[prevIdx].lineas || [])
                : [];

            // MEJORA: Para ORIGEN (idx=0), el total anterior es 0 (no N/A)
            const esOrigen = idx === 0;
            const totalAnterior = esOrigen ? 0 : prevLines.reduce((sum, l) => sum + (parseFloat(l.importe) || 0), 0);
            const totalDiferencia = totalActual - totalAnterior;

            // Update totals in footer
            const elAnterior = document.getElementById('modal-total-anterior');
            const elActual = document.getElementById('modal-total-actual');
            const elDif = document.getElementById('modal-total-diferencia');
            const elRevision = document.getElementById('modal-total-revision');

            // MEJORA: Siempre mostrar valor numérico (incluso para ORIGEN muestra $0.00)
            if (elAnterior) {
                elAnterior.textContent = _formatCurrency(totalAnterior);
                elAnterior.className = 'text-end' + (esOrigen ? ' text-muted' : '');
            }
            if (elActual) elActual.textContent = _formatCurrency(totalActual);
            if (elRevision) elRevision.textContent = _formatCurrency(totalActual);

            if (elDif) {
                let difHtml = '';
                if (totalDiferencia > 0) {
                    difHtml = `< div class="delta-up" > +${_formatCurrency(totalDiferencia)}</div > `;
                } else if (totalDiferencia < 0) {
                    difHtml = `< div class="delta-down" > ${_formatCurrency(totalDiferencia)}</div > `;
                } else {
                    difHtml = `< span class="text-muted" >—</span > `;
                }
                elDif.innerHTML = difHtml;
            }

            // Actualizar modelo del padre y tabla principal
            state.data.presupuesto[state.editingPresupuestoIdx].monto = totalActual;
            _renderPresupuesto();
            _renderMatrixActualizaciones();
        }

        async function _guardarTodo() {
            if (state.saving) return;
            state.saving = true;
            dom.btnGuardar.disabled = true;
            dom.btnGuardar.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Guardando...';
            // NORMALIZACIÓN DE CATEGORÍAS (Texto -> ID) antes de guardar
            // Para asegurar consistencia en la BD (1=Daño Físico, 2=Desazolve)
            if (state.data.presupuesto && Array.isArray(state.data.presupuesto)) {
                state.data.presupuesto.forEach(rev => {
                    if (rev.lineas && Array.isArray(rev.lineas)) {
                        rev.lineas.forEach(l => {
                            if (l.categoria) {
                                const s = String(l.categoria).toUpperCase();
                                if (s.includes('DAÑO') || s.includes('FISICO')) l.categoria = 1;
                                else if (s.includes('DESAZ')) l.categoria = 2;
                            }
                        });
                    }
                });
            }

            try {
                const payload = {
                    comunicado: dom.genComunicado.value,
                    // 'fecha' en DB es la Fecha del Documento
                    fecha: dom.genFechaDocumento ? dom.genFechaDocumento.value : null,
                    // 'fechaAsignacion' en DB es la Fecha de Registro
                    fechaAsignacion: dom.genFecha.value,
                    descripcion: dom.genDescripcion.value,
                    idEstado: dom.genEstado.value,
                    distrito: dom.genDistrito.value,
                    siniestro: dom.genSiniestro.value,
                    fenomeno: dom.genFenomeno.value,
                    fi: dom.genFi.value,
                    fondo: dom.genFondo.value,
                    presupuesto: state.data.presupuesto,
                    equipo: state.data.equipo,
                    financiero: state.data.financiero, // Mantener por compatibilidad si es necesario
                    estimaciones: state.data.estimaciones, // NUEVO: Enviar estimaciones
                    tickets: state.data.tickets,
                    ajustador: dom.genAjustador.value,
                    aseguradora: dom.genAseguradora.value // Include Aseguradora

        function crearActualizacionConTipo(tipo) {
            // Cerrar modal de selección
            const modalEl = document.getElementById('modalTipoActualizacion');
            if (modalEl) {
                const modal = bootstrap.Modal.getInstance(modalEl);
                if (modal) modal.hide();
            }

            const presupuestos = state.data.presupuesto || [];
            const ultimoIdx = presupuestos.length - 1;
            const ultimaActualizacion = ultimoIdx >= 0 ? presupuestos[ultimoIdx] : null;

            // Crear nueva actualización
            const nuevaActualizacion = {
                revision: '',
                fecha: new Date().toISOString(),
                monto: 0,
                montoCapturado: null,
                montoSupervision: 0,
                lineas: [],
                _tipoAccion: tipo, // Guardar tipo para el backend
                _esNueva: true // Marcar como nueva para lógica delta
            };

            // Lógica según tipo
            if (tipo === 'SUSTITUCION_TOTAL') {
                // Empezar vacío
                nuevaActualizacion.lineas = [];
            } else if (ultimaActualizacion && ultimaActualizacion.lineas && ultimaActualizacion.lineas.length > 0) {
                // INFORMATIVO o ACTUALIZACION: Copiar líneas del predecesor
                nuevaActualizacion.lineas = ultimaActualizacion.lineas.map(l => ({
                    ...l,
                    // Preservar idLinea para mantener relación
                    idLinea: l.idLinea,
                    // Nuevo registro, no tiene id propio todavía
                    id: undefined,
                    // Copia del importe
                    importe: l.importe || 0
                }));

                // Calcular monto total de las líneas copiadas
                const total = nuevaActualizacion.lineas.reduce((sum, l) => sum + (parseFloat(l.importe) || 0), 0);
                nuevaActualizacion.monto = total;
                nuevaActualizacion.montoSupervision = total * 0.05;
            }

            // Agregar al array
            state.data.presupuesto.push(nuevaActualizacion);
            _renderPresupuesto();

            // Si es ACTUALIZACION o SUSTITUCION, abrir editor de líneas
            if (tipo !== 'INFORMATIVO') {
                const nuevoIdx = state.data.presupuesto.length - 1;
                setTimeout(() => abrirEditorPresupuesto(nuevoIdx), 300);
            }
        }

        // Eliminar estimación del estado local con restricciones de integridad
        async function removeEstimacion(id) {
            // Encontrar la estimación
            const estimacion = (state.data.estimaciones || []).find(e => String(e.id) === String(id));
            if (!estimacion) return;

            // RESTRICTION 0: Chronological LIFO Audit
            const activeEsts = (state.data.estimaciones || [])
                .filter(e => e.estatusInterno !== 'CANCELADO' && (e.entidad || 'CONSTRUCTORA') === (estimacion.entidad || 'CONSTRUCTORA')) // Filter by same Entity!
                .sort((a, b) => {
                    const typeScore = (t) => t === 'ANTICIPO' ? 1 : (t === 'FINIQUITO' ? 3 : 2);
                    let scoreA = typeScore(a.tipo || 'ESTIMACION');
                    let scoreB = typeScore(b.tipo || 'ESTIMACION');
                    if (scoreA !== scoreB) return scoreA - scoreB;
                    return new Date(a.fechaCorte) - new Date(b.fechaCorte);
                });

            // Check if last
            const isLast = activeEsts.length > 0 && activeEsts[activeEsts.length - 1].id === estimacion.id;

            // Relaxed Rule for Supervision: Allow delete if PENDIENTE even if not last (to fix date errors)
            const isSupervision = (estimacion.entidad || 'CONSTRUCTORA') === 'SUPERVISION';
            const isPendiente = estimacion.estatusInterno === 'PENDIENTE';
            const ignoreLifo = isSupervision && isPendiente;

            if (!isLast && !ignoreLifo) {
                _showAlert('Acción Bloqueada', 'No se puede eliminar porque existe un registro posterior. Elimine el más reciente primero.', 'warning');
                return;
            }

            // Check Amortization for Anticipo
            if (estimacion.tipo === 'ANTICIPO') {
                const isAmortized = activeEsts.some(e => (parseFloat(e.amortizacion) || 0) > 0);
                if (isAmortized) {
                    _showAlert('Acción Bloqueada', 'Este Anticipo ya ha sido amortizado en estimaciones posteriores. No puede eliminarse.', 'warning');
                    return;
                }
            }

            // RESTRICTION 1: Linked to Supervision?
            // If this is a Contractor Est, check if any Supervision Est references it.
            const isLinked = (state.data.estimaciones || []).some(e => String(e.idRelacionada) === String(id) && e.estatusInterno !== 'CANCELADO');
            if (isLinked) {
                _showAlert('Acción Bloqueada', 'Esta estimación está vinculada a una supervisión. Elimine primero la estimación de supervisión asociada.', 'warning');
                return;
            }

            // RESTRICTION 2: Has Invoices or Complements?
            const facturasAsociadas = (state.data.facturasEstimaciones || [])
                .filter(f => String(f.idEstimacion) === String(id) && f.estatusSAT !== 'CANCELADO');

            if (facturasAsociadas.length > 0) {
                _showAlert('Acción Bloqueada', `Esta estimación tiene ${facturasAsociadas.length} facturas / complementos activos.Debe eliminarlos primero.`, 'warning');
                return;
            }

            if (estimacion.estatusInterno === 'PAGADO') {
                _showAlert('No permitido', 'No se puede eliminar una estimación PAGADA.', 'warning');
                return;
            }

            // Confirmación con Modal Genérico (Doble confirmación + Spin)
            _showDeleteModal(
                'Eliminar Estimación',
                `¿Está seguro de eliminar < strong > ${({ '1': 'ANTICIPO', '2': 'ESTIMACION', '3': 'FINIQUITO' }[String(estimacion.tipo)] || estimacion.tipo)} ${estimacion.numero}</strong > por < strong > ${_formatCurrency(estimacion.monto)}</strong >? `,
                async () => {
                    try {
                        // Si es temporal, borrar localmente
                        if (String(id).startsWith('temp-')) {
                            state.data.estimaciones = state.data.estimaciones.filter(e => String(e.id) !== String(id));
                            // Eliminar también facturas temp asociadas
                            state.data.facturasEstimaciones = state.data.facturasEstimaciones.filter(f => String(f.idEstimacion) !== String(id));
                        } else {
                            // Server call
                            await serverCall('eliminarEstimacion', id);
                            // Update Local State
                            state.data.estimaciones = state.data.estimaciones.filter(e => String(e.id) !== String(id));
                            state.data.facturasEstimaciones = state.data.facturasEstimaciones.filter(f => String(f.idEstimacion) !== String(id));
                        }

                        // Re-render
                        _renderFinanciero();
                        _renderPresupuesto();

                        // Clear selection if needed
                        if (state.ui.selectedEstimacionId === id) {
                            state.ui.selectedEstimacionId = null;
                            // Reset Validation/Placeholder UI if needed
                            const placeholderC = document.getElementById('facturas-placeholder-constructora');
                            const dataContainerC = document.getElementById('facturas-data-constructora');
                            if (placeholderC) placeholderC.classList.remove('d-none');
                            if (dataContainerC) dataContainerC.classList.add('d-none');
                        }

                        // Update summaries
                        _updateResumenFinanciero();

                        globalThis.showToast?.('Estimación eliminada', 'success');

                    } catch (e) {
                        console.error(e);
                        _showAlert('Error', 'Falló la eliminación: ' + e.message, 'error');
                        throw e; // Signal error to modal logic
                    }
                }
            );

        }

        // --- NEW HELPER: Generic Delete Modal ---
        function _showDeleteModal(title, htmlMessage, deleteActionAsync) {
            const modalEl = document.getElementById('modalDeleteGeneric');
            const modal = bootstrap.Modal.getOrCreateInstance(modalEl);

            // Set Content
            document.getElementById('modalDeleteGenericTitle').innerHTML = `< i class="bi bi-exclamation-triangle-fill me-2" ></i > ${title} `;
            document.getElementById('modalDeleteGenericMessage').innerHTML = htmlMessage;
            document.getElementById('modalDeleteGenericExtraWarning').classList.add('d-none');

            // Reset Button State
            const btn = document.getElementById('btnConfirmDeleteGeneric');
            const spinner = btn.querySelector('.spinner-border');

            // Get secondary buttons to lock them too
            const cancelBtn = modalEl.querySelector('.btn-outline-secondary');
            const closeBtn = modalEl.querySelector('.btn-close');

            btn.disabled = false;
            if (cancelBtn) cancelBtn.disabled = false;
            if (closeBtn) closeBtn.disabled = false;

            spinner.classList.add('d-none');

            // Assign Action
            btn.onclick = async () => {
                // UI: Loading State - LOCK EVERYTHING
                btn.disabled = true;
                if (cancelBtn) cancelBtn.disabled = true;
                if (closeBtn) closeBtn.disabled = true;
                spinner.classList.remove('d-none');

                try {
                    await deleteActionAsync();
                    // Success: Close Modal
                    modal.hide();
                } catch (e) {
                    // Error: Reset Button to allow retry or cancel
                    btn.disabled = false;
                    if (cancelBtn) cancelBtn.disabled = false;
                    if (closeBtn) closeBtn.disabled = false;
                    spinner.classList.add('d-none');
                }
            };

            modal.show();
        }

        async function registrarComplemento(idFactura) {
            const btn = event?.currentTarget || document.activeElement; // Capture button if safely possible
            const folioInput = document.getElementById(`input - comp - folio - ${idFactura} `);
            const fechaInput = document.getElementById(`input - comp - fecha - ${idFactura} `);
            const uuidInput = document.getElementById(`input - comp - uuid - ${idFactura} `);
            const montoInput = document.getElementById(`input - comp - monto - ${idFactura} `);
            const ivaInput = document.getElementById(`input - comp - iva - ${idFactura} `);
            const totalInput = document.getElementById(`input - comp - total - ${idFactura} `);

            if (!folioInput || !fechaInput) return;

            const folio = folioInput.value.trim();
            const fecha = fechaInput.value;
            const uuid = uuidInput ? uuidInput.value.trim() : '';

            // Clean currency inputs
            const cleanNumber = (val) => parseFloat((val || '').replace(/[^0-9.-]+/g, '')) || 0;
            const monto = cleanNumber(montoInput ? montoInput.value : '');
            const iva = cleanNumber(ivaInput ? ivaInput.value : '');
            const total = cleanNumber(totalInput ? totalInput.value : '');

            if (!folio || !fecha) {
                Swal.fire('Datos Incompletos', 'Ingresa Folio y Fecha para el complemento.', 'warning');
                return;
            }

            // Disable button
            let originalContent = '';
            if (btn && btn.tagName === 'BUTTON') {
                btn.disabled = true;
                originalContent = btn.innerHTML;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>';
            }

            try {
                const payload = {
                    folio,
                    fecha,
                    uuid,
                    monto,
                    iva,
                    total,
                    tipo: 2 // 2 = COMPLEMENTO
                };

                // serverCall resolves the 'data' part if success=true.
                // If success=false, it throws an error (handled in catch).
                // So if we get here, it succeeded. 'response' is actually 'data'.
                const data = await serverCall('registrarComplemento', idFactura, payload);

                if (data) {
                    // PATCH: Force numeric type 2 (wait for propagation)
                    try {
                        const newId = data.id || (data.data && data.data.id) || (typeof data === 'number' ? data : null);

                        if (newId) {
                            console.log('Patching complement type to 2 for id:', newId);
                            // Brief delay to ensure DB insert is stable
                            await new Promise(resolve => setTimeout(resolve, 500));
                            // Only update the type with minimal payload
                            await serverCall('actualizarFactura', newId, { tipo: 2 });
                        } else {
                            console.warn('Could not extract ID for patch from data:', data);
                        }
                    } catch (ePatch) {
                        console.warn('Patch type failed:', ePatch);
                    }

                    await _reloadEstimaciones();
                    Swal.fire({
                        icon: 'success',
                        title: 'Complemento Registrado',
                        text: data.message || 'La factura ha sido actualizada (PAGADO).',
                        timer: 2000,
                        showConfirmButton: false
                    });
                }

            } catch (e) {
                console.error(e);
                Swal.fire('Error', e.message, 'error');
                // Re-enable button on error
                if (btn && btn.tagName === 'BUTTON') {
                    btn.disabled = false;
                    btn.innerHTML = originalContent || '<i class="bi bi-plus"></i>';
                }
            }
        }

        // MOVEMENT: _confirmarCreacionSupervision (Refactored for Direct & Placeholder)
        async function _confirmarCreacionSupervision(idVinculada, tipo, placeholderId = null) {
            Swal.close(); // Close selection modal
            await new Promise(r => setTimeout(r, 100));

            // Validate Parent Existence
            const parent = state.data.estimaciones.find(e => String(e.id) === String(idVinculada));
            // We proceed even if parent not found? Preferably yes if idVinculada is passed, but calculation uses it.

            // Check duplicates logic...?
            const existentes = (state.data.estimaciones || [])
                .filter(e => (e.entidad || 'CONSTRUCTORA') === 'SUPERVISION' && e.tipo === tipo && !e._isPlaceholder);

            let numero = tipo === 'ANTICIPO' ? 'A' : tipo === 'FINIQUITO' ? 'F' : String(existentes.length + 1);

            // ========================================
            // CÁLCULO AUTOMÁTICO DEL MONTO SUPERVISIÓN
            // ========================================
            let montoCalculado = 0;

            // 1. Buscar la estimación CONSTRUCTORA vinculada
            if (idVinculada) {
                const estimacionContratista = (state.data.estimaciones || [])
                    .find(e => String(e.id).trim() === String(idVinculada).trim() &&
                        String(e.entidad || 'CONSTRUCTORA').toUpperCase() === 'CONSTRUCTORA');

                if (estimacionContratista && estimacionContratista.monto) {
                    // Opción 1: 5% del monto del contratista
                    const montoContratista = parseFloat(estimacionContratista.monto) || 0;
                    montoCalculado = Math.round(montoContratista * 0.05 * 100) / 100;
                    console.log(`[Supervisión] Monto calculado: 5 % de $${montoContratista} = $${montoCalculado} `);
                }
            }

            // 2. Si no hay monto del contratista, usar 50% del presupuesto de supervisión
            if (montoCalculado === 0) {
                // Buscar presupuesto de supervisión en la actualización vigente
                const presupuestoVigente = state.data.presupuestoVigente || state.data.actualizacionVigente;
                const presupuestoArray = state.data.presupuesto || [];

                let montoSupervisionPresupuesto = 0;

                if (presupuestoVigente && presupuestoVigente.montoSupervision) {
                    montoSupervisionPresupuesto = parseFloat(presupuestoVigente.montoSupervision) || 0;
                } else if (presupuestoArray.length > 0) {
                    // Buscar la última actualización
                    const ultima = presupuestoArray[presupuestoArray.length - 1];
                    montoSupervisionPresupuesto = parseFloat(ultima.montoSupervision) || 0;
                }

                if (montoSupervisionPresupuesto > 0) {
                    // 50% del presupuesto de supervisión
                    montoCalculado = Math.round(montoSupervisionPresupuesto * 0.50 * 100) / 100;
                    console.log(`[Supervisión] Monto calculado: 50 % de presupuesto supervisión $${montoSupervisionPresupuesto} = $${montoCalculado} `);
                }
            }

            // Calcular IVA y Total (Base = Monto - Amortizacion)
            // Supervision amortizacion usually 0, but good for consistency
            const amort = 0; // Hardcoded 0 for supervision generic create
            const baseGravable = Math.max(0, montoCalculado - amort);

            const ivaCalculado = Math.round(baseGravable * IVA_RATE * 100) / 100;
            const totalCalculado = baseGravable + ivaCalculado;

            // TEMP ID GENERATION
            const tempId = 'temp-' + Date.now() + '-' + Math.floor(Math.random() * 1000);

            const payload = {
                id: tempId, // Local ID
                idComunicado: state.id,
                entidad: 'SUPERVISION',
                idEmpresa: state.data.contrato?.idEmpresa || '',
                tipo: ({ 'ANTICIPO': 1, 'ESTIMACION': 2, 'FINIQUITO': 3 }[tipo] || tipo),
                numero: numero,
                idRelacionada: idVinculada,
                monto: montoCalculado,
                iva: ivaCalculado,
                montoTotal: totalCalculado,
                montoAvanceFisico: 0,
                porcentajeAvanceFisico: 0,
                amortizacion: 0,
                estatusInterno: 'PENDIENTE',
                fechaCorte: _getTodayLocalISO(),
                // Local UI Props
                _isNew: true,
                _modified: true,
                facturas: []
            };

            // REMOVE PLACEHOLDER IF EXISTS
            if (placeholderId && placeholderId !== 'null') {
                const idx = state.data.estimaciones.findIndex(e => e.id === placeholderId);
                if (idx !== -1) state.data.estimaciones.splice(idx, 1);
            }
            // Push New
            state.data.estimaciones.push(payload);

            // Set Selected
            state.ui.selectedEstimacionId = tempId;

            // Render
            _renderFinanciero();
            globalThis.showToast?.('Registro creado (sin guardar).', 'info');

            // Auto expand
            setTimeout(() => {
                ComunicadoDetalle.toggleInfo(tempId);
            }, 500);
        }

        // --- SAFE UPDATE FOR ESTIMACIONES ---
        // --- SAFE UPDATE FOR ESTIMACIONES ---
        function updateEstimacionSafe(id, field, val) {
            const item = (state.data.estimaciones || []).find(e => String(e.id) === String(id));
            if (!item) return;

            // CRITICAL FIX: Only parse numbers for numeric fields!
            const numericFields = ['monto', 'amortizacion', 'descuentos', 'iva', 'montoTotal', 'montoAvanceFisico', 'porcentajeAvanceFisico'];

            if (numericFields.includes(field)) {
                // Clean Number
                const cleanVal = parseFloat(String(val).replace(/[^0-9.-]+/g, '')) || 0;
                item[field] = cleanVal;
            } else {
                // Text/Date Fields
                item[field] = val;
            }

            item._modified = true; // Mark modified

            // 1. Update Input Field formatting immediately (Formatter)
            let inputId = '';
            if (field === 'monto') inputId = `input - monto - ${id} `;
            else if (field === 'amortizacion') inputId = `input - amortizacion - ${id} `;
            else if (field === 'descuentos') inputId = `input - descuentos - ${id} `;
            else if (field === 'montoAvanceFisico') inputId = `input - avfisico - ${id} `;

            if (inputId) {
                const inputEl = document.getElementById(inputId);
                if (inputEl) {
                    const valueToFormat = item[field];
                    inputEl.value = _formatCurrency(valueToFormat);
                }
            }

            // 2. Auto-calc Financials if monto/amortizacion/descuentos changed
            if (field === 'monto' || field === 'amortizacion' || field === 'descuentos') {
                const m = parseFloat(item.monto) || 0;
                let a = parseFloat(item.amortizacion) || 0;
                let d = parseFloat(item.descuentos) || 0;

                // VALIDATION: Amort + Desc <= Monto (Net never negative)
                // We perform the check. If negative, we clamp the modified field.
                if (a + d > m) {
                    if (field === 'descuentos') {
                        d = Math.max(0, m - a);
                        item.descuentos = d;
                        const el = document.getElementById(`input-descuentos-${id}`);
                        if (el) el.value = _formatCurrency(d);
                    } else if (field === 'amortizacion') {
                        a = Math.max(0, m - d);
                        item.amortizacion = a;
                        const el = document.getElementById(`input-amortizacion-${id}`);
                        if (el) el.value = _formatCurrency(a);
                    } else if (field === 'monto') {
                        // Reducing Amount might cause negative net. 
                        // Strategy: reduce D then A.
                        const excess = (a + d) - m;
                        if (excess > 0) {
                            if (d >= excess) {
                                d -= excess;
                                item.descuentos = d;
                            } else {
                                const rem = excess - d;
                                d = 0;
                                item.descuentos = 0;
                                a = Math.max(0, a - rem);
                                item.amortizacion = a;
                            }
                            // Update inputs
                            const elD = document.getElementById(`input-descuentos-${id}`);
                            if (elD) elD.value = _formatCurrency(d);
                            const elA = document.getElementById(`input-amortizacion-${id}`);
                            if (elA) elA.value = _formatCurrency(a);
                        }
                    }
                }
                // User said "logica para calcular el neto... : monto - amortizacion - descuento".
                // I will recalculate IVA based on this new Net Base (m - a - d).

                const base = Math.max(0, m - a - d);
                // Assign to item.neto so it gets persisted
                item.neto = base;

                const ivaRaw = base * IVA_RATE;

                item.iva = Math.round(ivaRaw * 100) / 100;
                item.montoTotal = base + item.iva;

                // Update UI text content
                const elNeto = document.getElementById(`input-neto-${id}`);
                const elIva = document.getElementById(`input-iva-${id}`);
                const elTotal = document.getElementById(`input-total-${id}`);

                if (elNeto) elNeto.textContent = _formatCurrency(base);
                if (elIva) elIva.textContent = _formatCurrency(item.iva);
                if (elTotal) elTotal.textContent = _formatCurrency(item.montoTotal);
            }

            // Update Save Button State
            // Update Save Button State
            const btn = document.querySelector(`button[onclick = "ComunicadoDetalle.saveEstimacion('${id}')"]`);
            if (btn) {
                btn.disabled = false;
                btn.style.opacity = '1';
                btn.title = "Guardar Cambios";
            }
        }

        async function saveEstimacion(id) {
            const item = (state.data.estimaciones || []).find(e => String(e.id) === String(id));
            if (!item) return;

            _setGlobalLoader(true, 'Guardando...');
            try {
                // Check if NEW (Temp ID)
                if (String(item.id).startsWith('temp-') || item._isNew) {
                    // Create
                    const payload = { ...item };
                    delete payload.id; // Remove temp ID
                    delete payload._isNew;
                    delete payload._modified;

                    // --- DATE FORMATTING FOR SAVE (dd/mm/yyyy) ---
                    // --- DATE HANDLING: Revert to Strings (ISO) ---
                    // "Illegal value" error confirms Date objects are rejected by serverCall/google.script.run here.
                    // Sending clean YYYY-MM-DD strings.
                    if (payload.fechaCorte) {
                        // Ensure we have a string YYYY-MM-DD
                        const iso = _formatDateISO(payload.fechaCorte);
                        payload.fechaCorte = iso || null; // Send null if invalid to avoid empty string issues
                    }
                    if (payload.fechaPago) {
                        const iso = _formatDateISO(payload.fechaPago);
                        payload.fechaPago = iso || null;
                    }

                    console.log('Saving New Estimacion Payload (ISO Strings):', payload);
                    const result = await serverCall('crearEstimacion', payload);

                    if (result && (result.id || result.success)) {
                        const realId = result.id || result.data?.id; // backend might wrap, check implementation

                        if (realId) {
                            item.id = realId;
                        }

                        delete item._isNew;
                        delete item._modified;
                        globalThis.showToast?.('Estimación creada exitosamente', 'success');
                    } else {
                        throw new Error("Respuesta inválida al crear");
                    }
                } else {
                    // Update Existing
                    // Ensure we send the FULL item with updated numeric values
                    // CLONE to avoid modifying local state which needs YYYY-MM-DD for inputs
                    const payload = { ...item };
                    if (payload.fechaCorte) {
                        const iso = _formatDateISO(payload.fechaCorte);
                        payload.fechaCorte = iso || null;
                    }
                    if (payload.fechaPago) {
                        const iso = _formatDateISO(payload.fechaPago);
                        payload.fechaPago = iso || null;
                    }

                    await serverCall('actualizarEstimacion', id, payload);
                    item._modified = false;
                    globalThis.showToast?.('Estimación guardada', 'success');
                }

                _renderFinanciero();
                _updateResumenFinanciero();
            } catch (e) {
                console.error(e);
                Swal.fire('Error', 'No se pudo guardar: ' + e.message, 'error');
            } finally {
                _setGlobalLoader(false);
            }
        }

        };

        // Assign to global
        globalThis.ComunicadoDetalle = ComponentExports;
        window.ComunicadoDetalle = ComponentExports;

        return ComponentExports;

    })();

        // --- MATRIX ACTUALIZACIONES ---
        function _renderMatrixActualizaciones() {
            const headerEl = document.getElementById('matrix-header');
            const bodyEl = document.getElementById('matrix-body');
            const footerEl = document.getElementById('matrix-footer');
            const emptyEl = document.getElementById('matrix-empty');
            const wrapperEl = document.getElementById('matrix-wrapper');
            const countConceptos = document.getElementById('matrix-count-conceptos');
            const countUpdates = document.getElementById('matrix-count-updates');

            if (!headerEl || !bodyEl) return;

            const actualizaciones = state.data.presupuesto || [];

            // Handle empty state
            if (actualizaciones.length === 0 || actualizaciones.every(a => !a.lineas || a.lineas.length === 0)) {
                if (wrapperEl) wrapperEl.classList.add('d-none');
                if (emptyEl) emptyEl.classList.remove('d-none');
                if (countConceptos) countConceptos.textContent = '0 conceptos';
                if (countUpdates) countUpdates.textContent = '0 actualizaciones';
                return;
            }

            if (wrapperEl) wrapperEl.classList.remove('d-none');
            if (emptyEl) emptyEl.classList.add('d-none');

            // 1. Collect all unique concepts across all updates
            const conceptosMap = new Map();
            actualizaciones.forEach((act, actIdx) => {
                (act.lineas || []).forEach(linea => {
                    const key = (linea.descripcion || '').toUpperCase().trim();
                    if (key && !conceptosMap.has(key)) {
                        conceptosMap.set(key, {
                            descripcion: linea.descripcion || '',
                            categoria: linea.categoria || '',
                            firstSeen: actIdx
                        });
                    }
                });
            });

            // 2. Build matrix: [conceptKey] -> { meta, importes: [importe per update] }
            const matrix = {};
            conceptosMap.forEach((meta, key) => {
                matrix[key] = { meta, importes: [] };
                actualizaciones.forEach((act, idx) => {
                    const linea = (act.lineas || []).find(l =>
                        (l.descripcion || '').toUpperCase().trim() === key
                    );
                    matrix[key].importes[idx] = linea ? (parseFloat(linea.importe) || 0) : null;
                });
            });

            const conceptKeys = Object.keys(matrix);
            const numActualizaciones = actualizaciones.length;

            // Update counters
            if (countConceptos) countConceptos.textContent = `${conceptKeys.length} concepto${conceptKeys.length !== 1 ? 's' : ''}`;
            if (countUpdates) countUpdates.textContent = `${numActualizaciones} actualizaci${numActualizaciones !== 1 ? 'ones' : 'ón'}`;

            // 3. Build header row
            let headerHtml = '<tr>';
            headerHtml += '<th class="sticky-col">Ubicación / Concepto</th>';
            headerHtml += '<th>Cat.</th>';
            actualizaciones.forEach((act, idx) => {
                const nombre = idx === 0 ? 'Origen' : (act.revision || `Rev ${String.fromCharCode(65 + idx - 1)}`);
                const fecha = _formatDateISO(act.fecha);
                const isLast = idx === numActualizaciones - 1;
                headerHtml += `<th class="text-center ${isLast ? 'col-vigente' : ''}">${nombre}${fecha ? `<br><span style="font-weight:400;text-transform:none;font-size:0.68rem;color:#64748b;">${fecha}</span>` : ''}</th>`;
            });
            headerHtml += '</tr>';
            headerEl.innerHTML = headerHtml;

            // 4. Build body rows
            let bodyHtml = '';
            conceptKeys.forEach(key => {
                const data = matrix[key];
                const cat = data.meta.categoria || '';
                const catClass = cat.includes('DAÑO') || cat.includes('FISICO') ? 'cat-df' : cat.includes('DESAZ') ? 'cat-dz' : '';

                bodyHtml += '<tr>';
                bodyHtml += `<td class="sticky-col">${_escapeHtml(data.meta.descripcion)}</td>`;
                bodyHtml += `<td><span class="cat-badge ${catClass}">${cat || '—'}</span></td>`;

                data.importes.forEach((importe, idx) => {
                    const isLast = idx === numActualizaciones - 1;
                    const prev = idx > 0 ? data.importes[idx - 1] : null;
                    const hasPrev = prev !== null;
                    let delta = null;
                    let deltaHtml = '';

                    if (importe !== null && hasPrev) {
                        delta = importe - prev;
                        if (delta > 0) {
                            deltaHtml = `<div class="delta-up">+${_formatCurrency(delta)}</div>`;
                        } else if (delta < 0) {
                            deltaHtml = `<div class="delta-down">${_formatCurrency(delta)}</div>`;
                        }
                    } else if (importe !== null && idx === 0) {
                        // Origin - show as new
                        deltaHtml = `<div class="delta-up">+${_formatCurrency(importe)}</div>`;
                    } else if (importe !== null && !hasPrev) {
                        // New concept in this revision
                        deltaHtml = `<div class="delta-up">NUEVO</div>`;
                    }

                    const cellValue = importe !== null ? _formatCurrency(importe) : '<span class="text-muted">—</span>';
                    bodyHtml += `<td class="${isLast ? 'col-vigente' : ''}">${cellValue}${deltaHtml}</td>`;
                });
                bodyHtml += '</tr>';
            });
            bodyEl.innerHTML = bodyHtml;

            // 5. Build footer with totals
            let footerHtml = '<tr>';
            footerHtml += '<td class="sticky-col text-end" colspan="2"><strong>Totales</strong></td>';
            actualizaciones.forEach((act, idx) => {
                const isLast = idx === numActualizaciones - 1;
                const total = conceptKeys.reduce((sum, key) => sum + (matrix[key].importes[idx] || 0), 0);
                const prevTotal = idx > 0 ? conceptKeys.reduce((sum, key) => sum + (matrix[key].importes[idx - 1] || 0), 0) : 0;
                const deltaTotal = total - prevTotal;
                let deltaHtml = '';
                if (idx > 0 && deltaTotal !== 0) {
                    deltaHtml = deltaTotal > 0
                        ? `<div class="delta-up">+${_formatCurrency(deltaTotal)}</div>`
                        : `<div class="delta-down">${_formatCurrency(deltaTotal)}</div>`;
                }
                footerHtml += `<td class="${isLast ? 'col-vigente' : ''}">${_formatCurrency(total)}${deltaHtml}</td>`;
            });
            footerHtml += '</tr>';
            footerEl.innerHTML = footerHtml;
        }

        function _escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // --- PUBLIC HELPERS (Exports) ---
        function updateFinanciero(index, field, value) {
            const item = state.data.financiero[index];
            if (!item) return;
            if (['montoEjecutado', 'amortizacion'].includes(field)) {
                item[field] = parseFloat(String(value).replace(/,/g, '')) || 0;
            } else {
                item[field] = value;
            }
            // Recálculo del Total Facturado
            const sub = (parseFloat(item.montoEjecutado) || 0) - (parseFloat(item.amortizacion) || 0);
            item.totalFacturado = sub * (1 + IVA_RATE);
            _renderFinanciero();
        }

        function removeFinanciero(index) {
            if (confirm('¿Eliminar registro financiero?')) {
                state.data.financiero.splice(index, 1);
                _renderFinanciero();
            }
        }

        function updatePresupuesto(idx, field, val) {
            const item = state.data.presupuesto[idx];
            if (field === 'montoCapturado' || field === 'montoSupervision') {
                // Permitir vacío para capturado
                if (val === '') {
                    item[field] = field === 'montoCapturado' ? null : 0;
                } else {
                    item[field] = parseFloat(val.replace(/,/g, '')) || 0;
                }
            } else if (field === 'monto') {
                // Legacy or if manually editing calc (shouldn't happen due to readonly)
                item[field] = parseFloat(val.replace(/,/g, '')) || 0;
            } else {
                item[field] = val;
            }
            _renderPresupuesto();
        }
        function removePresupuesto(idx) {
            const items = state.data.presupuesto;

            // Reglas de Seguridad
            if (idx === 0) {
                _showAlert('Acción No Permitida', 'No se puede eliminar el presupuesto de Origen.', 'warning');
                return;
            }
            if (idx !== items.length - 1) {
                _showAlert('Acción No Permitida', 'Solo se puede eliminar la última revisión para mantener la integridad de la secuencia.', 'warning');
                return;
            }

            if (!confirm('¿Estás seguro de eliminar esta revisión?\n\nADVERTENCIA: Esta acción eliminará permanentemente la revisión y todo su desglose de conceptos asociado.')) {
                return;
            }

            state.data.presupuesto.splice(idx, 1);
            _renderPresupuesto();
        }

        function updateEquipo(idx, field, val) { state.data.equipo[idx][field] = val; }
        function removeEquipo(idx) { state.data.equipo.splice(idx, 1); _renderEquipo(); }

        function updateTicket(idx, field, val) { state.data.tickets[idx][field] = val; }
        function removeTicket(idx) { state.data.tickets.splice(idx, 1); _renderTickets(); }

        // --- AUXILIARES ---
        function _attachCurrencyFormatters() {
            document.querySelectorAll('.currency-input').forEach(input => {
                input.addEventListener('blur', (e) => {
                    const val = parseFloat(e.target.value.replace(/[^0-9.-]/g, '')) || 0;
                    e.target.value = _formatCurrency(val, true);
                });
                input.addEventListener('focus', (e) => {
                    e.target.value = e.target.value.replace(/,/g, '').replace('$', '');
                    e.target.select();
                });
            });
        }
        function _formatCurrency(val, withSymbol = true) {
            const num = parseFloat(val) || 0;
            return (withSymbol ? '$' : '') + num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
        function _formatDateISO(dateStr) {
            if (!dateStr) return '';
            try { return new Date(dateStr).toISOString().split('T')[0]; } catch (e) { return ''; }
        }
        function _setComboboxValue(input, obj, prop) {
            const val = (obj && typeof obj === 'object') ? obj[prop] : (obj || '');
            input.value = val || '';
        }

        function _getStatusBadge(status) {
            const s = (status || 'PENDIENTE').toUpperCase();
            let colorClass = 'bg-secondary text-white';
            if (s === 'PENDIENTE') colorClass = 'badge-soft-warning';
            if (s === 'EN_REVISION' || s === 'REVISION') colorClass = 'badge-soft-info';
            if (s === 'APROBADO') colorClass = 'badge-soft-primary';
            if (s === 'PAGADO') colorClass = 'badge-soft-success';
            if (s === 'CANCELADO') colorClass = 'badge-soft-danger';
            return `<span class="badge ${colorClass} border-0">${s.replace('_', ' ')}</span>`;
        }

        function _updateResumenFinanciero() {
            // Helper de seguridad para numeros
            const safeFloat = (val) => parseFloat(String(val).replace(/[^0-9.-]+/g, '')) || 0;

            // 1. OBTENER DATOS BASE
            const estAll = state.data.estimaciones || [];
            const facturasAll = state.data.facturasEstimaciones || [];
            const presAll = state.data.presupuesto || [];
            const ultPres = presAll.length > 0 ? presAll[presAll.length - 1] : null;

            // 2. FUNCIÓN DE CÁLCULO POR ENTIDAD
            const calculateEntity = (entidad) => {
                const est = estAll.filter(e => (e.entidad || 'CONSTRUCTORA') === entidad && e.estatusInterno !== 'CANCELADO');
                const idsEst = est.map(e => String(e.id));
                const facturas = facturasAll.filter(f => idsEst.includes(String(f.idEstimacion)) && f.estatusSAT !== 'CANCELADO' && (f.tipo == 1 || f.tipo === 'FACTURA'));

                // A. Totales Tabla (Footer)
                // Neto = Monto - Amortizacion
                const totalMonto = est.reduce((acc, e) => acc + safeFloat(e.monto), 0);
                const totalAmort = est.reduce((acc, e) => acc + safeFloat(e.amortizacion), 0);
                const totalNeto = totalMonto - totalAmort;
                const totalIva = est.reduce((acc, e) => acc + safeFloat(e.iva), 0);
                const totalTotal = est.reduce((acc, e) => acc + safeFloat(e.montoTotal), 0);

                // B. Totales Tarjetas (Reglas Específicas)

                // AUTORIZADO: Presupuesto
                let autorizado = 0;
                if (ultPres) {
                    const field = entidad === 'CONSTRUCTORA' ? 'montoCapturado' : 'montoSupervision';
                    const fallbackField = entidad === 'CONSTRUCTORA' ? 'monto' : 'montoSupervision';

                    if (entidad === 'CONSTRUCTORA') {
                        autorizado = (ultPres.montoCapturado !== null && !isNaN(parseFloat(ultPres.montoCapturado)))
                            ? parseFloat(ultPres.montoCapturado)
                            : safeFloat(ultPres.monto);
                    } else {
                        autorizado = safeFloat(ultPres.montoSupervision);
                    }
                }

                // ESTIMADO: Suma del NETO de estimaciones (EXCEPTO ANTICIPO)
                // Regla: Solo sumar Neto si tipo != 'ANTICIPO'
                const estimado = est
                    .filter(e => (e.tipo || '').toUpperCase() !== 'ANTICIPO')
                    .reduce((acc, e) => acc + (safeFloat(e.monto) - safeFloat(e.amortizacion)), 0);

                // EJERCIDO: Suma de todas las facturas vigentes (Total/Gross)
                // Regla: "Tanto de anticipo y estimaciones (NETO)".
                // Interpretación: Suma de importes de facturas. Usaremos Total Factura.
                const ejercido = facturas.reduce((acc, f) => acc + safeFloat(f.monto), 0);

                // AVANCE FISICO: Suma de todos los avances fisicos
                const avFisico = est.reduce((acc, e) => acc + safeFloat(e.montoAvanceFisico), 0);

                // POR EJERCER: Autorizado - Ejercido
                const porEjercer = autorizado - ejercido;

                return {
                    totalNeto, totalIva, totalTotal,
                    autorizado, estimado, ejercido, avFisico, porEjercer
                };
            };

            const dataConst = calculateEntity('CONSTRUCTORA');
            const dataSup = calculateEntity('SUPERVISION');

            // --- C. ACTUALIZACION DOM (TABLAS FOOTER) ---
            const updateFooter = (prefix, data) => {
                if (dom.financiero[prefix].neto) dom.financiero[prefix].neto.textContent = _formatCurrency(data.totalNeto);
                if (dom.financiero[prefix].iva) dom.financiero[prefix].iva.textContent = _formatCurrency(data.totalIva);
                if (dom.financiero[prefix].total) dom.financiero[prefix].total.textContent = _formatCurrency(data.totalTotal);
            };
            updateFooter('resumen', dataConst);
            updateFooter('resumenSupervision', dataSup);


            // --- D. ACTUALIZACION DOM (TARJETAS + PROGRES BAR) ---
            const updateCard = (elId, val, baseRef, colorClass) => {
                const el = document.getElementById(elId);
                if (!el) return;
                el.textContent = _formatCurrency(val);

                const cardBody = el.closest('.card-body');
                if (!cardBody) return;

                // 1. Porcentaje (Badge)
                let badge = cardBody.querySelector('.pct-badge');
                if (!badge) {
                    badge = document.createElement('span');
                    badge.className = 'pct-badge position-absolute top-0 end-0 m-2 badge bg-light text-dark border';
                    badge.style.fontSize = '0.75rem';
                    const card = el.closest('.card');
                    if (card) {
                        card.classList.add('position-relative');
                        card.appendChild(badge);
                    }
                }

                if (baseRef > 0 && val !== 0) {
                    const pct = (val / baseRef) * 100;
                    badge.textContent = pct.toFixed(1) + '%';
                    badge.classList.remove('d-none');
                } else {
                    badge.classList.add('d-none');
                }

                // 2. Línea de Progreso (Bar)
                let progressContainer = cardBody.querySelector('.card-progress-container');
                if (!progressContainer) {
                    progressContainer = document.createElement('div');
                    progressContainer.className = 'card-progress-container mt-2';
                    progressContainer.style.height = '4px';
                    progressContainer.style.backgroundColor = '#e9ecef';
                    progressContainer.style.borderRadius = '2px';
                    progressContainer.style.overflow = 'hidden';

                    const bar = document.createElement('div');
                    bar.className = 'card-progress-bar h-100';
                    bar.style.width = '0%';
                    bar.style.transition = 'width 0.5s ease';

                    progressContainer.appendChild(bar);
                    cardBody.appendChild(progressContainer);
                }

                const bar = progressContainer.querySelector('.card-progress-bar');
                if (bar) {
                    // Set color based on passed class or inherit from card
                    const mapColor = {
                        'primary': '#0d6efd',
                        'warning': '#ffc107',
                        'success': '#198754',
                        'secondary': '#6c757d',
                        'info': '#0dcaf0',
                        'purple': '#6f42c1'
                    };
                    bar.style.backgroundColor = mapColor[colorClass] || '#0d6efd';

                    // Calc width
                    let w = 0;
                    // Logic: Autorizado is 100% of itself. Others relative to Autorizado.
                    // Except Avance Fisico? Usually relative to Autorizado or logic.
                    if (elId.includes('autorizado')) w = 100;
                    else if (baseRef > 0) w = (val / baseRef) * 100;

                    // Limit visual width to 100? or allow overflow? usually capped at 100 for visual bar
                    if (w > 100) w = 100;
                    if (w < 0) w = 0;

                    bar.style.width = w + '%';
                }
            };

            // Cards Constructora
            const autoC = dataConst.autorizado;
            updateCard('fin-autorizado', autoC, autoC, 'primary');
            updateCard('fin-estimado', dataConst.estimado, autoC, 'warning');
            updateCard('fin-ejercido', dataConst.ejercido, autoC, 'success');
            updateCard('fin-avance-fisico', dataConst.avFisico, autoC, 'secondary');
            updateCard('fin-por-ejercer', dataConst.porEjercer, autoC, 'purple');

            // Cards Supervision
            const autoS = dataSup.autorizado;
            updateCard('fin-autorizado-sup', autoS, autoS, 'primary');
            updateCard('fin-estimado-sup', dataSup.estimado, autoS, 'warning');
            updateCard('fin-ejercido-sup', dataSup.ejercido, autoS, 'success');
            updateCard('fin-avance-fisico-sup', dataSup.avFisico, autoS, 'secondary');
            updateCard('fin-por-ejercer-sup', dataSup.porEjercer, autoS, 'purple');
        }

        function _renderEntidadTable(entidad, container, resumenUI) {
            if (!container) return;
            container.innerHTML = '';

            // LOGICA DIFERENCIADA: SUPERVISION VS CONSTRUCTORA
            if (entidad === 'SUPERVISION') {
                _renderTableSupervisionNew(container);
            } else {
                _renderTableConstructora(container);
            }

            // BOTÓN "AGREGAR ESTIMACIÓN"
            // Para Supervision, el boton abre el modal de vinculacion.
            // Para Constructora, agrega directo.
            // Validar presupuesto...
            const estimaciones = (state.data.estimaciones || [])
                .filter(e => (e.entidad || 'CONSTRUCTORA').toUpperCase() === entidad && e.estatusInterno !== 'CANCELADO');

            const totalEstimado = estimaciones.reduce((sum, e) => sum + (parseFloat(e.montoTotal) || 0), 0);

            let limitePresupuesto = 0;
            if (entidad === 'CONSTRUCTORA') {
                const ultPres = state.data.presupuesto ? state.data.presupuesto[state.data.presupuesto.length - 1] : null;
                if (ultPres) {
                    const mCapturado = parseFloat(ultPres.montoCapturado);
                    limitePresupuesto = (!isNaN(mCapturado) && ultPres.montoCapturado !== null) ? mCapturado : (parseFloat(ultPres.monto) || 0);
                }
            } else {
                const ultPres = state.data.presupuesto ? state.data.presupuesto[state.data.presupuesto.length - 1] : null;
                limitePresupuesto = ultPres ? (parseFloat(ultPres.montoSupervision) || 0) : 0;
            }
            const presupuestoCubierto = limitePresupuesto > 0 && totalEstimado >= (limitePresupuesto - 1);

            if (!presupuestoCubierto) {
                const divAdd = document.createElement('div');
                divAdd.className = 'mt-3 mb-4';
                divAdd.innerHTML = `
                    <button class="btn btn-outline-primary w-100 py-2 border-dashed shadow-sm d-flex align-items-center justify-content-center gap-2" 
                        onclick="${entidad === 'SUPERVISION' ? 'ComunicadoDetalle._openModalVinculacion()' : `ComunicadoDetalle._addEstimacion('${entidad}')`}" 
                        style="border-style: dashed !important; border-width: 2px;">
                        <i class="bi bi-plus-circle-fill fs-5"></i>
                        <span class="fw-bold">${entidad === 'SUPERVISION' ? 'VINCULAR UNA NUEVA ESTIMACION DEL CONTRATISTA' : 'AGREGAR NUEVA ESTIMACIÓN'}</span>
                    </button>
                `;
                container.appendChild(divAdd);
            }
        }

        async function _addEstimacion(entidad, idRelacionada = null) {
            _setGlobalLoader(true, 'Creando nueva estimación...');
            try {
                const result = await serverCall('registrarEstimacion', state.id, entidad, idRelacionada);
                // serverCall unwraps the response.data if success is true.
                // So result IS the data (the created estimation object).
                // If it failed, serverCall would have rejected.
                if (result) {
                    await _loadData(); // Recargar todo
                    globalThis.showToast?.('Estimación creada correctamente', 'success');
                } else {
                    throw new Error('La respuesta del servidor fue vacía.');
                }
            } catch (e) {
                console.error(e);
                Swal.fire('Error', 'No se pudo crear la estimación: ' + e.message, 'error');
            } finally {
                _setGlobalLoader(false);
            }
        }

        function _renderTableConstructora(container) {
            let estimaciones = (state.data.estimaciones || [])
                .filter(e => (e.entidad || 'CONSTRUCTORA').toUpperCase() === 'CONSTRUCTORA')
                .sort((a, b) => {
                    const mapType = { 'ANTICIPO': 1, 'ESTIMACION': 2, 'FINIQUITO': 3 };
                    return (mapType[a.tipo] || 99) - (mapType[b.tipo] || 99) || (parseInt(a.numero) - parseInt(b.numero));
                });

            // APLICAR FILTRO DE CONTRATISTA
            if (state.ui && state.ui.filterContratistaId) {
                estimaciones = estimaciones.filter(e => {
                    // Si no tiene idEmpresa, se asume huerfano o global. 
                    // Pero si tiene, debe coincidir.
                    if (!e.idEmpresa) return true;
                    return String(e.idEmpresa) === String(state.ui.filterContratistaId);
                });
            }

            if (estimaciones.length === 0) {
                container.innerHTML = `<div class="text-center text-muted py-5 border rounded bg-light mb-3">Sin estimaciones registradas</div>`;
                return;
            }

            const table = _createTableSkeleton();
            const tbody = table.querySelector('tbody');

            estimaciones.forEach(est => {
                _appendEstimacionRowPair(tbody, est);
            });
            container.appendChild(table);
        }

        function _renderTableSupervision(container) {
            // 1. Obtener estimaciones SUPERVISION
            const estSupervision = (state.data.estimaciones || [])
                .filter(e => (e.entidad || 'CONSTRUCTORA').toUpperCase() === 'SUPERVISION');

            // 2. Obtener estimaciones CONSTRUCTORA (Parents)
            const estContratista = (state.data.estimaciones || [])
                .filter(e => (e.entidad || 'CONSTRUCTORA').toUpperCase() === 'CONSTRUCTORA')
                .sort((a, b) => {
                    const mapType = { 'ANTICIPO': 1, 'ESTIMACION': 2, 'FINIQUITO': 3 };
                    return (mapType[a.tipo] || 99) - (mapType[b.tipo] || 99) || (parseInt(a.numero) - parseInt(b.numero));
                });

            // 3. Crear Estructura de Tabla
            const table = _createTableSkeleton();
            const tbody = table.querySelector('tbody');

            // 4. Renderizar por cada Contratista (Parent)
            // Si la contratista NO tiene supervision, aun asi la mostramos para permitir agregarle una.
            // Asi que iteramos sobre TODAS las contratistas disponibles.

            // OJO: El usuario dice "mostrar datos de la estimacion de la contratista... Debajo un boton".
            // Y si ya existe supervision? Mostrar la existente.

            if (estContratista.length === 0 && estSupervision.length === 0) {
                container.innerHTML = `<div class="text-center text-muted py-5 border rounded bg-light mb-3">Sin estimaciones registradas</div>`;
                return;
            }

            estContratista.forEach(parentEst => {
                // Render Parent Row (Readonly visual context)
                const trParent = _createParentEstimacionRow(parentEst);
                tbody.appendChild(trParent);

                // Check for existing Supervision Children
                // Check for idRelacionada (Sheet Header) or idEstimacionVinculada (Legacy/Import Object)
                const children = estSupervision.filter(s => String(s.idRelacionada || s.idEstimacionVinculada || '').trim() === String(parentEst.id).trim());

                // Si existe, mostrar
                if (children.length > 0) {
                    children.forEach(child => {
                        _appendEstimacionRowPair(tbody, child, true); // true = indented
                    });
                } else {
                    // Si NO existe, mostrar Boton "Agregar"
                    // (O si queremos permitir multiples?) -> El usuario dijo "Agregar estimacion" debajor.
                    // Asumiremos 1:1 por logica comun, pero el boton permite crear nueva.
                    // Si ya hay una, quizas no queremos boton?
                    // "Al dar click... se inserta el registro".
                    // Mostraremos el boton SIEMPRE si queremos permitir N, o solo si children=0 si es 1:1.
                    // Por ahora mostremos el boton SOLO si no hay hijos, para forzar 1:1 logico visual, 
                    // a menos que sean estimaciones parciales.
                    // Dejaremos el boton disponible siempre debajo para consistencia.

                    const trBtnObj = document.createElement('tr');
                    trBtnObj.className = 'border-bottom border-light';
                    trBtnObj.innerHTML = `
                       <td colspan="12" class="p-0">
                           <div class="d-flex" style="background-color: #fcfcfc;">
                                <div style="width: 40px;" class="border-end text-center pt-2">
                                   <i class="bi bi-arrow-return-right text-muted opacity-50"></i>
                                </div>
                                <div class="flex-grow-1 p-2">
                                   <button class="btn btn-sm btn-light text-primary border-dashed w-100 text-start ps-3"
                                       onclick="ComunicadoDetalle._openModalCreacionSupervision('${parentEst.id}', '${parentEst.tipo}', '${parentEst.numero}')"
                                       title="Agregar estimación de supervisión vinculada a esta estimación">
                                       <i class="bi bi-plus-lg me-2"></i>Agregar Estimación de Supervisión
                                   </button>
                                </div>
                           </div>
                       </td>
                    `;
                    tbody.appendChild(trBtnObj);
                }
            });

            // 5. Renderizar Huerfanas (Supervision sin idVinculada o con id invalido)
            const orphans = estSupervision.filter(s => {
                const refId = String(s.idRelacionada || s.idEstimacionVinculada || '').trim();
                return !refId || !estContratista.find(c => String(c.id).trim() === refId);
            });
            if (orphans.length > 0) {
                // Header o separador para huerfanas
                const trSep = document.createElement('tr');
                trSep.className = 'table-warning';
                trSep.innerHTML = `<td colspan="12" class="text-center small fw-bold text-dark">ESTIMACIONES DE SUPERVISIÓN SIN VINCULAR</td>`;
                tbody.appendChild(trSep);

                orphans.forEach(child => {
                    _appendEstimacionRowPair(tbody, child, false);
                });
            }

            container.appendChild(table);
        }

        async function _openModalVinculacion() {
            // 1. Obtener estimaciones de contratista disponibles (que no esten canceladas)
            // Opcional: Filtrar las que ya estan vinculadas? El usuario no especifico 1:1 estricto, pero asumiremos que pueden reutilizarse o no.
            // Para "Agregar nueva linea indentada", sugiere que seleccionas una contratista y le creas una supervision.

            const estimacionesContratista = (state.data.estimaciones || [])
                .filter(e => (e.entidad || 'CONSTRUCTORA') === 'CONSTRUCTORA' && e.estatusInterno !== 'CANCELADO')
                .sort((a, b) => {
                    // Ordenar mas recientes primero
                    const mapType = { 'ANTICIPO': 1, 'ESTIMACION': 2, 'FINIQUITO': 3 };
                    return (mapType[a.tipo] || 99) - (mapType[b.tipo] || 99) || (parseInt(a.numero) - parseInt(b.numero));
                });

            const container = document.getElementById('lista-vinculacion-estimaciones');
            const btnConfirm = document.getElementById('btn-confirmar-vinculacion');

            container.innerHTML = '';
            btnConfirm.disabled = true;
            btnConfirm.onclick = () => _confirmarVinculacion();

            if (estimacionesContratista.length === 0) {
                container.innerHTML = `<div class="p-3 text-center text-muted">No hay estimaciones de contratista disponibles.</div>`;
                return;
            }

            estimacionesContratista.forEach(est => {
                const item = document.createElement('label');
                item.className = 'list-group-item list-group-item-action d-flex gap-3 align-items-center cursor-pointer';
                item.style.borderLeft = '4px solid transparent';

                // Logic visual selected
                item.onclick = () => {
                    document.querySelectorAll('#lista-vinculacion-estimaciones .list-group-item').forEach(el => {
                        el.classList.remove('active', 'border-primary');
                        el.style.borderLeftColor = 'transparent';
                    });
                    item.classList.add('active', 'border-primary');
                    item.style.borderLeftColor = '#0d6efd';
                    btnConfirm.disabled = false;
                    btnConfirm.dataset.id = est.id;
                };

                const neto = (parseFloat(est.monto) || 0) - (parseFloat(est.amortizacion) || 0);

                item.innerHTML = `
                    <input class="form-check-input flex-shrink-0" type="radio" name="radioVinculacion" value="${est.id}" style="display:none;">
                    <div class="d-flex w-100 justify-content-between align-items-center">
                        <div>
                            <div class="mb-1 d-flex align-items-center gap-2">
                                <span class="badge bg-light text-dark border">${est.tipo} ${est.numero}</span>
                                <small class="text-muted">${_formatDateISO(est.fechaCorte)}</small>
                            </div>
                            <small class="text-muted d-block">Monto Neto: <span class="fw-bold text-dark">${_formatCurrency(neto)}</span></small>
                        </div>
                        <i class="bi bi-chevron-right text-muted"></i>
                    </div>
                `;
                container.appendChild(item);
            });

            const modal = new bootstrap.Modal(document.getElementById('modalVincularEstimacion'));
            modal.show();
        }

        function _openModalCreacionSupervision(idParent, typeParent, numParent) {
            const btn = document.getElementById('btn-confirmar-vinculacion');
            btn.dataset.id = idParent;

            // Setup Modal UI for distinct feel or just reuse
            // For "Agregar" logic, we really just need to set the parent ID and confirm creation.
            // But the user asked for a modal to choose "Anticipo / Estimacion / Finiquito".

            // We can reuse the "Vincular" modal structure OR create a simpler one.
            // The user said: "Se abre un modal para elegir tipo: Anticipo / Estimacion / Finiquito".
            // Currently _openModalVinculacion lists *existing* contractor estimates.

            // This needs a NEW modal or a repurposed one?
            // "Al dar click... Se abre un modal para elegir tipo... En ese momento se inserta".

            // Let's invoke a Swal with inputs or use a custom modal.
            // For consistency with "new" features, Swal is easier if we don't have a template.
            // Or we can repurpose the existing "modalVincularEstimacion" if we modify it?? No, that is for selecting a *contractor* estimate.

            // We'll use Swal for the Type Selection as it's cleaner than injecting a whole new modal HTML if none exists.
            // Or better: Use the "Agregar Estimacion" logic but force the Type.

            // BUT wait, "registrarEstimacion" uses defaults.
            // We should ask the user for the Type.

            Swal.fire({
                title: `Nueva Estimación de Supervisión`,
                html: `
                    <p class="text-muted small">Vinculada a Contratista: <b>${typeParent} ${numParent}</b></p>
                    <div class="d-grid gap-2 mt-3">
                         <button class="btn btn-outline-primary" onclick="Swal.clickConfirm(); globalThis._tempType='ANTICIPO'">ANTICIPO</button>
                         <button class="btn btn-outline-primary" onclick="Swal.clickConfirm(); globalThis._tempType='ESTIMACION'">ESTIMACIÓN</button>
                         <button class="btn btn-outline-primary" onclick="Swal.clickConfirm(); globalThis._tempType='FINIQUITO'">FINIQUITO</button>
                    </div>
                 `,
                showConfirmButton: false,
                showCancelButton: true,
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed && globalThis._tempType) {
                    // Call register with explicit type if supported, OR register then update.
                    // registrarEstimacion(idComunicado, entidad, idRelacionada) -> creates "ESTIMACION" by default.
                    // IMPORTANT: The current registrarEstimacion sets 'tipo' = 'ESTIMACION'.
                    // We need to update it immediately or allow passing type.
                    // Backend signature: registrarEstimacion(idComunicado, entidad, idRelacionada)
                    // It does NOT take type.

                    // Workaround: Create then Update.
                    _createSupervisionWithType(idParent, globalThis._tempType);
                }
            });
        }

        async function _createSupervisionWithType(idRelacionada, tipo) {
            _setGlobalLoader(true, 'Creando nueva estimación...');
            try {
                // 1. Create default
                const result = await serverCall('registrarEstimacion', state.id, 'SUPERVISION', idRelacionada);
                if (result) {
                    // 2. Update Type if different from default
                    // Default is ESTIMACION. If user chose ANTICIPO or FINIQUITO, update.
                    if (tipo !== 'ESTIMACION') {
                        const updatePayload = { tipo: tipo };
                        // We can also reset numbering if needed? 
                        // "registrarEstimacion" calculated number based on "ESTIMACION".
                        // If we change to ANTICIPO, maybe number should be A?

                        // For now just update type.
                        await serverCall('actualizarRegistro', 'estimaciones', result.id, updatePayload);
                    }

                    await _loadData();
                    globalThis.showToast?.('Estimación de supervisión creada correctamente', 'success');
                } else {
                    throw new Error('La respuesta del servidor fue vacía.');
                }
            } catch (e) {
                console.error(e);
                Swal.fire('Error', 'No se pudo crear: ' + e.message, 'error');
            } finally {
                _setGlobalLoader(false);
            }
        }

        async function _confirmarVinculacion() {
            const btn = document.getElementById('btn-confirmar-vinculacion');
            const idRelacionada = btn.dataset.id;
            if (!idRelacionada) return;

            // Cerrar modal
            const modalEl = document.getElementById('modalVincularEstimacion');
            const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
            modal.hide();

            // Crear Estimacion de Supervision vinculada
            // Reutilizamos _addEstimacionLogic
            await _addEstimacion('SUPERVISION', idRelacionada);
        }

        function _createEstimacionRow(est, isReadOnly = false, isIndented = false) {

            tr.onclick = (e) => {
                if (['INPUT', 'BUTTON', 'A', 'I'].includes(e.target.tagName)) return;
                ComunicadoDetalle.selectEstimacion(est.id, est.entidad);
                // For nested/indented rows (Supervision), also toggle details automatically
                if (isIndented) {
                    ComunicadoDetalle.toggleInfo(est.id);
                }
            };

            if (state.ui.selectedEstimacionId === est.id) {
                tr.classList.add('table-active'); // Add active class if selected

            // Validation Logic for Inputs

            const isSaved = !String(est.id).startsWith('temp-');

            // Si hay facturas (isReadOnly = true), se bloquea CASI todo excepto quizás cosas no críticas.
            // Pero la regla usual es: Si tiene facturas, bloquear montos.

            const canEdit = isSaved && est.estatusInterno !== 'PAGADO' && est.estatusInterno !== 'CANCELADO';

            // Definir si está readonly basado en estatus O si isReadOnly (flag externo) es true

            // Clases
            const editableClass = (isLocked && isSaved) ? 'form-control-plaintext' : 'form-control-ghost';
            const readonlyAttr = (isLocked && isSaved) ? 'readonly' : '';

            // Función helper para atributos especificos (por si queremos ser granulares)
            const getAttr = (isRead) => isRead ? 'readonly' : '';
            // Si llamamos con isReadOnly=true, forzamos bloqueo. Si no, usamos logica de estatus.
            const forceRead = isReadOnly || (!String(est.id).startsWith('temp-') && est.estatusInterno !== 'PENDIENTE');

            const badgeResult = _getStatusBadge(est.estatusInterno);

            tr.innerHTML = `
                <td class="text-center text-muted">
                   ${isIndented
                    ? `<i class="bi bi-arrow-return-right text-primary me-1"></i>
                        <i class="bi bi-caret-right custom-caret cursor-pointer" onclick="ComunicadoDetalle.toggleInfo('${est.id}')" title="Ver Facturas"></i>`
                    : `<i class="bi bi-caret-right custom-caret cursor-pointer" onclick="ComunicadoDetalle.toggleInfo('${est.id}')" title="Ver Facturas"></i>`
                }
                </td>
                <td><span class="badge bg-primary bg-opacity-10 text-primary border border-primary border-opacity-25" style="font-size: 0.7rem;">${est.tipo}</span></td>
                <td class="fw-bold text-dark text-center">${est.numero}</td>
                <td>
                    <input type="date" class="${editableClass} p-1" style="font-size: 0.8rem;" value="${_formatDateISO(est.fechaCorte)}" ${readonlyAttr} 
                        onchange="ComunicadoDetalle.updateEstimacion('${est.id}', 'fechaCorte', this.value)">
                </td>
                <td>
                    <input type="text" class="${editableClass} text-end font-monospace currency-input text-muted" style="font-size: 0.8rem;" value="${_formatCurrency(est.montoAvanceFisico)}" ${readonlyAttr}
                        onchange="ComunicadoDetalle.updateEstimacion('${est.id}', 'montoAvanceFisico', this.value)" placeholder="$0.00">
                </td>
                <td>
                    <input type="text" class="${editableClass} text-end font-monospace currency-input fw-semibold" style="font-size: 0.8rem;" value="${_formatCurrency(est.monto)}" ${readonlyAttr}
                        onchange="ComunicadoDetalle.updateEstimacion('${est.id}', 'monto', this.value)" placeholder="$0.00">
                </td>
                <td>
                    <input type="text" class="${editableClass} text-end font-monospace currency-input text-danger" style="font-size: 0.8rem;" value="${_formatCurrency(est.amortizacion)}" ${readonlyAttr}
                        onchange="ComunicadoDetalle.updateEstimacion('${est.id}', 'amortizacion', this.value)" placeholder="$0.00">
                </td>
                <td class="text-end font-monospace" id="input-neto-${est.id}">${_formatCurrency((parseFloat(est.monto) || 0) - (parseFloat(est.amortizacion) || 0))}</td>
                <td class="text-end font-monospace" id="input-iva-${est.id}">${_formatCurrency(est.iva)}</td>
                <td class="text-end font-monospace fw-bold text-primary" id="input-total-${est.id}">${_formatCurrency(est.montoTotal)}</td>
                <td class="text-center">${badgeResult}</td>
                <td class="text-end">
                    <div class="d-flex justify-content-end gap-1">
                        <button class="btn-icon text-success" onclick="ComunicadoDetalle.saveEstimacion('${est.id}')" 
                            title="${est._modified || String(est.id).startsWith('temp-') ? 'Guardar Cambios' : 'Sin cambios'}"
                            ${est._modified || String(est.id).startsWith('temp-') ? '' : 'disabled style="opacity:0.3"'}>

        /**
         * Renderiza la tabla de facturas anidada dentro de una estimación.
         * Estructura: Estimación > Factura (Tipo 1) > Complemento (Tipo 2)
         */
        function _createNestedFacturasTable(est) {
            const container = document.createElement('div');
            container.className = 'ms-3 mt-2 mb-3 border-start border-3 border-secondary border-opacity-25 ps-2 pe-2';

            const isTemp = String(est.id).startsWith('temp-');
            const totalEst = parseFloat(est.montoTotal) || 0;

            const allRecords = (state.data.facturasEstimaciones || [])
                .filter(f => String(f.idEstimacion) === String(est.id));

            const facturasPadre = allRecords.filter(f => f.tipo == 1 || f.tipo === 'FACTURA');
            const complementosTotal = allRecords.filter(f => f.tipo == 2 || f.tipo === 'COMPLEMENTO');

            const totalFacturadoVigente = facturasPadre
                .filter(f => f.estatusSAT !== 'CANCELADO')
                .reduce((sum, f) => sum + (parseFloat(f.total) || 0), 0);

            const isLiquidada = totalEst > 0 && totalFacturadoVigente >= (totalEst - 1.00);

            // Header simple
            let htmlHeader = `
                <div class="d-flex align-items-center mb-2">
                    <span class="badge bg-light text-dark border me-2" style="font-size: 0.7rem;">FACTURACIÓN</span>
                    <hr class="flex-grow-1 my-0 border-secondary opacity-25">
                </div>
            `;

            if (facturasPadre.length > 0) {
                const table = document.createElement('table');
                table.className = 'table table-sm table-hover mb-0';
                table.style.fontSize = '0.8rem';

                table.innerHTML = `
                    <thead class="text-secondary bg-light bg-opacity-50" style="font-size: 0.7rem;">
                        <tr>
                            <th style="width: 30px;" class="text-center"></th>
                            <th style="width: 200px;">Folio</th>
                            <th style="width: 100px;">Fecha</th>
                            <th class="text-end" style="width: 140px;">Monto</th>
                            <th class="text-end" style="width: 140px;">IVA</th>
                            <th class="text-end" style="width: 140px;">Total</th>
                            <th class="text-center" style="width: 90px;">Estatus</th>
                            <th class="text-end" style="width: 80px;">Acciones</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                `;
                const tbody = table.querySelector('tbody');

                facturasPadre.forEach(f => {
                    // Hijos directos
                    const misComplementos = complementosTotal
                        .filter(c => String(c.idFacturaRelacionada) === String(f.id))
                        .sort((a, b) => parseInt(a.id) - parseInt(b.id)); // Ordenar por ID para saber cual es el ultimo

                    const tieneHijos = misComplementos.length > 0;

                    // 1. RENDERIZAR FACTURA (PADRE)
                    // Lógica bloqueo: Si tiene hijos (complementos), se bloquean importes.
                    tbody.appendChild(_createFacturaRow(f, misComplementos, false, tieneHijos));

                    // 2. RENDERIZAR COMPLEMENTOS (HIJOS)
                    misComplementos.forEach((comp, index) => {
                        // Lógica bloqueo: Solo el ÚLTIMO complemento es editable
                        const isLast = index === misComplementos.length - 1;

                        const trHijo = _createFacturaRow(comp, [], true, false, isLast);
                        trHijo.classList.add(`child-row-${f.id}`);
                        trHijo.style.display = 'none';
                        tbody.appendChild(trHijo);
                    });

                    // 3. BOTÓN "AGREGAR COMPLEMENTO" (Dentro del acordeón, al final de la lista)
                    if (f.estatusSAT !== 'CANCELADO' && !String(f.id).startsWith('temp-')) {
                        const pagado = misComplementos
                            .filter(c => c.estatusSAT !== 'CANCELADO')
                            .reduce((sum, c) => sum + (parseFloat(c.total) || 0), 0);
                        const saldo = (parseFloat(f.total) || 0) - pagado;

                        if (saldo > 0.01) {
                            const trBtn = document.createElement('tr');
                            trBtn.className = `child-row-${f.id}`; // Se oculta/muestra con el padre
                            trBtn.style.display = 'none';
                            trBtn.innerHTML = `
                                <td colspan="8" class="p-0 border-0">
                                    <button class="btn btn-sm btn-link w-100 text-decoration-none text-info py-2 bg-light border-bottom border-light" 
                                        onclick="ComunicadoDetalle.registrarComplemento('${f.id}')"
                                        style="font-size: 0.75rem; border-radius: 0;">
                                        <i class="bi bi-plus-lg me-1"></i>Agregar Complemento de Pago (Saldo: $${_formatCurrency(saldo)})
                                    </button>
                                </td>
                             `;
                            tbody.appendChild(trBtn);
                        }
                    }
                });

                const cardTable = document.createElement('div');
                cardTable.className = 'card border-0 shadow-sm';
                cardTable.appendChild(table);

                const wrapper = document.createElement('div');
                wrapper.innerHTML = htmlHeader;
                wrapper.appendChild(cardTable);

                container.innerHTML = '';
                container.appendChild(wrapper);

            } else {
                container.innerHTML = htmlHeader + `<div class="text-muted small fst-italic ps-2 py-2">Sin facturas registradas.</div>`;
            }

            // BOTÓN "REGISTRAR FACTURA" ESTÉTICO Y FULL-WIDTH
            if (!isLiquidada && !isTemp) {
                const btnContainer = document.createElement('div');
                btnContainer.className = 'mt-3';
                btnContainer.innerHTML = `
                    <button class="btn btn-outline-secondary w-100 py-2 border-dashed d-flex align-items-center justify-content-center gap-2" 
                        onclick="ComunicadoDetalle.addFactura('${est.id}')"
                        style="border-style: dashed !important;">
                        <i class="bi bi-receipt me-1"></i>
                        <span class="fw-bold small">REGISTRAR FACTURA</span>
                    </button>
                `;
                container.appendChild(btnContainer);
            }
            return container;
        }

        /**
         * @param {Object} f - Objeto Factura o Complemento
         * @param {Array} hijosContext - Lista de hijos (para facturas)
         * @param {Boolean} isComplemento - Si es tipo Complemento
         * @param {Boolean} hasChildren - Si tiene hijos (para mostrar acordeón)
         * @param {Boolean} isLastComplemento - Si es el último complemento (para permitir edición)
         */
        function _createFacturaRow(f, hijosContext = [], isComplemento = false, hasChildren = false, isLastComplemento = false) {
            const tr = document.createElement('tr');
            const isTemp = String(f.id).startsWith('temp-');

            // --- ESTILOS VISUALES MEJORADOS ---
            // Distribuir mejor: Complemento debe verse indentado pero alineado en columnas
            tr.className = isComplemento ? 'table-light' : ''; // Background suave

            let iconHtml = '';
            let paddingLeft = isComplemento ? '35px' : '5px';

            if (isComplemento) {
                // Icono flecha "enter" para indicar anidación
                iconHtml = `<i class="bi bi-arrow-return-right text-info fs-6"></i>`;
            } else {
                if (!isTemp && f.estatusSAT !== 'CANCELADO') {
                    // Botón toggle más limpio
                    iconHtml = `
                        <a href="javascript:void(0)" class="text-decoration-none text-primary toggle-btn d-inline-block transition-transform" 
                           onclick="toggleChildRows('${f.id}', this)" style="transition: transform 0.2s;">
                           <i class="bi bi-${hasChildren ? 'plus-square-fill' : 'plus-square'} fs-6"></i>
                        </a>`;
                } else {
                    iconHtml = `<i class="bi bi-file-earmark-text text-muted opacity-50"></i>`;
                }
            }

            // --- LÓGICA DE EDICIÓN (READONLY) ---
            // Regla 1: Factura (Importes) -> Solo editable si NO tiene complementos.
            // Regla 2: Complemento -> Solo editable si ES el último.

            let isReadOnlyAmount = false;
            let isReadOnlyData = false; // Para folio/fecha

                    // Si NO es el último complemento, todo bloqueado
                    if (!isLastComplemento) {
                        isReadOnlyAmount = true;
                        isReadOnlyData = true;
                    }
                } else {
                    // Es Factura. Si TIENE complementos (hijos), importes bloqueados.
                    if (hasChildren) {
                        isReadOnlyAmount = true;
                        // Folio y Fecha suelen poder editarse (corregir error de dedo) aunque tenga pagos, 
                        // pero si quieres estricto: isReadOnlyData = true;
                    }
                }
            }

            const classBase = 'form-control-plaintext form-control-sm px-1 shadow-none';
            const classEdit = 'form-control form-control-sm border-bottom border-0 rounded-0 bg-transparent px-1 shadow-none';

            // Función helper para clases
            const getCls = (isRead) => isRead ? classBase : classEdit;
            const getAttr = (isRead) => isRead ? 'readonly' : '';

            tr.innerHTML = `
                <td class="text-center align-middle">
                    ${iconHtml}
                </td>
                <td class="align-middle">
                    <div class="d-flex align-items-center" style="padding-left: ${isComplemento ? '25px' : '0'};">
                        <input type="text" class="${getCls(isReadOnlyData)} fw-bold ${isComplemento ? 'text-secondary font-italic' : 'text-dark'}" 
                            value="${f.folioFactura || ''}" 
                            onchange="ComunicadoDetalle.updateFactura('${f.id}', 'folioFactura', this.value)" 
                            placeholder="Folio" ${getAttr(isReadOnlyData)}>
                    </div>
                </td>
                <td class="align-middle">
                    <input type="date" class="${getCls(isReadOnlyData)} text-muted small" value="${_formatDateISO(f.fecha)}" 
                        onchange="ComunicadoDetalle.updateFactura('${f.id}', 'fecha', this.value)" ${getAttr(isReadOnlyData)}>
                </td>
                <td class="align-middle">
                    <input type="text" class="${getCls(isReadOnlyAmount)} text-end currency-input font-monospace text-dark" 
                        value="${_formatCurrency(f.monto)}" 
                        onchange="ComunicadoDetalle.updateFactura('${f.id}', 'monto', this.value)" ${getAttr(isReadOnlyAmount)}>
                </td>
                <td class="align-middle">
                    <input type="text" class="form-control-plaintext form-control-sm px-1 text-end font-monospace text-dark" 
                        value="${_formatCurrency(f.iva)}" readonly>
                </td>
                <td class="align-middle">
                     <input type="text" class="form-control-plaintext form-control-sm px-1 text-end font-monospace text-dark" 
                        value="${_formatCurrency(f.total)}" readonly>
                </td>
                <td class="text-center align-middle">
                    <span class="badge ${f.estatusSAT === 'CANCELADO' ? 'bg-danger' : (f.estatusSAT === 'PAGADO' ? 'bg-success' : 'bg-secondary')} bg-opacity-75 rounded-pill" 
                          style="font-size:0.65em; padding: 4px 8px;">
                        ${f.estatusSAT || 'VIGENTE'}
                    </span>
                </td>
                <td class="text-end align-middle">
                     <div class="d-flex justify-content-end align-items-center">
                        <button class="btn btn-sm btn-link text-muted p-0 me-2 opacity-50 hover-opacity-100" 
                                onclick="ComunicadoDetalle.openBitacoraModal('${f.id}')">
                            <i class="bi bi-chat-left-text"></i>
                        </button>
                        ${isTemp ? `
                            <button class="btn-icon text-success small me-1" onclick="ComunicadoDetalle.saveFactura('${f.id}')"><i class="bi bi-check-lg"></i></button>
                            <button class="btn-icon text-danger small" onclick="ComunicadoDetalle.removeFactura('${f.id}')"><i class="bi bi-x"></i></button>
                        ` : `
                            <button class="btn btn-sm btn-link text-danger p-0 ms-2 opacity-50 hover-opacity-100" 
                                    onclick="ComunicadoDetalle.cancelFactura('${f.id}')" title="Cancelar">
                                <i class="bi bi-slash-circle"></i>
                            </button>
                        `}
                    </div>
                </td>
            `;
            return tr;
        }

        function addFactura(idEstimacion) {
            // Find estimation to ensure it exists and valid
            const est = (state.data.estimaciones || []).find(e => String(e.id) === String(idEstimacion));
            if (!est) return;
            // Prevent adding to temp/unsaved estimation (should be hidden by UI anyway)
            if (String(est.id).startsWith('temp-')) {
                _showAlert('Estimación no guardada', 'Guarda la estimación antes de agregar facturas.', 'warning');
                return;
            }

            // Create new temp invoice
            const newFactura = {
                id: 'temp-' + Date.now(),
                idEstimacion: est.id,
                folioFactura: '',
                fecha: new Date().toISOString().split('T')[0],
                monto: 0,
                iva: 0,
                total: 0,
                estatusSAT: 'VIGENTE',
                tipo: 'FACTURA', // Default type
                _modified: true, // Mark as modified for save button
                _isNew: true
            };

            if (!state.data.facturasEstimaciones) state.data.facturasEstimaciones = [];
            state.data.facturasEstimaciones.push(newFactura);

            // Re-render
            _renderFinanciero();

            // Auto focus logic (optional)
        }

        function updateFactura(id, field, val) {
            const item = (state.data.facturasEstimaciones || []).find(f => String(f.id) === String(id));
            if (!item) return;

            if (field === 'monto') {
                const monto = parseFloat(val.replace(/[^0-9.-]+/g, '')) || 0;
                item.monto = monto;
                item.iva = monto * IVA_RATE;
                item.total = monto + item.iva;
            } else {
                item[field] = val;
            }
            item._modified = true;
            _renderFinanciero();
        }

        async function saveFactura(id) {
            const item = (state.data.facturasEstimaciones || []).find(f => String(f.id) === String(id));
            if (!item) return;

            // Validation
            if (!item.folioFactura || !item.folioFactura.trim()) {
                _showAlert('Dato Faltante', 'El Folio Fiscal es obligatorio.', 'warning');
                return;
            }
            if (!item.fecha) {
                _showAlert('Dato Faltante', 'La Fecha es obligatoria.', 'warning');
                return;
            }

            // Prepare Payload
            // If new (temp-), create. If existing, update.
            const isTemp = String(item.id).startsWith('temp-');
            const method = isTemp ? 'crearFactura' : 'actualizarFactura';
            const payload = { ...item };

            // Clean payload for server
            delete payload._modified;
            delete payload._isNew;
            if (isTemp) delete payload.id; // Server assigns ID

            try {
                const btn = event ? event.target.closest('button') : null; // Hacky access to button
                if (btn) btn.disabled = true;

                const response = await serverCall(method, isTemp ? payload : item.id, isTemp ? null : payload); // Signature varies?
                // Wrapper usually handles (method, id, payload) or (method, payload).
                // Let's assume standard wrapper signature:
                // If create: serverCall('crearFactura', payload)
                // If update: serverCall('actualizarFactura', id, payload)

                let result;
                if (isTemp) {
                    result = await serverCall('registrarFactura', payload); // Assuming 'registrarFactura' is the name for create
                } else {
                    result = await serverCall('actualizarFactura', item.id, payload);
                }

                if (result && (result.success || result.id)) {
                    // Update local state with real ID if created
                    if (isTemp && (result.id || result.data?.id)) {
                        item.id = result.id || result.data.id;
                    }
                    delete item._modified;
                    delete item._isNew;
                    globalThis.showToast?.('Factura guardada', 'success');
                    _renderFinanciero();

                    // Reload data to be safe?
                    // await _loadData(); 
                } else {
                    throw new Error(result?.message || 'Error al guardar');
                }
            } catch (e) {
                console.error(e);
                _showAlert('Error', 'No se pudo guardar la factura: ' + e.message, 'error');
            } finally {
                _renderFinanciero(); // Restore button state via re-render
            }
        }

        async function removeFactura(id) {
            if (!confirm('¿Eliminar esta factura?')) return;

            // If temp, just remove from array
            if (String(id).startsWith('temp-')) {
                state.data.facturasEstimaciones = state.data.facturasEstimaciones.filter(f => String(f.id) !== String(id));
                _renderFinanciero();
                return;
            }

            // If server, call delete
            try {
                await serverCall('eliminarFactura', id);
                state.data.facturasEstimaciones = state.data.facturasEstimaciones.filter(f => String(f.id) !== String(id));
                _renderFinanciero();
                globalThis.showToast?.('Factura eliminada', 'success');
            } catch (e) {
                console.error(e);
                _showAlert('Error', 'No se pudo eliminar: ' + e.message, 'error');
            }
        }

        function _setupCombobox(input, dropdown, items, keyProp, onSelect, alertElement = null, onInputHandler = null) {
            if (!input || !dropdown) return;
            const safeItems = Array.isArray(items) ? items : [];

            // Referencia a instancia bootstrap

            let dropdownInstance = null;

            const getDropdownInstance = () => {
                if (dropdownInstance) return dropdownInstance;
                if (window.bootstrap && window.bootstrap.Dropdown) {
                    try {
                        dropdownInstance = bootstrap.Dropdown.getInstance(input) || new bootstrap.Dropdown(input, { autoClose: 'outside' });
                    } catch (e) { console.warn('Bootstrap error:', e); }
                }
                return dropdownInstance;
            };

            const renderList = (filter = '') => {
                dropdown.innerHTML = '';
                const term = (filter || '').toLowerCase();
                const filtered = term
                    ? safeItems.filter(i => {
                        const val = i[keyProp] || i.nombre || '';
                        return String(val).toLowerCase().includes(term);
                    })
                    : safeItems;

                const displayItems = filtered.slice(0, 50);

                if (displayItems.length === 0) {
                    dropdown.innerHTML = '<li class="dropdown-item text-muted disabled">Sin resultados</li>';
                } else {
                    displayItems.forEach(item => {
                        const li = document.createElement('li');
                        const a = document.createElement('a');
                        a.className = 'dropdown-item';
                        a.href = '#';
                        a.textContent = item[keyProp] || item.nombre || 'Sin Nombre';
                        a.onclick = (e) => {
                            e.preventDefault();
                            onSelect(item);
                            const instance = getDropdownInstance();
                            if (instance) instance.hide();
                            else dropdown.classList.remove('show');

                            // Ocultar alerta al seleccionar existente
                            if (alertElement) alertElement.classList.add('d-none');
                        };
                        li.appendChild(a);
                        dropdown.appendChild(li);
                    });
                }
            };

            const showDropdown = () => {
                renderList(input.value);
                const instance = getDropdownInstance();
                if (instance) {
                    instance.show();
                } else {
                    // Fallback sin bootstrap
                    dropdown.classList.add('show');
                    dropdown.style.display = 'block';
                }
            };

            input.addEventListener('input', () => {
                // Force Uppercase
                _forceUppercase(input);

                const instance = getDropdownInstance();
                if (instance) instance.show();
                else { dropdown.classList.add('show'); dropdown.style.display = 'block'; }

                renderList(input.value);

                const val = input.value.trim().toLowerCase();
                let exactMatchItem = null;
                if (val) {
                    exactMatchItem = safeItems.find(i => String(i[keyProp] || i.nombre || '').toLowerCase() === val);
                }

                if (alertElement) {
                    if (!val) {
                        alertElement.classList.add('d-none');
                    } else {
                        alertElement.classList.toggle('d-none', !!exactMatchItem);
                    }
                }

                if (onInputHandler) {
                    onInputHandler(input.value, exactMatchItem);
                }
            });

            input.addEventListener('focus', showDropdown);
            input.addEventListener('click', showDropdown);

            input.addEventListener('blur', () => {
                setTimeout(() => {
                    const instance = getDropdownInstance();
                    if (instance) instance.hide();
                    else { dropdown.classList.remove('show'); dropdown.style.display = 'none'; }
                }, 200);
            });
        }

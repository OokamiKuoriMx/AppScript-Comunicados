        async function _openModalVinculacion() {
            // 1. Obtener estimaciones de contratista disponibles (que no esten canceladas)
            // Opcional: Filtrar las que ya estan vinculadas? El usuario no especifico 1:1 estricto, pero asumiremos que pueden reutilizarse o no.
            // Para "Agregar nueva linea indentada", sugiere que seleccionas una contratista y le creas una supervision.

            const estimacionesContratista = (state.data.estimaciones || [])
                .filter(e => (e.entidad || 'CONSTRUCTORA') === 'CONSTRUCTORA' && e.estatusInterno !== 'CANCELADO')
                .sort((a, b) => {
                    // Ordenar mas recientes primero
                    const mapType = { 'ANTICIPO': 1, 'ESTIMACION': 2, 'FINIQUITO': 3 };
                    return (mapType[a.tipo] || 99) - (mapType[b.tipo] || 99) || (parseInt(a.numero) - parseInt(b.numero));
                });

            const container = document.getElementById('lista-vinculacion-estimaciones');
            const btnConfirm = document.getElementById('btn-confirmar-vinculacion');

            container.innerHTML = '';
            btnConfirm.disabled = true;
            btnConfirm.onclick = () => _confirmarVinculacion();

            if (estimacionesContratista.length === 0) {
                container.innerHTML = `<div class="p-3 text-center text-muted">No hay estimaciones de contratista disponibles.</div>`;
                return;
            }

            estimacionesContratista.forEach(est => {
                const item = document.createElement('label');
                item.className = 'list-group-item list-group-item-action d-flex gap-3 align-items-center cursor-pointer';
                item.style.borderLeft = '4px solid transparent';

                // Logic visual selected
                item.onclick = () => {
                    document.querySelectorAll('#lista-vinculacion-estimaciones .list-group-item').forEach(el => {
                        el.classList.remove('active', 'border-primary');
                        el.style.borderLeftColor = 'transparent';
                    });
                    item.classList.add('active', 'border-primary');
                    item.style.borderLeftColor = '#0d6efd';
                    btnConfirm.disabled = false;
                    btnConfirm.dataset.id = est.id;
                };

                const neto = (parseFloat(est.monto) || 0) - (parseFloat(est.amortizacion) || 0);

                item.innerHTML = `
                    <input class="form-check-input flex-shrink-0" type="radio" name="radioVinculacion" value="${est.id}" style="display:none;">
                    <div class="d-flex w-100 justify-content-between align-items-center">
                        <div>
                            <div class="mb-1 d-flex align-items-center gap-2">
                                <span class="badge bg-light text-dark border">${({ '1': 'ANTICIPO', '2': 'ESTIMACION', '3': 'FINIQUITO' }[String(est.tipo)] || est.tipo)} ${est.numero}</span>
                                <small class="text-muted">${_formatDateISO(est.fechaCorte)}</small>
                            </div>
                            <small class="text-muted d-block">Monto Neto: <span class="fw-bold text-dark">${_formatCurrency(neto)}</span></small>
                        </div>
                        <i class="bi bi-chevron-right text-muted"></i>
                    </div>
                `;
                container.appendChild(item);
            });

            const modal = new bootstrap.Modal(document.getElementById('modalVincularEstimacion'));
            modal.show();
        }

        function _openModalCreacionSupervision(idParent, typeParent, numParent) {
            const btn = document.getElementById('btn-confirmar-vinculacion');
            btn.dataset.id = idParent;

            // Setup Modal UI for distinct feel or just reuse
            // For "Agregar" logic, we really just need to set the parent ID and confirm creation.
            // But the user asked for a modal to choose "Anticipo / Estimacion / Finiquito".

            // We can reuse the "Vincular" modal structure OR create a simpler one.
            // The user said: "Se abre un modal para elegir tipo: Anticipo / Estimacion / Finiquito".
            // Currently _openModalVinculacion lists *existing* contractor estimates.

            // This needs a NEW modal or a repurposed one?
            // "Al dar click... Se abre un modal para elegir tipo... En ese momento se inserta".

            // Let's invoke a Swal with inputs or use a custom modal.
            // For consistency with "new" features, Swal is easier if we don't have a template.
            // Or we can repurpose the existing "modalVincularEstimacion" if we modify it?? No, that is for selecting a *contractor* estimate.

            // We'll use Swal for the Type Selection as it's cleaner than injecting a whole new modal HTML if none exists.
            // Or better: Use the "Agregar Estimacion" logic but force the Type.

            // BUT wait, "registrarEstimacion" uses defaults.
            // We should ask the user for the Type.

            Swal.fire({
                title: `Nueva Estimación de Supervisión`,
                html: `
                    <p class="text-muted small">Vinculada a Contratista: <b>${typeParent} ${numParent}</b></p>
                    <div class="d-grid gap-2 mt-3">
                         <button class="btn btn-outline-primary" onclick="Swal.clickConfirm(); globalThis._tempType='ANTICIPO'">ANTICIPO</button>
                         <button class="btn btn-outline-primary" onclick="Swal.clickConfirm(); globalThis._tempType='ESTIMACION'">ESTIMACIÓN</button>
                         <button class="btn btn-outline-primary" onclick="Swal.clickConfirm(); globalThis._tempType='FINIQUITO'">FINIQUITO</button>
                    </div>
                 `,
                showConfirmButton: false,
                showCancelButton: true,
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed && globalThis._tempType) {
                    // Call register with explicit type if supported, OR register then update.
                    // registrarEstimacion(idComunicado, entidad, idRelacionada) -> creates "ESTIMACION" by default.
                    // IMPORTANT: The current registrarEstimacion sets 'tipo' = 'ESTIMACION'.
                    // We need to update it immediately or allow passing type.
                    // Backend signature: registrarEstimacion(idComunicado, entidad, idRelacionada)
                    // It does NOT take type.

                    // Workaround: Create then Update.
                    _createSupervisionWithType(idParent, globalThis._tempType);
                }
            });
        }

        async function _createSupervisionWithType(idRelacionada, tipo) {
            _setGlobalLoader(true, 'Creando nueva estimación...');
            try {
                // 1. Create default
                const result = await serverCall('registrarEstimacion', state.id, 'SUPERVISION', idRelacionada);
                if (result) {
                    // 2. Update Type if different from default
                    // Default is ESTIMACION. If user chose ANTICIPO or FINIQUITO, update.
                    if (tipo !== 'ESTIMACION') {
                        const updatePayload = { tipo: tipo };

                        // --- NUEVO: CALCULO AMORTIZACION FINIQUITO ---
                        // "Amortización del finiquito debe ser del monto neto del anticipo menos la suma de todas las amortizaciones"
                        if (tipo === 'FINIQUITO' || tipo === 3) {
                            const supervisionEsts = (state.data.estimaciones || [])
                                .filter(e => (e.entidad || 'CONSTRUCTORA') === 'SUPERVISION' && e.estatusInterno !== 'CANCELADO');

                            const totalAnticipo = supervisionEsts
                                .filter(e => String(e.tipo) === 'ANTICIPO' || String(e.tipo) === '1')
                                .reduce((sum, e) => sum + (parseFloat(e.monto) || 0), 0);

                            const totalAmortizado = supervisionEsts
                                .filter(e => String(e.tipo) === 'ESTIMACION' || String(e.tipo) === '2')
                                .reduce((sum, e) => sum + (parseFloat(e.amortizacion) || 0), 0);

                            // Amortización Faltante
                            const amortizacionFaltante = Math.max(0, totalAnticipo - totalAmortizado);

                            if (amortizacionFaltante > 0) {
                                updatePayload.amortizacion = parseFloat(amortizacionFaltante.toFixed(2));
                                console.log(`[Finiquito Supervisión] Amortización calculada: ${totalAnticipo} (Anticipos) - ${totalAmortizado} (Amortizado) = ${updatePayload.amortizacion}`);
                            }
                        }
                        // ----------------------------------------------

                        // For now just update type and potentially amortization.
                        await serverCall('actualizarRegistro', 'estimaciones', result.id, updatePayload);
                    }

                    await _loadData();
                    globalThis.showToast?.('Estimación de supervisión creada correctamente', 'success');
                } else {
                    throw new Error('La respuesta del servidor fue vacía.');
                }
            } catch (e) {
                console.error(e);
                Swal.fire('Error', 'No se pudo crear: ' + e.message, 'error');
            } finally {
                _setGlobalLoader(false);
            }
        }

        async function _confirmarVinculacion() {
            const btn = document.getElementById('btn-confirmar-vinculacion');
            const idRelacionada = btn.dataset.id;
            if (!idRelacionada) return;

            // Cerrar modal
            const modalEl = document.getElementById('modalVincularEstimacion');
            const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
            modal.hide();

            // Crear Estimacion de Supervision vinculada
            // Reutilizamos _addEstimacionLogic
            await _addEstimacion('SUPERVISION', idRelacionada);
        }

        function _createEstimacionRow(est, hasDeps = false, isIndented = false, isSupervision = false) {
            const tr = document.createElement('tr');
            tr.id = `row-${est.id}`;
            const isReadOnly = hasDeps;

            // Hoisted Logic: LIFO Sequence for Edit/Delete Rules
            const activeEsts = (state.data.estimaciones || [])
                .filter(e => e.estatusInterno !== 'CANCELADO' && (e.entidad || 'CONSTRUCTORA') === (est.entidad || 'CONSTRUCTORA'))
                .sort((a, b) => {
                    const typeScore = (t) => t === 'ANTICIPO' ? 1 : (t === 'FINIQUITO' ? 3 : 2);
                    let scoreA = typeScore(a.tipo || 'ESTIMACION');
                    let scoreB = typeScore(b.tipo || 'ESTIMACION');
                    if (scoreA !== scoreB) return scoreA - scoreB;
                    // Sort by Number (Int) if available, else Date
                    const numA = parseInt(a.numero) || 0;
                    const numB = parseInt(b.numero) || 0;
                    if (numA !== numB) return numA - numB;
                    return new Date(a.fechaCorte) - new Date(b.fechaCorte);
                });
            const isLast = activeEsts.length > 0 && activeEsts[activeEsts.length - 1].id === est.id;

            if (est._isNew) tr.classList.add('table-warning');

            // Allow clicking row to select (Master-Detail), excluding interactive elements
            tr.style.cursor = 'pointer';
            tr.onclick = (e) => {
                if (['BUTTON', 'A', 'I'].includes(e.target.tagName) || e.target.closest('button')) return;
                ComunicadoDetalle.selectEstimacion(est.id, est.entidad);
                if (isIndented) {
                    ComunicadoDetalle.toggleInfo(est.id);
                }
            };

            if (state.ui.selectedEstimacionId === est.id) {
                tr.classList.add('table-active');
            }

            const badgeResult = _getStatusBadge(est.estatusInterno);
            const isoDate = _formatDateISO(est.fechaCorte);

            // Logic for Supervision Payment Display
            let displayAvance = _formatCurrency(est.montoAvanceFisico);
            let titleAvance = '';
            let styleAvance = 'color: #6f42c1;';

            if (isSupervision) {
                const pagadoCalc = (state.data.facturasEstimaciones || [])
                    .filter(f => String(f.idEstimacion) === String(est.id) &&
                        (f.tipo == 2 || String(f.tipo).toUpperCase() === 'COMPLEMENTO') &&
                        f.estatusSAT !== 'CANCELADO')
                    .reduce((sum, c) => sum + (parseFloat(c.total) || 0), 0);
                displayAvance = _formatCurrency(pagadoCalc);
                styleAvance = 'color: #198754; font-weight: bold;'; // Green for Paid
                titleAvance = 'Pagado (Calculado)';
            } else if (String(est.tipo) === 'ANTICIPO' || String(est.tipo) === '1') {
                displayAvance = '-';
                styleAvance = 'color: #adb5bd;';
            }

            tr.innerHTML = `
                <td class="text-center text-muted">
                   ${(() => {
                    const isExpanded = state.ui.expandedEstimations && state.ui.expandedEstimations.has(String(est.id));
                    const caretClass = isExpanded ? 'expanded' : '';
                    const caretHtml = `<i id="icon-caret-${est.id}" class="bi bi-caret-right custom-caret cursor-pointer ${caretClass}" onclick="ComunicadoDetalle.toggleInfo('${est.id}')" title="Ver Facturas"></i>`;

                    return isIndented
                        ? `<i class="bi bi-arrow-return-right text-primary me-1"></i>${caretHtml}`
                        : caretHtml;
                })()}
                </td>
                <td><span class="badge bg-primary bg-opacity-10 text-primary border border-primary border-opacity-25" style="font-size: 0.7rem;">${({ 1: 'ANTICIPO', 2: 'ESTIMACION', 3: 'FINIQUITO' }[est.tipo] || est.tipo)}</span></td>
                <td class="fw-bold text-dark text-center">${est.numero}</td>
                <td class="text-center small">${isoDate}</td>
                <td class="text-end font-monospace small" style="${styleAvance}" title="${titleAvance}">
                    ${displayAvance}
                </td>
                <td class="text-end font-monospace small text-dark fw-semibold">
                    ${_formatCurrency(est.monto)}
                </td>
                <td class="text-end font-monospace small text-muted">
                    ${_formatCurrency(est.amortizacion || 0)}
                </td>
                <td class="text-end font-monospace small text-danger">
                    ${_formatCurrency(est.descuentos || 0)}
                </td>
                <td class="text-end font-monospace small">${_formatCurrency((parseFloat(est.monto) || 0) - (parseFloat(est.amortizacion) || 0) - (parseFloat(est.descuentos) || 0))}</td>
                <td class="text-end font-monospace small">${_formatCurrency(est.iva)}</td>
                <td class="text-end font-monospace fw-bold text-dark small">${_formatCurrency(est.montoTotal)}</td>
                <td class="text-center">${badgeResult}</td>
                <td class="text-end">
                    <div class="d-flex justify-content-end gap-1">
                        <!-- EDIT BUTTON (MODAL) -->
                        ${(() => {
                    const isPaid = est.estatusInterno === 'PAGADO';
                    const isCancelled = est.estatusInterno === 'CANCELADO';
                    let canEdit = !isPaid && !isCancelled;

                    // Safety Check: If ID is object (buggy state), disable edit to prevent recursion
                    if (typeof est.id === 'object') canEdit = false;

                    return `
                                <button class="btn-icon text-primary" onclick="${canEdit ? `ComunicadoDetalle._openModalEstimacion('${est.id}')` : ''}" 
                                    title="${canEdit ? 'Editar Movimiento' : 'No editable (Pagado/Cancelado)'}"
                                    ${canEdit ? '' : 'disabled style="opacity:0.3"'}>
                                    <i class="bi bi-pencil-square"></i>
                                </button>
                             `;
                })()}
                        
                        <!-- DELETE BUTTON -->
                        ${(() => {
                    let isAmortized = false;
                    if (est.tipo === 'ANTICIPO') {
                        isAmortized = activeEsts.some(e => (parseFloat(e.amortizacion) || 0) > 0);
                    }

                    const hasDeps = (state.data.facturasEstimaciones || [])
                        .some(f => String(f.idEstimacion) === String(est.id) && f.estatusSAT !== 'CANCELADO');
                    const isPaid = est.estatusInterno === 'PAGADO';
                    const isLinked = (state.data.estimaciones || [])
                        .some(e => String(e.idRelacionada) === String(est.id) && e.estatusInterno !== 'CANCELADO');

                    const isPendiente = est.estatusInterno === 'PENDIENTE';
                    const ignoreLifo = isSupervision && isPendiente;

                    const canDelete = (isLast || ignoreLifo) && !hasDeps && !isPaid && !isLinked && !isAmortized;

                    let reason = 'Eliminar';
                    if (isPaid) reason = 'Estimación PAGADA';
                    else if (hasDeps) reason = 'Tiene facturas asociadas';
                    else if (isLinked) reason = 'Vinculada a Supervisión';
                    else if (!isLast && !ignoreLifo) reason = 'No es el último movimiento (LIFO)';
                    else if (isAmortized) reason = 'Anticipo ya amortizado';

                    return `
                                <button class="btn-icon text-danger" onclick="${canDelete ? `ComunicadoDetalle.removeEstimacion('${est.id}')` : ''}"
                                    title="${reason}" ${canDelete ? '' : 'disabled style="opacity:0.3; cursor:not-allowed;"'}>
                                    <i class="bi bi-trash"></i>
                                </button>
                            `;
                })()}
                    </div>
                </td>
    `;
            return tr;
        }

        /**
         * Renderiza la tabla de facturas anidada dentro de una estimación.
         * Estructura: Estimación > Factura (Tipo 1) > Complemento (Tipo 2)
         */
        function _createNestedFacturasTable(est) {
            const container = document.createElement('div');
            container.className = 'ms-3 mt-2 mb-3 border-start border-3 border-secondary border-opacity-25 ps-2 pe-2';

            const isTemp = String(est.id).startsWith('temp-');
            const totalEst = parseFloat(est.montoTotal) || 0;

            const allRecords = (state.data.facturasEstimaciones || [])
                .filter(f => String(f.idEstimacion) === String(est.id));

            const facturasPadre = allRecords.filter(f => f.tipo == 1 || f.tipo === 'FACTURA');
            const complementosTotal = allRecords.filter(f => f.tipo == 2 || f.tipo === 'COMPLEMENTO');

            const totalFacturadoVigente = facturasPadre
                .filter(f => f.estatusSAT !== 'CANCELADO')
                .reduce((sum, f) => sum + (parseFloat(f.total) || 0), 0);

            const isLiquidada = totalEst > 0 && totalFacturadoVigente >= (totalEst - 1.00);

            // Header simple
            let htmlHeader = `
        <div class="d-flex align-items-center mb-2">
                    <span class="badge bg-light text-dark border me-2" style="font-size: 0.7rem;">FACTURACIÓN</span>
                    <hr class="flex-grow-1 my-0 border-secondary opacity-25">
                </div>
    `;

            if (facturasPadre.length > 0) {
                const table = document.createElement('table');
                table.className = 'table table-sm table-hover mb-0';
                table.style.fontSize = '0.8rem';

                table.innerHTML = `
                    <thead class="text-secondary bg-light bg-opacity-50 text-uppercase text-center" style="font-size: 0.7rem;">
                        <tr>
                            <th style="width: 30px;"></th>
                            <th style="width: 150px;">Folio</th>
                            <th style="width: 100px;">Fecha</th>
                            <th class="text-end" style="width: 130px;">Monto</th>
                            <th class="text-end" style="width: 130px;">IVA</th>
                            <th class="text-end" style="width: 130px;">Total</th>
                            <th class="text-center" style="width: 120px;">Estatus</th>
                            <th class="text-center" style="width: 90px;">Acciones</th>
                        </tr>
                    </thead >
        <tbody></tbody>
    `;
                const tbody = table.querySelector('tbody');

                facturasPadre.forEach(f => {
                    // Hijos directos
                    const misComplementos = complementosTotal
                        .filter(c => String(c.idFacturaRelacionada) === String(f.id))
                        .sort((a, b) => parseInt(a.id) - parseInt(b.id)); // Ordenar por ID para saber cual es el ultimo

                    const tieneHijos = misComplementos.length > 0;

                    // 1. RENDERIZAR FACTURA (PADRE)
                    // Lógica bloqueo: Si tiene hijos (complementos), se bloquean importes.
                    tbody.appendChild(_createFacturaRow(f, misComplementos, false, tieneHijos));

                    // 2. RENDERIZAR COMPLEMENTOS (HIJOS)
                    misComplementos.forEach((comp, index) => {
                        // Lógica bloqueo: Solo el ÚLTIMO complemento es editable
                        const isLast = index === misComplementos.length - 1;

                        const trHijo = _createFacturaRow(comp, [], true, false, isLast);
                        trHijo.classList.add(`child-row-${f.id}`);

                        // Check expansion state
                        if (!state.ui.expandedFacturas) state.ui.expandedFacturas = new Set();
                        if (!state.ui.expandedFacturas.has(String(f.id))) {
                            trHijo.style.display = 'none';
                        }

                        tbody.appendChild(trHijo);
                    });

                    // 3. BOTÓN "AGREGAR COMPLEMENTO" (Dentro del acordeón, al final de la lista)
                    if (f.estatusSAT !== 'CANCELADO' && !String(f.id).startsWith('temp-')) {
                        const pagado = misComplementos
                            .filter(c => c.estatusSAT !== 'CANCELADO')
                            .reduce((sum, c) => sum + (parseFloat(c.total) || 0), 0);
                        const saldo = (parseFloat(f.total) || 0) - pagado;

                        if (saldo > 0.01) {
                            const trBtn = document.createElement('tr');
                            trBtn.className = `child-row-${f.id}`; // Se oculta/muestra con el padre

                            // Check expansion state
                            if (!state.ui.expandedFacturas) state.ui.expandedFacturas = new Set();
                            if (!state.ui.expandedFacturas.has(String(f.id))) {
                                trBtn.style.display = 'none';
                            }

                            trBtn.innerHTML = `
                                <td colspan="8" class="p-0 border-0 pt-2 pb-2">
                                    <button class="btn btn-sm btn-outline-primary border-dashed w-100 py-2 d-flex align-items-center justify-content-center gap-2 shadow-sm"
                                        onclick="ComunicadoDetalle.addComplemento('${f.id}')"
                                        style="border-style: dashed !important; border-width: 1px;">
                                        <i class="bi bi-plus-circle-fill"></i>
                                        <span class="fw-bold">Agregar Complemento de Pago (Saldo: $${_formatCurrency(saldo)})</span>
                                    </button>
                                </td>
        `;
                            tbody.appendChild(trBtn);
                        }
                    }
                });

                const cardTable = document.createElement('div');
                cardTable.className = 'card border-0 shadow-sm';
                cardTable.appendChild(table);

                const wrapper = document.createElement('div');
                wrapper.innerHTML = htmlHeader;
                wrapper.appendChild(cardTable);

                container.innerHTML = '';
                container.appendChild(wrapper);

            } else {
                container.innerHTML = htmlHeader + `<div class="text-muted small fst-italic ps-2 py-2">Sin facturas registradas.</div>`;
            }

            // BOTÓN "REGISTRAR FACTURA" ESTÉTICO Y FULL-WIDTH
            if (!isLiquidada && !isTemp) {
                const btnContainer = document.createElement('div');
                btnContainer.className = 'mt-3';
                btnContainer.innerHTML = `
                    <button class="btn btn-outline-secondary w-100 py-2 border-dashed d-flex align-items-center justify-content-center gap-2"
                        onclick="ComunicadoDetalle._openModalFactura('${est.id}')"
                        style="border-style: dashed !important;">
                        <i class="bi bi-receipt me-1"></i>
                        <span class="fw-bold small">REGISTRAR FACTURA</span>
                    </button>
                `;
                container.appendChild(btnContainer);
            }
            return container;
        }

        /**
         * @param {Object} f - Objeto Factura o Complemento
         * @param {Array} hijosContext - Lista de hijos (para facturas)
         * @param {Boolean} isComplemento - Si es tipo Complemento
         * @param {Boolean} hasChildren - Si tiene hijos (para mostrar acordeón)
         * @param {Boolean} isLastComplemento - Si es el último complemento (para permitir edición)
         */
        function _createFacturaRow(f, hijosContext = [], isComplemento = false, hasChildren = false, isLastComplemento = false) {
            const tr = document.createElement('tr');
            const isTemp = String(f.id).startsWith('temp-');

            // --- ESTILOS VISUALES MEJORADOS ---
            // Distribuir mejor: Complemento debe verse indentado pero alineado en columnas
            tr.className = isComplemento ? 'table-light' : ''; // Background suave

            let iconHtml = '';
            let paddingLeft = isComplemento ? '35px' : '5px';

            if (isComplemento) {
                // Icono flecha "enter" para indicar anidación
                iconHtml = `<i class="bi bi-arrow-return-right text-info fs-6"></i>`;
            } else {
                if (!isTemp && f.estatusSAT !== 'CANCELADO') {
                    // Botón toggle más limpio
                    const isExpanded = state.ui.expandedFacturas && state.ui.expandedFacturas.has(String(f.id));
                    const iconClass = isExpanded ? 'dash-square-fill' : (hasChildren ? 'plus-square-fill' : 'plus-square');

                    iconHtml = `
        <a href="javascript:void(0)" class="text-decoration-none text-primary toggle-btn d-inline-block transition-transform"
    onclick="ComunicadoDetalle.toggleChildRows('${f.id}', this)" style="transition: transform 0.2s;">
        <i class="bi bi-${iconClass} fs-6"></i>
                        </a>`;
                } else {
                    iconHtml = `<i class="bi bi-file-earmark-text text-muted opacity-50"></i>`;
                }
            }

            // --- LÓGICA DE EDICIÓN (READONLY) ---
            // Regla 1: Factura (Importes) -> Solo editable si NO tiene complementos.
            // Regla 2: Complemento -> Solo editable si ES el último.

            let isReadOnlyAmount = false;
            let isReadOnlyData = false; // Para folio/fecha

            if (!isTemp) {
                if (isComplemento) {
                    // Si NO es el último complemento, todo bloqueado
                    if (!isLastComplemento) {
                        isReadOnlyAmount = true;
                        isReadOnlyData = true;
                    }
                } else {
                    // Es Factura. Si TIENE complementos (hijos), importes bloqueados.
                    if (hasChildren) {
                        isReadOnlyAmount = true;
                        // Folio y Fecha suelen poder editarse (corregir error de dedo) aunque tenga pagos, 
                        // pero si quieres estricto: isReadOnlyData = true;
                    }
                }
            }

            const classBase = 'form-control-plaintext form-control-sm px-1 shadow-none';
            const classEdit = 'form-control form-control-sm border-bottom border-0 rounded-0 bg-transparent px-1 shadow-none';

            // Función helper para clases
            const getCls = (isRead) => isRead ? classBase : classEdit;
            const getAttr = (isRead) => isRead ? 'readonly' : '';

            tr.innerHTML = `
                <td class="text-center align-middle">
                    ${iconHtml}
                </td>
                <td class="align-middle">
                    <div class="d-flex align-items-center" style="padding-left: ${isComplemento ? '25px' : '0'};">
                        <input id="input-factura-folio-${f.id}" type="text" class="${getCls(isReadOnlyData)} fw-bold ${isComplemento ? 'text-secondary font-italic' : 'text-dark'}" 
                            value="${f.folioFactura || ''}" 
                            aria-label="Folio Fiscal"
                            oninput="this.value = this.value.toUpperCase(); ComunicadoDetalle.updateFactura('${f.id}', 'folioFactura', this.value)"  
                            placeholder="Folio" ${getAttr(isReadOnlyData)}>
                    </div>
                </td>
                <td class="align-middle">
                    <input id="input-factura-fecha-${f.id}" type="date" class="${getCls(isReadOnlyData)} text-muted small" value="${_formatDateISO(f.fecha)}" 
                        onchange="ComunicadoDetalle.updateFactura('${f.id}', 'fecha', this.value)" ${getAttr(isReadOnlyData)}>
                </td>
                <td class="align-middle">
                    <input id="input-factura-monto-${f.id}" type="text" class="${getCls(isReadOnlyAmount)} text-end currency-input font-monospace text-dark" 
                        value="${_formatCurrency(f.monto)}" 
                        onchange="ComunicadoDetalle.updateFactura('${f.id}', 'monto', this.value)" ${getAttr(isReadOnlyAmount)}>
                </td>
                <td class="align-middle">
                    <input id="input-factura-iva-${f.id}" type="text" class="form-control-plaintext form-control-sm px-1 text-end font-monospace text-dark" 
                        value="${_formatCurrency(f.iva)}" readonly tabindex="-1">
                </td>
                <td class="align-middle">
                     <input id="input-factura-total-${f.id}" type="text" class="form-control-plaintext form-control-sm px-1 text-end font-monospace text-dark" 
                        value="${_formatCurrency(f.total)}" readonly tabindex="-1">
                </td>
                <td class="text-center align-middle">
                    <div class="d-flex justify-content-center">
                        <select id="select-factura-estatus-${f.id}" class="form-select form-select-sm border-0 bg-transparent fw-bold text-center text-${f.estatusSAT === 'PAGADO' ? 'success' : (f.estatusSAT === 'CANCELADO' ? 'danger' : 'secondary')}" 
                              style="font-size: 0.75rem; width: auto; cursor: pointer; padding: 2px 12px; background-position: right 0.2rem center;"
                              onchange="ComunicadoDetalle.updateFactura('${f.id}', 'estatusSAT', this.value)"
                              ${isTemp ? 'disabled' : ''}>
                            <option value="VIGENTE" ${f.estatusSAT === 'VIGENTE' ? 'selected' : ''}>VIGENTE</option>
                            <option value="PAGADO" ${f.estatusSAT === 'PAGADO' ? 'selected' : ''}>PAGADO</option>
                            <option value="CANCELADO" ${f.estatusSAT === 'CANCELADO' ? 'selected' : ''}>CANCELADO</option>
                        </select>
                    </div>
                </td>
                <td class="text-end align-middle">
                     <div class="d-flex justify-content-end align-items-center">
                        <button class="btn btn-sm btn-link text-muted p-0 me-2 opacity-50 hover-opacity-100" 
                                onclick="ComunicadoDetalle.openBitacoraModal('${f.id}')" tabindex="-1">
                            <i class="bi bi-chat-left-text"></i>
                        </button>
                        ${isTemp ? `
                            <button id="btn-save-factura-${f.id}" class="btn btn-sm btn-success d-flex align-items-center gap-1 shadow-sm px-2 py-0 me-2" onclick="ComunicadoDetalle.saveFactura('${f.id}')" title="Guardar">
                                <i class="bi bi-save"></i> Guardar
                            </button>
                            <button class="btn-icon text-danger small" onclick="ComunicadoDetalle.removeFactura('${f.id}')"><i class="bi bi-x"></i></button>
                        ` : `
                            <button id="btn-save-factura-${f.id}" class="btn btn-icon text-success p-0 ms-2" disabled style="opacity:0.3" 
                                    onclick="ComunicadoDetalle.saveFactura('${f.id}')" title="Sin cambios">
                                <i class="bi bi-check-circle-fill"></i>
                            </button>
                            <!-- Logic Change: Leaf Nodes (Green) show BOTH Cancel and Delete. Parents (Red) are Blocked. -->
                            ${hasChildren ? `
                                <button class="btn btn-sm btn-link text-secondary p-0 ms-2 opacity-50" disabled style="cursor:not-allowed;" title="Elimine primero los complementos/hijos">
                                    <i class="bi bi-slash-circle"></i>
                                </button>
                                <button class="btn btn-sm btn-link text-secondary p-0 ms-1 opacity-50" disabled style="cursor:not-allowed;" title="Elimine primero los complementos/hijos">
                                    <i class="bi bi-trash"></i>
                                </button>
                            ` : `
                                <!-- Leaf Node: Allow Both Actions -->
                                <button class="btn btn-sm btn-link text-warning p-0 ms-2" onclick="ComunicadoDetalle.cancelFactura('${f.id}')" title="Cancelar (Soft Delete)">
                                    <i class="bi bi-slash-circle"></i>
                                </button>
                                <button class="btn-icon text-danger small p-0 ms-1" onclick="ComunicadoDetalle.removeFactura('${f.id}')" title="Eliminar (Hard Delete)">
                                    <i class="bi bi-trash"></i>
                                </button>
                            `}
                        `}
                    </div>
                </td>
    `;
            return tr;
        }

        function addFactura(idEstimacion) {
            // Find estimation to ensure it exists and valid
            const est = (state.data.estimaciones || []).find(e => String(e.id) === String(idEstimacion));
            if (!est) return;

            // AUTO-EXPAND: Keep details open
            if (!state.ui.expandedEstimations) state.ui.expandedEstimations = new Set();
            state.ui.expandedEstimations.add(String(idEstimacion));

            // Prevent adding to temp/unsaved estimation (should be hidden by UI anyway)
            if (String(est.id).startsWith('temp-')) {
                _showAlert('Estimación no guardada', 'Guarda la estimación antes de agregar facturas.', 'warning');
                return;
            }

            // Pre-fill amounts from estimation for user convenience
            // LOGICA REQUERIDA: Si hay amortización, se factura el NETO (Monto - Amortización)
            const montoSiniestro = parseFloat(est.monto) || 0;
            const amortizacion = parseFloat(est.amortizacion) || 0;
            const preFillMonto = Math.max(0, montoSiniestro - amortizacion);
            const preFillIva = preFillMonto * 0.16;
            const preFillTotal = preFillMonto + preFillIva;

            // Create new temp invoice
            const newFactura = {
                id: 'temp-' + Date.now(),
                idEstimacion: est.id,
                folioFactura: '',
                fecha: new Date().toISOString().split('T')[0],
                monto: preFillMonto,
                iva: preFillIva,
                total: preFillTotal,
                estatusSAT: 'VIGENTE',
                tipo: 1, // 1 = Factura, 2 = Complemento
                _modified: true, // Mark as modified for save button
                _isNew: true
            };

            if (!state.data.facturasEstimaciones) state.data.facturasEstimaciones = [];
            state.data.facturasEstimaciones.push(newFactura);

            // Re-render
            _renderFinanciero();

            // Auto focus logic (optional)
        }

        function updateFactura(id, field, val) {
            const item = (state.data.facturasEstimaciones || []).find(f => String(f.id) === String(id));
            if (!item) return;

            if (field === 'monto') {
                const monto = parseFloat(val.replace(/[^0-9.-]+/g, '')) || 0;
                item.monto = monto;
                item.iva = monto * 0.16;
                item.total = monto + item.iva;

                // Smart Update DOM without re-rendering to prevent focus loss (Date inputs etc)
                const inputIva = document.getElementById(`input-factura-iva-${id}`);
                const inputTotal = document.getElementById(`input-factura-total-${id}`);
                if (inputIva) inputIva.value = _formatCurrency(item.iva);
                if (inputTotal) inputTotal.value = _formatCurrency(item.total);

                // --- VALIDACION DINAMICA (AFTER UPDATE) ---
                // Verifica si el nuevo monto causa desborde

                // 1. SI ES FACTURA: Suma Invoices <= Estimacion
                if (item.tipo == 1 || String(item.tipo).toUpperCase() === 'FACTURA') {
                    if (item.idEstimacion) {
                        const est = (state.data.estimaciones || []).find(e => String(e.id) === String(item.idEstimacion));
                        if (est) {
                            const estTotal = parseFloat(est.montoTotal) || 0;
                            // Sumar otras + actual
                            const otherInvoicesSum = (state.data.facturasEstimaciones || [])
                                .filter(other =>
                                    String(other.idEstimacion) === String(est.id) &&
                                    String(other.id) !== String(item.id) &&
                                    other.estatusSAT !== 'CANCELADO' &&
                                    (other.tipo == 1 || String(other.tipo).toUpperCase() === 'FACTURA')
                                )
                                .reduce((sum, val) => sum + (parseFloat(val.total) || 0), 0);

                            const newGrandTotal = otherInvoicesSum + item.total;

                            if (estTotal > 0 && newGrandTotal > (estTotal + 1.00)) {
                                Swal.fire({
                                    title: 'Límite Excedido',
                                    html: `El nuevo monto genera un total facturado de < b > $${_formatCurrency(newGrandTotal)}</b >, lo cual excede el monto autorizado de la estimación(<b>$${_formatCurrency(estTotal)}</b>).`,
                                    icon: 'warning',
                                    toast: true,
                                    position: 'top-end',
                                    showConfirmButton: false,
                                    timer: 5000
                                });
                                // Visual feedback (optional: Add red border)
                                const inputMonto = document.getElementById(`input-factura-monto-${id}`);
                                if (inputMonto) inputMonto.classList.add('text-danger', 'fw-bold');
                            } else {
                                const inputMonto = document.getElementById(`input - factura - monto - ${id} `);
                                if (inputMonto) inputMonto.classList.remove('text-danger', 'fw-bold');
                            }
                        }
                    }
                }

                // 2. SI ES COMPLEMENTO: Suma Complementos <= Factura Padre
                // Sin embargo, updateFactura se llama para items en la lista. 
                // Los complementos se editan directo en la tabla si son el último, o en agregar.
                if (item.tipo == 2 || String(item.tipo).toUpperCase() === 'COMPLEMENTO') {
                    const parentFactura = (state.data.facturasEstimaciones || []).find(f => String(f.id) === String(item.idFacturaRelacionada));
                    if (parentFactura) {
                        const complementsSum = (state.data.facturasEstimaciones || [])
                            .filter(c =>
                                String(c.idFacturaRelacionada) === String(parentFactura.id) &&
                                String(c.id) !== String(item.id) && // Excluir self
                                c.estatusSAT !== 'CANCELADO'
                            )
                            .reduce((sum, c) => sum + (parseFloat(c.total) || 0), 0);

                        const totalComp = complementsSum + item.total;
                        const totalFact = parseFloat(parentFactura.total) || 0;

                        if (totalComp > (totalFact + 0.10)) {
                            Swal.fire({
                                title: 'Saldo Excedido',
                                text: `El total pagado($${_formatCurrency(totalComp)}) superaría el monto de la factura($${_formatCurrency(totalFact)}).`,
                                icon: 'warning',
                                toast: true, position: 'top-end', timer: 4000
                            });
                        }
                    }
                }

            } else {
                item[field] = val;
            }
            item._modified = true;

            // Update Save Button State visually
            const btnSave = document.getElementById(`btn-save-factura-${id}`);
            if (btnSave) {
                btnSave.disabled = false;
                btnSave.style.opacity = '1';
                btnSave.title = "Guardar Cambios";
            }

            // Do NOT call _renderFinanciero() here to preserve focus and cursor position
        }

        // --- INVOICE MODAL HELPERS ---
        function _updateCalculosFactura() {
            // 1. Get Values
            const inputMonto = document.getElementById('factura-monto-obra');
            const inputAmort = document.getElementById('factura-amortizacion');
            const inputDesc = document.getElementById('factura-descuentos');

            if (!inputMonto) return; // Guard clause

            const monto = unformatInputCurrency(inputMonto) || 0;
            const amort = unformatInputCurrency(inputAmort) || 0;
            const desc = unformatInputCurrency(inputDesc) || 0;

            // 2. Calculate
            // Logic: Base Imponible (Neto) = Monto - Amort - Desc
            const neto = Math.max(0, monto - amort - desc);
            const iva = neto * 0.16; // Fixed 16% rate as per requirements
            const total = neto + iva;

            // 3. Update Read-only Fields
            const fieldNeto = document.getElementById('factura-subtotal-neto');
            const fieldIva = document.getElementById('factura-iva');
            const fieldTotal = document.getElementById('factura-total');

            if (fieldNeto) fieldNeto.value = _formatCurrency(neto);
            if (fieldIva) fieldIva.value = _formatCurrency(iva);
            if (fieldTotal) fieldTotal.value = _formatCurrency(total);
        }

        function _switchFileTab(tabName) {
            // Tabs Buttons
            const btnLink = document.getElementById('btn-tab-link');
            const btnUpload = document.getElementById('btn-tab-upload');
            // Content Areas
            const contentLink = document.getElementById('tab-link-content');
            const contentUpload = document.getElementById('tab-upload-content');

            if (tabName === 'link') {
                if (btnLink) btnLink.classList.add('active', 'border-primary', 'text-primary');
                if (btnUpload) btnUpload.classList.remove('active', 'border-primary', 'text-primary');

                if (contentLink) contentLink.style.display = 'block';
                if (contentUpload) contentUpload.style.display = 'none';
            } else {
                if (btnLink) btnLink.classList.remove('active', 'border-primary', 'text-primary');
                if (btnUpload) btnUpload.classList.add('active', 'border-primary', 'text-primary');

                if (contentLink) contentLink.style.display = 'none';
                if (contentUpload) contentUpload.style.display = 'block';
            }
        }

        function _initFileTabs() {
            // Safe Init
            const btnLink = document.getElementById('btn-tab-link');
            if (btnLink) _switchFileTab('link');
        }

        async function saveFactura(id) {
            if (!id || typeof id !== 'string') {
                return await _saveFacturaModal();
            }

            const item = (state.data.facturasEstimaciones || []).find(f => String(f.id) === String(id));
            if (!item) return;

            // Defensive Check: Recargar valor desde DOM si falta en state (por si onchange no disparó)
            if (!item.folioFactura || !item.folioFactura.trim()) {
                const elFolio = document.getElementById(`input-factura-folio-${id}`);
                if (elFolio && elFolio.value) {
                    item.folioFactura = elFolio.value;
                    console.log('Recuperado folio desde DOM:', item.folioFactura);
                }
            }

            // Validation
            if (!item.folioFactura || !item.folioFactura.trim()) {
                _showAlert('Dato Faltante', 'El Folio Fiscal es obligatorio.', 'warning');
                return;
            }
            if (!item.fecha) {
                _showAlert('Dato Faltante', 'La Fecha es obligatoria.', 'warning');
                return;
            }

            // (VALIDACION ESTATICA ELIMINADA - AHORA ES DINAMICA EN updateFactura)


            // Prepare Payload
            const isTemp = String(item.id).startsWith('temp-');

            // Auto-fill fechaPago for Complements (User Requirement)
            if (item.tipo == 2 || String(item.tipo).toUpperCase() === 'COMPLEMENTO') {
                item.fechaPago = item.fecha;
            }

            const payload = { ...item };
            delete payload._modified;
            delete payload._isNew;

            // --- DATE FORMATTING FOR SAVE (dd/mm/yyyy) ---
            if (payload.fecha) payload.fecha = _toSaveDate(payload.fecha);
            if (payload.fechaPago) payload.fechaPago = _toSaveDate(payload.fechaPago);
            // ---------------------------------------------

            // Clean ID for server new creation
            if (isTemp) {
                delete payload.id;
            }

            try {
                // UI Feedback
                // Use btn reference if event available, or global loader
                _setGlobalLoader(true, isTemp ? 'Registrando...' : 'Actualizando...');

                let result;
                if (isTemp) {
                    // Backend: agregarFactura(idEstimacion, datosFactura)
                    // We pass idEstimacion as first arg, payload as second
                    result = await serverCall('agregarFactura', item.idEstimacion, payload);
                } else {
                    // Backend: actualizarFactura(idFactura, datosFactura)
                    result = await serverCall('actualizarFactura', item.id, payload);
                }

                if (result && (result.success || result.data || result.id)) {
                    // Handle success
                    const data = result.data || result;

                    if (isTemp && data.id) {
                        item.id = data.id;
                    }
                    delete item._modified;
                    delete item._isNew;

                    globalThis.showToast?.('Factura guardada exitosamente', 'success');

                    // --- AUTOMATIC STATUS UPDATE LOGIC ---
                    if (item.tipo == 2 || String(item.tipo).toUpperCase() === 'COMPLEMENTO') {
                        // 1. Check if Parent Invoice should be PAGADO
                        const parentFactura = state.data.facturasEstimaciones.find(f => String(f.id) === String(item.idFacturaRelacionada));

                        if (parentFactura && parentFactura.estatusSAT !== 'PAGADO') {
                            // Re-fetch complements including the one just saved (item)
                            const complements = state.data.facturasEstimaciones.filter(c =>
                                String(c.idFacturaRelacionada) === String(parentFactura.id) &&
                                c.estatusSAT !== 'CANCELADO'
                            );
                            const totalPagado = complements.reduce((sum, c) => sum + (parseFloat(c.total) || 0), 0);
                            const totalFactura = parseFloat(parentFactura.total) || 0;

                            // Debug log
                            console.log(`AutoStatus Check: Factura ${parentFactura.folioFactura} Total: ${totalFactura}, Pagado: ${totalPagado} `);

                            // Tolerance for floating point
                            if (totalPagado >= (totalFactura - 0.10)) {
                                // Update Invoice to PAGADO and set fechaPago
                                try {
                                    await serverCall('actualizarFactura', parentFactura.id, {
                                        estatusSAT: 'PAGADO',
                                        fechaPago: item.fecha // Sync payment date
                                    });
                                } catch (e) {
                                    if (e.message && (e.message.includes('vacía') || e.message.includes('empty'))) {
                                        console.warn("Ignored empty response from actualizarFactura (assumed success)");
                                    } else {
                                        throw e;
                                    }
                                }
                                parentFactura.estatusSAT = 'PAGADO';
                                parentFactura.fechaPago = item.fecha;
                                globalThis.showToast?.('Factura liquidada', 'info');

                                // 2. Check if Estimation should be PAGADO (Only if invoice status changed)
                                const estimationId = parentFactura.idEstimacion;
                                const estimacion = state.data.estimaciones.find(e => String(e.id) === String(estimationId));

                                if (estimacion && estimacion.estatusInterno !== 'PAGADO') {
                                    // Get all invoices for this estimation
                                    const allInvoices = state.data.facturasEstimaciones.filter(f =>
                                        String(f.idEstimacion) === String(estimationId) &&
                                        (f.tipo == 1 || String(f.tipo).toUpperCase() === 'FACTURA') &&
                                        f.estatusSAT !== 'CANCELADO'
                                    );

                                    // Check if ALL are PAGADO
                                    const allPaid = allInvoices.every(inv => inv.estatusSAT === 'PAGADO');

                                    if (allPaid && allInvoices.length > 0) {
                                        // Update Estimation to PAGADO and set fechaPago
                                        try {
                                            // Send both keys to ensure DB update regardless of column name
                                            await serverCall('actualizarRegistro', 'estimaciones', estimacion.id, {
                                                estatusInterno: 'PAGADO',
                                                estatus: 'PAGADO',
                                                fechaPago: item.fecha // Sync payment date
                                            });
                                        } catch (e) {
                                            if (e.message && (e.message.includes('vacía') || e.message.includes('empty'))) {
                                                console.warn("Ignored empty response from actualizarRegistro (assumed success)");
                                            } else {
                                                throw e;
                                            }
                                        }
                                        estimacion.estatusInterno = 'PAGADO';
                                        estimacion.estatus = 'PAGADO'; // Local update
                                        estimacion.fechaPago = item.fecha;
                                        globalThis.showToast?.('Estimación liquidada y pagada', 'success');
                                    }
                                }
                            }
                        }
                    }

                    // Force state update to expanded (just in case)
                    if (state.ui.expandedEstimations && item.idEstimacion) {
                        state.ui.expandedEstimations.add(String(item.idEstimacion));
                    }

                    // Persist invoice expansion for complements
                    if ((item.tipo == 2 || String(item.tipo).toUpperCase() === 'COMPLEMENTO') && item.idFacturaRelacionada) {
                        if (!state.ui.expandedFacturas) state.ui.expandedFacturas = new Set();
                        state.ui.expandedFacturas.add(String(item.idFacturaRelacionada));
                    }

                    _renderFinanciero();
                } else {
                    throw new Error(result?.message || 'La respuesta del servidor no fue exitosa.');
                }
            } catch (e) {
                console.error(e);
                _showAlert('Error', 'No se pudo guardar la factura: ' + e.message, 'error');
            } finally {
                _setGlobalLoader(false);
                // Ensure re-render of TABLES to reflect status changes (Badge PENDIENTE -> PAGADO)
                // _renderFinanciero only updates the top cards. _renderData updates the whole view.
                if (typeof _renderData === 'function') {
                    _renderData();
                } else {
                    _renderFinanciero();
                }
            }
        }

        // NUEVO: Función para agregar complemento (tipo 2)
        function addComplemento(idFacturaPadre) {
            const parent = (state.data.facturasEstimaciones || []).find(f => String(f.id) === String(idFacturaPadre));
            if (!parent) return;

            // CALCULAR SALDO PENDIENTE
            const complements = (state.data.facturasEstimaciones || [])
                .filter(f => String(f.idFacturaRelacionada) === String(parent.id) && f.estatusSAT !== 'CANCELADO');

            const totalPagado = complements.reduce((sum, c) => sum + (parseFloat(c.total) || 0), 0);
            const saldo = (parseFloat(parent.total) || 0) - totalPagado;

            // Restricción: Si el saldo es menor o igual a 0 (con tolerancia de centavos), no permitir agregar
            if (saldo <= 0.01) {
                globalThis.showToast?.('La factura ya está totalmente liquidada.', 'warning');
                return;
            }

            // Pre-llenar con el saldo restante
            // Calcular desglose inverso desde Total
            const montoNeto = saldo / (1 + IVA_RATE);
            const montoIva = saldo - montoNeto;

            const newComp = {
                id: 'temp-comp-' + Date.now(),
                idEstimacion: parent.idEstimacion,
                idFacturaRelacionada: parent.id,
                folioFactura: '',
                fecha: new Date().toISOString().split('T')[0],
                monto: parseFloat(montoNeto.toFixed(2)),
                iva: parseFloat(montoIva.toFixed(2)),
                total: parseFloat(saldo.toFixed(2)),
                estatusSAT: 'VIGENTE',
                tipo: 2, // 2 = COMPLEMENTO
                _modified: true,
                _isNew: true
            };

            if (!state.data.facturasEstimaciones) state.data.facturasEstimaciones = [];
            state.data.facturasEstimaciones.push(newComp);

            if (!state.ui.expandedEstimations) state.ui.expandedEstimations = new Set();
            if (parent.idEstimacion) state.ui.expandedEstimations.add(String(parent.idEstimacion));

            // Persist invoice expansion
            if (!state.ui.expandedFacturas) state.ui.expandedFacturas = new Set();
            state.ui.expandedFacturas.add(String(parent.id));

            _renderFinanciero();
        }

        function toggleChildRows(id, btn) {
            event?.stopPropagation(); // Stop event bubbling if any
            if (!state.ui.expandedFacturas) state.ui.expandedFacturas = new Set();

            const isExpanded = state.ui.expandedFacturas.has(String(id));
            const rows = document.querySelectorAll(`.child-row-${id}`);

            if (!isExpanded) {
                // Expand
                rows.forEach(r => r.style.display = '');
                state.ui.expandedFacturas.add(String(id));
                if (btn) btn.innerHTML = '<i class="bi bi-dash-square-fill fs-6"></i>';
            } else {
                // Collapse
                rows.forEach(r => r.style.display = 'none');
                state.ui.expandedFacturas.delete(String(id));
                // Determine valid closed icon
                // We rely on re-render to determine if hasChildren logic applies, 
                // but for immediate UI feedback 'plus-square' is safe or check row existence
                const hasChildren = rows.length > 0;
                const icon = hasChildren ? 'plus-square-fill' : 'plus-square';
                if (btn) btn.innerHTML = `<i class="bi bi-${icon} fs-6"></i>`;
            }
        }

        async function cancelFactura(id) {
            const item = (state.data.facturasEstimaciones || []).find(f => String(f.id) === String(id));
            if (!item) return;

            // Check dependencies (Hierarchy Rule)
            if (item.tipo == 1 || String(item.tipo).toUpperCase() === 'FACTURA') {
                const hasChildren = (state.data.facturasEstimaciones || []).some(f =>
                    String(f.idFacturaRelacionada) === String(id) && f.estatusSAT !== 'CANCELADO'
                );
                if (hasChildren) {
                    _showAlert('Bloqueado', 'No se puede cancelar: Existen complementos asociados activos. Cancélelos o elimínelos primero.', 'warning');
                    return;
                }
            }

            if (!confirm('¿Seguro que desea CANCELAR este registro? (Soft Delete)')) return;

            try {
                _setGlobalLoader(true);
                // Call Server
                await serverCall('actualizarRegistro', 'facturasEstimaciones', item.id, {
                    estatusSAT: 'CANCELADO'
                });

                item.estatusSAT = 'CANCELADO';
                globalThis.showToast?.('Registro cancelado', 'info');

                // Trigger Status Reversion Check
                if (item.idEstimacion) await _updateEstimationPaymentStatus(item.idEstimacion);

            } catch (e) {
                console.error(e);
                _showAlert('Error', 'Error al cancelar: ' + e.message, 'error');
            } finally {
                _setGlobalLoader(false);
                if (typeof _renderData === 'function') _renderData();
                else _renderFinanciero();
            }
        }

        async function _updateEstimationPaymentStatus(idEstimacion) {
            const est = (state.data.estimaciones || []).find(e => String(e.id) === String(idEstimacion));
            if (!est) return;

            const allInvoices = (state.data.facturasEstimaciones || []).filter(f =>
                String(f.idEstimacion) === String(idEstimacion) &&
                f.estatusSAT !== 'CANCELADO' &&
                (f.tipo == 1 || String(f.tipo).toUpperCase() === 'FACTURA')
            );

            // Logic: If NO invoices, or ANY invoice is NOT PAGADO -> PENDIENTE
            // If ALL invoices are PAGADO (and >0 active invoices) -> PAGADO
            const allPaid = allInvoices.length > 0 && allInvoices.every(inv => inv.estatusSAT === 'PAGADO');
            const newStatus = allPaid ? 'PAGADO' : 'PENDIENTE';

            if (est.estatusInterno !== newStatus) {
                console.log(`AutoStatus: Reverting Estimacion ${est.numero} to ${newStatus} `);
                est.estatusInterno = newStatus;
                est.estatus = newStatus;
                try {
                    await serverCall('actualizarRegistro', 'estimaciones', est.id, {
                        estatusInterno: newStatus,
                        estatus: newStatus
                    });
                } catch (e) { console.error('Error auto-updating est status:', e); }
            }
        }

        async function removeFactura(id) {
            // Check for dependencies (Complements)
            const item = (state.data.facturasEstimaciones || []).find(f => String(f.id) === String(id));
            if (!item) return;

            // Check dependency
            if (item && (item.tipo == 1 || String(item.tipo).toUpperCase() === 'FACTURA')) {
                const hasChildren = (state.data.facturasEstimaciones || []).some(f =>
                    String(f.idFacturaRelacionada) === String(id) && f.estatusSAT !== 'CANCELADO'
                );
                if (hasChildren) {
                    _showAlert('Bloqueado', 'Esta factura tiene complementos de pago asociados. Elimínelos primero.', 'warning');
                    return;
                }
            }

            // Use Generic Modal with Spinner
            _showDeleteModal(
                'Eliminar Factura',
                `¿Desea eliminar la factura < strong > ${item ? (item.folioFactura || 'S/N') : ''}</strong >? `,
                async () => {
                    const idEstimacion = item.idEstimacion;

                    // If temp, just remove from array
                    if (String(id).startsWith('temp-')) {
                        state.data.facturasEstimaciones = state.data.facturasEstimaciones.filter(f => String(f.id) !== String(id));
                        _renderFinanciero(); // Re-render first
                        if (idEstimacion) await _updateEstimationPaymentStatus(idEstimacion);
                        _renderFinanciero(); // Re-render again with new status
                        return;
                    }

                    // If server, call delete
                    try {
                        await serverCall('eliminarFactura', id);
                        state.data.facturasEstimaciones = state.data.facturasEstimaciones.filter(f => String(f.id) !== String(id));

                        // Check Status Reversion
                        if (idEstimacion) await _updateEstimationPaymentStatus(idEstimacion);

                        _renderFinanciero();
                        globalThis.showToast?.('Factura eliminada', 'success');
                    } catch (e) {
                        console.error(e);
                        _showAlert('Error', 'No se pudo eliminar: ' + e.message, 'error');
                        throw e; // Rethrow to stop spinner? No, helper handles it.
                    }
                }
            );
        }

        function toggleInfo(id) {
            if (!state.ui.expandedEstimations) state.ui.expandedEstimations = new Set();

            const row = document.getElementById(`detail-row-${id}`);
            const icon = document.getElementById(`icon-caret-${id}`);

        function _setupCombobox(input, dropdown, items, keyProp, onSelect, alertElement = null, onInputHandler = null) {
            if (!input || !dropdown) return;
            const safeItems = Array.isArray(items) ? items : [];

            // Referencia a instancia bootstrap

            let dropdownInstance = null;

            const getDropdownInstance = () => {
                if (dropdownInstance) return dropdownInstance;
                if (window.bootstrap && window.bootstrap.Dropdown) {
                    try {
                        dropdownInstance = bootstrap.Dropdown.getInstance(input) || new bootstrap.Dropdown(input, { autoClose: 'outside' });
                    } catch (e) { console.warn('Bootstrap error:', e); }
                }
                return dropdownInstance;
            };

            const renderList = (filter = '') => {
                dropdown.innerHTML = '';
                const term = (filter || '').toLowerCase();
                const filtered = term
                    ? safeItems.filter(i => {
                        const val = i[keyProp] || i.nombre || '';
                        return String(val).toLowerCase().includes(term);
                    })
                    : safeItems;

                const displayItems = filtered.slice(0, 50);

                if (displayItems.length === 0) {
                    dropdown.innerHTML = '<li class="dropdown-item text-muted disabled">Sin resultados</li>';
                } else {
                    displayItems.forEach(item => {
                        const li = document.createElement('li');
                        const a = document.createElement('a');
                        a.className = 'dropdown-item';
                        a.href = '#';
                        a.textContent = item[keyProp] || item.nombre || 'Sin Nombre';
                        a.onclick = (e) => {
                            e.preventDefault();
                            onSelect(item);
                            const instance = getDropdownInstance();
                            if (instance) instance.hide();
                            else dropdown.classList.remove('show');

                            // Ocultar alerta al seleccionar existente
                            if (alertElement) alertElement.classList.add('d-none');
                        };
                        li.appendChild(a);
                        dropdown.appendChild(li);
                    });
                }
            };

            const showDropdown = () => {
                renderList(input.value);
                const instance = getDropdownInstance();
                if (instance) {
                    instance.show();
                } else {
                    // Fallback sin bootstrap
                    dropdown.classList.add('show');
                    dropdown.style.display = 'block';
                }
            };

            input.addEventListener('input', () => {
                // Force Uppercase
                _forceUppercase(input);

                const instance = getDropdownInstance();
                if (instance) instance.show();
                else { dropdown.classList.add('show'); dropdown.style.display = 'block'; }

                renderList(input.value);

                const val = input.value.trim().toLowerCase();
                let exactMatchItem = null;
                if (val) {
                    exactMatchItem = safeItems.find(i => String(i[keyProp] || i.nombre || '').toLowerCase() === val);
                }

                if (alertElement) {
                    if (!val) {
                        alertElement.classList.add('d-none');
                    } else {
                        alertElement.classList.toggle('d-none', !!exactMatchItem);
                    }
                }

                if (onInputHandler) {
                    onInputHandler(input.value, exactMatchItem);
                }
            });

            input.addEventListener('focus', showDropdown);
            input.addEventListener('click', showDropdown);

            input.addEventListener('blur', () => {
                setTimeout(() => {
                    const instance = getDropdownInstance();
                    if (instance) instance.hide();
                    else { dropdown.classList.remove('show'); dropdown.style.display = 'none'; }
                }, 200);
            });
        }

        function _onSiniestroChange(itemOrString) {
            const fields = [dom.genFenomeno, dom.genFi, dom.genFondo];
            const isObj = typeof itemOrString === 'object' && itemOrString !== null;
            if (isObj) {
                dom.genFenomeno.value = itemOrString.fenomeno || '';
                dom.genFi.value = itemOrString.fi || '';
                dom.genFondo.value = itemOrString.fondo || '';

                // Logic to set Aseguradora from Siniestro
                if (dom.genAseguradora) {
                    let asegName = itemOrString.aseguradora || '';
                    if (!asegName && itemOrString.idAseguradora && state.catalogs.aseguradoras) {
                        const match = state.catalogs.aseguradoras.find(a => String(a.id) === String(itemOrString.idAseguradora));
                        if (match) asegName = match.aseguradora || match.nombre || '';
                    }
                    dom.genAseguradora.value = asegName;
                    // Keep custom aseguradora editable even if derived? User said "fields linked", 
                    // usually implying read-only, but for Aseguradora they said "leave blank to choose".
                    // If populated, maybe we leave it enabled? I'll leave it enabled as per previous logic (it wasn't in 'fields' array).
                }

                // Habilitar campos siempre, para permitir correcciones
                fields.forEach(f => { if (f) f.disabled = false; });
                if (dom.avisos.siniestro) dom.avisos.siniestro.classList.add('d-none');
            } else {
                fields.forEach(f => { if (f) { f.disabled = false; f.value = ''; } });
                if (dom.genAseguradora) {
                    dom.genAseguradora.value = '';
                    dom.genAseguradora.disabled = false;
                }
            }
        }

        function _renderPresupuesto() {

            if (items.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-5 text-muted small">Sin presupuesto registrado</td></tr>';

                    const isLast = idx === items.length - 1;

                    // Cálculos

                    const mCapturado = parseFloat(item.montoCapturado);
                    const hasCapturado = item.montoCapturado !== null && item.montoCapturado !== '' && item.montoCapturado !== undefined;

                    // Estilos dinámicos

                    // Lógica del input Obra (Manual vs Calc)
                    const valObra = hasCapturado ? mCapturado : mCalculado;
                    const styleObra = hasCapturado ? 'fw-bold text-dark border-bottom border-primary' : 'text-muted';
                    const iconToggle = hasCapturado ? 'bi-arrow-counterclockwise' : 'bi-pencil';

                    tr.innerHTML = `

                            <td>
                                <input type="date" class="form-control-ghost text-muted small" 
                                    value="${_formatDateISO(item.fecha)}" 
                                    onchange="ComunicadoDetalle.updatePresupuesto(${idx},'fecha',this.value)">
                            </td>
                            <td>
                                <div class="d-flex align-items-center justify-content-end gap-2">
                                    <span class="badge ${hasCapturado ? 'badge-soft-warning' : 'badge-soft-secondary'} user-select-none" style="font-size: 0.6rem;">
                                        ${hasCapturado ? 'MANUAL' : 'AUTO'}
                                    </span>
                                    <input type="text" class="form-control-ghost text-end font-monospace currency-input ${styleObra}" 
                                        style="width: 140px;"
                                        value="${_formatCurrency(valObra, false)}" 
                                        ${hasCapturado ? '' : 'readonly'}
                                        onchange="ComunicadoDetalle.updatePresupuesto(${idx}, 'montoCapturado', this.value)">
                                    <button class="btn-icon small" onclick="ComunicadoDetalle.toggleManualInput(${idx}, ${!hasCapturado})" 
                                        title="${hasCapturado ? 'Revertir a cálculo automático' : 'Ajustar manualmente'}">
                                        <i class="bi ${iconToggle}"></i>
                                    </button>
                                </div>
                            </td>
                            <td>
                                <div class="d-flex align-items-center justify-content-end">
                                    <input type="text" class="form-control-ghost text-end font-monospace currency-input" 
                                        value="${_formatCurrency(mSupervision, false)}"
                                        onchange="ComunicadoDetalle.updatePresupuesto(${idx},'montoSupervision',this.value)">
                                    <button class="btn-icon ms-1 small" onclick="ComunicadoDetalle.calcularSupervision(${idx})" title="Calcular 5%">%</button>
                                </div>
                            </td>
                            <td class="text-center">
                                <div class="d-flex justify-content-center gap-2">
                                    <button class="btn-icon text-primary" onclick="ComunicadoDetalle.abrirEditorPresupuesto(${idx})" title="Ver Desglose">
                                        <i class="bi bi-list-columns-reverse"></i>
                                    </button>
                                    ${(!isOrigin && isLast) ?
                            `<button class="btn-icon text-danger" onclick="ComunicadoDetalle.removePresupuesto(${idx})" title="Eliminar"><i class="bi bi-trash"></i></button>` :
                            `<button class="btn-icon text-muted disabled" style="opacity:0.3"><i class="bi bi-lock"></i></button>`
                        }
                                </div>
                            </td>
    `;

                });
            }

            // Update Footer
            const last = items.length > 0 ? items[items.length - 1] : null;
            let obra = 0, supervision = 0;

            if (last) {
                const mCapturado = parseFloat(last.montoCapturado);
                const hasCapturado = !isNaN(mCapturado) && last.montoCapturado !== '' && last.montoCapturado !== null;
                obra = hasCapturado ? mCapturado : (parseFloat(last.monto) || 0);
                supervision = parseFloat(last.montoSupervision) || 0;

            const fObra = document.getElementById('footer-total-obra');
            const fSup = document.getElementById('footer-total-sup');
            if (fObra) fObra.textContent = _formatCurrency(obra);
            if (fSup) fSup.textContent = _formatCurrency(supervision);

            _updateResumenFinanciero();
            _attachCurrencyFormatters();

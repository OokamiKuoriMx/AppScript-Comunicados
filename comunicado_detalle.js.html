        function abrirEditorPresupuesto(idx) {
            state.editingPresupuestoIdx = idx;

            // Asegurar integridad de estructura
            if (!state.data.presupuesto[idx]) return;
            if (!state.data.presupuesto[idx].lineas) state.data.presupuesto[idx].lineas = [];

            // Sincronizar CASCADA de revisiones anteriores (Carry Over)
            // IMPORTANTE: Si abrimos L27B (idx=2), necesitamos asegurar que L27A (idx=1) 
            // ya haya sincronizado sus líneas con L27 (idx=0). 
            // Por eso iteramos desde el principio hasta el índice actual.
            for (let i = 1; i <= idx; i++) {
                // Asegurar que la revisión intermedia tenga array de líneas
                if (state.data.presupuesto[i] && !state.data.presupuesto[i].lineas) {
                    state.data.presupuesto[i].lineas = [];
                }
                _sincronizarLineasFaltantes(i);
            }

            _renderModalLines();
            _recalcularTotalModal(); // Inicializar total

            const modalEl = document.getElementById('modalPresupuestoDetalle');
            const modal = new bootstrap.Modal(modalEl);
            modal.show();
        }

        function _sincronizarLineasFaltantes(currentIdx) {
            const currentItem = state.data.presupuesto[currentIdx];
            const prevItem = state.data.presupuesto[currentIdx - 1];

            if (!prevItem || !prevItem.lineas || prevItem.lineas.length === 0) return;

            const currentLines = currentItem.lineas || [];
            let addedCount = 0;

            prevItem.lineas.forEach(pLine => {
                // Buscar si existe en la actual
                let match = null;

                // 1. Por ID directo (lo ideal)
                if (pLine.idLinea) {
                    match = currentLines.find(c => String(c.idLinea) === String(pLine.idLinea));
                }

                // 2. Por coincidencia de texto (fallback robusto)
                if (!match) {
                    const pDesc = (pLine.descripcion || '').toUpperCase().trim();
                    const pCat = (pLine.categoria || '').toUpperCase().trim();
                    match = currentLines.find(c => {
                        const cDesc = (c.descripcion || '').toUpperCase().trim();
                        const cCat = (c.categoria || '').toUpperCase().trim();
                        return cDesc === pDesc && cCat === pCat;
                    });
                }

                // Si no existe, la traemos (Arrastrar)
                if (!match) {
                    // Clonar objeto para romper referencia
                    const newLine = {
                        ...pLine,
                        id: undefined, // Es un nuevo registro en DB (relación nueva)
                        // idLinea se mantiene igual para preservar identidad del concepto
                        // importe se mantiene igual (carry over) a menos que el usuario lo cambie después
                    };
                    currentLines.push(newLine);
                    addedCount++;
                }
            });

            // Si agregamos líneas, reordenamos para mantener consistencia visual (ej. por consecutivo)
            if (addedCount > 0) {
                currentLines.sort((a, b) => (Number(a.consecutivo) || 9999) - (Number(b.consecutivo) || 9999));
                // console.log(`[Sync] Se arrastraron ${addedCount} líneas de la revisión anterior.`);
            }
        }

        function _renderModalLines() {
            const tbody = document.getElementById('modal-presupuesto-lines-body');
            tbody.innerHTML = '';
            const idx = state.editingPresupuestoIdx;
            const lines = state.data.presupuesto[idx].lineas;
            const totalRevisiones = state.data.presupuesto.length;

            // REGLA DE INTEGRIDAD: Si hay revisiones posteriores, no se puede modificar estructura
            const esUltimaRevision = idx === totalRevisiones - 1;
            const tieneRevisionesPosteriores = !esUltimaRevision;

            // Mostrar/ocultar botón Agregar Línea según si es última revisión
            const btnAgregarLinea = document.querySelector('[onclick="ComunicadoDetalle.addLineaPresupuesto()"]');
            if (btnAgregarLinea) {
                if (tieneRevisionesPosteriores) {
                    btnAgregarLinea.classList.add('d-none');
                } else {
                    btnAgregarLinea.classList.remove('d-none');
                }
            }

            // Get previous revision lines for comparison
            const prevIdx = idx - 1;
            const prevLines = prevIdx >= 0 && state.data.presupuesto[prevIdx]
                ? (state.data.presupuesto[prevIdx].lineas || [])
                : [];

            // Helper to find matching line from previous revision
            const findPrevLine = (currentLine, currentIdx) => {
                // 1. Try matching by unique 'idLinea' if available (Most Robust)
                if (currentLine.idLinea) {
                    const match = prevLines.find(pl => String(pl.idLinea) === String(currentLine.idLinea));
                    if (match) return match;
                }

                // 2. Try matching by Description + Category (Content Matching)
                const descNorm = (currentLine.descripcion || '').toUpperCase().trim();
                const catNorm = (currentLine.categoria || '').toUpperCase().trim();

                if (descNorm) {
                    // STRICT MATCH: Description AND Category must match
                    const exactMatch = prevLines.find(pl => {
                        const prevDesc = (pl.descripcion || '').toUpperCase().trim();
                        const prevCat = (pl.categoria || '').toUpperCase().trim();
                        return prevDesc === descNorm && prevCat === catNorm;
                    });

                    if (exactMatch) return exactMatch;

                    // Fallback: If Description matches exactly but Category is empty/undefined in one of them?
                    // No, safe to strictly require category if it exists.
                }

                // 3. Fallback: Positional Matching (if descriptions are empty or missing)
                // Assuming rows align if no content changes
                if (!descNorm) {
                    const candidateByIndex = prevLines[currentIdx];
                    // Verify candidate also has empty description to be safe
                    if (candidateByIndex && !(candidateByIndex.descripcion || '').trim()) {
                        return candidateByIndex;
                    }
                }

                return null;
            };

            // Prepare Categories Catalog
            const categoriasCatalog = state.catalogs.categorias || [];

            lines.forEach((l, i) => {
                const tr = document.createElement('tr');
                const importeActual = parseFloat(l.importe) || 0;

                // Find matching line in previous revision
                const prevLine = findPrevLine(l, i);

                // MEJORA: Para ORIGEN (idx=0), mostrar $0.00 como anterior para que se vea el incremento en verde
                // Para actualizaciones, si la línea es nueva (no existía antes), también mostrar $0.00
                const esOrigen = idx === 0;
                const esLineaNueva = !prevLine && !esOrigen; // Nueva en esta revisión (no origen)

                // Importe anterior: 0 para origen, 0 para líneas nuevas, valor real para existentes
                const importeAnterior = esOrigen ? 0 : (prevLine ? (parseFloat(prevLine.importe) || 0) : 0);
                const diferencia = importeActual - importeAnterior;

                // Color coding for diferencia - using matrix delta classes
                let difClass = 'delta-neutral';
                let difPrefix = '';
                let difHtml = '';
                if (diferencia > 0) {
                    difClass = 'delta-up';
                    difPrefix = '+';
                    difHtml = `<div class="delta-up">${difPrefix}${_formatCurrency(diferencia)}</div>`;
                } else if (diferencia < 0) {
                    difClass = 'delta-down';
                    difHtml = `<div class="delta-down">${_formatCurrency(diferencia)}</div>`;
                } else {
                    difHtml = `<span class="text-muted">—</span>`;
                }

                // Row class - subtle styling without Bootstrap colored backgrounds
                tr.className = '';

                // Build Category Options con badge
                const currentCat = (l.categoria || '').trim();
                const catExists = (val) => categoriasCatalog.some(c => String(c.id).toUpperCase() === String(val).toUpperCase());

                let catOptions = `<option value="">Seleccione...</option>`;
                if (currentCat && !catExists(currentCat)) {
                    catOptions += `<option value="${currentCat}" selected>${currentCat}</option>`;
                }
                categoriasCatalog.forEach(c => {
                    const isSelected = String(c.id).toUpperCase() === String(currentCat).toUpperCase();
                    catOptions += `<option value="${c.id}" ${isSelected ? 'selected' : ''}>${c.nombre}</option>`;
                });

                // Determinar si esta línea puede eliminarse
                // REGLA: Si hay revisiones posteriores, NINGUNA línea puede eliminarse
                // REGLA: Si es la última revisión, solo líneas nuevas (sin match previo) pueden eliminarse
                const esLineaNuevaEnEstaRevision = !prevLine;
                const puedeEliminar = esUltimaRevision && esLineaNuevaEnEstaRevision;

                // Badge de estado para indicar visualmente tipo de línea
                let statusBadge = '';
                if (esOrigen) {
                    statusBadge = '<span class="cat-badge" style="background:#dcfce7;color:#166534;">NUEVA</span>';
                } else if (esLineaNueva) {
                    statusBadge = '<span class="cat-badge" style="background:#dcfce7;color:#166534;">NUEVA</span>';
                } else if (diferencia !== 0) {
                    statusBadge = '<span class="cat-badge" style="background:#dbeafe;color:#1e40af;">MODIF</span>';
                }

                // ======= LOCKING LOGIC =======
                // Reglas:
                // - Descripción: Solo editable en ORIGEN o líneas nuevas de la última revisión
                // - Categoría: NUNCA editable en actualizaciones (solo ORIGEN)
                // - Importe: Editable en ORIGEN, o en la ÚLTIMA revisión (cualquier línea)

                const puedeEditarDescripcion = esOrigen || (esUltimaRevision && esLineaNuevaEnEstaRevision);
                const puedeEditarCategoria = esOrigen; // Solo en ORIGEN
                const puedeEditarImporte = esOrigen || esUltimaRevision;

                // Generar atributos disabled/readonly
                const descReadonly = puedeEditarDescripcion ? '' : 'readonly';
                const catDisabled = puedeEditarCategoria ? '' : 'disabled';
                const impReadonly = puedeEditarImporte ? '' : 'readonly';

                tr.innerHTML = `
                        <td class="sticky-col">
                            <div class="d-flex align-items-center gap-2">
                                <input type="text" class="form-control form-control-sm border-0" value="${l.descripcion || ''}" placeholder="Ubicación / Concepto" ${descReadonly} onchange="ComunicadoDetalle.updateLineaPresupuesto(${i}, 'descripcion', this.value)">
                                ${statusBadge}
                            </div>
                        </td>
                        <td>
                            <select class="form-select form-select-sm border-0" style="min-width:100px;" ${catDisabled} onchange="ComunicadoDetalle.updateLineaPresupuesto(${i}, 'categoria', this.value)">
                                ${catOptions}
                            </select>
                        </td>
                        <td class="text-end ${esOrigen ? 'text-muted' : ''}">
                            ${_formatCurrency(importeAnterior)}
                        </td>
                        <td class="col-vigente">
                            <input type="text" class="form-control form-control-sm text-end currency-input border-0 fw-bold" value="${_formatCurrency(importeActual)}" ${impReadonly} onchange="ComunicadoDetalle.updateLineaPresupuesto(${i}, 'importe', this.value)">
                        </td>
                        <td class="text-end fw-bold">
                            ${difHtml}
                        </td>
                        <td class="text-center">
                            ${puedeEliminar
                        ? `<button class="btn btn-sm text-danger border-0 p-0" onclick="ComunicadoDetalle.removeLineaPresupuesto(${i})" title="Eliminar línea"><i class="bi bi-trash"></i></button>`
                        : `<span class="text-muted" title="${tieneRevisionesPosteriores ? 'Revisión bloqueada' : 'Línea vinculada'}"><i class="bi bi-lock-fill"></i></span>`
                    }
                        </td>
                    `;
                tbody.appendChild(tr);
            });
            _attachCurrencyFormatters();
        }

        function addLineaPresupuesto() {
            const idx = state.editingPresupuestoIdx;
            const totalRevisiones = state.data.presupuesto.length;
            const esUltimaRevision = idx === totalRevisiones - 1;

            // REGLA DE INTEGRIDAD: Solo se pueden agregar líneas en la última revisión
            if (!esUltimaRevision) {
                _showAlert('Acción No Permitida', 'No se pueden agregar líneas a revisiones que ya tienen actualizaciones posteriores.', 'warning');
                return;
            }

            state.data.presupuesto[idx].lineas.push({ descripcion: '', categoria: '', importe: 0 });
            _renderModalLines();
        }

        function removeLineaPresupuesto(lineIdx) {
            const idx = state.editingPresupuestoIdx;
            const totalRevisiones = state.data.presupuesto.length;
            const esUltimaRevision = idx === totalRevisiones - 1;

            // REGLA DE INTEGRIDAD: Solo se pueden eliminar líneas en la última revisión
            if (!esUltimaRevision) {
                _showAlert('Acción No Permitida', 'No se pueden eliminar líneas de revisiones que ya tienen actualizaciones posteriores.', 'warning');
                return;
            }

            const linea = state.data.presupuesto[idx].lineas[lineIdx];

            // Verificar si existe en CUALQUIER revisión anterior (incluyendo origen)
            // Recopilar todas las líneas de revisiones anteriores
            let todasLineasAnteriores = [];
            for (let i = 0; i < idx; i++) {
                const rev = state.data.presupuesto[i];
                if (rev && rev.lineas) {
                    todasLineasAnteriores = todasLineasAnteriores.concat(rev.lineas);
                }
            }

            // Buscar si la línea existe en alguna revisión anterior
            let existeEnRevisionAnterior = false;
            if (linea.idLinea) {
                existeEnRevisionAnterior = todasLineasAnteriores.some(pl => String(pl.idLinea) === String(linea.idLinea));
            } else if (linea.descripcion) {
                const descNorm = (linea.descripcion || '').toUpperCase().trim();
                const catNorm = (linea.categoria || '').toUpperCase().trim();
                existeEnRevisionAnterior = todasLineasAnteriores.some(pl => {
                    const prevDesc = (pl.descripcion || '').toUpperCase().trim();
                    const prevCat = (pl.categoria || '').toUpperCase().trim();
                    return prevDesc === descNorm && prevCat === catNorm;
                });
            }

            // Validación: Solo líneas nuevas (que no existen en revisiones anteriores ni origen) pueden eliminarse
            if (existeEnRevisionAnterior) {
                _showAlert('Acción No Permitida', 'Esta línea existe en el origen o revisiones anteriores y no puede eliminarse.', 'warning');
                return;
            }

            state.data.presupuesto[idx].lineas.splice(lineIdx, 1);
            _renderModalLines();
            _recalcularTotalModal();
        }

        function updateLineaPresupuesto(lineIdx, field, val) {
            const line = state.data.presupuesto[state.editingPresupuestoIdx].lineas[lineIdx];
            if (field === 'importe') {
                line[field] = parseFloat(val.replace(/,/g, '')) || 0;
                _recalcularTotalModal();
            } else {
                line[field] = val;
            }
        }

        function _recalcularTotalModal() {
            const idx = state.editingPresupuestoIdx;
            const lines = state.data.presupuesto[idx].lineas;
            const totalActual = lines.reduce((sum, l) => sum + (parseFloat(l.importe) || 0), 0);

            // Get previous revision lines for comparison
            const prevIdx = idx - 1;
            const prevLines = prevIdx >= 0 && state.data.presupuesto[prevIdx]
                ? (state.data.presupuesto[prevIdx].lineas || [])
                : [];

            // MEJORA: Para ORIGEN (idx=0), el total anterior es 0 (no N/A)
            const esOrigen = idx === 0;
            const totalAnterior = esOrigen ? 0 : prevLines.reduce((sum, l) => sum + (parseFloat(l.importe) || 0), 0);
            const totalDiferencia = totalActual - totalAnterior;

            // Update totals in footer
            const elAnterior = document.getElementById('modal-total-anterior');
            const elActual = document.getElementById('modal-total-actual');
            const elDif = document.getElementById('modal-total-diferencia');
            const elRevision = document.getElementById('modal-total-revision');

            // MEJORA: Siempre mostrar valor numérico (incluso para ORIGEN muestra $0.00)
            if (elAnterior) {
                elAnterior.textContent = _formatCurrency(totalAnterior);
                elAnterior.className = 'text-end' + (esOrigen ? ' text-muted' : '');
            }
            if (elActual) elActual.textContent = _formatCurrency(totalActual);
            if (elRevision) elRevision.textContent = _formatCurrency(totalActual);

            if (elDif) {
                let difHtml = '';
                if (totalDiferencia > 0) {
                    difHtml = `<div class="delta-up">+${_formatCurrency(totalDiferencia)}</div>`;
                } else if (totalDiferencia < 0) {
                    difHtml = `<div class="delta-down">${_formatCurrency(totalDiferencia)}</div>`;
                } else {
                    difHtml = `<span class="text-muted">—</span>`;
                }
                elDif.innerHTML = difHtml;
            }

            // Actualizar modelo del padre y tabla principal
            state.data.presupuesto[state.editingPresupuestoIdx].monto = totalActual;
            _renderPresupuesto();
        }

        // Variable para controlar el loader de SweetAlert2
        let _globalLoaderInstance = null;

        function _setGlobalLoader(isLoading, msg = 'Procesando...') {
            // Use global loader (Overlay) to prevent double-loading UI
            // Prioritize the global helper setAppLoading if valid
            if (typeof globalThis.setAppLoading === 'function') {
                globalThis.setAppLoading(isLoading);
            } else {
                // Fallback manual toggle
                const l = document.getElementById('app-loader');
                if (l) {
                    if (isLoading) {
                        l.classList.remove('d-none');
                        l.style.opacity = '1';
                    } else {
                        l.classList.add('d-none');
                        l.style.opacity = '0';
                    }
                }
            }

            // Update message if loading
            if (isLoading) {
                const m = document.getElementById('app-loader-message');
                if (m) m.textContent = msg;
            }
        }

        function crearActualizacionConTipo(tipo) {
            // Cerrar modal de selección
            const modalEl = document.getElementById('modalTipoActualizacion');
            if (modalEl) {
                const modal = bootstrap.Modal.getInstance(modalEl);
                if (modal) modal.hide();
            }

            const presupuestos = state.data.presupuesto || [];
            const ultimoIdx = presupuestos.length - 1;
            const ultimaActualizacion = ultimoIdx >= 0 ? presupuestos[ultimoIdx] : null;

            // Crear nueva actualización
            const nuevaActualizacion = {
                revision: '',
                fecha: new Date().toISOString(),
                monto: 0,
                montoCapturado: null,
                montoSupervision: 0,
                lineas: [],
                _tipoAccion: tipo, // Guardar tipo para el backend
                _esNueva: true // Marcar como nueva para lógica delta
            };

            // Lógica según tipo
            if (tipo === 'SUSTITUCION_TOTAL') {
                // Empezar vacío
                nuevaActualizacion.lineas = [];
            } else if (ultimaActualizacion && ultimaActualizacion.lineas && ultimaActualizacion.lineas.length > 0) {
                // INFORMATIVO o ACTUALIZACION: Copiar líneas del predecesor
                nuevaActualizacion.lineas = ultimaActualizacion.lineas.map(l => ({
                    ...l,
                    // Preservar idLinea para mantener relación
                    idLinea: l.idLinea,
                    // Nuevo registro, no tiene id propio todavía
                    id: undefined,
                    // Copia del importe
                    importe: l.importe || 0
                }));

                // Calcular monto total de las líneas copiadas
                const total = nuevaActualizacion.lineas.reduce((sum, l) => sum + (parseFloat(l.importe) || 0), 0);
                nuevaActualizacion.monto = total;
                nuevaActualizacion.montoSupervision = total * 0.05;
            }

            // Agregar al array
            state.data.presupuesto.push(nuevaActualizacion);
            _renderPresupuesto();

            // Si es ACTUALIZACION o SUSTITUCION, abrir editor de líneas
            if (tipo !== 'INFORMATIVO') {
                const nuevoIdx = state.data.presupuesto.length - 1;
                setTimeout(() => abrirEditorPresupuesto(nuevoIdx), 300);
            }
        }

        // Eliminar estimación del estado local con eliminación en cascada
        async function removeEstimacion(id) {
            // Encontrar la estimación
            const estimacion = (state.data.estimaciones || []).find(e => String(e.id) === String(id));
            if (!estimacion) return;

            // Contar facturas y complementos asociados
            const facturasAsociadas = (state.data.facturasEstimaciones || [])
                .filter(f => String(f.idEstimacion) === String(id) && String(f.tipo) !== '2' && f.tipo !== 'COMPLEMENTO');
            const complementosAsociados = (state.data.facturasEstimaciones || [])
                .filter(f => String(f.idEstimacion) === String(id) && (String(f.tipo) === '2' || f.tipo === 'COMPLEMENTO'));

            const totalFacturas = facturasAsociadas.length;
            const totalComplementos = complementosAsociados.length;

            // Construir mensaje de confirmación
            let mensaje = `<div class="text-start">
                <p class="mb-2"><strong>Estimación:</strong> ${estimacion.tipo || 'ESTIMACION'} ${estimacion.numero || ''}</p>
                <p class="mb-2"><strong>Monto:</strong> ${_formatCurrency(estimacion.montoNeto || estimacion.monto || 0)}</p>`;

            if (totalFacturas > 0 || totalComplementos > 0) {
                mensaje += `<hr class="my-2">
                    <p class="text-danger mb-1"><i class="bi bi-exclamation-triangle-fill me-2"></i><strong>Se eliminarán también:</strong></p>
                    <ul class="mb-0 ps-3">`;
                if (totalFacturas > 0) {
                    mensaje += `<li>${totalFacturas} factura(s)</li>`;
                }
                if (totalComplementos > 0) {
                    mensaje += `<li>${totalComplementos} complemento(s) de pago</li>`;
                }
                mensaje += `</ul>`;
            }
            mensaje += `</div>`;

            // Modal de confirmación con SweetAlert2
            const result = await Swal.fire({
                title: '¿Eliminar Estimación?',
                html: mensaje,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#dc3545',
                cancelButtonColor: '#6c757d',
                confirmButtonText: '<i class="bi bi-trash me-1"></i> Eliminar Todo',
                cancelButtonText: 'Cancelar',
                focusCancel: true
            });

            if (!result.isConfirmed) return;

            try {
                _setGlobalLoader(true, 'Eliminando estimación y registros asociados...');

                // 1. Eliminar complementos del servidor
                for (const comp of complementosAsociados) {
                    try {
                        await serverCall('eliminarFactura', comp.id);
                    } catch (e) {
                        console.warn('Error eliminando complemento:', comp.id, e);
                    }
                }

                // 2. Eliminar facturas del servidor
                for (const fact of facturasAsociadas) {
                    try {
                        await serverCall('eliminarFactura', fact.id);
                    } catch (e) {
                        console.warn('Error eliminando factura:', fact.id, e);
                    }
                }

                // 3. Eliminar estimación del servidor
                await serverCall('eliminarEstimacion', id);

                // 4. Actualizar estado local
                // Eliminar facturas y complementos del estado local
                state.data.facturasEstimaciones = (state.data.facturasEstimaciones || [])
                    .filter(f => String(f.idEstimacion) !== String(id));

                // Eliminar estimación del estado local
                const idx = (state.data.estimaciones || []).findIndex(e => String(e.id) === String(id));
                if (idx > -1) {
                    state.data.estimaciones.splice(idx, 1);
                }

                // 5. Re-renderizar
                _renderFinanciero();

                // Limpiar selección si era la estimación seleccionada
                if (state.ui.selectedEstimacionId === id) {
                    state.ui.selectedEstimacionId = null;
                    // Mostrar placeholder de facturas
                    const placeholderC = document.getElementById('facturas-placeholder-constructora');
                    const dataContainerC = document.getElementById('facturas-data-constructora');
                    if (placeholderC) placeholderC.classList.remove('d-none');
                    if (dataContainerC) dataContainerC.classList.add('d-none');
                }

                globalThis.showToast?.(`Estimación y ${totalFacturas + totalComplementos} registros asociados eliminados`, 'success');
            } catch (e) {
                console.error('Error en eliminación en cascada:', e);
                Swal.fire('Error', 'No se pudo completar la eliminación: ' + e.message, 'error');
            } finally {
                _setGlobalLoader(false);
            }
        }

        async function registrarComplemento(idFactura) {
            const btn = event?.currentTarget || document.activeElement; // Capture button if safely possible
            const folioInput = document.getElementById(`input-comp-folio-${idFactura}`);
            const fechaInput = document.getElementById(`input-comp-fecha-${idFactura}`);
            const uuidInput = document.getElementById(`input-comp-uuid-${idFactura}`);
            const montoInput = document.getElementById(`input-comp-monto-${idFactura}`);
            const ivaInput = document.getElementById(`input-comp-iva-${idFactura}`);
            const totalInput = document.getElementById(`input-comp-total-${idFactura}`);

            if (!folioInput || !fechaInput) return;

            const folio = folioInput.value.trim();
            const fecha = fechaInput.value;
            const uuid = uuidInput ? uuidInput.value.trim() : '';

            // Clean currency inputs
            const cleanNumber = (val) => parseFloat((val || '').replace(/[^0-9.-]+/g, '')) || 0;
            const monto = cleanNumber(montoInput ? montoInput.value : '');
            const iva = cleanNumber(ivaInput ? ivaInput.value : '');
            const total = cleanNumber(totalInput ? totalInput.value : '');

            if (!folio || !fecha) {
                Swal.fire('Datos Incompletos', 'Ingresa Folio y Fecha para el complemento.', 'warning');
                return;
            }

            // Disable button
            let originalContent = '';
            if (btn && btn.tagName === 'BUTTON') {
                btn.disabled = true;
                originalContent = btn.innerHTML;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>';
            }

            try {
                const payload = {
                    folio,
                    fecha,
                    uuid,
                    monto,
                    iva,
                    total,
                    tipo: 2 // 2 = COMPLEMENTO
                };

                // serverCall resolves the 'data' part if success=true.
                // If success=false, it throws an error (handled in catch).
                // So if we get here, it succeeded. 'response' is actually 'data'.
                const data = await serverCall('registrarComplemento', idFactura, payload);

                if (data) {
                    // PATCH: Force numeric type 2 (wait for propagation)
                    try {
                        const newId = data.id || (data.data && data.data.id) || (typeof data === 'number' ? data : null);

                        if (newId) {
                            console.log('Patching complement type to 2 for id:', newId);
                            // Brief delay to ensure DB insert is stable
                            await new Promise(resolve => setTimeout(resolve, 500));
                            // Only update the type with minimal payload
                            await serverCall('actualizarFactura', newId, { tipo: 2 });
                        } else {
                            console.warn('Could not extract ID for patch from data:', data);
                        }
                    } catch (ePatch) {
                        console.warn('Patch type failed:', ePatch);
                    }

                    await _reloadEstimaciones();
                    Swal.fire({
                        icon: 'success',
                        title: 'Complemento Registrado',
                        text: data.message || 'La factura ha sido actualizada (PAGADO).',
                        timer: 2000,
                        showConfirmButton: false
                    });
                }

            } catch (e) {
                console.error(e);
                Swal.fire('Error', e.message, 'error');
                // Re-enable button on error
                if (btn && btn.tagName === 'BUTTON') {
                    btn.disabled = false;
                    btn.innerHTML = originalContent || '<i class="bi bi-plus"></i>';
                }
            }
        }

        function calculateTaxForComplemento(idFactura, inputMonto) {
            const row = inputMonto.closest('tr');

            const inputIva = row.querySelector(`#input-comp-iva-${idFactura}`);

            if (inputIva) inputIva.value = _formatCurrency(iva);
            if (inputTotal) inputTotal.value = _formatCurrency(total);
        }

        // --- SUPERVISION VINCULACION & PLACEHOLDERS ---

        function _renderTableSupervisionNew(container) {
            const estSupervision = (state.data.estimaciones || [])
                .filter(e => String(e.entidad || 'CONSTRUCTORA').trim().toUpperCase() === 'SUPERVISION' || e._isPlaceholder);

            const estContratista = (state.data.estimaciones || [])
                .filter(e => String(e.entidad || 'CONSTRUCTORA').trim().toUpperCase() === 'CONSTRUCTORA');

            const table = _createTableSkeleton();
            const tbody = table.querySelector('tbody');

            const groups = {};
            const orphans = [];

            estSupervision.forEach(child => {
                const term = String(child.idRelacionada || child.idEstimacionVinculada || '').trim();
                if (term) {
                    // Verify if parent actually exists in current dataset
                    const parentExists = estContratista.some(c => String(c.id).trim() === term);
                    if (parentExists) {
                        if (!groups[term]) groups[term] = [];
                        groups[term].push(child);
                    } else {
                        // Linked to ID that is not visible/doesn't exist -> Treat as orphan
                        orphans.push(child);
                    }
                } else {
                    orphans.push(child);
                }
            });

            const linkedIds = Object.keys(groups);
            let hasContent = false;

            linkedIds.forEach(parentId => {
                const parentEst = estContratista.find(e => String(e.id).trim() === String(parentId).trim());
                if (parentEst) {
                    hasContent = true;
                    tbody.appendChild(_createParentEstimacionRow(parentEst));
                    groups[parentId].forEach(child => {
                        if (child._isPlaceholder) {
                            _renderPlaceholderRow(tbody, child);
                        } else {
                            _appendEstimacionRowPair(tbody, child, true);
                        }
                    });
                }
            });

            if (orphans.length > 0) {
                hasContent = true;
                const trSep = document.createElement('tr');
                trSep.className = 'table-warning';
                trSep.innerHTML = `<td colspan="12" class="text-center small fw-bold text-dark">ESTIMACIONES DE SUPERVISIÓN SIN VINCULAR</td>`;
                tbody.appendChild(trSep);
                orphans.forEach(child => _appendEstimacionRowPair(tbody, child, false));
            }

            if (!hasContent) {
                container.innerHTML = `<div class="text-center text-muted py-5 border rounded bg-light mb-3">
                    <i class="bi bi-link-45deg fs-2 d-block mb-2 opacity-50"></i>
                    Sin estimaciones de supervisión vinculadas.<br>
                    <small>Utilice el botón inferior para vincular una referencia.</small>
                </div>`;
            } else {
                container.appendChild(table);
            }
        }

        function _openModalVinculacion() {
            const candidates = (state.data.estimaciones || [])
                .filter(e => (e.entidad || 'CONSTRUCTORA').toUpperCase() === 'CONSTRUCTORA')
                .sort((a, b) => {
                    const typeOrder = { 'ANTICIPO': 1, 'ESTIMACION': 2, 'FINIQUITO': 3 };
                    return (typeOrder[a.tipo] - typeOrder[b.tipo]) || (parseInt(a.numero) - parseInt(b.numero));
                });

            if (candidates.length === 0) {
                Swal.fire('Atención', 'No hay estimaciones del Contratista disponibles para vincular.', 'warning');
                return;
            }

            let listHtml = '<div class="list-group text-start" style="max-height: 400px; overflow-y: auto;">';
            candidates.forEach(c => {
                const monto = _formatCurrency(c.montoTotal || c.montoAutorizado || c.monto || 0);
                const date = c.fechaCorte ? new Date(c.fechaCorte).toLocaleDateString() : 'S/F';
                const icon = c.tipo === 'ANTICIPO' ? 'bi-cash-stack' : c.tipo === 'FINIQUITO' ? 'bi-flag-fill' : 'bi-bricks';
                const color = c.tipo === 'ANTICIPO' ? 'text-warning' : c.tipo === 'FINIQUITO' ? 'text-success' : 'text-primary';

                listHtml += `
                    <button type="button" class="list-group-item list-group-item-action p-3 mb-2 border rounded shadow-sm d-flex justify-content-between align-items-center"
                        onclick="ComunicadoDetalle._confirmarVinculacion('${c.id}')">
                        <div class="d-flex align-items-center gap-3">
                            <div class="rounded-circle bg-light p-2 d-flex align-items-center justify-content-center" style="width: 45px; height: 45px;">
                                <i class="bi ${icon} ${color} fs-4"></i>
                            </div>
                            <div>
                                <h6 class="mb-0 fw-bold text-dark">${c.tipo} No. ${c.numero}</h6>
                                <small class="text-muted"><i class="bi bi-calendar3 me-1"></i> ${date} &bull; <span class="badge bg-light text-dark border">${c.estatusInterno || 'N/A'}</span></small>
                            </div>
                        </div>
                        <div class="text-end">
                            <div class="fw-bold text-dark fs-6">${monto}</div>
                            <small class="text-primary fw-bold" style="font-size: 0.75rem;">Seleccionar <i class="bi bi-chevron-right"></i></small>
                        </div>
                    </button>
                 `;
            });
            listHtml += '</div>';

            Swal.fire({
                title: 'Vincular Referencia',
                html: `
                    <p class="text-muted mb-4">Seleccione la estimación del Contratista a la que desea vincular el nuevo movimiento de Supervisión:</p>
                    ${listHtml}
                `,
                showConfirmButton: false,
                showCloseButton: true,
                width: '650px',
                padding: '2em'
            });
        }

        function _confirmarVinculacion(parentId) {
            Swal.close();
            // Small delay to allow modal to close smoothly
            setTimeout(() => _addPlaceholderSupervision(parentId), 200);
        }

        function _addPlaceholderSupervision(parentId) {
            const parent = state.data.estimaciones.find(e => String(e.id) === String(parentId));
            if (!parent) return;

            const exists = state.data.estimaciones.some(e =>
                e._isPlaceholder && String(e.idRelacionada) === String(parentId)
            );
            if (exists) {
                Swal.fire('Aviso', 'Ya existe un placeholder pendiente.', 'info');
                return;
            }

            const placeholder = {
                id: 'PLACEHOLDER-' + Date.now(),
                entidad: 'SUPERVISION',
                _isPlaceholder: true,
                idRelacionada: parent.id,
                tipo: 'NUEVA',
                numero: '?',
                montoTotal: 0,
                estatusInterno: 'BORRADOR'
            };

            state.data.estimaciones.push(placeholder);
            _renderFinanciero();
        }

        function _renderPlaceholderRow(tbody, placeholder) {
            const tr = document.createElement('tr');
            tr.className = 'bg-light';
            tr.style.backgroundColor = '#f8fbfc';
            tr.innerHTML = `
                <td colspan="12" class="py-2 border-0">
                    <div class="d-flex align-items-center" style="margin-left: 40px; border-left: 3px solid #dee2e6; padding-left: 15px;">
                        <i class="bi bi-arrow-return-right text-muted me-3"></i>
                        <button class="btn btn-sm btn-outline-primary border-dashed fw-bold shadow-sm d-flex align-items-center gap-2 px-3 py-2" 
                            onclick="ComunicadoDetalle._createSupervisionFromPlaceholder('${placeholder.id}')">
                            <i class="bi bi-plus-lg"></i> + Agregar movimiento de Supervisión
                        </button>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        }

        function _createSupervisionFromPlaceholder(placeholderId) {
            const html = `
                <div class="row g-3">
                    <div class="col-4">
                        <button class="btn btn-outline-warning w-100 h-100 py-3 d-flex flex-column align-items-center gap-2 shadow-sm"
                            onclick="ComunicadoDetalle._confirmarCreacionSupervision('${placeholderId}', 'ANTICIPO')">
                            <i class="bi bi-percent fs-1"></i>
                            <span class="fw-bold">Anticipo</span>
                        </button>
                    </div>
                    <div class="col-4">
                        <button class="btn btn-outline-primary w-100 h-100 py-3 d-flex flex-column align-items-center gap-2 shadow-sm"
                            onclick="ComunicadoDetalle._confirmarCreacionSupervision('${placeholderId}', 'ESTIMACION')">
                            <i class="bi bi-bricks fs-1"></i>
                            <span class="fw-bold">Estimación</span>
                        </button>
                    </div>
                    <div class="col-4">
                        <button class="btn btn-outline-success w-100 h-100 py-3 d-flex flex-column align-items-center gap-2 shadow-sm"
                            onclick="ComunicadoDetalle._confirmarCreacionSupervision('${placeholderId}', 'FINIQUITO')">
                            <i class="bi bi-flag-fill fs-1"></i>
                            <span class="fw-bold">Finiquito</span>
                        </button>
                    </div>
                </div>
                <div class="mt-3 text-muted small text-center">Seleccione el tipo de movimiento de supervisión a crear.</div>
             `;

            Swal.fire({
                title: 'Crear Movimiento',
                html: html,
                showConfirmButton: false,
                showCloseButton: true,
                width: '600px',
                padding: '2em'
            });
        }

        async function _confirmarCreacionSupervision(placeholderId, tipo) {
            Swal.close(); // Close selection modal

            // Wait a tick
            await new Promise(r => setTimeout(r, 100));

            const placeholder = state.data.estimaciones.find(e => e.id === placeholderId);
            if (!placeholder) return;

            const existentes = (state.data.estimaciones || [])
                .filter(e => (e.entidad || 'CONSTRUCTORA') === 'SUPERVISION' && e.tipo === tipo && !e._isPlaceholder);

            let numero = tipo === 'ANTICIPO' ? 'A' : tipo === 'FINIQUITO' ? 'F' : String(existentes.length + 1);

            // ========================================
            // CÁLCULO AUTOMÁTICO DEL MONTO SUPERVISIÓN
            // ========================================
            let montoCalculado = 0;

            // 1. Buscar la estimación CONSTRUCTORA vinculada
            const idVinculada = placeholder.idRelacionada;
            if (idVinculada) {
                const estimacionContratista = (state.data.estimaciones || [])
                    .find(e => String(e.id).trim() === String(idVinculada).trim() &&
                        String(e.entidad || 'CONSTRUCTORA').toUpperCase() === 'CONSTRUCTORA');

                if (estimacionContratista && estimacionContratista.monto) {
                    // Opción 1: 5% del monto del contratista
                    const montoContratista = parseFloat(estimacionContratista.monto) || 0;
                    montoCalculado = Math.round(montoContratista * 0.05 * 100) / 100;
                    console.log(`[Supervisión] Monto calculado: 5% de $${montoContratista} = $${montoCalculado}`);
                }
            }

            // 2. Si no hay monto del contratista, usar 50% del presupuesto de supervisión
            if (montoCalculado === 0) {
                // Buscar presupuesto de supervisión en la actualización vigente
                const presupuestoVigente = state.data.presupuestoVigente || state.data.actualizacionVigente;
                const presupuestoArray = state.data.presupuesto || [];

                let montoSupervisionPresupuesto = 0;

                if (presupuestoVigente && presupuestoVigente.montoSupervision) {
                    montoSupervisionPresupuesto = parseFloat(presupuestoVigente.montoSupervision) || 0;
                } else if (presupuestoArray.length > 0) {
                    // Buscar la última actualización
                    const ultima = presupuestoArray[presupuestoArray.length - 1];
                    montoSupervisionPresupuesto = parseFloat(ultima.montoSupervision) || 0;
                }

                if (montoSupervisionPresupuesto > 0) {
                    // 50% del presupuesto de supervisión
                    montoCalculado = Math.round(montoSupervisionPresupuesto * 0.50 * 100) / 100;
                    console.log(`[Supervisión] Monto calculado: 50% de presupuesto supervisión $${montoSupervisionPresupuesto} = $${montoCalculado}`);
                }
            }

            // Calcular IVA y Total
            const ivaCalculado = Math.round(montoCalculado * IVA_RATE * 100) / 100;
            const totalCalculado = montoCalculado + ivaCalculado;

            const payload = {
                idComunicado: state.id,
                entidad: 'SUPERVISION',
                idEmpresa: state.data.contrato?.idEmpresa || '',
                tipo: tipo,
                numero: numero,
                idRelacionada: placeholder.idRelacionada,
                monto: montoCalculado,
                iva: ivaCalculado,
                montoTotal: totalCalculado,
                estatusInterno: 'PENDIENTE',
                fechaCorte: new Date().toISOString().split('T')[0],
                facturas: []
            };

            try {
                _setGlobalLoader(true, 'Creando...');
                const response = await serverCall('crearEstimacion', payload);
                if (response && (response.success || response.data)) {
                    state.data.estimaciones = state.data.estimaciones.filter(e => e.id !== placeholderId);
                    const data = response.data || response;
                    if (data.id) {
                        payload.id = data.id;
                        // Force ID Relacionada persistence locally in case backend skeletal response lacked it
                        payload.idRelacionada = placeholder.idRelacionada;

                        state.data.estimaciones.push(payload);

                        // Set as selected
                        state.ui.selectedEstimacionId = payload.id;

                        _renderFinanciero();
                        globalThis.showToast?.('Creado exitosamente', 'success');

                        // Auto expand
                        setTimeout(() => {
                            ComunicadoDetalle.toggleInfo(payload.id);
                        }, 500);
                    }
                }
            } catch (e) {
                console.error(e);
                Swal.fire('Error', e.message, 'error');
            } finally {
                _setGlobalLoader(false);
            }
        }

        return {
            _createSupervisionFromPlaceholder,
            _confirmarVinculacion,
            _confirmarCreacionSupervision,
            init,
            mount: (container) => init(container), // Alias para mount
            render: () => '<div id="comunicado-detalle-container"></div>', // Método render requerido
            updateFinanciero, removeFinanciero,
            updatePresupuesto, removePresupuesto,
            updateEquipo, removeEquipo,
            updateTicket, removeTicket,
            desvincularContratista: _desvincularContratista, // NUEVO
            addTicket: _addTicket, // Restore just in case
            removeEstimacion, // NUEVO: Eliminar estimación
            saveEstimacion,   // NUEVO: Guardar estimación
            updateEstimacion, // NUEVO: Actualizar estimación
            liveUpdateEstimacion, // NUEVO: Actualizacion dinamica
            selectEstimacion, // NUEVO: Seleccionar estimación (Master-Detail)
            addFactura,       // NUEVO: Agregar factura
            _addEstimacion,   // NUEVO: Agregar estimacion (Required for button)
            // Facturas & Bitácora
            toggleInfo,
            openBitacoraModal,
            updateFactura,
            saveFactura,
            removeFactura,
            addBitacora,
            registrarComplemento, // NUEVO: Funcion exportada
            // Exportar funciones del modal
            abrirEditorPresupuesto,
            addLineaPresupuesto,
            removeLineaPresupuesto,
            updateLineaPresupuesto,
            calcularSupervision,
            toggleManualInput,
            // NUEVO: Función para modal de tipo
            crearActualizacionConTipo,
            calculateTaxForComplemento, // Export helper
            _openModalVinculacion,
            _confirmarVinculacion,
            _onContratistaFilterChange
        };

    })();

    // EXPLICIT GLOBAL REGISTRATION TO ENSURE IT'S FOUND
    globalThis.ComunicadoDetalle = Componente;
    window.ComunicadoDetalle = Componente;
    console.log('✅ ComunicadoDetalle registrado globalmente como:', globalThis.ComunicadoDetalle);

    // Función global para manejar el acordeón de facturas
    function toggleChildRows(parentId, btnElement) {
        const icon = btnElement.querySelector('i');
        const rows = document.querySelectorAll(`.child-row-${parentId}`);

        // Determinar estado actual basado en si la primera fila está visible
        const isHidden = rows.length > 0 && rows[0].style.display === 'none';

        rows.forEach(row => {
            row.style.display = isHidden ? 'table-row' : 'none';
        });

        // Cambiar icono
        if (isHidden) {
            // Ahora está abierto -> mostrar icono MENOS
            icon.classList.remove('bi-plus-square-fill');
            icon.classList.add('bi-dash-square-fill');
        } else {
            // Ahora está cerrado -> mostrar icono MAS
            icon.classList.remove('bi-dash-square-fill');
            icon.classList.add('bi-plus-square-fill');
        }
    }
</script>

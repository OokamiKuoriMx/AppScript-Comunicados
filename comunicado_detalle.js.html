        // Eliminar estimación del estado local con restricciones de integridad
        async function removeEstimacion(id) {
            // Encontrar la estimación
            const estimacion = (state.data.estimaciones || []).find(e => String(e.id) === String(id));
            if (!estimacion) return;

            // RESTRICTION 0: Chronological LIFO Audit
            const activeEsts = (state.data.estimaciones || [])
                .filter(e => e.estatusInterno !== 'CANCELADO' && (e.entidad || 'CONSTRUCTORA') === (estimacion.entidad || 'CONSTRUCTORA')) // Filter by same Entity!
                .sort((a, b) => {
                    const typeScore = (t) => t === 'ANTICIPO' ? 1 : (t === 'FINIQUITO' ? 3 : 2);
                    let scoreA = typeScore(a.tipo || 'ESTIMACION');
                    let scoreB = typeScore(b.tipo || 'ESTIMACION');
                    if (scoreA !== scoreB) return scoreA - scoreB;
                    return new Date(a.fechaCorte) - new Date(b.fechaCorte);
                });

            // Check if last
            const isLast = activeEsts.length > 0 && activeEsts[activeEsts.length - 1].id === estimacion.id;

            // Relaxed Rule for Supervision: Allow delete if PENDIENTE even if not last (to fix date errors)
            const isSupervision = (estimacion.entidad || 'CONSTRUCTORA') === 'SUPERVISION';
            const isPendiente = estimacion.estatusInterno === 'PENDIENTE';
            const ignoreLifo = isSupervision && isPendiente;

            if (!isLast && !ignoreLifo) {
                _showAlert('Acción Bloqueada', 'No se puede eliminar porque existe un registro posterior. Elimine el más reciente primero.', 'warning');
                return;
            }

            // Check Amortization for Anticipo
            if (estimacion.tipo === 'ANTICIPO') {
                const isAmortized = activeEsts.some(e => (parseFloat(e.amortizacion) || 0) > 0);
                if (isAmortized) {
                    _showAlert('Acción Bloqueada', 'Este Anticipo ya ha sido amortizado en estimaciones posteriores. No puede eliminarse.', 'warning');
                    return;
                }
            }

            // RESTRICTION 1: Linked to Supervision?
            // If this is a Contractor Est, check if any Supervision Est references it.
            const isLinked = (state.data.estimaciones || []).some(e => String(e.idRelacionada) === String(id) && e.estatusInterno !== 'CANCELADO');
            if (isLinked) {
                _showAlert('Acción Bloqueada', 'Esta estimación está vinculada a una supervisión. Elimine primero la estimación de supervisión asociada.', 'warning');
                return;
            }

            // RESTRICTION 2: Has Invoices or Complements?
            const facturasAsociadas = (state.data.facturasEstimaciones || [])
                .filter(f => String(f.idEstimacion) === String(id) && f.estatusSAT !== 'CANCELADO');

            if (facturasAsociadas.length > 0) {
                _showAlert('Acción Bloqueada', `Esta estimación tiene ${facturasAsociadas.length} facturas/complementos activos. Debe eliminarlos primero.`, 'warning');
                return;
            }

            if (estimacion.estatusInterno === 'PAGADO') {
                _showAlert('No permitido', 'No se puede eliminar una estimación PAGADA.', 'warning');
                return;
            }

            // Confirmación con Modal Genérico (Doble confirmación + Spin)
            _showDeleteModal(
                'Eliminar Estimación',
                `¿Está seguro de eliminar <strong>${({ '1': 'ANTICIPO', '2': 'ESTIMACION', '3': 'FINIQUITO' }[String(estimacion.tipo)] || estimacion.tipo)} ${estimacion.numero}</strong> por <strong>${_formatCurrency(estimacion.monto)}</strong>?`,
                async () => {
                    try {
                        // Si es temporal, borrar localmente
                        if (String(id).startsWith('temp-')) {
                            state.data.estimaciones = state.data.estimaciones.filter(e => String(e.id) !== String(id));
                            // Eliminar también facturas temp asociadas
                            state.data.facturasEstimaciones = state.data.facturasEstimaciones.filter(f => String(f.idEstimacion) !== String(id));
                        } else {
                            // Server call
                            await serverCall('eliminarEstimacion', id);
                            // Update Local State
                            state.data.estimaciones = state.data.estimaciones.filter(e => String(e.id) !== String(id));
                            state.data.facturasEstimaciones = state.data.facturasEstimaciones.filter(f => String(f.idEstimacion) !== String(id));
                        }

                        // Re-render
                        _renderFinanciero();
                        _renderPresupuesto();

                        // Clear selection if needed
                        if (state.ui.selectedEstimacionId === id) {
                            state.ui.selectedEstimacionId = null;
                            // Reset Validation/Placeholder UI if needed
                            const placeholderC = document.getElementById('facturas-placeholder-constructora');
                            const dataContainerC = document.getElementById('facturas-data-constructora');
                            if (placeholderC) placeholderC.classList.remove('d-none');
                            if (dataContainerC) dataContainerC.classList.add('d-none');
                        }

                        // Update summaries
                        _updateResumenFinanciero();

                        globalThis.showToast?.('Estimación eliminada', 'success');

                    } catch (e) {
                        console.error(e);
                        _showAlert('Error', 'Falló la eliminación: ' + e.message, 'error');
                        throw e; // Signal error to modal logic
                    }
                }
            );

        }

        // --- NEW HELPER: Generic Delete Modal ---
        function _showDeleteModal(title, htmlMessage, deleteActionAsync) {
            const modalEl = document.getElementById('modalDeleteGeneric');
            const modal = bootstrap.Modal.getOrCreateInstance(modalEl);

            // Set Content
            document.getElementById('modalDeleteGenericTitle').innerHTML = `<i class="bi bi-exclamation-triangle-fill me-2"></i>${title}`;
            document.getElementById('modalDeleteGenericMessage').innerHTML = htmlMessage;
            document.getElementById('modalDeleteGenericExtraWarning').classList.add('d-none');

            // Reset Button State
            const btn = document.getElementById('btnConfirmDeleteGeneric');
            const spinner = btn.querySelector('.spinner-border');

            // Get secondary buttons to lock them too
            const cancelBtn = modalEl.querySelector('.btn-outline-secondary');
            const closeBtn = modalEl.querySelector('.btn-close');

            btn.disabled = false;
            if (cancelBtn) cancelBtn.disabled = false;
            if (closeBtn) closeBtn.disabled = false;

            spinner.classList.add('d-none');

            // Assign Action
            btn.onclick = async () => {
                // UI: Loading State - LOCK EVERYTHING
                btn.disabled = true;
                if (cancelBtn) cancelBtn.disabled = true;
                if (closeBtn) closeBtn.disabled = true;
                spinner.classList.remove('d-none');

                try {
                    await deleteActionAsync();
                    // Success: Close Modal
                    modal.hide();
                } catch (e) {
                    // Error: Reset Button to allow retry or cancel
                    btn.disabled = false;
                    if (cancelBtn) cancelBtn.disabled = false;
                    if (closeBtn) closeBtn.disabled = false;
                    spinner.classList.add('d-none');
                }
            };

            modal.show();
        }

        async function registrarComplemento(idFactura) {
            const btn = event?.currentTarget || document.activeElement; // Capture button if safely possible
            const folioInput = document.getElementById(`input-comp-folio-${idFactura}`);
            const fechaInput = document.getElementById(`input-comp-fecha-${idFactura}`);
            const uuidInput = document.getElementById(`input-comp-uuid-${idFactura}`);
            const montoInput = document.getElementById(`input-comp-monto-${idFactura}`);
            const ivaInput = document.getElementById(`input-comp-iva-${idFactura}`);
            const totalInput = document.getElementById(`input-comp-total-${idFactura}`);

            if (!folioInput || !fechaInput) return;

            const folio = folioInput.value.trim();
            const fecha = fechaInput.value;
            const uuid = uuidInput ? uuidInput.value.trim() : '';

            // Clean currency inputs
            const cleanNumber = (val) => parseFloat((val || '').replace(/[^0-9.-]+/g, '')) || 0;
            const monto = cleanNumber(montoInput ? montoInput.value : '');
            const iva = cleanNumber(ivaInput ? ivaInput.value : '');
            const total = cleanNumber(totalInput ? totalInput.value : '');

            if (!folio || !fecha) {
                Swal.fire('Datos Incompletos', 'Ingresa Folio y Fecha para el complemento.', 'warning');
                return;
            }

            // Disable button
            let originalContent = '';
            if (btn && btn.tagName === 'BUTTON') {
                btn.disabled = true;
                originalContent = btn.innerHTML;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>';
            }

            try {
                const payload = {
                    folio,
                    fecha,
                    uuid,
                    monto,
                    iva,
                    total,
                    tipo: 2 // 2 = COMPLEMENTO
                };

                // serverCall resolves the 'data' part if success=true.
                // If success=false, it throws an error (handled in catch).
                // So if we get here, it succeeded. 'response' is actually 'data'.
                const data = await serverCall('registrarComplemento', idFactura, payload);

                if (data) {
                    // PATCH: Force numeric type 2 (wait for propagation)
                    try {
                        const newId = data.id || (data.data && data.data.id) || (typeof data === 'number' ? data : null);

                        if (newId) {
                            console.log('Patching complement type to 2 for id:', newId);
                            // Brief delay to ensure DB insert is stable
                            await new Promise(resolve => setTimeout(resolve, 500));
                            // Only update the type with minimal payload
                            await serverCall('actualizarFactura', newId, { tipo: 2 });
                        } else {
                            console.warn('Could not extract ID for patch from data:', data);
                        }
                    } catch (ePatch) {
                        console.warn('Patch type failed:', ePatch);
                    }

                    await _reloadEstimaciones();
                    Swal.fire({
                        icon: 'success',
                        title: 'Complemento Registrado',
                        text: data.message || 'La factura ha sido actualizada (PAGADO).',
                        timer: 2000,
                        showConfirmButton: false
                    });
                }

            } catch (e) {
                console.error(e);
                Swal.fire('Error', e.message, 'error');
                // Re-enable button on error
                if (btn && btn.tagName === 'BUTTON') {
                    btn.disabled = false;
                    btn.innerHTML = originalContent || '<i class="bi bi-plus"></i>';
                }
            }
        }

                        if (!groups[term]) groups[term] = [];
                        groups[term].push(child);
                    } else {

                        orphans.push(child);
                    }
                } else {

                if (parentEst) {
                    hasContent = true;
                    tbody.appendChild(_createParentEstimacionRow(parentEst));

                            _renderPlaceholderRow(tbody, child);

            });

                trSep.innerHTML = `<td colspan="12" class="text-center small fw-bold text-dark">ESTIMACIONES DE SUPERVISIÓN SIN VINCULAR</td>`;
                tbody.appendChild(trSep);
                orphans.forEach(child => _appendEstimacionRowPair(tbody, child, false));
            }

            if (!hasContent) {
                container.innerHTML = `<div class="text-center text-muted py-5 border rounded bg-light mb-3">
                    <i class="bi bi-link-45deg fs-2 d-block mb-2 opacity-50"></i>
                    Sin estimaciones de supervisión vinculadas.<br>
                    <small>Utilice el botón inferior para vincular una referencia.</small>
                </div>`;
            } else {
                container.appendChild(table);
            }
        }

        function _openModalVinculacion() {
            // 1. Identify IDs already linked by active Supervision estimations
            const linkedIds = (state.data.estimaciones || [])
                .filter(e => (e.entidad || 'CONSTRUCTORA').toUpperCase() === 'SUPERVISION' && e.estatusInterno !== 'CANCELADO')
                .map(e => String(e.idRelacionada || ''));

            const candidates = (state.data.estimaciones || [])
                .filter(e => {
                    const isConst = (e.entidad || 'CONSTRUCTORA').toUpperCase() === 'CONSTRUCTORA';
                    const isLinked = linkedIds.includes(String(e.id));
                    return isConst && !isLinked;
                })
                .sort((a, b) => {
                    const typeOrder = { 'ANTICIPO': 1, 'ESTIMACION': 2, 'FINIQUITO': 3 };
                    return (typeOrder[a.tipo] - typeOrder[b.tipo]) || (parseInt(a.numero) - parseInt(b.numero));
                });

            if (candidates.length === 0) {
                Swal.fire('Atención', 'No hay estimaciones del Contratista disponibles para vincular.', 'warning');
                return;
            }

            let listHtml = '<div class="list-group text-start" style="max-height: 400px; overflow-y: auto;">';
            candidates.forEach(c => {
                const monto = _formatCurrency(c.montoTotal || c.montoAutorizado || c.monto || 0);
                const date = c.fechaCorte ? new Date(c.fechaCorte).toLocaleDateString() : 'S/F';

                // TRADUCCION DE TIPOS (1, 2, 3 -> TEXTO)
                let tipoNombre = String(c.tipo || '').toUpperCase();
                const tipoMap = { '1': 'ESTIMACION', '2': 'ANTICIPO', '3': 'FINIQUITO' };
                if (tipoMap[tipoNombre]) tipoNombre = tipoMap[tipoNombre];

                // Fallback icon/color logic based on resolved name
                const icon = tipoNombre === 'ANTICIPO' ? 'bi-cash-stack' : tipoNombre === 'FINIQUITO' ? 'bi-flag-fill' : 'bi-bricks';
                const color = tipoNombre === 'ANTICIPO' ? 'text-warning' : tipoNombre === 'FINIQUITO' ? 'text-success' : 'text-primary';

                listHtml += `
                    <button type="button" class="list-group-item list-group-item-action p-3 mb-2 border rounded shadow-sm d-flex justify-content-between align-items-center"
                        onclick="ComunicadoDetalle._confirmarVinculacion('${c.id}')">
                        <div class="d-flex align-items-center gap-3">
                            <div class="rounded-circle bg-light p-2 d-flex align-items-center justify-content-center" style="width: 45px; height: 45px;">
                                <i class="bi ${icon} ${color} fs-4"></i>
                            </div>
                            <div>
                                <h6 class="mb-0 fw-bold text-dark">${tipoNombre} No. ${c.numero}</h6>
                                <small class="text-muted"><i class="bi bi-calendar3 me-1"></i> ${date} &bull; <span class="badge bg-light text-dark border">${c.estatusInterno || 'N/A'}</span></small>
                            </div>
                        </div>
                        <div class="text-end">
                            <div class="fw-bold text-dark fs-6">${monto}</div>
                            <small class="text-primary fw-bold" style="font-size: 0.75rem;">Seleccionar <i class="bi bi-chevron-right"></i></small>
                        </div>
                    </button>
                 `;
            });
            listHtml += '</div>';

            Swal.fire({
                title: 'Vincular Referencia',
                html: `
                    <p class="text-muted mb-4">Seleccione la estimación del Contratista a la que desea vincular el nuevo movimiento de Supervisión:</p>
                    ${listHtml}
                `,
                showConfirmButton: false,
                showCloseButton: true,
                width: '650px',
                padding: '2em'
            });
        }

        function _confirmarVinculacion(parentId) {
            Swal.close();
            // Small delay to allow modal to close smoothly
            setTimeout(() => _addPlaceholderSupervision(parentId), 200);
        }

        function _addPlaceholderSupervision(parentId) {
            const parent = state.data.estimaciones.find(e => String(e.id) === String(parentId));
            if (!parent) return;

            const exists = state.data.estimaciones.some(e =>
                e._isPlaceholder && String(e.idRelacionada) === String(parentId)
            );
            if (exists) {
                Swal.fire('Aviso', 'Ya existe un placeholder pendiente.', 'info');
                return;
            }

            const placeholder = {
                id: 'PLACEHOLDER-' + Date.now(),
                entidad: 'SUPERVISION',
                _isPlaceholder: true,
                idRelacionada: parent.id,
                tipo: 'NUEVA',
                numero: '?',
                montoTotal: 0,
                estatusInterno: 'BORRADOR'
            };

            state.data.estimaciones.push(placeholder);
            _renderFinanciero();
        }

        function _renderPlaceholderRow(tbody, placeholder) {
            const tr = document.createElement('tr');
            tr.className = 'bg-light';
            tr.style.backgroundColor = '#f8fbfc';
            tr.innerHTML = `
                <td colspan="12" class="py-2 border-0">
                    <div class="d-flex align-items-center" style="margin-left: 40px; border-left: 3px solid #dee2e6; padding-left: 15px;">
                        <i class="bi bi-arrow-return-right text-muted me-3"></i>
                        <button class="btn btn-sm btn-outline-primary border-dashed fw-bold shadow-sm d-flex align-items-center gap-2 px-3 py-2" 
                            onclick="ComunicadoDetalle._createSupervisionFromPlaceholder('${placeholder.id}')">
                            <i class="bi bi-plus-lg"></i> + Agregar movimiento de Supervisión
                        </button>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        }

        function _createSupervisionFromPlaceholder(placeholderId) {
            const html = `
                <div class="row g-3">
                    <div class="col-4">
                        <button class="btn btn-outline-warning w-100 h-100 py-3 d-flex flex-column align-items-center gap-2 shadow-sm"
                            onclick="ComunicadoDetalle._confirmarCreacionSupervision('${placeholderId}', 'ANTICIPO')">
                            <i class="bi bi-percent fs-1"></i>
                            <span class="fw-bold">Anticipo</span>
                        </button>
                    </div>
                    <div class="col-4">
                        <button class="btn btn-outline-primary w-100 h-100 py-3 d-flex flex-column align-items-center gap-2 shadow-sm"
                            onclick="ComunicadoDetalle._confirmarCreacionSupervision('${placeholderId}', 'ESTIMACION')">
                            <i class="bi bi-bricks fs-1"></i>
                            <span class="fw-bold">Estimación</span>
                        </button>
                    </div>
                    <div class="col-4">
                        <button class="btn btn-outline-success w-100 h-100 py-3 d-flex flex-column align-items-center gap-2 shadow-sm"
                            onclick="ComunicadoDetalle._confirmarCreacionSupervision('${placeholderId}', 'FINIQUITO')">
                            <i class="bi bi-flag-fill fs-1"></i>
                            <span class="fw-bold">Finiquito</span>
                        </button>
                    </div>
                </div>
                <div class="mt-3 text-muted small text-center">Seleccione el tipo de movimiento de supervisión a crear.</div>
             `;

            Swal.fire({
                title: 'Crear Movimiento',
                html: html,
                showConfirmButton: false,
                showCloseButton: true,
                width: '600px',
                padding: '2em'
            });
        }

        // MOVEMENT: _confirmarCreacionSupervision (Modified for GHOST/LOCAL creation)
        async function _confirmarCreacionSupervision(placeholderId, tipo) {
            Swal.close(); // Close selection modal

            // Wait a tick
            await new Promise(r => setTimeout(r, 100));

            const placeholder = state.data.estimaciones.find(e => e.id === placeholderId);
            if (!placeholder) return;

            const existentes = (state.data.estimaciones || [])
                .filter(e => (e.entidad || 'CONSTRUCTORA') === 'SUPERVISION' && e.tipo === tipo && !e._isPlaceholder);

            let numero = tipo === 'ANTICIPO' ? 'A' : tipo === 'FINIQUITO' ? 'F' : String(existentes.length + 1);

            // ========================================
            // CÁLCULO AUTOMÁTICO DEL MONTO SUPERVISIÓN
            // ========================================
            let montoCalculado = 0;

            // 1. Buscar la estimación CONSTRUCTORA vinculada
            const idVinculada = placeholder.idRelacionada;
            if (idVinculada) {
                const estimacionContratista = (state.data.estimaciones || [])
                    .find(e => String(e.id).trim() === String(idVinculada).trim() &&
                        String(e.entidad || 'CONSTRUCTORA').toUpperCase() === 'CONSTRUCTORA');

                if (estimacionContratista && estimacionContratista.monto) {
                    // Opción 1: 5% del monto del contratista
                    const montoContratista = parseFloat(estimacionContratista.monto) || 0;
                    montoCalculado = Math.round(montoContratista * 0.05 * 100) / 100;
                    console.log(`[Supervisión] Monto calculado: 5% de $${montoContratista} = $${montoCalculado}`);
                }
            }

            // 2. Si no hay monto del contratista, usar 50% del presupuesto de supervisión
            if (montoCalculado === 0) {
                // Buscar presupuesto de supervisión en la actualización vigente
                const presupuestoVigente = state.data.presupuestoVigente || state.data.actualizacionVigente;
                const presupuestoArray = state.data.presupuesto || [];

                let montoSupervisionPresupuesto = 0;

                if (presupuestoVigente && presupuestoVigente.montoSupervision) {
                    montoSupervisionPresupuesto = parseFloat(presupuestoVigente.montoSupervision) || 0;
                } else if (presupuestoArray.length > 0) {
                    // Buscar la última actualización
                    const ultima = presupuestoArray[presupuestoArray.length - 1];
                    montoSupervisionPresupuesto = parseFloat(ultima.montoSupervision) || 0;
                }

                if (montoSupervisionPresupuesto > 0) {
                    // 50% del presupuesto de supervisión
                    montoCalculado = Math.round(montoSupervisionPresupuesto * 0.50 * 100) / 100;
                    console.log(`[Supervisión] Monto calculado: 50% de presupuesto supervisión $${montoSupervisionPresupuesto} = $${montoCalculado}`);
                }
            }

            // Calcular IVA y Total (Base = Monto - Amortizacion)
            // Supervision amortizacion usually 0, but good for consistency
            const amort = 0; // Hardcoded 0 for supervision generic create
            const baseGravable = Math.max(0, montoCalculado - amort);

            const ivaCalculado = Math.round(baseGravable * IVA_RATE * 100) / 100;
            const totalCalculado = baseGravable + ivaCalculado;

            // TEMP ID GENERATION
            const tempId = 'temp-' + Date.now() + '-' + Math.floor(Math.random() * 1000);

            const payload = {
                id: tempId, // Local ID
                idComunicado: state.id,
                entidad: 'SUPERVISION',
                idEmpresa: state.data.contrato?.idEmpresa || '',
                tipo: ({ 'ANTICIPO': 1, 'ESTIMACION': 2, 'FINIQUITO': 3 }[tipo] || tipo),
                numero: numero,
                idRelacionada: placeholder.idRelacionada,
                monto: montoCalculado,
                iva: ivaCalculado,
                montoTotal: totalCalculado,
                montoAvanceFisico: 0,
                porcentajeAvanceFisico: 0,
                amortizacion: 0,
                estatusInterno: 'PENDIENTE',
                fechaCorte: new Date().toISOString().split('T')[0],
                // Local UI Props
                _isNew: true,
                _modified: true,
                facturas: []
            };

            // Remove placeholder
            state.data.estimaciones = state.data.estimaciones.filter(e => e.id !== placeholderId);

            // Push New
            state.data.estimaciones.push(payload);

            // Set Selected
            state.ui.selectedEstimacionId = tempId;

            // Render
            _renderFinanciero();
            globalThis.showToast?.('Registro creado (sin guardar).', 'info');

            // Auto expand
            setTimeout(() => {
                ComunicadoDetalle.toggleInfo(tempId);
            }, 500);
        }

        // --- SAFE UPDATE FOR ESTIMACIONES ---
        function updateEstimacionSafe(id, field, val) {
            const item = (state.data.estimaciones || []).find(e => String(e.id) === String(id));
            if (!item) return;

            // Clean Number
            const cleanVal = parseFloat(String(val).replace(/[^0-9.-]+/g, '')) || 0;
            item[field] = cleanVal;
            item._modified = true; // Mark modified

            // 1. Update Input Field formatting immediately (Formatter)
            //    Locate input by ID since we added them
            let inputId = '';
            if (field === 'monto') inputId = `input-monto-${id}`;
            else if (field === 'amortizacion') inputId = `input-amortizacion-${id}`;
            else if (field === 'montoAvanceFisico') inputId = `input-avfisico-${id}`;

            if (inputId) {
                const inputEl = document.getElementById(inputId);
                if (inputEl) {
                    inputEl.value = _formatCurrency(cleanVal);
                }
            }

            // 2. Auto-calc Financials if monto/amortizacion changed
            if (field === 'monto' || field === 'amortizacion') {
                const m = parseFloat(item.monto) || 0;
                const a = parseFloat(item.amortizacion) || 0;

                // Calc IVA using Net Base (Monto - Amortizacion)
                // This accounts for the fact that Anticipo amortization already had tax paid/deducted.
                const base = Math.max(0, m - a);
                const ivaRaw = base * IVA_RATE;

                item.iva = Math.round(ivaRaw * 100) / 100;
                item.montoTotal = base + item.iva;

                // Update UI text content
                const elNeto = document.getElementById(`input-neto-${id}`);
                const elIva = document.getElementById(`input-iva-${id}`);
                const elTotal = document.getElementById(`input-total-${id}`);

                if (elNeto) elNeto.textContent = _formatCurrency(m - a);
                if (elIva) elIva.textContent = _formatCurrency(item.iva);
                if (elTotal) elTotal.textContent = _formatCurrency(item.montoTotal);
            }

            // Update Save Button State
            const btn = document.querySelector(`button[onclick="ComunicadoDetalle.saveEstimacion('${id}')"]`);
            if (btn) {
                btn.disabled = false;
                btn.style.opacity = '1';
                btn.title = "Guardar Cambios";
            }
        }

        async function saveEstimacion(id) {
            const item = (state.data.estimaciones || []).find(e => String(e.id) === String(id));
            if (!item) return;

            _setGlobalLoader(true, 'Guardando...');
            try {
                // Check if NEW (Temp ID)
                if (String(item.id).startsWith('temp-') || item._isNew) {
                    // Create
                    const payload = { ...item };
                    delete payload.id; // Remove temp ID
                    delete payload._isNew;
                    delete payload._modified;

                    const result = await serverCall('crearEstimacion', payload);

                    if (result && (result.id || result.success)) {
                        const realId = result.id || result.data?.id; // backend might wrap, check implementation

                        if (realId) {
                            item.id = realId;
                        }

                        delete item._isNew;
                        delete item._modified;
                        globalThis.showToast?.('Estimación creada exitosamente', 'success');
                    } else {
                        throw new Error("Respuesta inválida al crear");
                    }
                } else {
                    // Update Existing
                    // Ensure we send the FULL item with updated numeric values
                    await serverCall('actualizarEstimacion', id, item);
                    item._modified = false;
                    globalThis.showToast?.('Estimación guardada', 'success');
                }

                _renderFinanciero();
                _updateResumenFinanciero();
            } catch (e) {
                console.error(e);
                Swal.fire('Error', 'No se pudo guardar: ' + e.message, 'error');
            } finally {
                _setGlobalLoader(false);
            }
        }

        return {
            _createSupervisionFromPlaceholder,
            _confirmarVinculacion,
            _confirmarCreacionSupervision,
            init,
            mount: (container) => init(container), // Alias para mount
            render: () => '<div id="comunicado-detalle-container"></div>', // Método render requerido
            updateFinanciero, removeFinanciero,
            // Export New
            abrirModalMovimiento, crearMovimiento, updateEstimacionSafe,
            updatePresupuesto, removePresupuesto,
            updateEquipo, removeEquipo,
            updateTicket, removeTicket,
            desvincularContratista: _desvincularContratista, // NUEVO
            addTicket: _addTicket, // Restore just in case
            removeEstimacion, // NUEVO: Eliminar estimación
            saveEstimacion,   // NUEVO: Guardar estimación
            updateEstimacion: updateEstimacionSafe, // ALIAS FOR SAFE UPDATE
            updateEstimacionSafe, // EXPORTED AS IS
            liveUpdateEstimacion, // NUEVO: Actualizacion dinamica
            selectEstimacion, // NUEVO: Seleccionar estimación (Master-Detail)
            addFactura,       // NUEVO: Agregar factura
            _addEstimacion,   // NUEVO: Agregar estimacion (Required for button)
            // Facturas & Bitácora
            toggleInfo,
            openBitacoraModal,
            updateFactura,
            saveFactura,
            removeFactura,
            addBitacora,
            addBitacora,
            addComplemento,
            toggleChildRows, // EXPORTED
            // Exportar funciones del modal
            abrirEditorPresupuesto,
            addLineaPresupuesto,
            removeLineaPresupuesto,
            updateLineaPresupuesto,
            calcularSupervision,
            toggleManualInput,
            // NUEVO: Función para modal de tipo
            crearActualizacionConTipo,
            calculateTaxForComplemento, // Export helper
            _openModalVinculacion,
            _confirmarVinculacion,
            _confirmarVinculacion,
            _onContratistaFilterChange,
            _updateTableTotals // Export helper just in case
        };

        function _updateTableTotals(entidad) {
            if (!entidad) return;
            const targetEntidad = entidad.toUpperCase();

            // 1. Filtrar estimaciones activas de esta entidad
            const items = (state.data.estimaciones || [])
                .filter(e => (e.entidad || 'CONSTRUCTORA').toUpperCase() === targetEntidad && e.estatusInterno !== 'CANCELADO');

            // 2. Calcular Sumatorias
            // Neto: monto - amortizacion
            // IVA: iva
            // Total: montoTotal
            let sumNeto = 0;
            let sumIva = 0;
            let sumTotal = 0;

            items.forEach(item => {
                const m = parseFloat(item.monto) || 0;
                const a = parseFloat(item.amortizacion) || 0;
                const i = parseFloat(item.iva) || 0;
                const t = parseFloat(item.montoTotal) || 0;

                sumNeto += (m - a);
                sumIva += i;
                sumTotal += t;
            });

            // 3. Actualizar DOM
            // IDs esperados: total-neto-constructora, total-neto-supervision (si existiera), etc.
            const suffix = targetEntidad === 'CONSTRUCTORA' ? 'constructora' : 'supervision';

            const elNeto = document.getElementById(`total-neto-${suffix}`);
            const elIva = document.getElementById(`total-iva-${suffix}`);
            const elTotal = document.getElementById(`total-${suffix}`);

            // Usamos _formatCurrency si está disponible
            if (elNeto) elNeto.textContent = _formatCurrency(sumNeto);
            if (elIva) elIva.textContent = _formatCurrency(sumIva);
            if (elTotal) elTotal.textContent = _formatCurrency(sumTotal);
        }

    })();

    // EXPLICIT GLOBAL REGISTRATION TO ENSURE IT'S FOUND
    globalThis.ComunicadoDetalle = Componente;
    window.ComunicadoDetalle = Componente;
    console.log('✅ ComunicadoDetalle registrado globalmente como:', globalThis.ComunicadoDetalle);

    // Función global para manejar el acordeón de facturas
    function toggleChildRows(parentId, btnElement) {
        const icon = btnElement.querySelector('i');
        const rows = document.querySelectorAll(`.child-row-${parentId}`);

        // Determinar estado actual basado en si la primera fila está visible
        const isHidden = rows.length > 0 && rows[0].style.display === 'none';

        rows.forEach(row => {
            row.style.display = isHidden ? 'table-row' : 'none';
        });

        // Cambiar icono
        if (isHidden) {
            // Ahora está abierto -> mostrar icono MENOS
            icon.classList.remove('bi-plus-square-fill');
            icon.classList.add('bi-dash-square-fill');
        } else {
            // Ahora está cerrado -> mostrar icono MAS
            icon.classList.remove('bi-dash-square-fill');
            icon.classList.add('bi-plus-square-fill');
        }
    }
</script>

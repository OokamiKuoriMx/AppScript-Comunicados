            if (successCount > 0 && globalThis.Comunicados && typeof Comunicados.recargar === 'function') {
                Comunicados.recargar();
            }
        };

        const _updateRowStatus = (index, type, msg) => {
            const el = document.getElementById(`row-status-${index}`);
            if (!el) return;

            if (type === 'loading') {
                el.innerHTML = `<div class="spinner-border spinner-border-sm text-primary" role="status"></div>`;
            } else if (type === 'success') {
                el.innerHTML = `<i class="bi bi-check-circle-fill text-success fs-5" title="${msg || 'Éxito'}"></i>`;
            } else if (type === 'error') {
                el.innerHTML = `<i class="bi bi-x-circle-fill text-danger fs-5" title="${msg || 'Error'}"></i>
        <div class="text-danger small mt-1" style="font-size: 0.7em; line-height: 1.1;">${msg || 'Error'}</div>`;
            }
        };

        // Función global para expandir/contraer filas de detalle
        globalThis._toggleRowDetail = (rowIndex) => {
            const detailRow = document.getElementById(`row-${rowIndex}-detail`);
            const chevron = document.getElementById(`row-${rowIndex}-chevron`);

            if (detailRow) {
                const isHidden = detailRow.classList.contains('d-none');

                if (isHidden) {
                    detailRow.classList.remove('d-none');
                    if (chevron) {
                        chevron.classList.remove('bi-chevron-right');
                        chevron.classList.add('bi-chevron-down');
                    }
                } else {
                    detailRow.classList.add('d-none');
                    if (chevron) {
                        chevron.classList.remove('bi-chevron-down');
                        chevron.classList.add('bi-chevron-right');
                    }
                }
            }
        };

        const _renderResultados = (data) => {
            // dom.previewContainer.classList.remove('d-none'); // Handled by setStage
            dom.previewBody.innerHTML = '';

            const filas = data.filas || [];
            currentPreviewData = filas; // Guardar referencia global

            // Ensure Header has Progress Column
            const theadRow = dom.previewContainer.querySelector('thead tr');
            if (theadRow && !theadRow.querySelector('.col-progress')) {
                const th = document.createElement('th');
                th.className = 'col-progress text-center';
                th.innerText = 'Progreso';
                theadRow.appendChild(th);
            }

            const resumen = data.resumen || {};

            dom.previewSummary.innerHTML = `
        <strong>Total Filas:</strong> ${resumen.total || 0} <span class="mx-2">|</span>
                <strong class="text-success">A Importar:</strong> ${resumen.validos || 0} <span class="mx-2">|</span>
                <strong class="text-secondary">Omitidos:</strong> ${resumen.omitidos || 0} <span class="mx-2">|</span>
                <strong class="text-danger">Errores:</strong> ${resumen.errores || 0}
    `;

            // Mostrar botón Confirmar solo si hay válidos > 0
            if (resumen.validos > 0) {
                dom.btnConfirmar.classList.remove('d-none');
                dom.btnConfirmar.disabled = false;
                dom.btnConfirmar.onclick = confirmar;
                dom.btnConfirmar.innerHTML = `<i class="bi bi-cloud-upload me-2"></i> Confirmar Importación(${resumen.validos})`;
            } else {
                dom.btnConfirmar.classList.add('d-none');
            }

            // Reporte de errores
            if (resumen.errores > 0) {
                dom.errorReportContainer.classList.remove('d-none');
                dom.errorReportMsg.innerHTML = `<i class="bi bi-exclamation-triangle-fill me-2"></i> Atención: <strong>${resumen.errores}</strong> registros tienen errores y NO se procesarán.`;
                dom.btnDownloadErrors.classList.add('d-none');
            } else {
                dom.errorReportContainer.classList.add('d-none');
            }

            const html = filas.map((d, i) => {
                let badgeClass = 'bg-secondary';
                let badgeText = 'DESCONOCIDO';

                if (d.status === 'OMITIDO') {
                    badgeClass = 'bg-warning text-dark';
                    badgeText = '<i class="bi bi-exclamation-triangle me-1"></i>OMITIDO';
                } else if (d.status === 'ERROR' || !d.esValido) {
                    badgeClass = 'bg-danger';
                    badgeText = '<i class="bi bi-x-circle me-1"></i>ERROR';
                } else {
                    badgeClass = 'bg-success';
                    badgeText = '<i class="bi bi-check-circle me-1"></i>VÁLIDO';
                }

                const badgeEstado = `<span class="badge ${badgeClass}">${badgeText}</span>`;

                // Analisis de entidades nuevas
                const analisisBadges = [];
                if (d.analisis) {
                    if (d.analisis.cuenta?.status === 'NUEVO') analisisBadges.push('<span class="badge bg-info text-dark ms-1">Nueva Cuenta</span>');
                    if (d.analisis.siniestro?.status === 'NUEVO') analisisBadges.push('<span class="badge bg-purple ms-1" style="background-color: #6f42c1;">Nuevo Siniestro</span>');
                    if (d.analisis.distrito?.status === 'NUEVO') analisisBadges.push('<span class="badge bg-info text-dark ms-1">Nuevo DR</span>');

                    // Comunicado Status
                    if (d.analisis.comunicado?.status === 'EXISTE') {
                        analisisBadges.push('<span class="badge bg-warning text-dark ms-1"><i class="bi bi-exclamation-circle me-1"></i>Comunicado Existente</span>');
                    } else if (d.analisis.comunicado?.status === 'NUEVO') {
                        analisisBadges.push('<span class="badge bg-success ms-1">Nuevo Comunicado</span>');
                    } else if (d.analisis.comunicado?.status === 'ACTUALIZACION_LOTE') {
                        analisisBadges.push('<span class="badge bg-info text-dark ms-1"><i class="bi bi-arrow-up-circle me-1"></i>Actualización (En Lote)</span>');
                    } else if (d.analisis.comunicado?.status === 'ACTUALIZACION_BD') {
                        analisisBadges.push('<span class="badge bg-primary ms-1"><i class="bi bi-arrow-up-circle me-1"></i>Actualización (En BD)</span>');
                    } else if (d.analisis.comunicado?.status === 'ACTUALIZACION') {
                        analisisBadges.push('<span class="badge bg-info text-dark ms-1"><i class="bi bi-arrow-up-circle me-1"></i>Actualización</span>');
                    } else if (d.analisis.comunicado?.status === 'DUPLICADO_CONTENIDO') {
                        analisisBadges.push('<span class="badge bg-danger ms-1"><i class="bi bi-exclamation-triangle me-1"></i>Posible Duplicado (Monto)</span>');
                    } else if (d.analisis.comunicado?.status === 'REEMPLAZAR') {
                        analisisBadges.push('<span class="badge bg-primary ms-1"><i class="bi bi-pencil-square me-1"></i>Actualización Detectada</span>');
                        if (d.analisis.comunicado.cambios && d.analisis.comunicado.cambios.length > 0) {
                            d.analisis.comunicado.cambios.forEach(change => {
                                analisisBadges.push(`<span class="badge bg-light text-dark border ms-1"><small>${change}</small></span>`);
                            });
                        }
                    } else if (d.analisis.comunicado?.status === 'OMITIDO') {
                        analisisBadges.push('<span class="badge bg-secondary ms-1"><i class="bi bi-slash-circle me-1"></i>Sin Cambios (Se omitirá)</span>');
                    } else if (d.analisis.comunicado?.status === 'ERROR_SIN_PADRE') {
                        analisisBadges.push('<span class="badge bg-danger ms-1"><i class="bi bi-x-circle me-1"></i>Error: Padre no existe</span>');
                    }
                }

                // Calcular número de partidas e importe
                const lineas = d.rawPayload?.lineas || [];
                const numPartidas = lineas.length;
                const importePartidas = lineas.reduce((sum, l) => sum + (parseFloat(l.importe) || 0), 0);
                const hasLineas = numPartidas > 0;

                // Generar HTML de la fila expandida con las líneas
                let expandedRowHtml = '';
                if (hasLineas) {
                    // Helper para determinar estilo de fila según acción
                    const getRowStyle = (linea) => {
                        const accion = (linea.accion || '').toUpperCase();
                        const esPreservado = linea._preservadoDeInformativo === true;

                        if (esPreservado || accion === 'PRESERVADO') {
                            return { badgeClass: 'bg-warning text-dark', rowClass: 'table-warning', label: 'PRESERVADO' };
                        } else if (accion === 'CREAR') {
                            return { badgeClass: 'bg-success', rowClass: 'table-success', label: 'CREAR' };
                        } else if (accion === 'ACTUALIZAR') {
                            return { badgeClass: 'bg-primary', rowClass: 'table-info', label: 'ACTUALIZAR' };
                        } else if (accion === 'CANCELAR') {
                            return { badgeClass: 'bg-danger', rowClass: 'table-danger text-decoration-line-through', label: 'CANCELAR' };
                        } else {
                            // MANTENER o sin acción
                            return { badgeClass: 'bg-secondary', rowClass: 'table-light text-muted', label: 'MANTENER' };
                        }
                    };

                    const lineasHtml = lineas.map((l, li) => {
                        const style = getRowStyle(l);
                        return `
        <tr class="${style.rowClass}">
                            <td class="ps-4 text-muted small">${li + 1}</td>
                            <td class="small"><span class="badge ${style.badgeClass}" style="font-size: 0.6rem;">${style.label}</span></td>
                            <td class="small">${l.concepto || l.descripcion || 'Sin descripción'}</td>
                            <td class="small text-center">${l.categoria || '-'}</td>
                            <td class="small text-end font-monospace fw-semibold">$${parseFloat(l.importe || 0).toLocaleString('es-MX', { minimumFractionDigits: 2 })}</td>
                            <td colspan="3"></td>
                        </tr >
        `}).join('');

            /**

            function _drawMap() {

                if (!container || !state.googleChartsLoaded || !google.visualization) {
                    if (loader) loader.textContent = 'Cargando librería de mapas...';

                    if (!state.googleChartsLoaded) setTimeout(_drawMap, 500);
                    return;

                if (loader) loader.classList.add('d-none');

                // 1. Prepare Data
                const counts = {};
                state.comunicados.forEach(c => {
                    let nombre = (c.estado || '').trim();
                    // Google Charts expects standard names
                    if (nombre.includes('Veracruz')) nombre = 'Veracruz';
                    if (nombre.includes('Michoacán')) nombre = 'Michoacán';
                    if (nombre.includes('México') && !nombre.includes('Ciudad')) nombre = 'State of Mexico'; // Special case
                    if (nombre.includes('CDMX') || nombre.includes('Ciudad de México')) nombre = 'Mexico City';

                    if (nombre) {
                        counts[nombre] = (counts[nombre] || 0) + 1;
                    }
                });

                const chartData = [['State', 'Comunicados']];
                Object.keys(counts).forEach(k => {
                    chartData.push([k, counts[k]]);
                });

                if (chartData.length === 1) {
                    chartData.push(['Mexico', 0]); // Empty map fallback
                }

                const data = google.visualization.arrayToDataTable(chartData);

                // 2. Options
                const options = {
                    region: 'MX', // Mexico
                    resolution: 'provinces',
                    displayMode: 'regions',
                    colorAxis: { colors: ['#cff4fc', '#0d6efd', '#0a58ca'] }, // Light blue to Dark blue
                    backgroundColor: 'transparent',
                    datalessRegionColor: '#f8f9fa',
                    defaultColor: '#f5f5f5',
                    tooltip: { textStyle: { color: '#444' }, showColorCode: true }
                };

                // 3. Draw
                const chart = new google.visualization.GeoChart(container);

                // Interaction
                google.visualization.events.addListener(chart, 'select', () => {
                    const selection = chart.getSelection();
                    if (selection.length > 0) {
                        const item = selection[0];
                        if (item.row != null) {
                            const selectedState = data.getValue(item.row, 0);
                            console.log('Selected State:', selectedState);

                            // Map Google name back to our filter format
                            let filterName = selectedState;
                            if (selectedState === 'State of Mexico') filterName = 'Estado de México';
                            if (selectedState === 'Mexico City') filterName = 'Ciudad de México';

                            // Filter
                            state.filters.stateFilter = filterName;
                            dom.toggleList.click(); // Switch to list
                            _renderTable();
                        }
                    }
                });

                chart.draw(data, options);
            }

            /**
             * Verifica si el valor ingresado es nuevo o existe en el catálogo
             */
            function _verificarNuevoRegistro(tipo) {
                let input, aviso, valoresUnicos;

                // Configurar según el tipo de campo
                switch (tipo) {
                    case 'distrito':
                        input = dom.inputDistrito;
                        aviso = dom.avisoDistrito;
                        valoresUnicos = (state.catalogs.distritosRiego || []).map(d =>
                            String(d.distritoRiego || d.nombre || '').toLowerCase().trim()
                        );
                        break;
                    case 'siniestro':
                        input = dom.inputSiniestro;
                        aviso = dom.avisoSiniestro;
                        valoresUnicos = (state.catalogs.siniestros || []).map(s =>
                            String(s.siniestro || s.nombre || '').toLowerCase().trim()
                        );
                        break;
                    case 'fenomeno':
                        input = dom.inputFenomeno;
                        aviso = dom.avisoFenomeno;
                        valoresUnicos = [...new Set((state.catalogs.siniestros || [])
                            .map(s => String(s.fenomeno || '').trim())
                            .filter(f => f)
                            .map(f => f.toLowerCase())
                        )];
                        break;
                    case 'fi':
                        input = dom.inputFi;
                        aviso = dom.avisoFi;
                        valoresUnicos = [...new Set((state.catalogs.siniestros || [])
                            .map(s => String(s.fi || '').trim())
                            .filter(f => f)
                            .map(f => f.toLowerCase())
                        )];
                        break;
                    case 'fondo':
                        input = dom.inputFondo;
                        aviso = dom.avisoFondo;
                        valoresUnicos = [...new Set((state.catalogs.siniestros || [])
                            .map(s => String(s.fondo || '').trim())
                            .filter(f => f)
                            .map(f => f.toLowerCase())
                        )];
                        break;
                    default:
                        return;
                }

                if (!input || !aviso) {
                    console.log(`⚠️ _verificarNuevoRegistro(${tipo}): input o aviso no encontrado`, { input, aviso });
                    return;
                }

                const valor = input.value.trim();
                if (!valor) {
                    aviso.classList.add('d-none');
                    return;
                }

                const existe = valoresUnicos.includes(valor.toLowerCase());

                if (tipo === 'siniestro' || tipo === 'distrito') {
                    console.log(`🔍 Verificando ${tipo}: `, {
                        valor,
                        existe,
                        valoresUnicos: valoresUnicos.slice(0, 5),
                        totalEnCatalogo: valoresUnicos.length
                    });
                }

                if (!existe) {
                    aviso.classList.remove('d-none');
                    console.log(`✅ Mostrando aviso para ${tipo} nuevo`);
                } else {
                    aviso.classList.add('d-none');
                    console.log(`ℹ️ ${tipo} existe en catálogo, ocultando aviso`);
                }
            }

            /**
             * Actualiza los campos readonly de siniestro cuando se selecciona uno existente
             * Y habilita fenómeno/fi/fondo si es un siniestro NUEVO
             */
            function _actualizarDetallesSiniestro() {
                const valor = dom.inputSiniestro.value.trim();

                const campoFenomeno = document.getElementById('detalle-fenomeno');
                const campoFi = document.getElementById('detalle-fi');
                const campoFondo = document.getElementById('detalle-fondo');

                if (!valor) {
                    // Si está vacío, limpiar y dejar readonly
                    if (campoFenomeno) {
                        campoFenomeno.value = '';
                        campoFenomeno.setAttribute('readonly', 'true');
                        campoFenomeno.classList.remove('bg-white');
                        campoFenomeno.classList.add('bg-light');
                    }
                    if (campoFi) {
                        campoFi.value = '';
                        campoFi.setAttribute('readonly', 'true');
                        campoFi.classList.remove('bg-white');
                        campoFi.classList.add('bg-light');
                    }
                    if (campoFondo) {
                        campoFondo.value = '';
                        campoFondo.setAttribute('readonly', 'true');
                        campoFondo.classList.remove('bg-white');
                        campoFondo.classList.add('bg-light');
                    }
                    // Ocultar advertencias
                    if (dom.avisoFenomeno) dom.avisoFenomeno.classList.add('d-none');
                    if (dom.avisoFi) dom.avisoFi.classList.add('d-none');
                    if (dom.avisoFondo) dom.avisoFondo.classList.add('d-none');
                    return;
                }

                const siniestroEncontrado = state.catalogs.siniestros.find(s =>
                    String(s.siniestro || s.nombre || '').toLowerCase() === valor.toLowerCase()
                );

                if (siniestroEncontrado) {
                    // SINIESTRO EXISTE → Auto-completar y dejar readonly
                    if (campoFenomeno) {
                        campoFenomeno.value = siniestroEncontrado.fenomeno || '';
                        campoFenomeno.setAttribute('readonly', 'true');
                        campoFenomeno.classList.remove('bg-white');
                        campoFenomeno.classList.add('bg-light');
                    }
                    if (campoFi) {
                        campoFi.value = siniestroEncontrado.fi || '';
                        campoFi.setAttribute('readonly', 'true');
                        campoFi.classList.remove('bg-white');
                        campoFi.classList.add('bg-light');
                    }
                    if (campoFondo) {
                        campoFondo.value = siniestroEncontrado.fondo || '';
                        campoFondo.setAttribute('readonly', 'true');
                        campoFondo.classList.remove('bg-white');
                        campoFondo.classList.add('bg-light');
                    }
                    // Ocultar advertencias
                    if (dom.avisoFenomeno) dom.avisoFenomeno.classList.add('d-none');
                    if (dom.avisoFi) dom.avisoFi.classList.add('d-none');
                    if (dom.avisoFondo) dom.avisoFondo.classList.add('d-none');
                } else {
                    // SINIESTRO NUEVO → Limpiar, habilitar para edición y mostrar advertencias
                    if (campoFenomeno) {
                        campoFenomeno.value = '';
                        campoFenomeno.removeAttribute('readonly');
                        campoFenomeno.classList.remove('bg-light');
                        campoFenomeno.classList.add('bg-white');
                        campoFenomeno.placeholder = 'Ingrese el tipo de fenómeno (ej: Granizo, Helada, Inundación...)';
                    }
                    if (campoFi) {
                        campoFi.value = '';
                        campoFi.removeAttribute('readonly');
                        campoFi.classList.remove('bg-light');
                        campoFi.classList.add('bg-white');
                        campoFi.placeholder = 'Ingrese el FI correspondiente al siniestro';
                    }
                    if (campoFondo) {
                        campoFondo.value = '';
                        campoFondo.removeAttribute('readonly');
                        campoFondo.classList.remove('bg-light');
                        campoFondo.classList.add('bg-white');
                        campoFondo.placeholder = 'Ingrese el fondo asegurador (ej: FONDEN, CADENA...)';
                    }
                    // Mostrar advertencias
                    if (dom.avisoFenomeno) dom.avisoFenomeno.classList.remove('d-none');
                    if (dom.avisoFi) dom.avisoFi.classList.remove('d-none');
                    if (dom.avisoFondo) dom.avisoFondo.classList.remove('d-none');
                }
            }

            function _toggleEdicion(habilitar) {

                const inputs = document.querySelectorAll('#form-detalle-comunicado input:not([readonly]), #form-detalle-comunicado select, #form-detalle-comunicado textarea');

                    if (['detalle-fenomeno', 'detalle-fondo', 'detalle-fi'].includes(input.id)) return;
                    input.disabled = !habilitar;

                // Ya no hay botones separados de dropdown, los inputs manejan el dropdown directamente

                if (dom.btnEditar) {

                }

                if (dom.btnGuardar) {
                    if (habilitar) dom.btnGuardar.classList.remove('d-none');
                    else dom.btnGuardar.classList.add('d-none');

                    return;

                    if (id !== null && id !== undefined && String(id).trim() !== '') {
                        option.value = String(id);

            function _poblarDatalists() {
                // Poblar los combobox híbridos
                _poblarCombobox('distrito', state.catalogs.distritosRiego, 'distritoRiego');
                _poblarCombobox('siniestro', state.catalogs.siniestros, 'siniestro');

                // Configurar el filtrado en tiempo real
                _setupComboboxFilter('distrito', state.catalogs.distritosRiego, 'distritoRiego');
                _setupComboboxFilter('siniestro', state.catalogs.siniestros, 'siniestro');
            }

            function _poblarCombobox(tipo, catalogo, campoNombre) {
                const dropdownList = document.getElementById(`dropdown - ${tipo} -list`);
                if (!dropdownList || !catalogo) return;

                dropdownList.innerHTML = '';
                catalogo.forEach(item => {
                    const valor = String(item[campoNombre] || item.nombre || '');
                    if (!valor) return; // Saltar si está vacío

                    const li = document.createElement('li');
                    li.innerHTML = `< a class="dropdown-item" href = "#" data - value="${escapeHtml(valor)}" > ${escapeHtml(valor)}</a > `;

                    li.querySelector('a').addEventListener('click', (e) => {
                        e.preventDefault();
                        const input = document.getElementById(`detalle - ${tipo} `);
                        input.value = valor;

                        // Trigger change para actualizar detalles de siniestro si aplica
                        if (tipo === 'siniestro') {
                            _actualizarDetallesSiniestro();
                        }
                        _verificarNuevoRegistro(tipo);
                    });

                    dropdownList.appendChild(li);
                });
            }

            function _setupComboboxFilter(tipo, catalogo, campoNombre) {
                const input = document.getElementById(`detalle - ${tipo} `);
                const dropdownList = document.getElementById(`dropdown - ${tipo} -list`);

                console.log(`🔧 _setupComboboxFilter para ${tipo}: `, { input: !!input, dropdownList: !!dropdownList });

                if (!input || !dropdownList) return;

                // Evitar agregar listeners duplicados
                if (input.dataset.filterConfigured === 'true') {
                    console.log(`⚠️ Filtro para ${tipo} ya configurado, saltando...`);
                    return;
                }
                input.dataset.filterConfigured = 'true';
                console.log(`✅ Configurando listener para ${tipo} `);

                input.addEventListener('input', () => {
                    console.log(`📝 Input event en ${tipo}: "${input.value}"`);

                    const searchTerm = input.value.toLowerCase();
                    const items = dropdownList.querySelectorAll('.dropdown-item');
                    let hasVisibleItems = false;

                    items.forEach(item => {
                        const text = item.textContent.toLowerCase();
                        if (text.includes(searchTerm)) {
                            item.parentElement.style.display = '';
                            hasVisibleItems = true;
                        } else {
                            item.parentElement.style.display = 'none';
                        }
                    });

                    // NOTA: Las validaciones se manejan en _cacheDomElements
                });
            }

            /**
             * Maneja cambios en los filtros
             */
            function _handleFilterChange(key, value) {
                state.filters[key] = key === 'search' ? value.toLowerCase() : value;
                _renderTable(); // Re-renderizar tabla con nuevos filtros
            }

            /**
             * Filtra los datos según el estado de los filtros
             */
            function _filterData() {
                let data = [...state.comunicados];

                // 1. Filtro Texto (Search)
                if (state.filters.search) {
                    const term = state.filters.search;
                    data = data.filter(item => {
                        const combinado = [
                            item.comunicado,
                            item.descripcion,
                            item.contratista,
                            item.estado,
                            item.siniestro
                        ].join(' ').toLowerCase();
                        return combinado.includes(term);
                    });
                }

                // 2. Filtro Estado (Geográfico)
                if (state.filters.estado !== 'all') {
                    data = data.filter(item => {
                        const itemEstado = (item.estado || '').toUpperCase().trim();
                        const filterEstado = state.filters.estado.toUpperCase().trim();
                        return itemEstado === filterEstado;
                    });
                }

                // 3. Filtro Año
                if (state.filters.year !== 'all') {
                    data = data.filter(item => {
                        if (!item.fecha) return false;
                        const f = String(item.fecha); // Esperamos string YYYY-MM-DD o similar
                        return f.includes(state.filters.year);
                    });
                }

                // 4. Filtro Mapa (Estado)
                if (state.filters.stateFilter) {
                    data = data.filter(item => {
                        const st = (item.estado || '').toLowerCase();
                        const filter = state.filters.stateFilter.toLowerCase();
                        return st.includes(filter) || filter.includes(st);
                    });
                }

                return data;
            }

            /**
             * Calcula estadísticas para el dashboard
             */
            function _calculateStats(data) {
                if (!dom.dashboard) return;

                // Total de comunicados
                const total = data.length;

                // Suma total de presupuestos (Contratista/Obra)
                const totalContratista = data.reduce((sum, d) => sum + (parseFloat(d.presupuesto) || 0), 0);

                // Suma total de montos de supervisión
                const totalSupervision = data.reduce((sum, d) => sum + (parseFloat(d.montoSupervision) || 0), 0);

                // Render DOM
                dom.statTotal.textContent = total;
                dom.statTotalContratista.textContent = _formatCurrency(totalContratista);
                dom.statTotalSupervision.textContent = _formatCurrency(totalSupervision);

                // Mostrar el dashboard si hay datos
                if (total > 0) {
                    dom.dashboard.classList.remove('d-none');
                }
            }

            /**
             * Maneja el recálculo masivo de importes
             */
            async function _handleRecalcularImportes() {
                if (!confirm('¿Desea recalcular los importes vigentes de todos los comunicados?\nEsto sumará las partidas de presupuesto y actualizará el monto total de cada actualización si hay discrepancias.')) {
                    return;
                }

                const btn = dom.btnRecalcular;
                const originalHtml = btn ? btn.innerHTML : '';

                if (btn) {
                    btn.disabled = true;
                    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
                }

                try {
                    console.log('Solicitando recálculo masivo...');
                    // serverCall returns response.data directly on success, throws on failure
                    const res = await serverCall('recalcularImportesVigentes');
                    console.log('Resultado recálculo:', res);

                    // serverCall resolves with the 'data' object: { message, logs }
                    // If we get here, the call was successful
                    const logsHtml = (res && res.logs && res.logs.length > 0)
                        ? `< br > <div class="text-start small mt-2" style="max-height: 200px; overflow-y: auto;">
            <strong>Cambios realizados:</strong><ul class="mb-0 ps-3">${res.logs.map(l => `<li>${l}</li>`).join('')}</ul>
        </div>`
                        : '<br>No se encontraron discrepancias.';

                    const swal = globalThis.Swal;
                    if (swal) {
                        swal.fire({
                            icon: 'success',
                            title: 'Recálculo Completado',
                            html: `${res?.message || 'Proceso completado'}${logsHtml} `,
                            width: '600px'
                        });
                    } else {
                        alert(res?.message || 'Proceso completado');
                    }

                    // Recargar tabla para reflejar cambios
                    _loadComunicados();

                } catch (error) {
                    console.error('Error en recálculo:', error);
                    const swal = globalThis.Swal;
                    if (swal) {
                        swal.fire({
                            icon: 'error',
                            title: 'Error',
                            text: error.message
                        });
                    } else {
                        alert('Error: ' + error.message);
                    }
                } finally {
                    if (btn) {
                        btn.disabled = false;
                        btn.innerHTML = originalHtml;
                    }
                }
            }

            /**
             * Maneja el recálculo de importes para un comunicado individual
             */
            async function _handleRecalcularIndividual(id) {
                if (!confirm('¿Recalcular importes de este comunicado?\nSe verificará la suma de sus partidas.')) return;

                const btn = dom.btnRecalcularUnico;
                const originalHtml = btn ? btn.innerHTML : '';
                if (btn) {
                    btn.disabled = true;
                    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
                }

                try {
                    // serverCall returns response.data directly on success
                    const res = await serverCall('recalcularImportesVigentes', id);
                    console.log('Resultado recálculo individual:', res);

                    // If we get here, call was successful (serverCall throws on error)
                    const msg = (res && res.logs && res.logs.length > 0) ?
                        'Se corrigieron discrepancias:\n' + res.logs.join('\n') :
                        'Los importes son correctos. No se requirieron cambios.';
                    alert(msg);

                    // Recargar lista global
                    await _loadComunicados();

                    // Actualizar el "comunicadoActual" con los nuevos datos del state
                    const refreshed = state.comunicados.find(c => String(c.id) === String(id));
                    if (refreshed) {
                        comunicadoActual = refreshed;
                        _poblarFormulario(refreshed);
                    }
                } catch (e) {
                    console.error(e);
                    alert('Error inesperado al recalcular: ' + e.message);
                } finally {
                    if (btn) {
                        btn.disabled = false;
                        btn.innerHTML = originalHtml;
                    }
                }
            }

            /**
             * Carga los comunicados desde el servidor
             */
            async function _loadComunicados() {
                state.loading = true;
                _renderLoading();

                try {
                    if (state.catalogs.estados.length === 0) {
                        await _loadCatalogs();
                    }

                    const comunicados = await serverCall('readAllComunicados');
                    state.comunicados = comunicados || [];
                    _poblarFilterEstados(); // Populate filter dropdown with unique states
                    _calculateStats(state.comunicados); // Actualizar Dashboard
                    if (state.viewMode === 'map') _drawMap(); // Redraw if map active
                    _renderTable(); // Render tabla (filtrada)
                } catch (error) {
                    console.error('Error cargando comunicados:', error);
                    state.error = error.message;
                    _renderError(error.message);
                } finally {
                    state.loading = false;
                    if (dom.loader) dom.loader.classList.add('d-none');
                }
            }

            /**
             * Pobla el dropdown de filtro por estado con estados únicos de los comunicados

            function _poblarFilterEstados() {

            /**
             * Maneja el cambio de ordenamiento
             */
            function _handleSort(column) {
                if (state.sort.column === column) {
                    // Toggle direction
                    state.sort.direction = state.sort.direction === 'asc' ? 'desc' : 'asc';
                } else {
                    // New column, default to asc (except for date maybe? logic implies default asc usually)
                    state.sort.column = column;
                    state.sort.direction = 'asc';
                }
                _renderTable();
            }

            /**
             * Actualiza los iconos de ordenamiento en la cabecera
             */
            function _updateSortIcons() {
                // Reset all icons
                const headers = ['descripcion', 'fecha', 'estado', 'contratista', 'presupuesto', 'montoSupervision'];
                headers.forEach(key => {
                    const icon = document.getElementById(`sort - icon - ${key} `);
                    if (icon) {
                        icon.className = 'bi bi-arrow-down-up small text-muted ms-1'; // Default neutral
                    }
                });

                // Set active icon
                const activeIcon = document.getElementById(`sort - icon - ${state.sort.column} `);
                if (activeIcon) {
                    if (state.sort.direction === 'asc') {
                        activeIcon.className = 'bi bi-arrow-up text-primary ms-1';
                    } else {
                        activeIcon.className = 'bi bi-arrow-down text-primary ms-1';
                    }
                }
            }

            /**
             * Renderiza la tabla de comunicados
             */
            /**
             * Renderiza la tabla de comunicados
             */
            function _renderTable() {
                if (!state.comunicados || state.comunicados.length === 0) {
                    if (dom.emptyState) dom.emptyState.classList.remove('d-none');
                    if (dom.totalBadge) dom.totalBadge.textContent = '0';
                    return;
                }

                if (dom.tableContainer) dom.tableContainer.classList.remove('d-none');

                // Actualizar badge total (siempre muestra el total real o el filtrado? Mejor el filtrado para feedback visual)
                const filteredData = _filterData();
                if (dom.totalBadge) dom.totalBadge.textContent = filteredData.length;

                // Ordenar por fecha descendente (más recientes primero)
                const { column, direction } = state.sort;
                const comunicadosOrdenados = [...filteredData].sort((a, b) => {
                    let valA = a[column];
                    let valB = b[column];

                    // Handle null/undefined
                    if (valA == null) valA = '';
                    if (valB == null) valB = '';

                    // Numeric sorting for money fields
                    if (['presupuesto', 'montoSupervision'].includes(column)) {
                        valA = parseFloat(valA) || 0;
                        valB = parseFloat(valB) || 0;
                    } else {
                        // String sorting (case insensitive)
                        valA = String(valA).toLowerCase();
                        valB = String(valB).toLowerCase();
                    }

                    if (valA < valB) return direction === 'asc' ? -1 : 1;
                    if (valA > valB) return direction === 'asc' ? 1 : -1;
                    return 0;
                });

                _updateSortIcons();

                const html = comunicadosOrdenados.map(com => `
                <tr>
                    <!-- Referencia y Comunicado Corto eliminados. Descripción es ahora la primera columna 'Comunicado' -->
                    <td class="ps-4 fw-semibold text-primary text-truncate" style="max-width: 350px;" title="${escapeHtml(com.descripcion || '')}">
                        ${escapeHtml(com.descripcion || '')}
                    </td>
                    <td class="text-nowrap small">${escapeHtml(com.fecha || '')}</td>
                    <td class="small">${escapeHtml(com.estado || '')}</td>
                    <td class="small text-truncate" style="max-width: 200px;" title="${escapeHtml(com.contratista || '')}">${escapeHtml(com.contratista || '')}</td>
                    <td class="small font-monospace text-end text-primary fw-bold cursor-pointer" 
                        title="Doble clic para ver historial" 
                        style="cursor: pointer;"
                        ondblclick="Comunicados.abrirHistorialPresupuesto(${com.id || ''})">
                        ${_formatCurrency(com.presupuesto)}
                    </td>
                    <td class="small font-monospace text-end text-muted">${_formatCurrency(com.montoSupervision)}</td>
                    <td class="text-end pe-4">
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="Comunicados.abrirModal(${com.id || ''})" title="Edición rápida">
                            <i class="bi bi-eye"></i> Ver
                        </button>
                        <button class="btn btn-sm btn-primary" onclick="Comunicados.verDetalle(${com.id || ''})" title="Gestión completa">
                            <i class="bi bi-gear-fill"></i> Gestión
                        </button>
                        <button class="btn btn-sm btn-outline-danger ms-1" onclick="Comunicados.confirmarEliminar(${com.id || ''})" title="Eliminar">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
                `).join('');

                if (dom.tbody) dom.tbody.innerHTML = html;
            }

            /**
             * Abre el detalle del comunicado en MODAL (Vista Rápida)
             */
            function abrirModal(idComunicado) {
                if (!idComunicado) return;
                const com = state.comunicados.find(c => String(c.id) === String(idComunicado));

                    console.warn('Comunicado no encontrado en memoria:', idComunicado);
                    return;

                comunicadoActual = com;

                // Asegurar modo lectura al abrir

                // FIX: Asegurar que se muestra el contenido y se oculta el loader
                if (dom.modalLoader) dom.modalLoader.classList.add('d-none');
                if (dom.modalContent) dom.modalContent.classList.remove('d-none');
                if (dom.modalError) dom.modalError.classList.add('d-none');

                    modalInstance.show();
                } else {
                    console.error('Instancia del modal no inicializada');

            /**
             * Abre el modal de Matriz de Actualizaciones al hacer doble clic en el monto de obra
             * Muestra todos los conceptos como filas y las revisiones (Origen, L27A, L27B...) como columnas
             * @param {number} idComunicado - ID del comunicado
             */
            // Estado del modal de historial
            let historialModalInstance = null;
            let historialComunicadoId = null;
            let historialCargando = false;

            async function abrirHistorialPresupuesto(idComunicado) {
                if (!idComunicado) return;
                const idStr = idComunicado;

                // Referencias DOM del modal
                const modal = document.getElementById('modalHistorialPresupuestos');
                const loader = document.getElementById('historial-loader');
                const content = document.getElementById('historial-content');
                const emptyState = document.getElementById('historial-empty');
                const btnGestion = document.getElementById('btnVerGestionCompleta');
                const badgeConceptos = document.getElementById('badge-conceptos');
                const badgeActualizaciones = document.getElementById('badge-actualizaciones');
                const headerRow = document.getElementById('matriz-header');
                const tbody = document.getElementById('matriz-tbody');
                const totalsRow = document.getElementById('matriz-totals');

                if (!modal) {
                    console.error('Modal de historial no encontrado');
                    return;
                }

                // 0. GESTIÓN DE INSTANCIA (Forzar Static Backdrop)
                // Si ya existe instancia, la destruimos para asegurar que se aplique la config 'static'
                // Esto es crucial si la instancia se creó previamente sin estas opciones.
                if (historialModalInstance) {
                    // Solo eliminar si no está visible para evitar parpadeos feos, 
                    // aunque si el usuario hace doble clic probablemente esté cerrado o quiera refrescar.
                    // Si está abierto y 'dispose', se pierde el backdrop. Mejor comprobar.
                    if (!modal.classList.contains('show')) {
                        historialModalInstance.dispose();
                        historialModalInstance = null;
                    }
                }

                if (!historialModalInstance && typeof bootstrap !== 'undefined') {
                    historialModalInstance = new bootstrap.Modal(modal, {
                        backdrop: 'static',  // No se cierra al hacer clic fuera
                        keyboard: false      // No se cierra con Escape
                    });

                    // Listener para botón de gestión completa
                    if (btnGestion) {
                        // Eliminar listeners viejos clonando? No, addEventListener acumula.
                        // Mejor usar una propiedad para no duplicar
                        if (btnGestion.dataset.hasListener !== 'true') {
                            btnGestion.addEventListener('click', () => {
                                if (!historialCargando && historialModalInstance) {
                                    historialModalInstance.hide();
                                    verDetalle(historialComunicadoId);
                                }
                            });
                            btnGestion.dataset.hasListener = 'true';
                        }
                    }
                }

                // Reiniciar estado
                historialComunicadoId = idStr;
                historialCargando = true;

                // 1. BLOQUEAR CIERRE (Botones de Header y Footer)
                const closeButtons = modal.querySelectorAll('[data-bs-dismiss="modal"], .btn-close');
                closeButtons.forEach(btn => btn.disabled = true);
                if (btnGestion) btnGestion.disabled = true;

                // 2. REINICIAR VISUALIZACIÓN (Loader visible, contenido oculto)
                if (loader) {
                    loader.classList.remove('d-none');
                    loader.innerHTML = `
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Cargando...</span>
                        </div>
                        <p class="mt-3 text-muted">Cargando historial...</p>
                    `;
                }
                if (content) content.classList.add('d-none');
                if (emptyState) emptyState.classList.add('d-none');

                // Limpiar tablas
                if (headerRow) headerRow.innerHTML = '';
                if (tbody) tbody.innerHTML = '';
                if (totalsRow) totalsRow.innerHTML = '';
                if (badgeConceptos) badgeConceptos.textContent = '';
                if (badgeActualizaciones) badgeActualizaciones.textContent = '';

                // Mostrar modal
                historialModalInstance.show();

                try {
                    console.log('[Matriz NEW] Solicitando datos. Time:', new Date().toISOString());
                    const comunicadoCompleto = await serverCall('getComunicadoCompleto', idStr);
                    console.log('[Matriz NEW] Datos recibidos.', comunicadoCompleto.success);

                    if (!comunicadoCompleto) {
                        throw new Error('No se encontraron datos del comunicado');
                    }

                    // DEBUG: Mostrar timestamp de actualización
                    console.log(`[Matriz] Datos frescos recibidos. Ts: ${comunicadoCompleto.data?._ts || 'N/A'}`);

                    // Inyectar badge visual de actualización (Feedback para usuario)
                    const modalTitle = modal.querySelector('.modal-title');
                    if (modalTitle && comunicadoCompleto.data?._ts) {
                        const oldBadge = modalTitle.querySelector('.badge-debug-ts');
                        if (oldBadge) oldBadge.remove();

                        const ts = new Date(comunicadoCompleto.data._ts);
                        const timeTag = ts.getHours().toString().padStart(2, '0') + ':' +
                            ts.getMinutes().toString().padStart(2, '0') + ':' +
                            ts.getSeconds().toString().padStart(2, '0');

                        const debugBadge = document.createElement('span');
                        debugBadge.className = 'badge bg-info text-dark ms-2 badge-debug-ts';
                        debugBadge.style.fontSize = '0.65rem';
                        debugBadge.title = 'Hora de consulta al servidor';
                        debugBadge.innerText = `Refreshed: ${timeTag}`;
                        modalTitle.appendChild(debugBadge);
                    }

                    // Los datos vienen en comunicadoCompleto.presupuesto (array de actualizaciones)
                    const revisiones = comunicadoCompleto.presupuesto || [];

                    console.log('[Matriz] Revisiones encontradas:', revisiones.length);
                    if (revisiones.length > 0) {
                        console.log('[Matriz] Primera revisión:', revisiones[0]);
                        console.log('[Matriz] Líneas de primera revisión:', revisiones[0]?.lineas?.length || 0);
                        if (revisiones[0]?.lineas?.length > 0) {
                            console.log('[Matriz] Primera línea:', revisiones[0].lineas[0]);
                        }
                    }

                    // Si no hay revisiones o todas las revisiones no tienen líneas, mostrar estado vacío
                    if (revisiones.length === 0 || revisiones.every(r => !r.lineas || r.lineas.length === 0)) {
                        if (emptyState) emptyState.classList.remove('d-none');
                        if (loader) loader.classList.add('d-none');
                        if (content) content.classList.remove('d-none');
                        return;
                    }
                    if (emptyState) emptyState.classList.add('d-none');

                    // ============================================
                    // CONSTRUIR MATRIZ PIVOTEADA
                    // ============================================

                    // 1. Recolectar todos los conceptos únicos (por descripción + categoría)
                    const conceptosMap = new Map();
                    revisiones.forEach((rev, revIdx) => {
                        console.log(`[Matriz] Revisión ${revIdx}: ${rev.revision || 'Sin nombre'}, lineas: ${(rev.lineas || []).length}`);

                        // DEBUG: Ver estructura de la primera línea
                        if (rev.lineas && rev.lineas.length > 0) {
                            console.log(`[Matriz] Estructura de primera línea:`, JSON.stringify(rev.lineas[0], null, 2));
                        }

                        (rev.lineas || []).forEach((linea, lineaIdx) => {
                            const desc = (linea.descripcion || '').toUpperCase().trim();
                            if (!desc) {
                                console.log(`[Matriz] Línea ${lineaIdx} sin descripcion:`, linea);
                                return;
                            }

                            // Usar descripción + categoría como clave para evitar sobrescribir
                            const cat = (linea.categoria || '').toUpperCase().trim();
                            const key = `${desc}|||${cat}`;

                            if (!conceptosMap.has(key)) {
                                conceptosMap.set(key, {
                                    descripcion: linea.descripcion || '',
                                    categoria: linea.categoria || '',
                                    montos: new Array(revisiones.length).fill(null)
                                });
                            }
                            const concepto = conceptosMap.get(key);

                            // Obtener el valor de importe
                            const valorImporte = parseFloat(linea.importe) || 0;

                            // Si ya hay un valor, sumar (por si hay duplicados)
                            if (concepto.montos[revIdx] !== null) {
                                concepto.montos[revIdx] += valorImporte;
                            } else {
                                concepto.montos[revIdx] = valorImporte;
                            }

                            console.log(`[Matriz] Rev ${revIdx} - "${desc.substring(0, 30)}..." [${cat}] importe=${linea.importe} -> ${concepto.montos[revIdx]}`);
                        });
                    });

                    const conceptos = Array.from(conceptosMap.values());

                    // 2. Actualizar badges
                    if (badgeConceptos) badgeConceptos.textContent = `${conceptos.length} conceptos`;
                    if (badgeActualizaciones) badgeActualizaciones.textContent = `${revisiones.length} actualizaciones`;

                    // 3. Construir Header (columnas)
                    let headerHtml = `
                        <th class="col-concepto ps-3 small text-uppercase text-secondary">Ubicación / Concepto</th>
                        <th class="col-cat small text-uppercase text-secondary">Cat.</th>
                    `;
                    revisiones.forEach((rev, idx) => {
                        const revName = rev.revision || (rev.esOrigen ? 'Origen' : `Rev ${idx + 1}`);
                        const fecha = rev.fecha || '';
                        headerHtml += `
                            <th class="col-revision small text-uppercase text-secondary pe-3">
                                <div class="fw-bold ${idx === revisiones.length - 1 ? 'text-primary' : ''}">${escapeHtml(revName)}</div>
                                <div class="text-muted" style="font-size: 0.7rem;">${escapeHtml(fecha)}</div>
                            </th>
                        `;
                    });
                    if (headerRow) headerRow.innerHTML = headerHtml;

                    // 4. Construir Filas (conceptos)
                    let bodyHtml = '';
                    conceptos.forEach(concepto => {
                        // Badge de categoría
                        let catBadge = '';
                        const cat = (concepto.categoria || '').toUpperCase();
                        if (cat.includes('DAÑO') || cat.includes('FISICO')) {
                            catBadge = '<span class="badge badge-cat bg-danger bg-opacity-75">DAÑO FÍSICO</span>';
                        } else if (cat.includes('DESAZOLVE')) {
                            catBadge = '<span class="badge badge-cat bg-info text-dark">DESAZOLVES</span>';
                        } else if (cat) {
                            catBadge = `<span class="badge badge-cat bg-secondary">${escapeHtml(cat)}</span>`;
                        }

                        bodyHtml += `<tr>`;
                        bodyHtml += `<td class="col-concepto ps-3 small">${escapeHtml(concepto.descripcion)}</td>`;
                        bodyHtml += `<td class="col-cat">${catBadge}</td>`;

                        // Montos por revisión
                        concepto.montos.forEach((monto, idx) => {
                            // Calcular variación
                            let variacionHtml = '';
                            if (idx > 0) {
                                const prevMonto = concepto.montos[idx - 1];
                                if (monto !== null && prevMonto !== null) {
                                    const diff = monto - prevMonto;
                                    if (diff !== 0) {
                                        const sign = diff > 0 ? '+' : '';
                                        const cls = diff > 0 ? 'positiva' : 'negativa';
                                        variacionHtml = `<span class="variacion ${cls}">${sign}${_formatCurrency(diff)}</span>`;
                                    }
                                } else if (monto !== null && prevMonto === null) {
                                    // Nuevo concepto en esta revisión
                                    variacionHtml = `<span class="variacion positiva">+${_formatCurrency(monto)}</span>`;
                                }
                            } else if (monto !== null) {
                                // Primera revisión (Origen)
                                variacionHtml = `<span class="variacion positiva">+${_formatCurrency(monto)}</span>`;
                            }

                            const montoStr = monto !== null ? _formatCurrency(monto) : '$0.00';
                            const montoClass = monto === null ? 'text-muted' : '';

                            bodyHtml += `
                                <td class="col-revision pe-3 font-monospace small ${montoClass}">
                                    <span>${montoStr}</span>
                                    ${variacionHtml}
                                </td>
                            `;
                        });

                        bodyHtml += `</tr>`;
                    });
                    if (tbody) tbody.innerHTML = bodyHtml;

                    // 5. Construir Fila de Totales
                    const totales = revisiones.map((_, revIdx) => {
                        return conceptos.reduce((sum, c) => sum + (c.montos[revIdx] || 0), 0);
                    });

                    let totalsHtml = `
                        <td class="col-concepto ps-3 text-end">Totales</td>
                        <td class="col-cat"></td>
                    `;
                    totales.forEach((total, idx) => {
                        // Variación del total
                        let variacionHtml = '';
                        if (idx > 0) {
                            const diff = total - totales[idx - 1];
                            if (diff !== 0) {
                                const sign = diff > 0 ? '+' : '';
                                const cls = diff > 0 ? 'positiva' : 'negativa';
                                variacionHtml = `<span class="variacion ${cls}">${sign}${_formatCurrency(diff)}</span>`;
                            }
                        }

                        const isLast = idx === totales.length - 1;
                        totalsHtml += `
                            <td class="col-revision pe-3 font-monospace ${isLast ? 'text-success fs-6' : ''}">
                                <span>${_formatCurrency(total)}</span>
                                ${variacionHtml}
                            </td>
                        `;
                    });
                    if (totalsRow) totalsRow.innerHTML = totalsHtml;

                    // Mostrar contenido
                    if (loader) loader.classList.add('d-none');
                    if (content) content.classList.remove('d-none');

                } catch (error) {
                    console.error('Error cargando matriz de presupuestos:', error);
                    if (loader) loader.innerHTML = `
                        <div class="text-danger">
                            <i class="bi bi-exclamation-triangle fs-1"></i>
                            <p class="mt-2">${error.message}</p>
                        </div>
                    `;
                } finally {
                    // DESBLOQUEAR MODAL - Permitir cierre
                    historialCargando = false;

                    const closeButtons = document.querySelectorAll('#modalHistorialPresupuestos [data-bs-dismiss="modal"], #modalHistorialPresupuestos .btn-close');
                    closeButtons.forEach(btn => btn.disabled = false);

                    if (btnGestion) btnGestion.disabled = false;
                }
            }


            /**
             * Formatea moneda
             */
            function _formatCurrency(val) {
                const num = parseFloat(val) || 0;
                return '$' + num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            }

            /**
             * Muestra un mensaje de error
             */
            function _renderError(message) {
                if (dom.errorAlert) {
                    dom.errorAlert.textContent = message;
                    dom.errorAlert.classList.remove('d-none');
                }
            }

            /**
             * Formatea una fecha para el input date (YYYY-MM-DD)
             */
            function _formatearFechaInput(fecha) {
                if (!fecha) return '';
                try {
                    if (typeof fecha === 'string') {
                        if (fecha.includes('/')) {
                            const partes = fecha.split('/');
                            if (partes.length === 3) {
                                const dia = partes[0].padStart(2, '0');
                                const mes = partes[1].padStart(2, '0');
                                const anio = partes[2];
                                return `${anio} -${mes} -${dia} `;
                            }
                        }
                        if (fecha.includes('T')) {
                            return fecha.split('T')[0];
                        }
                        return fecha;
                    }
                    if (fecha instanceof Date) {
                        return fecha.toISOString().split('T')[0];
                    }
                } catch (e) {
                    console.error('Error formateando fecha:', fecha, e);
                }
                return '';
            }

            /**
             * Navega a la vista de detalle del comunicado (Gestión Completa)
             */
            async function verDetalle(idComunicado) {
                if (!idComunicado) return;
                // Guardar ID en sesión para que la nueva vista lo recupere
                sessionStorage.setItem('currentComunicadoId', String(idComunicado));
                // Navegar a la nueva ruta
                location.hash = '#/comunicado-detalle';
            }

            /**
             * Pobla el formulario del modal con los datos del comunicado
             */
            function _poblarFormulario(com) {
                // Campos básicos
                const setVal = (id, val) => {
                    const el = document.getElementById(id);
                    if (el) el.value = val || '';
                };

                setVal('detalle-comunicado', com.comunicado);
                setVal('detalle-fecha', _formatearFechaInput(com.fecha));
                setVal('detalle-descripcion', com.descripcion);

                // Estado (Select)
                setVal('detalle-estado', com.idEstado);

                // Combobox Híbridos
                setVal('detalle-distrito', com.distrito);
                setVal('detalle-siniestro', com.siniestro);

                // Siniestro Detalles (Fenomeno, FI, Fondo)
                setVal('detalle-fenomeno', com.fenomeno);
                setVal('detalle-fi', com.fi);
                setVal('detalle-fondo', com.fondo);

                // Forzar actualización visual de readonly/bg-color para siniestro
                _actualizarDetallesSiniestro();
            }

            /**
             * Guarda los cambios del comunicado
             */
            async function _guardarCambios() {
                if (!comunicadoActual) return;

                dom.btnGuardar.disabled = true;
                dom.btnGuardar.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Guardando...';

                try {
                    const updates = {
                        comunicado: document.getElementById('detalle-comunicado').value,
                        fecha: document.getElementById('detalle-fecha').value,
                        idEstado: document.getElementById('detalle-estado').value,
                        descripcion: document.getElementById('detalle-descripcion').value,
                        distrito: document.getElementById('detalle-distrito').value,
                        siniestro: document.getElementById('detalle-siniestro').value,
                        fenomeno: document.getElementById('detalle-fenomeno').value,
                        fi: document.getElementById('detalle-fi').value,
                        fondo: document.getElementById('detalle-fondo').value
                    };

                    console.log('💾 Guardando comunicado con datos:', updates);

                    await serverCall('updateComunicado', comunicadoActual.id, updates);

                    if (modalInstance) modalInstance.hide();
                    await _loadComunicados();

                    // Usar SweetAlert2 si está disponible (globalThis.Swal)
                    const swal = globalThis.Swal;
                    if (swal) {
                        swal.fire({
                            icon: 'success',
                            title: 'Actualizado',
                            text: 'Comunicado actualizado correctamente',
                            timer: 1500,
                            showConfirmButton: false
                        });
                    } else {
                        alert('Comunicado actualizado correctamente');
                    }

                } catch (error) {
                    console.error('Error guardando cambios:', error);
                    dom.modalError.textContent = error.message;
                    dom.modalError.classList.remove('d-none');
                } finally {
                    dom.btnGuardar.disabled = false;
                    dom.btnGuardar.innerHTML = '<i class="bi bi-save"></i> Guardar Cambios';
                }
            }

            /**
             * Lógica de Eliminación (Listado)
             */
            let itemsToDeleteId = null;

            function confirmarEliminar(id) {
                console.log('Solicitud de eliminación para:', id);
                if (!id) return;
                itemsToDeleteId = id;

                if (dom.modalInstanceDelete) {
                    dom.modalInstanceDelete.show();
                } else {
                    // Fallback
                    if (confirm('¿Confirma que desea eliminar este comunicado y TODOS sus datos asociados?\nEsta acción no se puede deshacer.')) {
                        _handleDeleteConfirm();
                    }
                }
            }

            async function _handleDeleteConfirm() {
                if (!itemsToDeleteId) return;

                const btn = dom.btnConfirmDeleteList;
                const originalText = btn ? btn.innerHTML : '';
                if (btn) {
                    btn.disabled = true;
                    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Eliminando...';
                }

                try {
                    const res = await serverCall('deleteComunicado', itemsToDeleteId);
                    console.log('Delete result:', res);

                    if (dom.modalInstanceDelete) dom.modalInstanceDelete.hide();

                    // Mostrar éxito
                    const swal = globalThis.Swal;
                    if (swal) {
                        swal.fire({
                            icon: 'success',
                            title: 'Eliminado',
                            text: 'El comunicado y todos sus datos han sido eliminados.',
                            timer: 1500,
                            showConfirmButton: false
                        });
                    } else {
                        alert('Comunicado eliminado correctamente.');
                    }

                    // Recargar tabla
                    _loadComunicados();

                } catch (error) {
                    console.error('Error eliminando:', error);
                    alert('Error al eliminar: ' + error.message);
                } finally {
                    itemsToDeleteId = null;
                    if (btn) {
                        btn.disabled = false;
                        btn.innerHTML = originalText || 'Eliminar';
                    }
                }
            }

            /**
             * Función de inicialización principal
             */
            const init = async (container) => {
                try {
                    await _mount(container);
                    _cacheDomElements();
                    await _loadComunicados(); // Esto cargará catálogos también

                    // Inicializar módulo de importación si está disponible (Modal)
                    if (globalThis.Importacion) {
                        Importacion.mount();
                    }

                    console.log('✅ Componente Comunicados listo');
                } catch (error) {
                    console.error('❌ FALLO CRÍTICO EN LA CARGA de Comunicados:', error);
                    container.innerHTML = `< div class="alert alert-danger" > Error fatal al cargar: ${error.message}</div >`;
                }
            };

            const mount = async (container) => init(container);

            // Exportar componente
            return {
                init,
                mount,
                abrirModal,
                abrirHistorialPresupuesto,
                verDetalle,
                confirmarEliminar,
                recargar: _loadComunicados,
                ordenar: _handleSort
            };

        } catch (e) {
            console.error('❌ CRITICAL ERROR INITIALIZING COMUNICADOS:', e);
            // Return minimal fallback to prevent total crash
            return {
                init: () => console.error('Componente Comunicados falló al inicializar:', e),
                mount: () => { },
                render: () => '<div class="alert alert-danger">Error crítico cargando módulo Comunicados. Revise la consola.</div>'
            };
        }
    })();
</script>

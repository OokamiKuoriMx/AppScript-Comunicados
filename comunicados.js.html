<script>
    /**
     * MÓDULO IMPORTACIÓN FRONTEND
     * Maneja la carga de archivos y la comunicación con el backend.
     */
    globalThis.Importacion = (() => {
        'use strict';

        const dom = {
            dropZone: document.getElementById('drop-zone'),
            fileInput: document.getElementById('file-input'),
            btnAnalizar: document.getElementById('btn-analizar'),
            btnAnalizarPdf: document.getElementById('btn-analizar-pdf'), // NEW Button
            loader: document.getElementById('import-loader'),
            loaderMsg: document.getElementById('loader-msg'),
            previewContainer: document.getElementById('preview-container'),
            previewBody: document.getElementById('preview-body'),
            previewSummary: document.getElementById('preview-summary'),
            // Wizard Stages
            stage1: document.getElementById('stage-1-upload'),
            stage3: document.getElementById('confirmation-stage'),
            stage5: document.getElementById('summary-stage'),
            // Wizard Elements
            confirmCount: document.getElementById('confirm-count'),
            btnStartImport: document.getElementById('btn-start-import'),
            previewTitle: document.getElementById('preview-title'),
            summaryTotal: document.getElementById('summary-total'),
            summarySuccess: document.getElementById('summary-success'),
            summaryErrors: document.getElementById('summary-errors')
        };

        let currentFile = null;
        let currentCsvContent = null; // Store for confirmation step
        let fileQueue = []; // NUEVO: Cola de archivos
        let dragSrcEl = null; // Para Drag & Drop

        const init = () => {
            _cacheDom();
            _addEventListeners();
            console.log('Componente Importacion inicializado (Modal mode)');
        };

        const _addEventListeners = () => {
            // Drag & Drop
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dom.dropZone.addEventListener(eventName, _preventDefaults, false);
            });

            ['dragenter', 'dragover'].forEach(eventName => {
                dom.dropZone.addEventListener(eventName, () => dom.dropZone.classList.add('dragover'), false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                dom.dropZone.addEventListener(eventName, () => dom.dropZone.classList.remove('dragover'), false);
            });

            dom.dropZone.addEventListener('drop', _handleDrop, false);
            dom.fileInput.addEventListener('change', _handleFileSelect, false);

            // Wizard Listeners
            if (dom.btnStartImport) {
                dom.btnStartImport.addEventListener('click', startImportFlow);
            }
        };

        const _preventDefaults = (e) => {
            e.preventDefault();
            e.stopPropagation();
        };

        const _handleDrop = (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            _handleFiles(files);
        };

        const _handleFileSelect = (e) => {
            const files = e.target.files;
            _handleFiles(files);
        };

        const _handleFiles = (files) => {
            if (files.length > 0) {
                // Agregar a la cola con propiedades de estado
                const newFiles = Array.from(files).map(f => ({
                    id: Date.now() + Math.random().toString(36).substr(2, 9),
                    file: f,
                    name: f.name,
                    size: (f.size / 1024).toFixed(1) + ' KB',
                    type: f.name.toLowerCase().endsWith('.pdf') ? 'PDF' : 'CSV/EXCEL',
                    selected: true, // NUEVO: Seleccionado por defecto
                    status: 'pending', // NUEVO: pending, analyzing, success, error
                    errorMsg: null // NUEVO: Mensaje de error si aplica
                }));

                fileQueue = [...fileQueue, ...newFiles];
                _renderQueue();
            }
        };

        // ===============================================
        //  GESTOR VISUAL DE COLA
        // ===============================================
        const _renderQueue = () => {
            const container = document.getElementById('file-queue-container');
            const emptyState = document.getElementById('dropzone-empty-state');
            const queueState = document.getElementById('dropzone-queue-state');
            const actionBar = document.getElementById('import-action-bar');
            const countSpan = document.getElementById('queue-count');
            const btnPdfText = document.getElementById('btn-pdf-text');
            const selectedCountSpan = document.getElementById('queue-selected-count');
            const selectAllCheckbox = document.getElementById('select-all-files');

            // Filter out imported items from visible queue (they're being animated out)
            const activeQueue = fileQueue.filter(f => f.status !== 'imported');

            countSpan.innerText = activeQueue.length;

            // Actualizar conteo de seleccionados
            const selectedCount = fileQueue.filter(f => f.selected && f.status === 'pending').length;
            const pendingCount = fileQueue.filter(f => f.status === 'pending').length;
            if (selectedCountSpan) selectedCountSpan.innerText = selectedCount;

            // ========== STATUS SUMMARY COUNTER (Real-time) ==========
            const statusSummary = document.getElementById('queue-status-summary');
            const countAnalyzed = document.getElementById('count-analyzed');
            const countPendingEl = document.getElementById('count-pending');
            const countErrors = document.getElementById('count-errors');

            if (statusSummary && countAnalyzed && countPendingEl && countErrors) {
                const analyzedCount = fileQueue.filter(f => f.status === 'success' || f.status === 'imported').length;
                const analyzingCount = fileQueue.filter(f => f.status === 'analyzing' || f.status === 'importing').length;
                const errorCount = fileQueue.filter(f => f.status === 'error' || f.status === 'import-error').length;
                const pendingCountTotal = fileQueue.filter(f => f.status === 'pending').length;

                countAnalyzed.innerText = analyzedCount;
                countPendingEl.innerText = pendingCountTotal + analyzingCount; // Include analyzing in pending
                countErrors.innerText = errorCount;

                // Show summary only when there's activity (not all pending)
                if (analyzedCount > 0 || errorCount > 0 || analyzingCount > 0) {
                    statusSummary.classList.remove('d-none');
                } else {
                    statusSummary.classList.add('d-none');
                }
            }
            // ========== END STATUS SUMMARY COUNTER ==========

            // Actualizar estado del checkbox "Todos"
            if (selectAllCheckbox && pendingCount > 0) {
                selectAllCheckbox.checked = selectedCount === pendingCount;
                selectAllCheckbox.indeterminate = selectedCount > 0 && selectedCount < pendingCount;
            }

            if (activeQueue.length === 0) {
                // Show empty state, hide queue (all files imported or queue empty)
                emptyState.classList.remove('d-none');
                queueState.classList.add('d-none');
                if (actionBar) actionBar.classList.add('d-none');
                dom.btnAnalizar.classList.add('d-none');
                dom.btnAnalizarPdf.classList.add('d-none');
                // Also hide status summary when empty
                const statusSummary = document.getElementById('queue-status-summary');
                if (statusSummary) statusSummary.classList.add('d-none');
                return;
            }

            // Has files - show queue state
            emptyState.classList.add('d-none');
            queueState.classList.remove('d-none');
            if (actionBar) actionBar.classList.remove('d-none');

            container.innerHTML = '';

            // Verificar tipos para mostrar botones adecuados
            const pdfCount = fileQueue.filter(f => f.type === 'PDF').length;
            const pendingPdfCount = fileQueue.filter(f => f.type === 'PDF' && f.status === 'pending').length;
            const hasCsv = fileQueue.some(f => f.type !== 'PDF');

            // Contar analizados válidos (para botón de importar)
            const validAnalyzedCount = fileQueue.filter(f =>
                f.status === 'success' && f.resultado?.esValido && f.selected
            ).length;

            // Mostrar botón Procesar PDF solo si hay PDFs pendientes
            if (pendingPdfCount > 0) {
                dom.btnAnalizarPdf.classList.remove('d-none');
                if (btnPdfText) btnPdfText.textContent = `Procesar ${pendingPdfCount} PDF${pendingPdfCount > 1 ? 's' : ''} con IA`;
                dom.btnAnalizarPdf.disabled = false;
            } else if (pdfCount > 0 && pendingPdfCount === 0) {
                // Hay PDFs pero todos ya analizados - mostrar botón de importar
                dom.btnAnalizarPdf.classList.add('d-none');
            } else {
                dom.btnAnalizarPdf.classList.add('d-none');
            }

            // Mostrar botón Confirmar Importación SOLO SI:
            // 1. No está analizando
            // 2. Hay items válidos analizados
            // 3. Todos los análisis terminaron (no hay pending)
            const allAnalyzed = fileQueue.length > 0 && fileQueue.every(item =>
                item.status !== 'pending' && item.status !== 'analyzing'
            );

            if (validAnalyzedCount > 0 && !isAnalyzing && allAnalyzed) {
                dom.btnConfirmar.classList.remove('d-none');
                dom.btnConfirmar.disabled = false;
                dom.btnConfirmar.innerHTML = `<i class="bi bi-cloud-upload me-2"></i>Importar ${validAnalyzedCount} Comunicado${validAnalyzedCount > 1 ? 's' : ''}`;
                dom.btnConfirmar.onclick = confirmarImportacion;
            } else {
                dom.btnConfirmar.classList.add('d-none');
            }

            if (hasCsv && pdfCount === 0) { // Solo CSV individual por ahora en logica legacy
                dom.btnAnalizar.classList.remove('d-none');
                dom.btnAnalizar.disabled = false;
                // Legacy: set currentFile to first one
                currentFile = fileQueue[0].file;
            } else {
                dom.btnAnalizar.classList.add('d-none');
            }

            // Render Items: Unified Cards con datos extraídos
            fileQueue.forEach((item, index) => {
                // Skip imported items (they're being animated out or already removed)
                if (item.status === 'imported') return;

                const div = document.createElement('div');
                div.className = 'queue-card';
                div.id = `queue-item-${item.id}`;  // Use unique item id instead of array index
                div.dataset.index = index;
                div.dataset.itemId = item.id;  // Store item id for reference

                const iconClass = item.type === 'PDF' ? 'pdf' : 'excel';
                const iconBi = item.type === 'PDF' ? 'bi-file-pdf-fill' : 'bi-file-earmark-spreadsheet-fill';

                // Determinar indicador de estado
                let statusHtml = '';
                let statusBadge = '';
                switch (item.status) {
                    case 'analyzing':
                        statusHtml = `<div class="spinner-border spinner-border-sm text-primary" role="status"></div>`;
                        statusBadge = '<span class="badge bg-info">Analizando...</span>';
                        div.className += ' analyzing';
                        break;
                    case 'success':
                        statusHtml = `<i class="bi bi-check-circle-fill text-success fs-5"></i>`;
                        statusBadge = '<span class="badge bg-success"><i class="bi bi-check-lg me-1"></i>Analizado</span>';
                        div.className += ' success';
                        break;
                    case 'importing':
                        statusHtml = `<div class="spinner-border spinner-border-sm text-warning" role="status"></div>`;
                        statusBadge = '<span class="badge bg-warning text-dark"><i class="bi bi-cloud-arrow-up me-1"></i>Importando...</span>';
                        div.className += ' importing';
                        break;
                    case 'imported':
                        statusHtml = `<i class="bi bi-check-all text-white fs-5"></i>`;
                        statusBadge = '<span class="badge bg-success"><i class="bi bi-check2-circle me-1"></i>Importado</span>';
                        div.className += ' imported slide-out-right';
                        break;
                    case 'import-error':
                        statusHtml = `<i class="bi bi-exclamation-triangle-fill text-danger fs-5"></i>`;
                        statusBadge = '<span class="badge bg-danger"><i class="bi bi-x-lg me-1"></i>Error Import</span>';
                        div.className += ' import-error';
                        break;
                    case 'error':
                        statusHtml = `<i class="bi bi-x-circle-fill text-danger fs-5"></i>`;
                        statusBadge = '<span class="badge bg-danger"><i class="bi bi-x-lg me-1"></i>Error</span>';
                        div.className += ' error';
                        break;
                    default: // pending
                        statusHtml = `<span class="text-muted small">Pendiente</span>`;
                        statusBadge = '<span class="badge bg-secondary">Pendiente</span>';
                }

                let extractedDataHtml = '';
                const res = item.resultado;
                if (res && item.status === 'success') {
                    // Buscar líneas en diferentes posibles ubicaciones
                    const lineas = res.rawPayload?.presupuesto?.lineas
                        || res.rawPayload?.lineas
                        || res.presupuesto?.lineas
                        || res.lineas
                        || [];
                    const numLineas = lineas.length;
                    const totalImporte = lineas.reduce((sum, l) => sum + (parseFloat(l.importe) || 0), 0);

                    console.log('[DEBUG] Lineas encontradas:', numLineas, lineas);

                    // ALERTAS: Generar HTML de alertas del backend (SIEMPRE, incluso con 0 líneas)
                    let alertasHtml = '';
                    if (res.alertas && res.alertas.length > 0) {
                        alertasHtml = res.alertas.map(alerta => `
                            <div class="alert alert-${alerta.tipo} alert-dismissible py-1 px-2 mb-1 small fade show" role="alert">
                                <i class="bi ${alerta.icono || 'bi-info-circle'} me-1"></i>
                                ${alerta.mensaje}
                                <button type="button" class="btn-close btn-close-sm py-1" data-bs-dismiss="alert" aria-label="Close" style="padding: 0.5rem;"></button>
                            </div>
                        `).join('');
                    }


                    // Generar tabla de líneas de presupuesto (COLAPSABLE con total visible)
                    let lineasHtml = '';
                    if (numLineas > 0) {
                        const budgetId = `budget-collapse-${index}`;

                        // Helper para determinar estilo de fila según acción
                        const getRowStyle = (linea) => {
                            const accion = (linea.accion || '').toUpperCase();
                            const esPreservado = linea._preservadoDeInformativo === true;

                            if (esPreservado || accion === 'PRESERVADO') {
                                return { badgeClass: 'bg-warning text-dark', rowClass: 'table-warning', label: 'PRESERVADO' };
                            } else if (accion === 'CREAR') {
                                return { badgeClass: 'bg-success', rowClass: 'table-success', label: 'CREAR' };
                            } else if (accion === 'ACTUALIZAR') {
                                return { badgeClass: 'bg-primary', rowClass: 'table-info', label: 'ACTUALIZAR' };
                            } else if (accion === 'CANCELAR') {
                                return { badgeClass: 'bg-danger', rowClass: 'table-danger text-decoration-line-through', label: 'CANCELAR' };
                            } else {
                                return { badgeClass: 'bg-secondary', rowClass: 'table-light text-muted', label: 'MANTENER' };
                            }
                        };

                        lineasHtml = `
                            <div class="budget-section mt-2">
                                <div class="budget-header d-flex justify-content-between align-items-center p-2 rounded" 
                                     style="background: linear-gradient(135deg, #f8f9fa, #e9ecef); cursor: pointer;"
                                     onclick="document.getElementById('${budgetId}').classList.toggle('d-none'); this.querySelector('.chevron-icon').classList.toggle('rotated');">
                                    <div class="d-flex align-items-center gap-2">
                                        <i class="bi bi-chevron-right chevron-icon transition-transform"></i>
                                        <span class="fw-medium small text-muted">Ver ${numLineas} partida${numLineas > 1 ? 's' : ''}</span>
                                    </div>
                                    <div class="fw-bold text-success">
                                        $${totalImporte.toLocaleString('es-MX', { minimumFractionDigits: 2 })}
                                    </div>
                                </div>
                                <div id="${budgetId}" class="budget-lines d-none mt-1">
                                    <table class="table table-sm table-borderless mb-0 small">
                                        <thead class="text-muted">
                                            <tr>
                                                <th style="width: 20px;">#</th>
                                                <th style="width: 80px;">Acción</th>
                                                <th>Concepto / Ubicación</th>
                                                <th class="text-end" style="width: 100px;">Importe</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${lineas.map((l, li) => {
                            const style = getRowStyle(l);
                            return `
                                                <tr class="${style.rowClass}">
                                                    <td class="text-muted">${li + 1}</td>
                                                    <td><span class="badge ${style.badgeClass}" style="font-size: 0.65rem;">${style.label}</span></td>
                                                    <td class="text-truncate" style="max-width: 250px;" title="${l.concepto || ''}">${l.concepto || '-'}</td>
                                                    <td class="text-end font-monospace">$${(parseFloat(l.importe) || 0).toLocaleString('es-MX', { minimumFractionDigits: 2 })}</td>
                                                </tr>
                                            `}).join('')}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        `;
                    }


                    extractedDataHtml = `
                        <div class="queue-card-data">
                            ${alertasHtml}
                            <div class="d-flex flex-wrap gap-3 small mb-2">
                                <div><span class="text-muted">Ref:</span> <strong>${res.ref || '-'}</strong></div>
                                <div><span class="text-muted">Comunicado:</span> <strong>${res.comunicado || '-'}</strong></div>
                                <div><span class="text-muted">Tipo:</span> <span class="badge ${res.tipo === 'ORIGEN' ? 'bg-primary' : 'bg-warning text-dark'}">${res.tipo || '-'}</span></div>
                                <div><span class="text-muted">Partidas:</span> <strong>${numLineas}</strong></div>
                            </div>
                            ${(() => {
                            // Determinar badge según status
                            const status = res.status || '';
                            if (status === 'OMITIDO') {
                                return `<span class="badge bg-secondary"><i class="bi bi-slash-circle me-1"></i>OMITIDO - ${res.motivo || 'Ya existe'}</span>`;
                            } else if (status === 'REEMPLAZAR') {
                                // Obtener lista de cambios detectados
                                const cambios = res.analisis?.comunicado?.cambios || [];
                                const cambiosHtml = cambios.length > 0
                                    ? `<div class="changes-list mt-2 small border-start border-info ps-2 ms-1">
                                        ${cambios.map(c => `<div class="text-muted py-1"><i class="bi bi-arrow-right-short text-info"></i>${c}</div>`).join('')}
                                       </div>`
                                    : '';
                                return `<span class="badge bg-info text-dark"><i class="bi bi-arrow-repeat me-1"></i>Actualización disponible</span>
                                        <span class="badge bg-warning text-dark ms-1">${cambios.length} cambio${cambios.length !== 1 ? 's' : ''}</span>
                                        ${cambiosHtml}`;
                            } else if (!res.esValido) {
                                return `<span class="badge bg-danger"><i class="bi bi-x-circle me-1"></i>${res.motivo || 'Inválido'}</span>`;
                            } else if (status === 'NUEVO' || status === 'ACTUALIZACION' || status === 'ACTUALIZACION_BD' || status === 'ACTUALIZACION_LOTE') {
                                return `<span class="badge bg-success"><i class="bi bi-check-circle me-1"></i>Válido para importar</span>`;
                            } else {
                                return `<span class="badge bg-success"><i class="bi bi-check-circle me-1"></i>Válido para importar</span>`;
                            }
                        })()}
                            ${lineasHtml}
                        </div>
                    `;
                } else if (item.status === 'error') {
                    extractedDataHtml = `
                        <div class="queue-card-data text-danger">
                            <i class="bi bi-exclamation-triangle me-1"></i>${item.errorMsg || 'Error en el análisis'}
                        </div>
                    `;
                }

                // Checkbox habilitado solo si no está analizando, es válido y no está OMITIDO
                const isOmitido = item.resultado?.status === 'OMITIDO';
                const checkboxDisabled = item.status === 'analyzing' || (item.status === 'success' && (!item.resultado?.esValido || isOmitido));
                const checkboxChecked = item.selected && !isOmitido && (item.status === 'pending' || (item.status === 'success' && item.resultado?.esValido));

                // Hacer draggable siempre (excepto mientras analiza)
                div.draggable = item.status !== 'analyzing';

                div.innerHTML = `
                    <div class="queue-card-header" draggable="true">
                        <div class="drag-handle me-2" title="Arrastrar para reordenar">
                            <i class="bi bi-grip-vertical text-muted"></i>
                        </div>
                        <div class="form-check me-2">
                            <input class="form-check-input" type="checkbox" ${checkboxChecked ? 'checked' : ''} 
                                   onchange="event.stopPropagation(); Importacion.toggleFileSelection(${index})"
                                   ${checkboxDisabled ? 'disabled' : ''}>
                        </div>
                        <div class="queue-item-icon ${iconClass}">
                            <i class="bi ${iconBi}"></i>
                        </div>
                        <div class="queue-item-info ms-2 flex-grow-1">
                            <div class="queue-item-name" title="${item.name}">${item.name}</div>
                            <div class="queue-item-meta">${item.size} • ${statusBadge}</div>
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            ${statusHtml}
                            ${item.status === 'error' || item.status === 'success' ? `
                                <button class="btn btn-sm btn-outline-secondary" onclick="event.stopPropagation(); Importacion.reintentarAnalisis(${index})" title="Reintentar análisis">
                                    <i class="bi bi-arrow-clockwise"></i>
                                </button>
                            ` : ''}
                            <button class="btn btn-sm btn-outline-danger" onclick="event.stopPropagation(); Importacion.removeFromQueue(${index})" title="Eliminar documento">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>
                    ${extractedDataHtml}
                `;

                // Agregar eventos de drag-drop
                _addCardDragEvents(div);
                container.appendChild(div);
            });
        };

        // Variable para saber si hay análisis en progreso
        let isAnalyzing = false;
        let isCancelled = false;

        // ========== FUNCIONES DE CONTROL DE PROCESO ==========
        const cancelarProceso = () => {
            if (confirm('¿Cancelar el proceso de análisis? Los archivos pendientes no serán procesados.')) {
                isCancelled = true;
                _restoreAnalyzeButton();

                // Marcar items en análisis como pendientes
                fileQueue.forEach(item => {
                    if (item.status === 'analyzing') {
                        item.status = 'pending';
                    }
                });

                isAnalyzing = false;
                _renderQueue();
            }
        };

        const _restoreAnalyzeButton = () => {
            const btnPdfText = document.getElementById('btn-pdf-text');
            if (dom.btnAnalizarPdf) {
                dom.btnAnalizarPdf.innerHTML = '<i class="bi bi-robot me-2"></i><span id="btn-pdf-text">Procesar PDFs con IA</span>';
                dom.btnAnalizarPdf.classList.remove('btn-danger');
                dom.btnAnalizarPdf.classList.add('btn-warning', 'text-white');
                dom.btnAnalizarPdf.onclick = procesarColaIA;
            }
        };

        // Drag-drop para cards unificados
        const _addCardDragEvents = (el) => {
            el.addEventListener('dragstart', (e) => {
                if (isAnalyzing) {
                    e.preventDefault();
                    return;
                }
                dragSrcEl = el;
                el.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', el.dataset.index);
            });

            el.addEventListener('dragend', () => {
                el.classList.remove('dragging');
                document.querySelectorAll('.queue-card').forEach(c => c.classList.remove('drag-over'));
            });

            el.addEventListener('dragover', (e) => {
                if (isAnalyzing) return;
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
            });

            el.addEventListener('dragenter', (e) => {
                if (isAnalyzing) return;
                el.classList.add('drag-over');
            });

            el.addEventListener('dragleave', () => {
                el.classList.remove('drag-over');
            });

            el.addEventListener('drop', (e) => {
                if (isAnalyzing) return;
                e.preventDefault();
                const fromIndex = parseInt(e.dataTransfer.getData('text/plain'));
                const toIndex = parseInt(el.dataset.index);

                if (fromIndex !== toIndex && !isNaN(fromIndex) && !isNaN(toIndex)) {
                    // Mover en array
                    const item = fileQueue.splice(fromIndex, 1)[0];
                    fileQueue.splice(toIndex, 0, item);
                    _renderQueue();
                }

                document.querySelectorAll('.queue-card').forEach(c => c.classList.remove('drag-over', 'dragging'));
            });
        };

        const _addDragEvents = (el) => {
            el.addEventListener('dragstart', _handleDragStart, false);
            el.addEventListener('dragenter', _handleDragEnter, false);
            el.addEventListener('dragover', _handleDragOver, false);
            el.addEventListener('dragleave', _handleDragLeave, false);
            el.addEventListener('drop', _handleDropQueue, false);
            el.addEventListener('dragend', _handleDragEnd, false);
        };

        const _handleDragStart = (e) => {
            dragSrcEl = e.target;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/html', e.target.outerHTML);
            e.target.classList.add('opacity-50');
        };

        const _handleDragOver = (e) => {
            if (e.preventDefault) e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            return false;
        };

        const _handleDragEnter = (e) => {
            e.target.closest('.queue-item').classList.add('border-primary');
        };

        const _handleDragLeave = (e) => {
            e.target.closest('.queue-item').classList.remove('border-primary');
        };

        const _handleDropQueue = (e) => {
            if (e.stopPropagation) e.stopPropagation();
            const targetEl = e.target.closest('.queue-item');

            if (dragSrcEl !== targetEl) {
                const fromIndex = parseInt(dragSrcEl.dataset.index);
                const toIndex = parseInt(targetEl.dataset.index);

                // Mover en Array
                const item = fileQueue.splice(fromIndex, 1)[0];
                fileQueue.splice(toIndex, 0, item);

                _renderQueue(); // Re-render
            }
            return false;
        };

        const _handleDragEnd = (e) => {
            e.target.classList.remove('opacity-50');
            document.querySelectorAll('.queue-item').forEach(col => {
                col.classList.remove('border-primary');
            });
        };

        // Mover item en la cola (para botones de reordenar)
        const moveQueueItem = (index, direction) => {
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= fileQueue.length) return;

            // Intercambiar posiciones
            const temp = fileQueue[index];
            fileQueue[index] = fileQueue[newIndex];
            fileQueue[newIndex] = temp;

            _renderQueue();
        };

        const removeFromQueue = (index) => {
            fileQueue.splice(index, 1);
            _renderQueue();
        };

        const clearQueue = () => {
            fileQueue = [];
            _renderQueue();
        };

        // ========== NUEVAS FUNCIONES DE SELECCIÓN ==========
        const toggleFileSelection = (index) => {
            if (fileQueue[index]) {
                fileQueue[index].selected = !fileQueue[index].selected;
                _renderQueue();
            }
        };

        const toggleAllSelection = (selectAll) => {
            fileQueue.forEach(item => {
                if (item.status === 'pending') {
                    item.selected = selectAll;
                }
            });
            _renderQueue();
        };

        const reintentarAnalisis = async (index) => {
            const item = fileQueue[index];
            if (!item || (item.status !== 'error' && item.status !== 'success')) return;

            // Reset estado para reintentar
            item.status = 'analyzing';
            item.resultado = null;
            item.errorMsg = null;
            _renderQueue();

            // Procesar solo este archivo
            await _procesarArchivoIndividual(index);
        };

        const procesarColaIA = () => {
            // Filtrar solo archivos seleccionados y pendientes
            const selectedIndices = fileQueue
                .map((item, idx) => ({ item, idx }))
                .filter(({ item }) => item.selected && item.status === 'pending')
                .map(({ idx }) => idx);

            if (selectedIndices.length === 0) {
                alert('No hay archivos seleccionados para procesar.');
                return;
            }

            _iniciarCargaIAMejorado(selectedIndices);
        };

        // ===============================================
        //  GESTOR DE COLA IA MEJORADO (Con estados individuales)
        // ===============================================
        const _iniciarCargaIAMejorado = async (indices) => {
            console.log(`Iniciando Carga IA Mejorada de ${indices.length} archivos`);

            // Reset cancellation flag
            isCancelled = false;

            // Deshabilitar drag-drop durante análisis
            isAnalyzing = true;

            // ===== TRANSFORMAR BOTÓN A "CANCELAR" =====
            if (dom.btnAnalizarPdf) {
                dom.btnAnalizarPdf.innerHTML = '<i class="bi bi-x-circle me-2"></i>Cancelar';
                dom.btnAnalizarPdf.classList.remove('btn-warning');
                dom.btnAnalizarPdf.classList.add('btn-danger');
                dom.btnAnalizarPdf.onclick = cancelarProceso;
            }

            // Ocultar botón de importar durante análisis
            if (dom.btnConfirmar) {
                dom.btnConfirmar.classList.add('d-none');
            }

            // Ocultar loader global, usaremos estados individuales
            _showLoader(false);

            const RESULTADOS_BATCH = [];
            const conceptosPorRef = new Map();

            for (let i = 0; i < indices.length; i++) {
                // ===== CHECK PARA CANCELACIÓN =====
                if (isCancelled) {
                    console.log('[Batch] Proceso cancelado por usuario');
                    break;
                }

                const queueIdx = indices[i];
                const item = fileQueue[queueIdx];
                if (!item) continue;

                // Actualizar estado a "analizando"
                item.status = 'analyzing';
                _renderQueue();

                try {
                    // Procesar archivo
                    const resultado = await _procesarArchivoIA(item.file, conceptosPorRef, RESULTADOS_BATCH);

                    if (resultado.success) {
                        item.status = 'success';
                        item.resultado = resultado.data;
                        RESULTADOS_BATCH.push(resultado.data);

                        // Acumular conceptos
                        if (resultado.extractedConcepts && resultado.refCta) {
                            const currentConcepts = conceptosPorRef.get(resultado.refCta) || [];
                            const newConcepts = [...new Set([...currentConcepts, ...resultado.extractedConcepts])];
                            conceptosPorRef.set(resultado.refCta, newConcepts);
                        }
                    } else {
                        item.status = 'error';
                        item.errorMsg = resultado.message || 'Error desconocido';
                        RESULTADOS_BATCH.push(_crearErrorRow(item.name, item.errorMsg));
                    }
                } catch (error) {
                    item.status = 'error';
                    item.errorMsg = error.message;
                    RESULTADOS_BATCH.push(_crearErrorRow(item.name, error.message));
                }

                _renderQueue();
            }

            // FIN: Mostrar resultados si hay alguno
            if (RESULTADOS_BATCH.length > 0) {
                // Ya no cambiamos de stage - todo está en vista unificada
                // Los resultados ya están en fileQueue.resultado
                currentPreviewData = RESULTADOS_BATCH;
            }

            // ===== RESTAURAR BOTÓN Y ESTADO =====
            _restoreAnalyzeButton();
            isAnalyzing = false;
            _renderQueue(); // Re-render con drag habilitado
        };

        // Procesa un archivo individual (para reintento)
        const _procesarArchivoIndividual = async (index) => {
            const item = fileQueue[index];
            if (!item) return;

            item.status = 'analyzing';
            _renderQueue();

            try {
                const conceptosPorRef = new Map();
                const resultado = await _procesarArchivoIA(item.file, conceptosPorRef, []);

                if (resultado.success) {
                    item.status = 'success';
                    item.resultado = resultado.data;
                } else {
                    item.status = 'error';
                    item.errorMsg = resultado.message || 'Error desconocido';
                }
            } catch (error) {
                item.status = 'error';
                item.errorMsg = error.message;
            }

            _renderQueue();
        };

        // Función auxiliar que procesa un archivo y retorna resultado estructurado
        const _procesarArchivoIA = async (file, conceptosPorRef, batchResults) => {
            // 1. Leer Archivo a Base64
            const base64 = await _readFileAsBase64(file);

            // 2. Extraer refCta y comunicadoId del nombre
            let refCta = null;
            let comIdPre = null;

            const fullMatch = file.name.match(/^([A-Z]{2}\d+)[-_]?(L\d+[A-Z]?)?/i);
            if (fullMatch) {
                refCta = fullMatch[1].toUpperCase();
                comIdPre = fullMatch[2] ? fullMatch[2].toUpperCase() : null;
            }
            if (!comIdPre) {
                const lMatch = file.name.match(/(L\d+[A-Z]?)/i);
                if (lMatch) comIdPre = lMatch[1].toUpperCase();
            }

            // 3. Obtener conceptos
            let existingConcepts = refCta ? (conceptosPorRef.get(refCta) || []) : [];
            if (existingConcepts.length === 0 && refCta) {
                try {
                    const conceptosDB = await serverCall('cargarConceptosPorRefCta', refCta);
                    if (Array.isArray(conceptosDB) && conceptosDB.length > 0) {
                        existingConcepts = conceptosDB;
                        conceptosPorRef.set(refCta, conceptosDB);
                    }
                } catch (dbErr) {
                    console.warn(`[Batch] No se pudieron cargar conceptos de BD para ${refCta}: `, dbErr);
                }
            }

            // 4. Llamar IA
            let resIA = await serverCall('procesarPdfIA', {
                content: base64,
                filename: file.name,
                existingConcepts: existingConcepts,
                refCta: refCta,
                comunicadoId: comIdPre,
                batchResults: batchResults.filter(r => r.esValido && r.rawPayload)
            });

            // Parsear si es string
            if (typeof resIA === 'string') {
                try { resIA = JSON.parse(resIA); } catch (e) { console.error('Error parseando resIA:', e); }
            }

            if (resIA && (resIA.success || resIA.header)) {
                const datosIA = resIA.success ? resIA.data : resIA;

                // Analizar datos
                const analisis = await serverCall('analizarExtraccionIA', datosIA, batchResults);
                let rowData = null;

                if (analisis) {
                    if (analisis.success && analisis.data) {
                        rowData = analisis.data;
                    } else if (analisis.esValido !== undefined || analisis.status) {
                        rowData = analisis;
                    }
                }

                if (rowData) {
                    return {
                        success: true,
                        data: rowData,
                        extractedConcepts: resIA.extractedConcepts,
                        refCta: refCta
                    };
                } else {
                    return {
                        success: false,
                        message: (analisis && analisis.message) ? analisis.message : 'Error en análisis'
                    };
                }
            } else {
                return {
                    success: false,
                    message: (resIA && resIA.message) ? resIA.message : 'Error IA: Respuesta inválida'
                };
            }
        };

        // ===============================================
        //  GESTOR DE COLA IA (BATCH PDF) - LEGACY
        // ===============================================
        const _iniciarCargaIA = async (fileList) => {
            const files = Array.from(fileList);
            console.log(`Iniciando Carga IA de ${files.length} archivos`);

            _showLoader(true, `Preparando ${files.length} archivos...`);

            const RESULTADOS_BATCH = [];
            let total = files.length;
            let procesados = 0;

            // Mapa de conceptos por refCta para propagar entre documentos del mismo comunicado
            const conceptosPorRef = new Map();

            for (let i = 0; i < total; i++) {
                const file = files[i];
                const msg = `🤖 IA Analizando(${i + 1}/ ${total}): ${file.name} `;
                dom.loaderMsg.textContent = msg;

                try {
                    // 1. Leer Archivo a Base64
                    const base64 = await _readFileAsBase64(file);

                    // 2. Intentar extraer refCta y comunicadoId del nombre del archivo
                    // Patrón: GL123456-L01.pdf, GL123456_L01.pdf, o incluso L01A.pdf (si solo tiene ID) 
                    // Pero la regex debe ser robusta.
                    // Prioridad: "GL123456-L30A"
                    let refCta = null;
                    let comIdPre = null;

                    const fullMatch = file.name.match(/^([A-Z]{2}\d+)[-_]?(L\d+[A-Z]?)?/i);
                    if (fullMatch) {
                        refCta = fullMatch[1].toUpperCase();
                        comIdPre = fullMatch[2] ? fullMatch[2].toUpperCase() : null;
                    }

                    // Si no, buscar solo Lxx pattern si no hay Ref
                    if (!comIdPre) {
                        const lMatch = file.name.match(/(L\d+[A-Z]?)/i);
                        if (lMatch) comIdPre = lMatch[1].toUpperCase();
                    }

                    // Obtener conceptos: primero del batch, si no hay → cargar de BD
                    let existingConcepts = refCta ? (conceptosPorRef.get(refCta) || []) : [];

                    if (existingConcepts.length === 0 && refCta) {
                        // Intentar cargar conceptos desde BD (registros previos)
                        try {
                            const conceptosDB = await serverCall('cargarConceptosPorRefCta', refCta);
                            if (Array.isArray(conceptosDB) && conceptosDB.length > 0) {
                                existingConcepts = conceptosDB;
                                conceptosPorRef.set(refCta, conceptosDB); // Cachear para siguientes docs
                                console.log(`[Batch] ${file.name}: Cargados ${conceptosDB.length} conceptos desde BD`);
                            }
                        } catch (dbErr) {
                            console.warn(`[Batch] No se pudieron cargar conceptos de BD para ${refCta}: `, dbErr);
                        }
                    }

                    console.log(`[Batch] ${file.name}: refCta = ${refCta}, comIdPre = ${comIdPre}, conceptos = ${existingConcepts.length} `);

                    // 3. Enviar a Backend (IA + Extracción) con conceptos existentes
                    // También pasar resultados ya procesados para carry-forward de registros relacionados
                    let resIA = await serverCall('procesarPdfIA', {
                        content: base64,
                        filename: file.name,
                        existingConcepts: existingConcepts,
                        refCta: refCta,          // <--- NUEVO
                        comunicadoId: comIdPre,  // <--- NUEVO (Para búsqueda de contexto anticipada)
                        batchResults: RESULTADOS_BATCH.filter(r => r.esValido && r.rawPayload) // Solo enviar resultados válidos con payload
                    });

                    console.log('DEBUG resIA', resIA);

                    // Robustez: Si llega como string, parsearlo
                    if (typeof resIA === 'string') {
                        try {
                            resIA = JSON.parse(resIA);
                            console.log('DEBUG resIA parsed:', resIA);
                        } catch (e) {
                            console.error('Error parseando resIA:', e);
                        }
                    }

                    if (resIA && (resIA.success || resIA.header)) {
                        // Adaptador: Si serverCall devolvió la data directa (sin wrapper success), úsala.
                        const datosIA = resIA.success ? resIA.data : resIA;

                        // 4. Acumular conceptos extraídos para propagación en batch
                        if (resIA.extractedConcepts && refCta) {
                            const currentConcepts = conceptosPorRef.get(refCta) || [];
                            const newConcepts = [...new Set([...currentConcepts, ...resIA.extractedConcepts])];
                            conceptosPorRef.set(refCta, newConcepts);
                            console.log(`[Batch] ${file.name}: Acumulados ${newConcepts.length} conceptos para ${refCta} `);
                        }

                        // 5. Analizar Datos vs DB (Previsualización)
                        // IMPORTANTE: Pasar documentos previos como contexto de lote para detectar padres
                        const analisis = await serverCall('analizarExtraccionIA', datosIA, RESULTADOS_BATCH);

                        console.log('DEBUG analisis', analisis);

                        // Lógica flexible: manejar tanto respuesta empaquetada como desempaquetada
                        let rowData = null;

                        if (analisis) {
                            if (analisis.success && analisis.data) {
                                // Caso empaquetado: { success: true, data: {...} }
                                rowData = analisis.data;
                            } else if (analisis.esValido !== undefined || analisis.status) {
                                // Caso desempaquetado: El objeto ya es la fila de datos (tiene esValido/status)
                                rowData = analisis;
                            }
                        }

                        if (rowData) {
                            RESULTADOS_BATCH.push(rowData);
                        } else {
                            // Falló análisis de negocio
                            RESULTADOS_BATCH.push(_crearErrorRow(file.name, (analisis && analisis.message) ? analisis.message : 'Error en análisis (Datos inválidos)'));
                        }
                    } else {
                        // Falló IA o OCR
                        RESULTADOS_BATCH.push(_crearErrorRow(file.name, (resIA && resIA.message) ? resIA.message : 'Error interno: Respuesta IA inválida'));
                    }

                } catch (error) {
                    console.error('Error file:', file.name, error);
                    RESULTADOS_BATCH.push(_crearErrorRow(file.name, error.message));
                }

                procesados++;
            }

            // FIN: Renderizar Resultados Batch
            _showLoader(false);

            // Ordenar resultados por refCta, fecha del documento, y secuencia de comunicado
            RESULTADOS_BATCH.sort((a, b) => {
                // 1. RefCta
                const refA = (a.ref || '').toUpperCase();
                const refB = (b.ref || '').toUpperCase();
                if (refA !== refB) return refA.localeCompare(refB);

                // 2. ORIGEN Priority (Must be first)
                const isOrigenA = String(a.tipo || '').toUpperCase() === 'ORIGEN';
                const isOrigenB = String(b.tipo || '').toUpperCase() === 'ORIGEN';
                if (isOrigenA && !isOrigenB) return -1;
                if (!isOrigenA && isOrigenB) return 1;

                // 3. Date (Secondary)
                const getTs = (d) => {
                    if (!d) return 0;
                    const t = new Date(d).getTime();
                    return isNaN(t) ? 0 : t;
                };
                const dateA = getTs(a.fecha);
                const dateB = getTs(b.fecha);
                if (dateA !== dateB) return dateA - dateB;

                // 3. Fallback: Base Number (L3 < L30)
                const parseId = (id) => {
                    const match = String(id || '').toUpperCase().match(/^L(\d+)([A-Z])?$/);
                    if (match) {
                        return {
                            num: parseInt(match[1], 10),
                            index: match[2] ? match[2].charCodeAt(0) - 64 : 0
                        };
                    }
                    return { num: -1, index: 0 }; // Non-standard IDs (e.g. Unknown)
                };

                const vA = parseId(a.comunicado);
                const vB = parseId(b.comunicado);

                if (vA.num !== vB.num) {
                    if (vA.num === -1) return 1; // Put unknowns last
                    if (vB.num === -1) return -1;
                    return vA.num - vB.num;
                }

                // 4. Fallback: Suffix Index (L03 < L03A)
                return vA.index - vB.index;
            });

            console.log('[Batch] Orden final:', RESULTADOS_BATCH.map(r => `${r.ref} -${r.comunicado} (${r.fecha})`).join(', '));

            // Construir estructura compatible con _renderResultados
            const reportData = {
                filas: RESULTADOS_BATCH,
                resumen: {
                    total: total,
                    validos: RESULTADOS_BATCH.filter(r => r.esValido && r.status !== 'OMITIDO').length,
                    omitidos: RESULTADOS_BATCH.filter(r => r.status === 'OMITIDO').length,
                    errores: RESULTADOS_BATCH.filter(r => !r.esValido).length
                }
            };

            _renderResultados(reportData);
            setStage(2);
        };

        const _readFileAsBase64 = (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    // split ',' to get clean base64
                    resolve(reader.result.split(',')[1]);
                };
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        };

        const _crearErrorRow = (filename, errorMsg) => {
            return {
                ref: filename, // Usar nombre de archivo como ref temporal
                comunicado: 'ERROR IMPORT',
                status: 'ERROR',
                esValido: false,
                motivo: errorMsg,
                analisis: { comunicado: { debug: null } } // Dummy structure
            };
        };

        // === MODAL DE CONFIRMACIÓN PREMIUM ===
        const _mostrarConfirmacionImport = (count) => {
            return new Promise((resolve) => {
                const modalEl = document.getElementById('modalConfirmImport');
                const countEl = document.getElementById('confirm-import-count');
                const btnCancel = document.getElementById('btn-confirm-cancel');
                const btnAccept = document.getElementById('btn-confirm-accept');

                if (!modalEl) {
                    // Fallback al confirm nativo si el modal no existe
                    resolve(confirm(`¿Importar ${count} comunicado(s) ? `));
                    return;
                }

                // Actualizar el contador
                if (countEl) countEl.textContent = count;

                // Crear instancia del modal
                const modal = new bootstrap.Modal(modalEl, {
                    backdrop: 'static',
                    keyboard: false
                });

                // Limpiar eventos previos
                const newBtnCancel = btnCancel.cloneNode(true);
                const newBtnAccept = btnAccept.cloneNode(true);
                btnCancel.parentNode.replaceChild(newBtnCancel, btnCancel);
                btnAccept.parentNode.replaceChild(newBtnAccept, btnAccept);

                // Event handlers
                const handleCancel = () => {
                    modal.hide();
                    resolve(false);
                };

                const handleAccept = () => {
                    modal.hide();
                    resolve(true);
                };

                // Asignar eventos
                newBtnCancel.addEventListener('click', handleCancel);
                newBtnAccept.addEventListener('click', handleAccept);

                // Mostrar modal
                modal.show();
            });
        };

        // === MODAL DE RESULTADO DE IMPORTACIÓN ===
        const _mostrarResultadoImport = (successCount, errorCount) => {
            return new Promise((resolve) => {
                const modalEl = document.getElementById('modalImportResult');
                const titleEl = document.getElementById('result-title');
                const subtitleEl = document.getElementById('result-subtitle');
                const successCountEl = document.getElementById('result-success-count');
                const errorCountEl = document.getElementById('result-error-count');
                const iconSuccess = document.getElementById('result-icon-success');
                const iconWarning = document.getElementById('result-icon-warning');
                const glowEl = modalEl?.querySelector('.result-modal-glow');
                const btnAccept = document.getElementById('btn-result-accept');

                if (!modalEl) {
                    // Fallback al alert nativo si el modal no existe
                    alert(`Importación completada.\n\n✓ Éxitos: ${successCount} \n✗ Errores: ${errorCount} `);
                    resolve();
                    return;
                }

                // Actualizar contadores
                if (successCountEl) successCountEl.textContent = successCount;
                if (errorCountEl) errorCountEl.textContent = errorCount;

                // Determinar si hay errores
                const hasErrors = errorCount > 0;

                // Ocultar ambos iconos primero
                if (iconSuccess) iconSuccess.classList.add('d-none');
                if (iconWarning) iconWarning.classList.add('d-none');

                // Configurar apariencia según resultado
                if (hasErrors) {
                    // Modo advertencia (con errores)
                    if (iconWarning) iconWarning.classList.remove('d-none');
                    if (glowEl) {
                        glowEl.classList.remove('success-glow');
                        glowEl.classList.add('warning-glow');
                    }
                    if (titleEl) {
                        titleEl.textContent = 'Importación con Advertencias';
                        titleEl.classList.remove('success-title');
                        titleEl.classList.add('warning-title');
                    }
                    if (subtitleEl) subtitleEl.textContent = 'Algunos documentos no pudieron procesarse';
                    if (btnAccept) btnAccept.classList.add('warning-btn');
                } else {
                    // Modo éxito (sin errores)
                    if (iconSuccess) iconSuccess.classList.remove('d-none');
                    if (glowEl) {
                        glowEl.classList.remove('warning-glow');
                        glowEl.classList.add('success-glow');
                    }
                    if (titleEl) {
                        titleEl.textContent = '¡Importación Exitosa!';
                        titleEl.classList.remove('warning-title');
                        titleEl.classList.add('success-title');
                    }
                    if (subtitleEl) subtitleEl.textContent = 'Todos los documentos fueron procesados correctamente';
                    if (btnAccept) btnAccept.classList.remove('warning-btn');
                }

                // Crear instancia del modal
                const modal = new bootstrap.Modal(modalEl);

                // Limpiar eventos previos
                const newBtnAccept = btnAccept.cloneNode(true);
                if (hasErrors) newBtnAccept.classList.add('warning-btn');
                btnAccept.parentNode.replaceChild(newBtnAccept, btnAccept);

                // Event handler
                const handleAccept = () => {
                    modal.hide();
                    resolve();
                };

                newBtnAccept.addEventListener('click', handleAccept);

                // Mostrar modal
                modal.show();
            });
        };

        const reset = () => {
            currentFile = null;
            // dom.fileInput.value = ''; // Keep if input exists
            if (dom.fileInput) dom.fileInput.value = '';

            if (dom.btnAnalizar) dom.btnAnalizar.disabled = true;
            if (dom.btnAnalizarPdf) dom.btnAnalizarPdf.disabled = true;

            // Clear Queue
            fileQueue = [];
            _renderQueue();

            // Reset Wizard
            currentPreviewData = [];
            currentCsvContent = null;
            setStage(1);
            dom.previewBody.innerHTML = '';

            // Preview additions
            dom.btnConfirmar.classList.add('d-none');
            dom.errorReportContainer.classList.add('d-none');
            currentCsvContent = null;
        };

        const analizar = () => {
            if (!currentFile) return;

            const fileName = currentFile.name.toLowerCase();
            const isExcel = fileName.endsWith('.xlsx') || fileName.endsWith('.xls');

            if (isExcel) {
                _procesarExcel(currentFile);
            } else {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const content = e.target.result;
                    await _procesarBackend(content);
                };
                reader.readAsText(currentFile);
            }
        };

        const _procesarExcel = async (file) => {
            _showLoader(true, 'Procesando archivo Excel...');

            try {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const base64Data = e.target.result.split(',')[1];
                    const result = await serverCall('convertirExcelACsv', base64Data);

                    if (result.success) {
                        await _procesarBackend(result.csvContent);
                    } else {
                        alert('Error al procesar Excel: ' + result.message);
                        _showLoader(false);
                    }
                };
                reader.readAsDataURL(file);
            } catch (error) {
                console.error(error);
                alert('Error al leer el archivo Excel: ' + error.message);
                _showLoader(false);
            }
        };

        const _procesarBackend = async (csvContent) => {
            _showLoader(true, 'Analizando archivo y catálogos...');
            currentCsvContent = csvContent; // Save for later

            try {
                // PASO 1: Previsualización (Solo Lectura)
                // serverCall devuelve directamente 'data' si es exitoso, y lanza error si falla.
                const data = await serverCall('previsualizarImportacion', csvContent);

                if (data) {
                    _renderResultados(data);
                    setStage(2); // Move to Preview Stage
                } else {
                    throw new Error('La respuesta de previsualización esta vacía.');
                }

            } catch (error) {
                console.error(error);
                alert('Error en el análisis: ' + error.message);
            } finally {
                _showLoader(false);
            }
        };

        // Función para importar desde la vista unificada
        const confirmarImportacion = async () => {
            // Obtener items válidos, analizados y seleccionados
            const toImport = fileQueue.filter(f =>
                f.status === 'success' && f.resultado?.esValido && f.selected
            );

            if (toImport.length === 0) {
                alert('No hay documentos válidos seleccionados para importar.');
                return;
            }

            // Mostrar modal de confirmación premium
            const confirmed = await _mostrarConfirmacionImport(toImport.length);
            if (!confirmed) return;

            // Deshabilitar botón de importar durante el proceso
            if (dom.btnConfirmar) {
                dom.btnConfirmar.disabled = true;
                dom.btnConfirmar.innerHTML = '<i class="bi bi-hourglass-split me-2"></i>Importando...';
            }

            // BLOQUEAR botón cerrar y modal durante importación
            const btnCerrar = document.getElementById('btn-cerrar-modal');
            const modalEl = document.getElementById('modalImportacion');
            if (btnCerrar) {
                btnCerrar.disabled = true;
                btnCerrar.innerHTML = '<i class="bi bi-lock me-1"></i>Importando...';
            }
            // Evitar cerrar con click fuera o ESC
            if (modalEl) {
                modalEl.dataset.bsBackdrop = 'static';
                modalEl.dataset.bsKeyboard = 'false';
            }

            let successCount = 0;
            let errorCount = 0;

            for (const item of toImport) {
                // Mostrar spinner EN EL CARD del documento (use item.id for stable reference)
                _updateQueueItemStatus(item.id, 'importing');

                try {
                    const payload = item.resultado.rawPayload;
                    if (!payload) {
                        console.error(`[Import] Sin rawPayload para ${item.name} `);
                        errorCount++;
                        item.importError = 'Sin datos de importación';
                        _updateQueueItemStatus(item.id, 'import-error', 'Sin datos');
                        continue;
                    }

                    // Importar
                    const result = await serverCall('importarUnico', JSON.stringify(payload));

                    if (result && result.success) {
                        successCount++;
                        item.imported = true;
                        item.status = 'imported';
                        _updateQueueItemStatus(item.id, 'imported');
                    } else {
                        errorCount++;
                        item.importError = result?.message || 'Error desconocido';
                        _updateQueueItemStatus(item.id, 'import-error', item.importError);
                    }
                } catch (err) {
                    console.error(`[Import] Error: `, err);
                    errorCount++;
                    item.importError = err.message;
                    _updateQueueItemStatus(item.id, 'import-error', err.message);
                }
            }

            // Restaurar botón
            if (dom.btnConfirmar) {
                dom.btnConfirmar.disabled = false;
                const validCount = fileQueue.filter(f =>
                    f.status === 'success' && f.resultado?.esValido && f.selected && !f.imported
                ).length;
                if (validCount > 0) {
                    dom.btnConfirmar.innerHTML = `<i class="bi bi-cloud-upload me-2"></i>Importar ${validCount} Comunicado${validCount > 1 ? 's' : ''}`;
                } else {
                    dom.btnConfirmar.classList.add('d-none');
                }
            }

            // ===== VERIFICAR SI TODOS LOS ITEMS ESTÁN IMPORTADOS =====
            const allImported = fileQueue.filter(f =>
                f.status === 'success' && f.resultado?.esValido && f.selected
            ).every(f => f.imported);

            // DESBLOQUEAR botón cerrar y convertirlo en "Finalizar" SOLO SI todo terminó
            if (btnCerrar && allImported) {
                btnCerrar.disabled = false;
                btnCerrar.removeAttribute('data-bs-dismiss'); // Quitar dismiss automático
                btnCerrar.innerHTML = '<i class="bi bi-check2-all me-1"></i>Finalizar';
                btnCerrar.className = 'btn btn-success rounded-pill px-4';
                // Al hacer clic, cerrar modal y actualizar tabla
                btnCerrar.onclick = () => {
                    cerrarYActualizar();
                };
            } else if (btnCerrar) {
                // Si hay items pendientes, mantener botón cerrar deshabilitado
                btnCerrar.disabled = true;
                btnCerrar.innerHTML = '<i class="bi bi-hourglass-split me-1"></i>Procesando...';
            }

            // ===== MODAL DE RESULTADO (Premium) =====
            await _mostrarResultadoImport(successCount, errorCount);

            _renderQueue();
        };

        // Helper para actualizar status visual en la cola
        const _updateQueueItemStatus = (itemId, status, message) => {
            const card = document.getElementById(`queue-item-${itemId}`);
            if (!card) {
                console.warn(`[_updateQueueItemStatus] Card not found for item: ${itemId}`);
                return;
            }

            // Buscar o crear el área de status de importación
            let importStatusEl = card.querySelector('.import-status-badge');
            if (!importStatusEl) {
                const statusArea = card.querySelector('.queue-item-meta');
                if (statusArea) {
                    importStatusEl = document.createElement('span');
                    importStatusEl.className = 'import-status-badge ms-2';
                    statusArea.appendChild(importStatusEl);
                }
            }

            if (importStatusEl) {
                if (status === 'importing') {
                    importStatusEl.innerHTML = `
                        <span class="badge bg-primary">
                            <span class="spinner-border spinner-border-sm me-1" style="width: 0.8rem; height: 0.8rem;"></span>
                            Importando...
                        </span>
                    `;
                    card.style.opacity = '0.7';
                } else if (status === 'imported') {
                    importStatusEl.innerHTML = '<span class="badge bg-success"><i class="bi bi-check-lg me-1"></i>Importado ✓</span>';
                    card.style.opacity = '1';
                    card.classList.add('border-success', 'imported');

                    // ===== ANIMACIÓN SLIDE-OUT (ESTILO CARTUCHO) =====
                    // Guardar altura original antes de animar
                    const originalHeight = card.offsetHeight;
                    card.style.maxHeight = originalHeight + 'px';
                    card.style.overflow = 'hidden';

                    // Fase 1: Deslizar a la derecha
                    setTimeout(() => {
                        card.style.transition = 'all 0.4s ease-out';
                        card.style.transform = 'translateX(100%)';
                        card.style.opacity = '0';
                    }, 600);

                    // Fase 2: Colapsar altura (las demás suben)
                    setTimeout(() => {
                        card.style.transition = 'all 0.3s ease-in-out';
                        card.style.maxHeight = '0';
                        card.style.marginBottom = '0';
                        card.style.padding = '0';
                        card.style.border = 'none';
                    }, 1000);

                    // Fase 3: Remover del DOM
                    setTimeout(() => {
                        // Encontrar y eliminar del fileQueue por id (itemId is passed to function)
                        const queueIndex = fileQueue.findIndex(f => f.id === itemId);
                        if (queueIndex > -1) {
                            fileQueue.splice(queueIndex, 1);
                        }
                        card.remove();
                        // Actualizar contadores (use activeQueue count)
                        const activeCount = fileQueue.filter(f => f.status !== 'imported').length;
                        const countSpan = document.getElementById('queue-count');
                        if (countSpan) countSpan.innerText = activeCount;

                        // If all done, show empty state
                        if (activeCount === 0) {
                            const emptyState = document.getElementById('dropzone-empty-state');
                            const queueState = document.getElementById('dropzone-queue-state');
                            const statusSummary = document.getElementById('queue-status-summary');
                            if (emptyState) emptyState.classList.remove('d-none');
                            if (queueState) queueState.classList.add('d-none');
                            if (statusSummary) statusSummary.classList.add('d-none');
                        }
                    }, 1350);

                } else if (status === 'import-error') {
                    importStatusEl.innerHTML = `<span class="badge bg-danger" title="${message}"><i class="bi bi-x-lg me-1"></i>Error</span>`;
                    card.style.opacity = '1';
                    card.classList.add('border-danger');
                }
            }
        };

        let currentPreviewData = [];

        const setStage = (stage) => {
            console.log('Wizard Stage set to:', stage);

            // Hide all stages first
            if (dom.stage1) dom.stage1.classList.add('d-none');
            if (dom.previewContainer) dom.previewContainer.classList.add('d-none');
            if (dom.stage3) dom.stage3.classList.add('d-none');
            if (dom.stage5) dom.stage5.classList.add('d-none');

            // Redundant legacy element hide just in case
            if (dom.dropZone && stage !== 1) dom.dropZone.classList.add('d-none');

            // Footer starts visible by default, but hide for specific stages
            if (dom.modalFooter) {
                if ([3, 4, 5].includes(stage)) {
                    dom.modalFooter.classList.add('d-none');
                } else {
                    dom.modalFooter.classList.remove('d-none');
                }
            }

            // Show requested stage
            switch (stage) {
                case 1:
                    if (dom.stage1) dom.stage1.classList.remove('d-none');
                    if (dom.dropZone) dom.dropZone.classList.remove('d-none');
                    break;
                case 2:
                    dom.previewContainer.classList.remove('d-none');
                    if (dom.previewTitle) dom.previewTitle.innerText = 'Reporte de Procesamiento';
                    // Activar botones de Stage 2 (Volver, Confirmar)
                    break;
                case 3:
                    dom.stage3.classList.remove('d-none');
                    break;
                case 4:
                    dom.previewContainer.classList.remove('d-none');
                    if (dom.previewTitle) dom.previewTitle.innerText = 'Importando...';
                    if (dom.btnConfirmar) dom.btnConfirmar.classList.add('d-none');
                    break;
                case 5:
                    dom.stage5.classList.remove('d-none');
                    break;
            }
        };

        // ========== FUNCIONES PARA REORDENAR Y REINTENTAR EN PREVIEW ==========
        const movePreviewRow = (index, direction) => {
            if (!currentPreviewData || currentPreviewData.length === 0) return;

            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= currentPreviewData.length) return;

            // Intercambiar posiciones
            const temp = currentPreviewData[index];
            currentPreviewData[index] = currentPreviewData[newIndex];
            currentPreviewData[newIndex] = temp;

            // Re-render con el nuevo orden
            const resumen = {
                total: currentPreviewData.length,
                validos: currentPreviewData.filter(r => r.esValido && r.status !== 'OMITIDO').length,
                omitidos: currentPreviewData.filter(r => r.status === 'OMITIDO').length,
                errores: currentPreviewData.filter(r => !r.esValido).length
            };
            _renderResultados({ filas: currentPreviewData, resumen });
        };

        const reintentarPreviewRow = async (index) => {
            const row = currentPreviewData[index];
            if (!row) return;

            // Buscar el archivo original en fileQueue por nombre
            const queueItem = fileQueue.find(f => f.name.includes(row.ref) || f.name.includes(row.comunicado));

            if (!queueItem) {
                alert('No se encontró el archivo original para reintentar. Por favor, vuelva a cargar el documento.');
                return;
            }

            // Marcar como procesando en la tabla
            _updateRowStatus(index, 'loading');

            try {
                const conceptosPorRef = new Map();
                const resultado = await _procesarArchivoIA(queueItem.file, conceptosPorRef, []);

                if (resultado.success) {
                    // Reemplazar la fila con el nuevo resultado
                    currentPreviewData[index] = resultado.data;
                    _updateRowStatus(index, 'success', 'Reanalizado correctamente');

                    // Re-render para actualizar la UI completa
                    const resumen = {
                        total: currentPreviewData.length,
                        validos: currentPreviewData.filter(r => r.esValido && r.status !== 'OMITIDO').length,
                        omitidos: currentPreviewData.filter(r => r.status === 'OMITIDO').length,
                        errores: currentPreviewData.filter(r => !r.esValido).length
                    };
                    _renderResultados({ filas: currentPreviewData, resumen });
                } else {
                    _updateRowStatus(index, 'error', resultado.message || 'Error en reintento');
                }
            } catch (error) {
                _updateRowStatus(index, 'error', error.message);
            }
        };

        const confirmar = async () => {
            // Legacy wrapper if called directly, redirects to Wizard Stage 3
            if (!currentPreviewData || currentPreviewData.length === 0) return;

            // Count valid items
            const count = currentPreviewData.filter(d => d.esValido && d.status !== 'OMITIDO').length;
            if (count === 0) { alert('Nada que importar'); return; }

            if (dom.confirmCount) dom.confirmCount.innerText = count;
            setStage(3);
        };

        const startImportFlow = async () => {
            // Actual execution (Stage 4)
            if (!currentPreviewData || currentPreviewData.length === 0) return;

            // Filtrar solo los que se pueden importar (VALIDOS y NO ERRORES)
            // Incluimos REEMPLAZAR (Actualizaciones) y NUEVO. OMITIDO se salta.
            const toImportIndices = currentPreviewData
                .map((d, i) => ({ data: d, index: i }))
                .filter(item => item.data.esValido && item.data.status !== 'OMITIDO');

            if (toImportIndices.length === 0) {
                alert('No hay registros nuevos o modificados para importar.');
                return;
            }

            setStage(4); // Switch to Progress View

            // if (!confirm(`Se importarán ${ toImportIndices.length } registros uno por uno. ¿Continuar ? `)) return;

            dom.btnConfirmar.disabled = true;
            let successCount = 0;
            let errorCount = 0;

            for (const item of toImportIndices) {
                const idx = item.index;
                let payload = item.data.rawPayload;

                // UI: Spinner
                _updateRowStatus(idx, 'loading');

                if (!payload) {
                    console.error(`Row ${idx}: rawPayload is missing`, item.data);
                    _updateRowStatus(idx, 'error', 'Error inetrno: Datos faltantes');
                    errorCount++;
                    continue;
                }

                try {
                    // Stringify to ensure safe transmission
                    const payloadStr = JSON.stringify(payload);
                    const res = await serverCall('importarUnico', payloadStr);

                    if (res.success) {
                        console.log(`Row ${idx} Logs: `, res.debugLogs);
                        _updateRowStatus(idx, 'success', res.message);
                        successCount++;
                    } else {
                        _updateRowStatus(idx, 'error', res.message);
                        errorCount++;
                    }
                } catch (e) {
                    _updateRowStatus(idx, 'error', e.message);
                    errorCount++;
                }
            }

            // Summary Stage 5
            if (dom.summaryTotal) dom.summaryTotal.innerText = toImportIndices.length;
            if (dom.summarySuccess) dom.summarySuccess.innerText = successCount;
            if (dom.summaryErrors) dom.summaryErrors.innerText = errorCount;

            setStage(5);
            /*
            if (globalThis.Swal) {
                Swal.fire({
                    icon: errorCount === 0 ? 'success' : 'warning',
                    title: 'Proceso Finalizado',
                    text: `Importados: ${ successCount } \nFallidos: ${ errorCount } `,
                });
            } else {
                alert(`Proceso Finalizado.\nImportados: ${ successCount } \nFallidos: ${ errorCount } `);
            }
            */

            dom.btnConfirmar.disabled = false;
            // Opcional: Recargar tabla principal si hubo exitos
